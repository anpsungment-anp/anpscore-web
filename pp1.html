/* หน้าพิมพ์ ปพ.1 — รายชื่ออยู่ซ้าย ตัวอย่างเอกสารอยู่ขวา คลิกชื่อเพื่อดู ติ๊กเพื่อเลือกพิมพ์หลายคน
   ฉบับสำเนาและฉบับจริงใช้หน้าเดียวกัน สลับได้จากปุ่มด้านบน */
const PP1_VIEW = { status: 'active', level: null, room: '', q: '', cur: '', sel: {}, settingsOpen: false };

function pp1LevelOf(s) { return String(isLeaver(s) ? leftLevelOf(s) : (s.level || PP1.settings.cohortLevel || 6)); }
function pp1StatusOk(s) { return PP1_VIEW.status === 'all' || (PP1_VIEW.status === 'left') === isLeaver(s); }
function pp1Rooms() {
    const lvl = PP1_VIEW.level;
    return Array.from(new Set(PP1.students.filter(s => pp1StatusOk(s) && (!lvl || pp1LevelOf(s) === lvl)).map(s => String(s.room || ''))))
        .filter(Boolean).sort((a, b) => num(a) - num(b));
}
function pp1ListStudents() {
    const q = PP1_VIEW.q.trim().toLowerCase();
    return sortedStudents().filter(s => {
        if (!pp1StatusOk(s)) return false;
        if (PP1_VIEW.level && pp1LevelOf(s) !== PP1_VIEW.level) return false;
        if (PP1_VIEW.room && String(s.room || '') !== PP1_VIEW.room) return false;
        if (q && (studentDisplayName(s) + ' ' + s.studentId + ' ' + (s.citizenId || '')).toLowerCase().indexOf(q) < 0) return false;
        return true;
    });
}
/* สิ่งที่ยังขาดก่อนพิมพ์ — ให้ครูเห็นก่อนสั่งพิมพ์ ไม่ต้องไปไล่ดูทีละช่องในเอกสาร */
function pp1Issues(stu, mode) {
    const sid = String(stu.studentId), out = [];
    if (!stu.citizenId) out.push('เลขประจำตัวประชาชน');
    if (!stu.birthD || !stu.birthY) out.push('วันเกิด');
    if (!stu.father || !stu.mother) out.push('ชื่อบิดา-มารดา');
    if (!stu.entryY) out.push('วันเข้าเรียน');
    const lastLevel = isLeaver(stu) ? leaverLastLevel(stu) : 6;
    for (let level = 1; level <= lastLevel; level++) {
        if (!levelOnPp1(level)) continue;
        const subs = (PP1.curriculum[level].subjects || []).filter(s => s.code);
        if (!subs.length) continue;
        const rec = PP1.grades[level].records[sid];
        const missing = subs.filter(s => !rec || rec.subjects[s.code] === undefined || rec.subjects[s.code] === '').length;
        if (missing === subs.length) out.push('ผลการเรียน ' + LEVEL_NAMES[level]);
        else if (missing) out.push(LEVEL_NAMES[level] + ' ขาดผลการเรียน ' + missing + ' วิชา');
    }
    if (isLeaver(stu)) {
        if (!stu.leaveY) out.push('วันที่ออกจากโรงเรียน');
        if (!stu.leaveReason) out.push('สาเหตุที่ออก');
    } else {
        const gd = studentGradDate(stu);
        if (!gd.d || !gd.y) out.push('วันอนุมัติการจบ');
    }
    if (mode === 'copy' && !stu.photo) out.push('รูปถ่าย');
    return out;
}
function pp1Mode() { return state.page === 'pp1real' ? 'real' : 'copy'; }

function renderPp1Page(root, mode) {

    const seg = (m, label, sub) => '<button onclick="navigate(\'' + (m === 'real' ? 'pp1real' : 'pp1copy') + '\')" class="px-4 py-2 rounded-lg text-left transition-colors ' +
        (mode === m ? 'bg-white shadow text-indigo-700' : 'text-slate-500 hover:text-slate-700') + '">' +

    const allOn = list.length && list.every(s => PP1_VIEW.sel[s.studentId]);
    $('pp1-list-head').innerHTML =
        '<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"' + (allOn ? ' checked' : '') +
            ' onchange="window.pp1SelectAll(this.checked)" class="w-4 h-4 accent-indigo-600">เลือกทั้งหมด (' + list.length + ' คน)</label>' +
        '<span class="flex items-center gap-3">' +
            (selCount ? '<button onclick="window.pp1SelectAll(false, true)" class="text-rose-500 hover:underline">ล้าง</button>' : '') +
            '<button onclick="window.pickBulkPhotos()" class="text-indigo-600 hover:underline" title="เลือกหลายไฟล์ ตั้งชื่อไฟล์เป็นเลขประจำตัวนักเรียน"><i class="ph ph-images"></i> รูปหลายคน</button>' +
        '</span>';
    $('pp1-list').innerHTML = list.length ? list.map(s => {
        const id = String(s.studentId), active = id === PP1_VIEW.cur;
        const ok = !pp1Issues(s, mode).length;
        return '<div onclick="window.pp1Show(\'' + esc(id) + '\')" data-sid="' + esc(id) + '" class="flex items-center gap-2 px-2 py-1.5 rounded-lg cursor-pointer text-sm ' +
                (active ? 'bg-indigo-50 text-indigo-800 font-bold' : 'hover:bg-slate-50 text-slate-700') + '">' +
            '<input type="checkbox"' + (PP1_VIEW.sel[id] ? ' checked' : '') + ' onclick="event.stopPropagation()" onchange="window.pp1Pick(\'' + esc(id) + '\', this.checked)" class="w-4 h-4 accent-indigo-600 shrink-0">' +
            '<span class="w-8 text-xs text-slate-400 text-right shrink-0">' + esc(s.no || '') + '</span>' +
            '<span class="flex-1 truncate">' + esc(studentDisplayName(s)) + '</span>' +
            '<span class="w-2 h-2 rounded-full shrink-0 ' + (ok ? 'bg-emerald-400' : 'bg-amber-400') + '" title="' + (ok ? 'ข้อมูลครบ' : 'ข้อมูลยังไม่ครบ') + '"></span>' +
        '</div>';
    }).join('') : emptyState('ไม่พบนักเรียน', 'ลองเปลี่ยนชั้น ห้อง หรือคำค้นหา');

function renderPp1Preview() {
    const head = $('pp1-head'), pv = $('pp1-preview');
    if (!head || !pv) return;
    const stu = getStudent(PP1_VIEW.cur), mode = pp1Mode();
    if (!stu) { head.innerHTML = ''; pv.innerHTML = emptyState('ยังไม่มีข้อมูลนักเรียน', 'นำเข้าไฟล์ Excel หรือเชื่อมต่อระบบคะแนนก่อน'); return; }
    const list = pp1ListStudents();
    const idx = list.findIndex(s => String(s.studentId) === PP1_VIEW.cur);
    const issues = pp1Issues(stu, mode);
    const navBtn = (dir, icon, dis) => '<button onclick="window.pp1Step(' + dir + ')" ' + (dis ? 'disabled ' : '') +
        'class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center' + (dis ? ' opacity-40 cursor-not-allowed' : '') + '"><i class="ph ' + icon + '"></i></button>';
    head.innerHTML =
        '<div class="flex flex-wrap items-center gap-3">' +
            navBtn(-1, 'ph-caret-left', idx <= 0) +
            '<div class="min-w-0 flex-1">' +
                '<div class="font-extrabold text-slate-800 truncate">' + esc(studentDisplayName(stu)) + '</div>' +
                '<div class="text-xs text-slate-400">' + (idx >= 0 ? 'คนที่ ' + (idx + 1) + ' จาก ' + list.length + ' • ' : '') +
                    'ห้อง ' + esc(stu.room || '-') + ' เลขที่ ' + esc(stu.no || '-') + ' • เลขประจำตัว ' + esc(stu.studentId) + ' • ใช้ปุ่มลูกศร ↑ ↓ เปลี่ยนคนได้</div>' +
            '</div>' +
            (mode === 'copy'
                ? '<button onclick="document.getElementById(\'pp1-photo-file\').click()" class="tactile-btn bg-white border border-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">' +
                    '<i class="ph ph-camera text-base"></i>' + (stu.photo ? 'เปลี่ยนรูปถ่าย' : 'เพิ่มรูปถ่าย') + '</button>' +
                  (stu.photo ? '<button onclick="window.pp1PhotoRemove()" class="text-xs font-bold text-rose-500 hover:underline">ลบรูป</button>' : '')
                : '') +
            navBtn(1, 'ph-caret-right', idx < 0 || idx >= list.length - 1) +
        '</div>' +
        '<div class="flex flex-wrap gap-1.5 mt-2.5">' +
            (issues.length
                ? '<span class="text-xs font-bold text-amber-700 py-1">ยังขาด:</span>' + issues.map(t => '<span class="px-2 py-1 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-xs font-bold">' + esc(t) + '</span>').join('')
                : '<span class="px-2 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold"><i class="ph ph-check-circle"></i> ข้อมูลครบ พร้อมพิมพ์</span>') +
        '</div>';
    pv.innerHTML = '<div id="pp1-zoom">' + pp1DocHtml(stu, mode) + '</div>';
    window.pp1ShrinkToFit(pv);
    pp1FitPreview();
}
/* ย่อตัวอย่างให้เต็มความกว้างกรอบ — เอกสารจริงกว้าง 210 มม. ใหญ่กว่าจอโน้ตบุ๊กส่วนใหญ่ */
function pp1FitPreview() {
    const pv = $('pp1-preview'), z = $('pp1-zoom');
    if (!pv || !z) return;
    const sheet = z.querySelector('.pp1-sheet');
    if (!sheet) return;
    z.style.zoom = 1;
    const k = Math.min(1, (pv.clientWidth - 24) / sheet.offsetWidth);
    z.style.zoom = k > 0 ? k : 1;
}
window.addEventListener('resize', () => { if (state.page === 'pp1copy' || state.page === 'pp1real') pp1FitPreview(); });
document.addEventListener('keydown', e => {
    if ((state.page !== 'pp1copy' && state.page !== 'pp1real') || !$('pp1-list')) return;
    if (!$('print-view').classList.contains('hidden') || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); window.pp1Step(1); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); window.pp1Step(-1); }
});

window.pp1SetFilter = function (key, value) {
    PP1_VIEW[key] = value;
    /* คนออกกลางคันมาจากหลายชั้นปี เลือกสถานะนี้แล้วให้เห็นทุกชั้นก่อน */
    if (key === 'status') { PP1_VIEW.level = value === 'left' ? '' : String(PP1.settings.cohortLevel || 6); PP1_VIEW.room = ''; navigate(state.page); return; }
    if (key === 'level') { PP1_VIEW.room = ''; navigate(state.page); return; }
    renderPp1List();
    const list = pp1ListStudents();
    if (!list.some(s => String(s.studentId) === PP1_VIEW.cur) && list.length) PP1_VIEW.cur = String(list[0].studentId);
    renderPp1Preview();
};
window.pp1Show = function (sid) {
    PP1_VIEW.cur = String(sid);
    renderPp1List();
    renderPp1Preview();
    const row = document.querySelector('#pp1-list [data-sid="' + CSS.escape(PP1_VIEW.cur) + '"]');
    if (row) row.scrollIntoView({ block: 'nearest' });
};
window.pp1Step = function (dir) {
    const list = pp1ListStudents();
    const idx = list.findIndex(s => String(s.studentId) === PP1_VIEW.cur);
    const next = list[Math.max(0, Math.min(list.length - 1, idx + dir))];
    if (next) window.pp1Show(next.studentId);
};
window.pp1Pick = function (sid, on) {
    if (on) PP1_VIEW.sel[sid] = 1; else delete PP1_VIEW.sel[sid];
    renderPp1List();
};
window.pp1SelectAll = function (on, everyone) {
    if (everyone) PP1_VIEW.sel = {};
    else pp1ListStudents().forEach(s => { if (on) PP1_VIEW.sel[s.studentId] = 1; else delete PP1_VIEW.sel[s.studentId]; });
    renderPp1List();
};
window.pp1ToggleSettings = function () {
    PP1_VIEW.settingsOpen = !PP1_VIEW.settingsOpen;
    $('pp1-settings').classList.toggle('hidden', !PP1_VIEW.settingsOpen);
};
window.applyPp1Settings = function () {
    const c = PP1.settings;
    c.pp1Layout = $('pp1-layout').value;
    c.showGpa = $('pp1-showgpa').value === '1';
    setOnetMode($('pp1-onetmode').value);
    c.onetPercent = num($('pp1-onetpct').value);
    c.pp1Numerals = $('pp1-numerals').value;
    c.pp1NudgeX = Math.min(15, Math.max(-15, num($('pp1-nudgex').value)));
    c.pp1NudgeY = Math.min(15, Math.max(-15, num($('pp1-nudgey').value)));
    c.pp1Stamps = $('pp1-stamps').checked;
    c.inkDark = $('pp1-ink').checked;
    if ($('pp1-gradd')) c.gradD = $('pp1-gradd').value.trim() || '31';
    if ($('pp1-gradm')) c.gradM = $('pp1-gradm').value.trim() || 'มีนาคม';
    if ($('pp1-grady')) c.gradYear = $('pp1-grady').value.trim() || '2569';
    saveDB(true);
    renderPp1Preview();
};

window.applyGradDateToAll = function (force) {
    const c = PP1.settings;
    const d = ($('pp1-gradd') ? $('pp1-gradd').value.trim() : '') || c.gradD || '31';
    const m = ($('pp1-gradm') ? $('pp1-gradm').value.trim() : '') || c.gradM || 'มีนาคม';
    const y = ($('pp1-grady') ? $('pp1-grady').value.trim() : '') || c.gradYear || '2569';
    c.gradD = d;
    c.gradM = m;
    c.gradYear = y;
    let count = 0;
    (PP1.students || []).forEach(s => {
        if (!isLeaver(s)) {
            if (force || !s.gradD || !s.gradM || !s.gradY) {
                s.gradD = d;
                s.gradM = m;
                s.gradY = y;
                count++;
            }
        }
    });
    saveDB(true);
    renderPp1Preview();
    notify('ปรับใช้วันอนุมัติการจบ ' + d + ' ' + m + ' ' + y + ' ให้กับนักเรียน ' + count + ' คน เรียบร้อย');
};
window.resetPp1Margins = function () {

/* ย่อรูปก่อนเก็บ — รูปจากมือถือหลาย MB จะทำให้ฐานข้อมูลในเครื่องโตเร็ว */
function shrinkImage(file, maxW, maxH, type) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                const k = Math.min(1, maxW / img.width, maxH / img.height);
                const cv = document.createElement('canvas');
                cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
                cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                resolve(cv.toDataURL(type, 0.88));
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

/* ตั้งชื่อไฟล์เป็นเลขประจำตัวนักเรียน เลข 13 หลัก หรือชื่อ-นามสกุล เช่น 4550.jpg, 1549900927846.png, ณัฐธิดา เหลือล้น.jpg */
function photoKeyNorm(v) {
    return String(v || '').replace(/^(เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.|นางสาว|นาย|นาง)/, '').replace(/[\s._\-]+/g, '').toLowerCase();
}
function matchPhotoFile(name) {
    const base = name.replace(/\.[^.]+$/, '');
    const n = photoKeyNorm(base);
    const tokens = base.split(/[\s_\-.()]+/).filter(Boolean);
    return PP1.students.find(s => photoKeyNorm(s.first + s.last) === n || photoKeyNorm(s.prefix + s.first + s.last) === n) ||
        PP1.students.find(s => tokens.some(t => t === String(s.studentId) || (s.citizenId && t === String(s.citizenId))));
}

/* =========================================================================
   นักเรียนออกกลางคัน — ย้ายสถานศึกษา ลาออก หรือออกระหว่างปี
   ปพ.1 ของคนกลุ่มนี้พิมพ์ผลการเรียนถึงชั้นที่ออก ไม่มีวันอนุมัติการจบ และไม่ไปปนในรายงานผู้จบ (ปพ.3)
   ========================================================================= */
const LEAVE_TYPES = ['ย้ายสถานศึกษา', 'ลาออก', 'ออกกลางคัน', 'ถึงแก่กรรม', 'อื่น ๆ'];
const LEAVER_NOTE = 'ยังไม่สำเร็จการศึกษาชั้นประถมศึกษา';
function isLeaver(s) { return !!s && s.status === 'left'; }
function leftLevelStored(s) { return num(s.leftLevel) || num(s.level) || num(PP1.settings.cohortLevel) || 6; }
/* ปีการศึกษาที่เข้า ป.1 จากวันเข้าเรียน — ใช้ได้เฉพาะคนที่เข้าที่นี่ตั้งแต่ ป.1 (ไม่มีโรงเรียนเดิม) */
function leaverEntryYear(s) { return s && !s.prevSchool && s.entryY ? academicYearOf(s.entryM, s.entryY) : 0; }
/* ชั้นที่เรียนอยู่ตอนออก: ถ้ามีวันเข้าเรียน นับจากปีที่เข้าถึงปีที่ออก (เข้า 2567 ออกปี 2569 = ป.3)
   ไม่งั้นใช้ชั้นที่เลือกไว้ในฟอร์ม */
function leftLevelOf(s) {
    const e = leaverEntryYear(s), acad = academicYearOf(s.leaveM, s.leaveY);
    if (e && acad && acad >= e) return Math.min(6, acad - e + 1);
    return leftLevelStored(s);
}
/* ชั้นที่ออก = ชั้นที่เรียนอยู่ตอนออก ปพ.1 ออกได้เฉพาะชั้นที่เรียนจบปีการศึกษาแล้ว
   อยู่ ป.4 แล้วออก → ปพ.1 มีแค่ ป.1–3 เว้นแต่ติ๊กว่าเรียนจบชั้นนั้นแล้ว (ออกหลังสิ้นปีการศึกษา) */
function leaverLastLevel(s) { return leftLevelOf(s) - 1 + (s.leftCompleted ? 1 : 0); }
/* ปีการศึกษาไทยเริ่มเดือนพฤษภาคม — ออกเดือนมกราคมถึงเมษายนยังนับเป็นปีการศึกษาก่อนหน้า */
function academicYearOf(month, year) {
    const y = num(year);
    if (!y) return 0;
    const mi = THAI_MONTHS.indexOf(month);
    return mi >= 0 && mi <= 3 ? y - 1 : y;
}
/* ออกตอน ป.4 ปีการศึกษา 2568 → เข้า ป.1 ปีการศึกษา 2565 */
function leaverStartYear(stu) {
    const e = leaverEntryYear(stu);
    if (e) return e;
    const acad = academicYearOf(stu.leaveM, stu.leaveY);
    return acad ? acad - (leftLevelStored(stu) - 1) : 0;
}
/* ปีการศึกษาของแต่ละชั้นสำหรับนักเรียนคนหนึ่ง ผู้ออกกลางคันใช้ปีของตัวเอง ไม่ใช้ปีของรุ่นที่เปิดอยู่ */
function studentYearOfLevel(stu, level) {
    const start = stu && isLeaver(stu) ? leaverStartYear(stu) : 0;
    return start ? String(start + level - 1) : yearOfLevel(level);
}
/* วัน-เดือนที่เข้าเรียนที่พบบ่อยที่สุดในรุ่น ใช้เติมให้ผู้ออกกลางคันที่ยังไม่มี */
function commonEntryDayMonth() {
    const count = {};
    PP1.students.forEach(x => { if (x.entryD && x.entryM) { const k = x.entryD + '|' + x.entryM; count[k] = (count[k] || 0) + 1; } });
    const best = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
    return best ? best.split('|') : ['16', 'พฤษภาคม'];
}
function leaversList() {
    return sortedStudents().filter(isLeaver).sort((a, b) =>
        (num(b.leaveY) - num(a.leaveY)) || (THAI_MONTHS.indexOf(b.leaveM) - THAI_MONTHS.indexOf(a.leaveM)) || (num(b.leaveD) - num(a.leaveD)));
}
/* ข้อความในช่อง "สาเหตุที่ออกจากโรงเรียน" ของ ปพ.1 ประกอบจากประเภทและโรงเรียนปลายทาง */

    if (type === 'ย้ายสถานศึกษา') return ('ย้ายไปเรียนที่โรงเรียน' + (to || '……………') + (province ? ' จังหวัด' + province : '')).trim();
    if (type === 'อื่น ๆ') return detail || '';
    return type + (detail ? ' (' + detail + ')' : '');
}

function pp1YearBlocks(sid) {
    const blocks = [];
    const stu = getStudent(sid);
    const lastLevel = isLeaver(stu) ? leaverLastLevel(stu) : 6;
    for (let level = 1; level <= lastLevel; level++) {
        if (!levelOnPp1(level)) continue;   // ปิดทั้งชั้น (รวมกิจกรรม) ปีของชั้นอื่นคงเดิม
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid] || { subjects: {}, activities: {} };
        /* แสดงเฉพาะรายวิชาที่มีรหัสวิชา หรือมีผลการเรียนบันทึกไว้ (ตรงกับแบบพิมพ์ต้นฉบับ) */
        /* แสดงเฉพาะรายวิชาที่มีรหัสวิชา วิชาที่ไม่ได้ใส่รหัสไม่พิมพ์ใน ปพ.1 แม้จะมีเกรด
           ชั้นที่ไม่มีรายวิชาที่มีรหัสเลยจึงไม่แสดงทั้งชั้น */
        const subs = (cur.subjects || []).filter(s => String(s.code || '').trim());
        if (!subs.length) continue;
        blocks.push({
            level,
            year: studentYearOfLevel(stu, level),
            title: 'ปีการศึกษา ' + (studentYearOfLevel(stu, level) || '….') + ' ' + LEVEL_NAMES[level],
            base: subs.filter(s => s.type !== 'เพิ่มเติม').map(s => ({ label: (s.code ? s.code + '  ' : '') + s.name, hours: s.hours, grade: rec.subjects[s.code || s.name] || '' })),
            extra: subs.filter(s => s.type === 'เพิ่มเติม').map(s => ({ label: (s.code ? s.code + '  ' : '') + s.name, hours: s.hours, grade: rec.subjects[s.code || s.name] || '' })),
            /* แบบพิมพ์เดิมพิมพ์ชื่อชุมนุมต่อท้ายคำว่า "ชุมนุม" เช่น ชุมนุมคณิต */
            acts: (cur.activities || []).filter(a => a.code || a.name).map(a => ({
                label: (rec.clubName && String(a.name || '').indexOf('ชุมนุม') === 0) ? 'ชุมนุม' + rec.clubName : a.name,
                hours: a.hours,
                grade: rec.activities[a.code || a.name] || ''
            }))
        });
    }
    return blocks;
}
/* การจัดปีลงสามคอลัมน์ของ ปพ.1 มีสามแบบ
   byYear     ตามต้นฉบับ  ป.1–2 คอลัมน์ 1 | ป.3–4 คอลัมน์ 2 | ป.5–6 คอลัมน์ 3
   side       ไปด้านข้าง  ปีละคอลัมน์ ป.1 | ป.2 | ป.3 แล้ว ป.4 ต่อใต้ ป.1 ...
   sequential ต่อกันลงมา  เต็มคอลัมน์แล้วขึ้นคอลัมน์ถัดไป ปีหนึ่งไม่ถูกตัดแยกสองคอลัมน์ */
const PP1_LAYOUTS = [
    { value: 'byYear', label: 'ตามต้นฉบับ (ป.1–2 | ป.3–4 | ป.5–6)' },
    { value: 'side', label: 'ไปด้านข้าง (ปีละคอลัมน์)' },
    { value: 'sequential', label: 'ต่อกันลงมา (เต็มคอลัมน์แล้วขึ้นคอลัมน์ใหม่)' }];
function pp1PlaceBlocks(chunks, layout, capacity) {
    const cols = [[], [], []];
    let ci = 0;
    chunks.forEach((c, i) => {
        if (layout === 'side') ci = i % 3;
        else if (layout === 'sequential') {
            if (cols[ci].length && cols[ci].length + c.lines.length > capacity[ci] && ci < 2) ci++;
        } else ci = Math.min(2, Math.floor((c.level - 1) / 2));
        cols[ci].push.apply(cols[ci], c.lines);
    });
    return cols;
}
function pp1SubjectColumns(blocks, layout) {
    const chunks = blocks.map(b => {
        const lines = [{ t: 'year', text: b.title }];
        if (b.base.length) lines.push({ t: 'group', text: 'รายวิชาพื้นฐาน' });
        b.base.forEach(r => lines.push({ t: 'row', r }));
        if (b.extra.length) lines.push({ t: 'group', text: 'รายวิชาเพิ่มเติม' });
        b.extra.forEach(r => lines.push({ t: 'row', r }));
        return { level: b.level, lines };
    });
    return pp1PlaceBlocks(chunks, layout, PP1_GROUPS.map(g => g.subjectTo - PP1_SUBJECT_ROWS.from + 1));
}
function pp1ActivityColumns(blocks, layout) {
    const chunks = blocks.map(b => ({ level: b.level,
        lines: [{ t: 'year', text: 'ปีการศึกษา ' + (b.year || '….') }].concat(b.acts.map(r => ({ t: 'row', r }))) }));
    const rows = PP1_ACTIVITY_ROWS.to - PP1_ACTIVITY_ROWS.from + 1;
    return pp1PlaceBlocks(chunks, layout, [rows, rows, rows]);
}
function pp1ColumnTable(lines, minRows, real) {
    const border = real ? 'none' : '0.7pt solid #111827';
    let html = '<table style="width:100%;border-collapse:collapse;font-size:7.6pt;table-layout:fixed">';
    const emit = (l) => {
        if (l.t === 'year') return '<tr><td colspan="3" style="border:' + border + ';font-weight:700;padding:0 2px">' + esc(l.text) + '</td></tr>';
        if (l.t === 'group') return '<tr><td colspan="3" style="border:' + border + ';padding:0 2px">' + esc(l.text) + '</td></tr>';
        return '<tr><td style="border:' + border + ';padding:0 2px;overflow:hidden;white-space:nowrap">' + esc(l.r.label) + '</td>' +
            '<td style="border:' + border + ';width:11mm;text-align:center">' + esc(l.r.hours || '') + '</td>' +
            '<td style="border:' + border + ';width:11mm;text-align:center;font-weight:700">' + esc(l.r.grade || '') + '</td></tr>';
    };
    lines.forEach(l => { html += emit(l); });
    for (let i = lines.length; i < minRows; i++) {
        html += '<tr><td style="border:' + border + ';padding:0 2px">&nbsp;</td><td style="border:' + border + '"></td><td style="border:' + border + '"></td></tr>';
    }
    return html + '</table>';
}
/* =========================================================================
   แผ่นงานที่ 17 — สรุปเกรด (ใบรับรองผลการเรียน 6 ปี รายกลุ่มสาระ)
   ========================================================================= */
function areaSummaryByYear(sid) {
    const areas = PP1_AREAS.map(a => ({ key: a.key, label: a.label, years: {}, totalHours: 0, wsum: 0, credit: 0 }));
    for (let level = 1; level <= 6; level++) {
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid];
        areas.forEach(a => { a.years[level] = { hours: 0, wsum: 0, credit: 0 }; });
        (cur.subjects || []).filter(s => s.code || s.name).forEach(sub => {
            const key = areaKeyFor(sub);
            let a = areas.find(x => x.key === key);
            if (!a) {
                a = { key: 'other', label: 'อื่น ๆ', years: {}, totalHours: 0, wsum: 0, credit: 0 };
                for (let l = 1; l <= 6; l++) a.years[l] = { hours: 0, wsum: 0, credit: 0 };
                areas.push(a);
            }
            const hours = num(sub.hours), credit = num(sub.credit);
            a.years[level].hours += hours;
            a.totalHours += hours;
            const g = rec ? rec.subjects[sub.code || sub.name] : '';
            if (g !== undefined && g !== '' && !isNaN(parseFloat(g)) && credit) {
                a.years[level].wsum += credit * parseFloat(g); a.years[level].credit += credit;
                a.wsum += credit * parseFloat(g); a.credit += credit;
            }
        });
    }
    areas.forEach(a => {
        for (let l = 1; l <= 6; l++) { const y = a.years[l]; y.avg = y.credit ? roundDown2(y.wsum / y.credit) : ''; }
        a.avg = a.credit ? roundDown2(a.wsum / a.credit) : '';
    });
    return areas;
}

/* =========================================================================
   ทะเบียนคุม ปพ.1 / ปพ.2 — หนึ่งเล่มต่อรุ่น (ปีการศึกษาที่จบ)
   บันทึกชุดที่/เลขที่ของแบบพิมพ์ที่ออกให้นักเรียนแต่ละคน วันที่ออก และช่องลงชื่อผู้รับ
   ปพ.1 ออกให้ทั้งผู้จบและผู้ออกกลางคัน ปพ.2 ออกให้เฉพาะผู้จบ
   ========================================================================= */
const REG_KINDS = {
    pp1: { label: 'ทะเบียนคุม ปพ.1', title: 'ทะเบียนคุมแบบรายงานผลการเรียน (ปพ.1 : ป)', hasSet: true },
    pp2: { label: 'ทะเบียนคุม ปพ.2', title: 'ทะเบียนคุมใบรับรองการศึกษา (ปพ.2 : ป)', hasSet: false }
};
const REG_ROWS_PER_PAGE = 22;
function regKind() { return REG_KINDS[state.regKind] ? state.regKind : 'pp1'; }
/* ผู้จบกับผู้ออกกลางคันลงเลขแยกเล่มกัน ไม่ให้เลขสลับไปมาตามลำดับห้อง */
function regGroup(kind) { return kind === 'pp1' && state.regGroup === 'left' ? 'left' : 'grad'; }
function registerStudents(kind, group) {
    group = group || regGroup(kind);
    return sortedStudents().filter(s => group === 'left' ? isLeaver(s) : !isLeaver(s));
}
function regTitle(kind, group) {
    return REG_KINDS[kind].title + (group === 'left' ? ' — นักเรียนออกกลางคัน' : '');
}
/* วันที่ออกเอกสาร: ผู้จบใช้วันอนุมัติการจบ ผู้ออกกลางคันใช้วันที่ออกจากโรงเรียน */
function regIssueDate(s) {
    if (isLeaver(s)) return thaiDate(s.leaveD, s.leaveM, s.leaveY);
    const gd = studentGradDate(s);
    return thaiDate(gd.d, gd.m, gd.y);
}
function regNumberOf(s, kind) { return kind === 'pp1' ? (s.pp1No || '') : (s.pp2No || ''); }
function regRemark(s) {
    const parts = [];
    if (isLeaver(s)) parts.push((s.leaveType || 'ออกกลางคัน') + ' (ป.' + leftLevelOf(s) + ')');
    if (s.regNote) parts.push(s.regNote);
    return parts.join(' • ');
}

function regDuplicates(list, kind) {
    const seen = {}, dup = [];
    list.forEach(s => {
        const key = (kind === 'pp1' ? (s.pp1Set || '') + '/' : '') + regNumberOf(s, kind);
        const no = regNumberOf(s, kind);
        if (!no) return;
        if (seen[key] && dup.indexOf(no) < 0) dup.push(no);
        seen[key] = 1;
    });
    return dup;
}
window.setRegKind = function (k) { state.regKind = k; navigate('register'); };
window.setRegGroup = function (g) { state.regGroup = g; navigate('register'); };
/* พิมพ์เลขที่ (หรือชุดที่) ของคนหนึ่ง แล้วคนที่อยู่ถัดลงไปได้เลขเรียงต่อกันทันที ไม่ต้องกรอกทีละคน */
window.setRegField = function (sid, key, val) {
    const s = getStudent(sid);
    if (!s) return;
    const v = String(val).trim();
    s[key] = v;
    const cascade = (key === 'pp1No' || key === 'pp2No') ? /^\d+$/.test(v) : key === 'pp1Set' && v;
    if (cascade) {
        const list = registerStudents(regKind());
        const at = list.findIndex(x => String(x.studentId) === String(sid));
        for (let j = at + 1; j < list.length; j++) {
            const nv = key === 'pp1Set' ? v : regNextNumber(v, j - at);
            list[j][key] = nv;
            const el = $('reg-' + key + '-' + j);
            if (el) el.value = nv;
        }
        if (at < list.length - 1) notify('เรียง' + (key === 'pp1Set' ? 'ชุดที่' : 'เลขที่') + 'ให้อีก ' + (list.length - 1 - at) + ' คนถัดลงไปแล้ว');
    }
    saveDebounced();
};
/* เลขถัดไปโดยคงจำนวนหลักเดิม เช่น 00019 → 00020 */
function regNextNumber(start, step) {
    const digits = String(start).trim();
    const n = parseInt(digits, 10) + step;
    return String(n).padStart(digits.length, '0');
}
window.regAutoNumber = function () {
    const kind = regKind();
    const start = $('reg-start').value.trim();
    if (!/^\d+$/.test(start)) { notify('กรอกเลขที่เริ่มต้นเป็นตัวเลข', 'warn'); return; }
    const set = $('reg-set') ? $('reg-set').value.trim() : '';
    const onlyEmpty = $('reg-onlyempty').checked;
    const list = registerStudents(kind).filter(s => !onlyEmpty || !regNumberOf(s, kind));   // เฉพาะกลุ่มที่เปิดอยู่
    if (!list.length) { notify('ทุกคนมีเลขแล้ว — เอาเครื่องหมายช่อง "เติมเฉพาะคนที่ยังไม่มีเลข" ออกถ้าต้องการลงใหม่ทั้งหมด', 'warn'); return; }
    const last = regNextNumber(start, list.length - 1);
    if (!confirm('ลงเลขให้ ' + list.length + ' คน เลขที่ ' + start + ' ถึง ' + last + (set ? ' ชุดที่ ' + set : '') + '?')) return;
    list.forEach((s, i) => {
        if (kind === 'pp1') { s.pp1No = regNextNumber(start, i); if (set) s.pp1Set = set; }
        else s.pp2No = regNextNumber(start, i);
    });
    saveDB();
    navigate('register');
    notify('ลงเลขแล้ว ' + list.length + ' คน');
};

/* =========================================================================
   นำเข้า / ส่งออกข้อมูล (Excel .xlsm/.xlsx และ JSON)

window.openFilePicker = function () { $('file-import').click(); };
window.handleImportFile = function (ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    const isJson = /\.json$/i.test(file.name);
    reader.onload = async function (e) {
        try {
            if (isJson) {
                const parsed = JSON.parse(e.target.result);
                PP1 = mergeDefaults(defaultDB(), parsed);
                window.PP1 = PP1; saveDB(); navigate(state.page);
                notify('นำเข้าไฟล์สำรองสำเร็จ');
            } else {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const year = await prepareCohortForImport(wb);
                const report = importFromWorkbook(wb);
                await saveDB(); navigate('students');
                scheduleImageSync(0);
                if (year) notify('เก็บเป็นรุ่นที่จบปีการศึกษา ' + year + ' (ป.1 ปี ' + (num(year) - 5) + ')');
                notify('นำเข้าสำเร็จ • นักเรียน ' + report.students + ' คน • รายวิชา ' + report.subjects + ' วิชา • ผลการเรียน ' + report.grades + ' ช่อง');
            }
        } catch (err) {
            console.error(err);
            notify('นำเข้าไม่สำเร็จ: ' + err.message, 'error');
        }
        ev.target.value = '';
    };
    if (isJson) reader.readAsText(file, 'utf-8'); else reader.readAsArrayBuffer(file);
};
function sheetRows(wb, name) {
    const ws = wb.Sheets[name];
    if (!ws) return null;
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
}
function cellAt(rows, r, c) {
    const row = rows[r];
    if (!row) return '';
    const v = row[c];
    return (v === undefined || v === null) ? '' : String(v).trim();
}
function importFromWorkbook(wb) {
    const report = { students: 0, subjects: 0, grades: 0 };

    /* --- ข้อมูลพื้นฐาน --- */
    const basic = sheetRows(wb, 'ข้อมูลพื้นฐาน');
    if (basic) {
        const D = 3;
        PP1.school.name = cellAt(basic, 3, D) || PP1.school.name;
        PP1.school.affiliation = cellAt(basic, 4, D) || PP1.school.affiliation;
        PP1.school.area = cellAt(basic, 5, D) || PP1.school.area;
        PP1.school.tambon = cellAt(basic, 6, D) || PP1.school.tambon;
        PP1.school.amphoe = cellAt(basic, 7, D) || PP1.school.amphoe;
        PP1.school.province = cellAt(basic, 8, D) || PP1.school.province;
        PP1.school.registrar = cellAt(basic, 9, D) || PP1.school.registrar;
        PP1.school.registrarPosition = cellAt(basic, 10, D) || PP1.school.registrarPosition;
        PP1.school.director = cellAt(basic, 11, D) || PP1.school.director;
        PP1.school.directorPosition = cellAt(basic, 12, D) || PP1.school.directorPosition;
    }

    /* --- หลักสูตร --- */
    const cur = sheetRows(wb, 'หลักสูตร');
    if (cur) {
        const bands = [
            { level: 1, base: 0,  subFrom: 3,  subTo: 20, actFrom: 22, actTo: 26 },
            { level: 2, base: 8,  subFrom: 3,  subTo: 20, actFrom: 22, actTo: 26 },
            { level: 3, base: 16, subFrom: 3,  subTo: 20, actFrom: 22, actTo: 26 },
            { level: 4, base: 0,  subFrom: 31, subTo: 48, actFrom: 50, actTo: 54 },
            { level: 5, base: 8,  subFrom: 31, subTo: 48, actFrom: 50, actTo: 54 },
            { level: 6, base: 16, subFrom: 31, subTo: 48, actFrom: 50, actTo: 54 }
        ];
        bands.forEach(b => {
            const subs = [], acts = [];
            for (let r = b.subFrom; r <= b.subTo; r++) {
                const code = cellAt(cur, r, b.base + 1), name = cellAt(cur, r, b.base + 2);
                if (!code && !name) continue;
                subs.push({
                    code, name,
                    /* เก็บประเภทตามที่กรอกไว้จริง ช่องว่างในต้นฉบับหมายถึงรายวิชา
                       ที่ยังไม่จัดประเภท และแบบพิมพ์วางไว้ท้ายรายการ */
                    type: cellAt(cur, r, b.base + 3),
                    area: cellAt(cur, r, b.base + 4),
                    hours: cellAt(cur, r, b.base + 5),
                    credit: cellAt(cur, r, b.base + 6)
                });
            }
            for (let r = b.actFrom; r <= b.actTo; r++) {
                const code = cellAt(cur, r, b.base + 1), name = cellAt(cur, r, b.base + 2);
                if (!code && !name) continue;
                acts.push({ code, name, hours: cellAt(cur, r, b.base + 5) });
            }
            /* หลักสูตรแต่ละปีตามไฟล์ที่นำเข้าทั้งหมด ชั้นที่ไฟล์ว่างก็ว่างตาม */
            PP1.curriculum[b.level] = { subjects: subs, activities: acts };
            report.subjects += subs.length;
        });
    }

    /* --- ข้อมูลนักเรียน --- */
    const stuRows = sheetRows(wb, 'ข้อมูลนักเรียน');
    if (stuRows) {
        const startYear = cellAt(stuRows, 3, 5);
        if (startYear) PP1.settings.startYear = startYear;
        const map = {
            room: 0, no: 1, studentId: 2, prefix: 3, first: 4, last: 5, citizenId: 6,
            entryD: 7, entryM: 8, entryY: 9, prevSchool: 10, prevProvince: 11, prevLevel: 12,
            birthD: 13, birthM: 14, birthY: 15, sex: 16, nationality: 17, religion: 18,
            father: 19, mother: 20, pp1Set: 21, pp1No: 22, pp2No: 23,
            gradD: 24, gradM: 25, gradY: 26, leaveD: 27, leaveM: 28, leaveY: 29, leaveReason: 30,
            evalBasic: 31, evalRead: 32, evalChar: 33, evalAct: 34,
            decBasic: 35, decRead: 36, decChar: 37, decAct: 38,
            onet_thai: 39, onet_math: 40, onet_sci: 41, onet_soc: 42,
            onet_health: 43, onet_art: 44, onet_work: 45, onet_eng: 46,
            onetAvg: 47, pp1Note: 52
        };
        const imported = [];
        for (let r = 6; r < stuRows.length; r++) {
            const sid = cellAt(stuRows, r, 2);
            const first = cellAt(stuRows, r, 4);
            if (!sid && !first) continue;
            const rec = {};
            Object.keys(map).forEach(k => { rec[k] = cellAt(stuRows, r, map[k]); });
            if (!rec.studentId) continue;
            imported.push(rec);
        }
        /* รูปถ่ายและสถานะออกกลางคันไม่มีในไฟล์ Excel จึงคงของเดิมไว้ */
        const keep = ['photo', 'photoAt', 'status', 'leaveType', 'leftLevel', 'leftTerm', 'leaveTo', 'leaveProvince', 'leaveDetail', 'leaveBackup'];
        imported.forEach(rec => {
            const old = getStudent(rec.studentId);
            if (old) keep.forEach(k => { if (old[k] !== undefined) rec[k] = old[k]; });
            if (!rec.gradD && !isLeaver(rec)) rec.gradD = PP1.settings.gradD || '31';
            if (!rec.gradM && !isLeaver(rec)) rec.gradM = PP1.settings.gradM || 'มีนาคม';
            if (!rec.gradY && !isLeaver(rec)) rec.gradY = PP1.settings.gradYear || '2569';
        });
        if (imported.length) { PP1.students = imported; report.students = imported.length; }
    }

    /* --- ข้อมูลใบรับรอง --- */
    const certRows = sheetRows(wb, 'ข้อมูลใบรับรอง');
    if (certRows) {
        for (let r = 6; r < certRows.length; r++) {
            const sid = cellAt(certRows, r, 2);
            if (!sid) continue;
            PP1.certData[sid] = {
                docNo: cellAt(certRows, r, 6), d: cellAt(certRows, r, 7), m: cellAt(certRows, r, 8), y: cellAt(certRows, r, 9),
                l1: cellAt(certRows, r, 10), l2: cellAt(certRows, r, 11), l3: cellAt(certRows, r, 12), note: cellAt(certRows, r, 13)
            };
        }
    }

    /* --- เกรด 1 - 6 --- */
    const qualityMap = { '3': 'ดีเยี่ยม', '2': 'ดี', '1': 'ผ่าน', '0': 'ไม่ผ่าน' };
    for (let level = 1; level <= 6; level++) {
        const g = sheetRows(wb, 'เกรด' + level);
        if (!g) continue;
        const year = cellAt(g, 0, 3);
        PP1.grades[level] = { year: year || '', records: {} };
        const cols = [];   // ตำแหน่งคอลัมน์รายวิชา H..Y
        for (let c = 7; c <= 24; c++) cols.push({ c, code: cellAt(g, 2, c), name: cellAt(g, 1, c) });
        const actCols = [];
        for (let c = 25; c <= 29; c++) actCols.push({ c, code: cellAt(g, 2, c), name: cellAt(g, 1, c) });
        const curSubs = (PP1.curriculum[level].subjects || []);
        const curActs = (PP1.curriculum[level].activities || []);
        for (let r = 6; r < g.length; r++) {
            const sid = cellAt(g, r, 2);
            if (!sid) continue;
            const rec = gradeRecord(level, sid);
            cols.forEach((col, idx) => {
                const val = cellAt(g, r, col.c);
                if (val === '') return;
                let target = curSubs.find(s => col.code && s.code && s.code.trim() === col.code.trim());
                if (!target) target = curSubs.find(s => col.name && s.name && s.name.trim() === col.name.trim());
                if (!target) target = curSubs[idx];
                if (!target) return;
                rec.subjects[target.code || target.name] = val;
                report.grades++;
            });
            actCols.forEach((col, idx) => {
                const val = cellAt(g, r, col.c);
                if (val === '') return;
                let target = curActs.find(a => col.code && a.code && a.code.trim() === col.code.trim());
                if (!target) target = curActs.find(a => col.name && a.name && a.name.trim() === col.name.trim());
                if (!target) target = curActs[idx];
                if (!target) return;
                rec.activities[target.code || target.name] = val;
            });
            const ch = cellAt(g, r, 30), rd = cellAt(g, r, 31);
            rec.character = qualityMap[ch] !== undefined ? qualityMap[ch] : ch;
            rec.reading = qualityMap[rd] !== undefined ? qualityMap[rd] : rd;
            rec.activitySummary = cellAt(g, r, 32);
            rec.clubName = cellAt(g, r, 36);
        }
    }

    /* --- O-Net (เก็บข้อมูลดิบไว้ดู/โอนซ้ำ) --- */
    const onet = sheetRows(wb, 'O-Net');
    if (onet) {
        const rows = [];
        for (let r = 11; r < onet.length; r++) {
            const cid = cellAt(onet, r, 2);
            if (!cid) continue;
            rows.push(onet[r].map(v => (v === undefined || v === null) ? '' : String(v)));
        }
        if (rows.length) PP1.onetRaw = { header: {}, rows };
    }
    return report;
}

/* =========================================================================
   เชื่อมต่อระบบคะแนน ANPSCORE — ดึงข้อมูลสดจาก Firestore ชุดเดียวกับ index.html
   ------------------------------------------------------------------------

   index.html) ชั้นปีที่ดึงสดได้จึงเป็นชั้นที่กำลังเรียนอยู่เท่านั้น ชั้นปี
   ก่อนหน้าของรุ่นเดียวกันยังต้องมาจากแฟ้ม Excel เดิมหรือกรอกเอง
   ========================================================================= */
const ANP = {
    status: 'idle',        // idle | connecting | ready | error | offline
    message: '',
    db: null,              // core_db ของ ANPSCORE
    subjectData: {},       // รูปแบบเดียวกับ DB_SubjectData
    scoresLoaded: false,
    loadedAt: 0,
    live: false
};
window.ANP = ANP;

function anpSource() {
    if (ANP.db) return { db: ANP.db, sdata: ANP.subjectData, live: ANP.live };
    const local = readAnpscore();
    return local ? { db: local.db, sdata: local.sdata, live: false } : null;
}
/* "ป.6/1" -> { level: 6, room: "1" } */
function parseClassName(name) {
    const m = String(name || '').match(/ป\.?\s*([1-6])\s*\/\s*(\d+)/);
    if (m) return { level: parseInt(m[1], 10), room: m[2] };
    const m2 = String(name || '').match(/([1-6])\s*\/\s*(\d+)/);
    if (m2) return { level: parseInt(m2[1], 10), room: m2[2] };
    return null;
}
function anpClassEntries() {
    const src = anpSource();
    if (!src || !src.db || !src.db.classes) return [];
    return Object.entries(src.db.classes).map(([cId, cls]) => {
        const parsed = parseClassName(cls.name);
        return { cId, name: cls.name || '', level: parsed ? parsed.level : null, room: parsed ? parsed.room : '', students: (cls.students || []).length };
    }).sort((a, b) => String(a.name).localeCompare(String(b.name), 'th', { numeric: true }));
}
function anpCurrentYear() {
    const src = anpSource();
    return src && src.db && src.db.schoolInfo ? String(src.db.schoolInfo.year || '') : '';
}
function setAnpStatus(status, message) {
    ANP.status = status; ANP.message = message || '';
    const el = $('anp-pill');
    if (el) {
        const tone = status === 'ready' ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
            : status === 'connecting' ? 'bg-amber-50 text-amber-700 border-amber-200'
            : status === 'offline' ? 'bg-slate-100 text-slate-600 border-slate-200'
            : status === 'error' ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-slate-100 text-slate-600 border-slate-200';
        const icon = status === 'ready' ? 'ph-cloud-check' : status === 'connecting' ? 'ph-spinner-gap animate-spin'
            : status === 'offline' ? 'ph-cloud-slash' : status === 'error' ? 'ph-cloud-warning' : 'ph-cloud';
        el.className = 'w-full flex items-center gap-2 px-3 py-2 rounded-xl border text-[11px] font-bold ' + tone;
        el.innerHTML = '<i class="ph ' + icon + ' text-sm shrink-0"></i><span class="truncate">' + esc(ANP.message || status) + '</span>';
    }
    if (state.page === 'sync' && $('page-root')) PAGES.sync($('page-root'));
}

async function connectScoreSystem(opts) {
    opts = opts || {};
    if (!window.anpCloud) { setAnpStatus('offline', 'ใช้ข้อมูลในเครื่อง (ยังไม่ได้เชื่อมคลาวด์)'); return false; }
    try {
        setAnpStatus('connecting', 'กำลังเชื่อมต่อระบบคะแนน…');
        await window.anpCloud.connect();
        const core = await window.anpCloud.loadCore();
        if (!core.db) { setAnpStatus('error', 'เชื่อมต่อได้ แต่ยังไม่พบข้อมูลระบบคะแนน'); return false; }
        ANP.db = core.db;
        ANP.subjectData = {};
        Object.keys(core.subjects || {}).forEach(subId => {
            const meta = core.subjects[subId] || {};
            ANP.subjectData[subId] = Object.assign({ classData: {}, scores: {} }, meta, { scores: {} });
        });
        ANP.live = true; ANP.loadedAt = Date.now(); ANP.scoresLoaded = false;
        setAnpStatus('ready', 'เชื่อมต่อแล้ว • ปีการศึกษา ' + (anpCurrentYear() || '-'));
        return true;
    } catch (e) {
        console.warn(e);
        const local = readAnpscore();
        setAnpStatus(local ? 'offline' : 'error', local ? 'ออฟไลน์ — ใช้ข้อมูลที่แคชไว้ในเครื่อง' : ('เชื่อมต่อไม่สำเร็จ: ' + e.message));
        return false;
    }
}
async function loadScoresFromCloud(subIds) {
    if (!window.anpCloud || !ANP.live) return false;
    const ids = subIds && subIds.length ? subIds : (ANP.db.subjects || []).map(s => s.id);
    if (!ids.length) return false;
    setAnpStatus('connecting', 'กำลังดึงคะแนน 0/' + ids.length + ' วิชา…');
    const data = await window.anpCloud.loadScoresForSubjects(ids, (done, total) => {
        setAnpStatus('connecting', 'กำลังดึงคะแนน ' + done + '/' + total + ' วิชา…');
    });
    Object.keys(data).forEach(subId => {
        if (!ANP.subjectData[subId]) ANP.subjectData[subId] = { classData: {}, scores: {} };
        ANP.subjectData[subId].scores = data[subId];
    });
    ANP.scoresLoaded = true;
    setAnpStatus('ready', 'เชื่อมต่อแล้ว • ปีการศึกษา ' + (anpCurrentYear() || '-'));
    return true;
}

/* ---------- ซิงก์รายชื่อนักเรียน + หลักสูตร (ไม่ทับข้อมูลงานทะเบียน) ---------- */
function syncStudentsFromAnp(classIds) {
    const src = anpSource();
    if (!src) return { added: 0, updated: 0 };
    let added = 0, updated = 0;
    classIds.forEach(cId => {
        const cls = src.db.classes[cId];
        if (!cls) return;
        const parsed = parseClassName(cls.name);
        (cls.students || []).forEach(stu => {
            const sid = String(stu.studentId || '').trim();
            if (!sid) return;
            const parts = String(stu.name || '').trim();
            const pfx = PREFIXES.find(p => parts.indexOf(p) === 0) || '';
            const rest = parts.slice(pfx.length).trim().split(/\s+/);
            let target = getStudent(sid);
            if (!target) {
                target = { studentId: sid, room: parsed ? parsed.room : '', no: '', prefix: pfx, first: rest[0] || '', last: rest.slice(1).join(' ') || '',
                    citizenId: '', nationality: 'ไทย', religion: 'พุทธ', sex: pfx.indexOf('หญิง') >= 0 ? 'หญิง' : 'ชาย',
                    gradD: PP1.settings.gradD || '31', gradM: PP1.settings.gradM || 'มีนาคม', gradY: PP1.settings.gradYear || (typeof yearOfLevel === 'function' ? yearOfLevel(6) : '2569') };
                PP1.students.push(target); added++;
            } else {
                /* อัปเดตเฉพาะช่องที่ยังว่าง — ข้อมูลงานทะเบียนที่กรอกเองต้องไม่ถูกทับ */
                if (!target.first && rest[0]) { target.first = rest[0]; target.last = rest.slice(1).join(' '); updated++; }
                if (!target.prefix && pfx) { target.prefix = pfx; }
                if (!target.room && parsed) target.room = parsed.room;
            }
        });
    });
    return { added, updated };
}
function syncCurriculumFromAnp(level, classIds) {
    const src = anpSource();
    if (!src) return 0;
    const cur = PP1.curriculum[level];
    const used = new Set();
    classIds.forEach(cId => {
        (src.db.subjects || []).forEach(sub => {
            const sd = src.sdata[sub.id];
            if (!sd) return;
            const taught = (sd.classData && sd.classData[cId]) || (sd.scores && sd.scores[cId]);
            if (!taught) return;
            used.add(sub.id);
        });
    });
    let added = 0;
    Array.from(used).forEach(subId => {
        const sub = (src.db.subjects || []).find(s => s.id === subId);
        if (!sub) return;
        const exists = (cur.subjects || []).some(s =>
            (sub.code && s.code && s.code.trim() === String(sub.code).trim()) ||
            (sub.name && s.name && s.name.trim() === String(sub.name).trim()));
        if (exists) return;
        if ((cur.subjects || []).length >= MAX_SUBJECT_SLOTS) return;
        cur.subjects.push({ code: String(sub.code || '').trim(), name: String(sub.name || '').trim(), type: 'พื้นฐาน', area: '', hours: '', credit: '' });
        added++;
    });
    /* ระบบคะแนนไม่ได้เก็บรหัสวิชา จึงสร้างให้ตามรูปแบบ สพฐ. แล้วค่อยเรียง
       เพราะการเรียงอ้างอิงรหัสวิชา และเอกสารทุกฉบับอ่านลำดับนี้ต่อ */
    if (added) { generateSubjectCodes(level, false); sortCurriculumLevel(level); }
    return added;
}
function syncGradesFromAnp(level, classIds, opts) {
    opts = opts || {};
    const src = anpSource();
    if (!src) return { filled: 0, skipped: 0 };
    const settings = src.db.gradeSettings || { '4.0': 80, '3.5': 75, '3.0': 70, '2.5': 65, '2.0': 60, '1.5': 55, '1.0': 50 };
    const curSubjects = (PP1.curriculum[level].subjects || []).filter(s => s.code || s.name);
    const requireBoth = PP1.settings.syncRequireBothTerms !== false;
    let filled = 0, skipped = 0;
    classIds.forEach(cId => {
        const cls = src.db.classes[cId];
        if (!cls) return;
        (cls.students || []).forEach(stu => {
            const sid = String(stu.studentId || '').trim();
            if (!sid || !getStudent(sid)) return;
            const rec = gradeRecord(level, sid);
            (src.db.subjects || []).forEach(sub => {
                const sd = src.sdata[sub.id];
                if (!sd) return;
                const match = curSubjects.find(cs =>
                    (sub.code && cs.code && String(sub.code).trim() === String(cs.code).trim()) ||
                    (sub.name && cs.name && String(sub.name).trim() === String(cs.name).trim()));
                if (!match) { skipped++; return; }
                const t1 = anpTotalScore(sd, cId, sid, '1'), t2 = anpTotalScore(sd, cId, sid, '2');
                if (t1 === null && t2 === null) return;
                /* เกรดปลายปีต้องมาจากคะแนนครบทั้งสองภาคเรียน มิฉะนั้นปีที่เพิ่งเริ่ม
                   จะถูกแปลงเป็นเกรด 0 แล้วติดไปกับ ปพ.1 ซึ่งเป็นเอกสารทางการ */
                if (requireBoth && (t1 === null || t2 === null)) { skipped++; return; }
                const score = (t1 === null || t2 === null) ? (t1 === null ? t2 : t1) : (t1 + t2) / 2;
                const key = match.code || match.name;
                if (!opts.overwrite && rec.subjects[key] !== undefined && rec.subjects[key] !== '') return;
                rec.subjects[key] = anpGrade(score, settings);
                filled++;
            });
        });
    });
    return { filled, skipped };
}
/* ---------- ดึงข้อมูลส่วนตัวจากระบบจัดการข้อมูลนักเรียน (แบบสำรวจ) ----------
   ระบบสำรวจไม่มีเลขประจำตัวนักเรียน จึงจับคู่ด้วยชื่อ-สกุล และใช้ชั้น/ห้อง
   ช่วยแยกกรณีชื่อซ้ำ */
function normalizeName(s) {
    return String(s || '').replace(/\s+/g, '').trim();
}

/* ---------- คำนำหน้าชื่อบิดา-มารดา ----------
   ระบบสำรวจบันทึกชื่อผู้ปกครองไว้เปล่า ๆ ไม่มีคำนำหน้า แต่เอกสารงานทะเบียน
   ต้องมี จึงเติมให้ตามหลักที่นายทะเบียนใช้: บิดาเป็น "นาย" เสมอ ส่วนมารดา
   ถ้านามสกุลตรงกับบิดาถือว่าสมรสแล้วใช้ "นาง" ถ้าต่างกันใช้ "นางสาว" */
const NAME_TITLES = [
    'นางสาว', 'นาง', 'นาย', 'น.ส.', 'ด.ช.', 'ด.ญ.', 'เด็กชาย', 'เด็กหญิง',
    'ว่าที่', 'ดร.', 'พระ', 'สามเณร', 'หม่อม', 'คุณ',
    'ร้อยตำรวจ', 'พันตำรวจ', 'พลตำรวจ', 'สิบตำรวจ', 'จ่าสิบตำรวจ', 'ดาบตำรวจ',
    'ร้อย', 'พัน', 'พล', 'จ่าสิบ', 'สิบ', 'นาวา', 'เรือ', 'เรืออากาศ', 'นายแพทย์', 'แพทย์หญิง',
    'ร.ต.', 'ร.อ.', 'ร.ท.', 'พ.ต.', 'พ.อ.', 'พ.ท.', 'จ.ส.อ.', 'ส.อ.', 'ส.ต.', 'ด.ต.'
];
function hasNameTitle(name) {
    const t = String(name || '').trim();
    return NAME_TITLES.some(p => t.indexOf(p) === 0);
}
function lastNameOf(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    return parts.length ? parts[parts.length - 1].replace(/[.ๆ]+$/, '') : '';
}
function applyParentTitles(stu) {
    let changed = false;
    const father = String(stu.father || '').trim();
    const mother = String(stu.mother || '').trim();
    if (father && !hasNameTitle(father)) { stu.father = 'นาย' + father; changed = true; }
    if (mother && !hasNameTitle(mother)) {
        const fLast = lastNameOf(stu.father);
        const mLast = lastNameOf(mother);
        /* ไม่มีชื่อบิดาให้เทียบ จึงใช้ "นาง" เป็นค่าตั้งต้น */
        const title = (!fLast || fLast === mLast) ? 'นาง' : 'นางสาว';
        stu.mother = title + mother;
        changed = true;
    }
    return changed;
}
window.applyParentTitlesAll = function () {
    let n = 0;
    PP1.students.forEach(s => { if (applyParentTitles(s)) n++; });
    saveDB();
    renderStudentGrid();
    notify(n ? 'เติมคำนำหน้าบิดา-มารดาแล้ว ' + n + ' คน' : 'ทุกรายการมีคำนำหน้าอยู่แล้ว', n ? 'success' : 'warn');
};
function studentNameKey(prefixFirst, last) {
    return normalizeName(prefixFirst) + '|' + normalizeName(last);
}
function dobToThai(dob) {
    /* ระบบสำรวจเก็บเป็น ค.ศ. รูปแบบ YYYY-MM-DD */
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dob || '').trim());
    if (!m) return null;
    const year = parseInt(m[1], 10);
    const beYear = year > 2200 ? year : year + 543;
    return { d: String(parseInt(m[3], 10)), m: THAI_MONTHS[parseInt(m[2], 10) - 1] || '', y: String(beYear) };
}
window.importFromSurvey = async function (opts) {
    opts = opts || {};
    if (!window.surveyCloud) { notify('ยังโหลดโมดูลคลาวด์ไม่เสร็จ ลองใหม่อีกครั้ง', 'warn'); return; }
    if (!PP1.students.length) { notify('ยังไม่มีทะเบียนนักเรียน — ซิงก์รายชื่อจากระบบคะแนนก่อน', 'warn'); return; }
    setAnpStatus('connecting', 'กำลังดึงข้อมูลส่วนตัวจากระบบสำรวจ…');
    let rows, info;
    try {
        rows = await window.surveyCloud.loadStudents();
        info = await window.surveyCloud.loadSchoolInfo();
    } catch (e) {
        setAnpStatus('error', 'ดึงข้อมูลระบบสำรวจไม่สำเร็จ');
        notify('ดึงข้อมูลไม่สำเร็จ: ' + e.message, 'error');
        return;
    }
    if (info) {
        if (info.logoUrl) PP1.school.logo = info.logoUrl;
        if (!PP1.school.name && info.name) PP1.school.name = String(info.name).replace(/^โรงเรียน/, '');
        if (info.affiliation && !PP1.school.affiliation) PP1.school.affiliation = String(info.affiliation).replace(/^สังกัด/, '');
        if (info.address) PP1.school.addressLine = info.address;
        if (info.academicYear) PP1.settings.certYear = String(info.academicYear);
    }
    /* จับคู่ด้วยชื่อ-สกุลโดยไม่นับคำนำหน้า เพราะสองระบบบันทึกคำนำหน้าไม่ตรงกัน
       (เช่น เด็กชาย/นาย) ถ้าชื่อซ้ำจึงค่อยใช้ชั้นและห้องแยก */
    const byName = {};
    rows.forEach(r => {
        const key = studentNameKey(r.firstName, r.lastName);
        (byName[key] = byName[key] || []).push(r);
    });
    const level = cohortLevel();
    let matched = 0, ambiguous = 0, filled = 0;
    const missing = [];
    PP1.students.forEach(s => {
        const key = studentNameKey(s.first, s.last);
        let candidates = byName[key] || [];
        if (candidates.length > 1) {
            const narrowed = candidates.filter(r => String(r.grade || '') === 'ป.' + level && String(r.room || '') === String(s.room || ''));
            if (narrowed.length === 1) candidates = narrowed;
            else { ambiguous++; missing.push({ name: studentDisplayName(s), room: s.room, reason: 'ชื่อซ้ำ ' + candidates.length + ' รายการ' }); return; }
        }
        if (!candidates.length) { missing.push({ name: studentDisplayName(s), room: s.room, reason: 'ไม่พบในระบบสำรวจ' }); return; }
        const r = candidates[0];
        matched++;
        const set = (field, value) => {
            if (value === undefined || value === null || String(value).trim() === '') return;
            if (!opts.overwrite && s[field] !== undefined && String(s[field]).trim() !== '') return;
            s[field] = String(value).trim(); filled++;
        };
        set('citizenId', r.nationalId);
        set('father', r.fatherName);
        set('mother', r.motherName);
        set('religion', r.religion);
        set('sex', r.gender);
        set('prefix', r.prefix);
        const b = dobToThai(r.dob);
        if (b) { set('birthD', b.d); set('birthM', b.m); set('birthY', b.y); }
        /* ระบบสำรวจส่งชื่อผู้ปกครองมาโดยไม่มีคำนำหน้า เติมให้ตามหลักงานทะเบียน */
        if (applyParentTitles(s)) filled++;
    });
    saveDB();
    setAnpStatus('ready', 'เชื่อมต่อแล้ว • ปีการศึกษา ' + (anpCurrentYear() || '-'));
    notify('ดึงข้อมูลส่วนตัวแล้ว • จับคู่ได้ ' + matched + '/' + PP1.students.length + ' คน • เติม ' + filled + ' ช่อง' +
        (missing.length ? ' • จับคู่ไม่ได้ ' + missing.length : ''), missing.length ? 'warn' : 'success');
    navigate(state.page);
    if (missing.length) {
        openModal('<h3 class="text-xl font-extrabold text-slate-800 mb-1">จับคู่ไม่ได้ ' + missing.length + ' คน</h3>' +
            '<p class="text-sm text-slate-500 mb-4">ชื่อในทะเบียน ปพ.1 ไม่ตรงกับชื่อในระบบสำรวจ ตรวจสอบการสะกดในระบบใดระบบหนึ่งแล้วดึงข้อมูลใหม่อีกครั้ง</p>' +
            '<div class="border border-slate-200 rounded-xl divide-y divide-slate-100 max-h-72 overflow-y-auto">' +
            missing.map(m => '<div class="px-3 py-2 text-sm flex justify-between gap-3">' +
                '<span class="font-medium text-slate-700">' + esc(m.name) + '</span>' +
                '<span class="text-slate-400 shrink-0">ห้อง ' + esc(m.room || '-') + ' • ' + esc(m.reason) + '</span></div>').join('') +
            '</div>' +
            '<div class="flex justify-end mt-5"><button onclick="window.closeModal()" class="tactile-btn px-5 py-2.5 rounded-xl bg-primary-gradient text-white font-bold">เข้าใจแล้ว</button></div>');
    }
};

function syncSchoolFromAnp() {
    const src = anpSource();
    if (!src || !src.db.schoolInfo) return;
    if (!PP1.school.name && src.db.schoolInfo.name) PP1.school.name = src.db.schoolInfo.name;
    if (!PP1.school.director && src.db.schoolInfo.director) PP1.school.director = src.db.schoolInfo.director;
}

/* ---------- ห้องเรียนของรุ่นที่กำลังจัดทำ ปพ.1 ---------- */
/* ชั้นที่รุ่นหนึ่งเรียนอยู่ในปีการศึกษาปัจจุบันของระบบคะแนน คิดจากปีที่จบ เช่น ปีนี้ 2569:
   จบ 2569 = ป.6, จบ 2572 = ป.3, จบ 2567 = จบไปแล้ว (คืนค่า 0) */
function liveLevelOfGrad(grad) {
    const g = num(grad), y = num(anpCurrentYear());
    if (!g || !y) return 0;
    const level = 6 - (g - y);
    return level >= 1 && level <= 6 ? level : 0;
}
function gradForLiveLevel(level) {
    const y = num(anpCurrentYear());
    return y ? String(y + 6 - num(level)) : '';
}
/* รุ่นที่เปิดอยู่ยังเรียนอยู่ในปีนี้หรือไม่ — ซิงก์จากระบบคะแนนได้เฉพาะรุ่นที่เรียนอยู่ */
function cohortIsLive() {
    const g = gradYearOf(PP1);
    return !g || !anpCurrentYear() || !!liveLevelOfGrad(g);
}
/* รุ่นที่จบแล้วถือว่าอยู่ ป.6 (ชั้นสุดท้ายที่เรียน) รุ่นที่ยังไม่รู้ปีที่จบใช้ค่าที่เลือกไว้ */
function cohortLevel() {
    const g = gradYearOf(PP1);
    if (g && anpCurrentYear()) return liveLevelOfGrad(g) || 6;
    return num(PP1.settings.cohortLevel) || 6;
}
/* เปิดรุ่นตามปีที่จบ ถ้ายังไม่มีก็สร้างรุ่นเปล่า */
async function openOrCreateCohort(grad) {
    if (!grad || grad === gradYearOf(PP1)) return;
    if (!gradYearOf(PP1) && !PP1.students.length) {
        PP1.settings.startYear = String(num(grad) - 5);
        await saveDB(true);
        return;
    }
    if (COHORTS.years[grad]) await window.switchCohort(grad);
    else {
        await startBlankCohort(grad);
        notify('สร้างรุ่นที่จบปีการศึกษา ' + grad + ' แล้ว');
    }
}
function cohortClasses() {
    const level = cohortLevel();
    const picked = PP1.settings.cohortClassIds || [];
    return anpClassEntries().filter(c => c.level === level && (!picked.length || picked.indexOf(c.cId) >= 0));
}

/* ---------- ซิงก์จากระบบคะแนน ----------
   เกรด1-เกรด6 คือ 6 ปีของนักเรียน "รุ่นเดียวกัน" ระบบคะแนนมีคะแนนสดแค่ปีปัจจุบัน
   จึงซิงก์ได้เฉพาะชั้นปีที่รุ่นนี้กำลังเรียนอยู่ ไม่ใช่ทุกชั้นในโรงเรียน */
window.syncCohortFromScoreSystem = async function (opts) {
    opts = opts || {};
    const level = cohortLevel();
    const classes = cohortClasses();
    if (!classes.length) { notify('ไม่พบห้องเรียนของ ป.' + level + ' ในระบบคะแนน', 'warn'); return; }
    const ids = classes.map(c => c.cId);
    if (!cohortIsLive()) {
        const g = num(gradYearOf(PP1)), y = num(anpCurrentYear());
        notify('รุ่นที่จบปี ' + g + (g < y ? ' จบไปแล้ว' : ' ยังไม่เข้าเรียน') + ' — ระบบคะแนนมีเฉพาะนักเรียนปีการศึกษา ' + y +
            ' จึงซิงก์ได้เฉพาะรุ่นที่กำลังเรียนอยู่ ข้อมูลรุ่นนี้ให้นำเข้าจากไฟล์ Excel', 'warn');
        return;
    }
    syncSchoolFromAnp();
    if (ANP.live && !ANP.scoresLoaded) await loadScoresFromCloud();
    const r1 = syncStudentsFromAnp(ids);
    const addedSubjects = syncCurriculumFromAnp(level, ids);
    if (!PP1.grades[level].year && anpCurrentYear()) setYearOfLevel(level, anpCurrentYear());
    if (!PP1.settings.startYear && anpCurrentYear()) {
        PP1.settings.startYear = String(num(anpCurrentYear()) - (level - 1));
    }
    const r2 = syncGradesFromAnp(level, ids, { overwrite: !!opts.overwrite });
    PP1.meta.lastSyncAt = new Date().toISOString();
    saveDB();
    notify('ซิงก์ ป.' + level + ' แล้ว • นักเรียนใหม่ ' + r1.added + ' คน • รายวิชา ' + addedSubjects + ' วิชา • เกรด ' + r2.filled + ' ช่อง');
    navigate(state.page === 'sync' ? 'sync' : state.page);
};

/* เปิดระบบ: เชื่อมต่อและอ่านข้อมูลส่วนที่เบา (ห้องเรียน/รายวิชา) เสมอ
   ถ้าทะเบียนยังว่างจะซิงก์รุ่นให้อัตโนมัติ ถ้ามีข้อมูลอยู่แล้วจะรอให้กดเอง
   เพื่อไม่ให้นักเรียนคนละรุ่นปนกันในแฟ้มเดียว */
window.autoSyncFromScoreSystem = async function (force) {
    const ok = await connectScoreSystem();
    if (!ok && !readAnpscore()) return;
    syncSchoolFromAnp();
    const levels = anpClassEntries().filter(c => c.level).map(c => c.level);
    if (levels.length && !PP1.settings.cohortLevel) PP1.settings.cohortLevel = Math.max.apply(null, levels);
    saveDB(true);
    const registryEmpty = PP1.students.length === 0;
    if (force || registryEmpty) {
        await window.syncCohortFromScoreSystem({ overwrite: !!force });
    } else if (state.page === 'sync' || state.page === 'guide') {
        navigate(state.page);
    }
};

function cohortSyncPanel() {
    const grad = gradYearOf(PP1), y = num(anpCurrentYear());
    const live = cohortIsLive(), level = cohortLevel();
    const classes = anpClassEntries();
    const status = !grad
        ? '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-600">ยังไม่ได้เลือกรุ่น — เลือกชั้นด้านล่าง ระบบจะตั้งรุ่นตามปีที่จบให้</div>'

            ? '<div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-sm text-emerald-800"><b>รุ่นที่จบปีการศึกษา ' + esc(grad) + '</b> (ป.1 ปี ' + (num(grad) - 5) +
                ') • ปีการศึกษา ' + y + ' กำลังเรียน <b>' + esc(LEVEL_NAMES[level]) + '</b> — ซิงก์ผลการเรียนชั้นนี้จากระบบคะแนนได้</div>'
            : '<div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-800"><b>รุ่นที่จบปีการศึกษา ' + esc(grad) + '</b> (ป.1 ปี ' + (num(grad) - 5) + ') ' +
                (num(grad) < y ? 'จบไปแล้ว' : 'ยังไม่เข้าเรียน') + ' — ระบบคะแนนมีเฉพาะนักเรียนปีการศึกษา ' + y +
                ' จึงซิงก์รุ่นนี้ไม่ได้ ข้อมูลรุ่นนี้มาจากไฟล์ Excel ที่นำเข้า หากต้องการรุ่นที่กำลังเรียน ให้เลือกชั้นด้านล่าง</div>';
    return status +
        '<div class="flex flex-wrap items-end gap-3 mt-4">' +
            '<div><label class="block text-xs font-bold text-slate-500 mb-1">เปิดรุ่นที่กำลังเรียนชั้น</label>' +
            '<select onchange="window.setCohortLevel(this.value)" class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus-ring bg-white">' +
                (live && grad ? '' : '<option value="" selected>— เลือกชั้น —</option>') +
                [1, 2, 3, 4, 5, 6].map(l => '<option value="' + l + '"' + (live && grad && level === l ? ' selected' : '') + '>' +
                    esc(LEVEL_NAMES[l]) + (y ? ' (รุ่นที่จบ ' + gradForLiveLevel(l) + ')' : '') + '</option>').join('') +
            '</select></div>' +
            (live ?
            '<div class="flex-1 min-w-[240px]"><label class="block text-xs font-bold text-slate-500 mb-1">ห้องที่นับเป็นรุ่นนี้ (ไม่เลือก = ทุกห้องของชั้นนั้น)</label>' +
            '<div class="flex flex-wrap gap-2">' +
                (classes.filter(c => c.level === level).map(c =>
                    '<label class="flex items-center gap-1.5 text-sm px-3 py-2 rounded-xl border border-slate-200 bg-white">' +
                    '<input type="checkbox" class="cohort-cls w-4 h-4" value="' + esc(c.cId) + '"' +
                    ((PP1.settings.cohortClassIds || []).indexOf(c.cId) >= 0 ? ' checked' : '') +
                    ' onchange="window.saveCohortClasses()"> ' + esc(c.name) + ' <span class="text-slate-400 text-xs">' + c.students + '</span></label>').join('')
                    || '<span class="text-sm text-rose-500">ไม่พบห้องของชั้นนี้ในระบบคะแนน</span>') +
            '</div></div>' : '') +
        '</div>' +
        (live ?
        '<label class="flex items-center gap-2 text-sm text-slate-600 mt-4"><input type="checkbox" class="w-4 h-4"' +
            (PP1.settings.syncRequireBothTerms !== false ? ' checked' : '') + ' onchange="window.setRequireBothTerms(this.checked)"> ' +
            'ลงเกรดเฉพาะวิชาที่มีคะแนนครบทั้ง 2 ภาคเรียน <span class="text-xs text-slate-400">(แนะนำ — กันปีที่เพิ่งเริ่มถูกคิดเป็นเกรด 0)</span></label>' +
        '<div class="mt-3 text-xs text-slate-500">จะซิงก์เข้าชีต <b>เกรด ' + level + '</b> ปีการศึกษา <b>' + esc(anpCurrentYear() || '—') + '</b> • รวม ' +
            cohortClasses().reduce((m, c) => m + c.students, 0) + ' คน</div>' : '');
}
function miniStat(label, value) {
    return '<div class="p-3 rounded-xl bg-slate-50 border border-slate-100">' +
        '<div class="text-[11px] font-bold text-slate-400">' + esc(label) + '</div>' +
        '<div class="text-lg font-extrabold text-slate-800">' + esc(value) + '</div></div>';
}
function syncRow(label, yes, note) {
    return '<div class="flex gap-2.5">' +
        '<i class="ph ' + (yes ? 'ph-check-circle text-emerald-500' : 'ph-x-circle text-slate-300') + ' text-lg shrink-0 mt-0.5"></i>' +
        '<div><div class="font-bold text-slate-700">' + esc(label) + '</div>' +
        '<div class="text-xs text-slate-500 leading-relaxed">' + esc(note) + '</div></div></div>';
}
/* เลือก "ชั้นที่กำลังเรียน" = เลือกรุ่นที่จบปีนั้น ไม่ใช่ย้ายรุ่นที่เปิดอยู่ไปชั้นอื่น */
window.setCohortLevel = async function (l) {
    const level = num(l);
    if (!level) return;
    const grad = gradForLiveLevel(level);
    if (grad) await openOrCreateCohort(grad);
    PP1.settings.cohortLevel = level;
    PP1.settings.cohortClassIds = [];
    await saveDB(true);
    renderCohortPicker();
    navigate('sync');
};
window.saveCohortClasses = function () {
    PP1.settings.cohortClassIds = Array.from(document.querySelectorAll('.cohort-cls:checked')).map(el => el.value);
    saveDB(); navigate('sync');
};
window.connectAgain = async function () { await connectScoreSystem(); navigate('sync'); };
window.setRequireBothTerms = function (v) { PP1.settings.syncRequireBothTerms = !!v; saveDB(); };
window.forceSync = async function () {
    if (!confirm('ซิงก์ทับจะเขียนทับระดับผลการเรียนของชั้น ป.' + cohortLevel() + ' ด้วยค่าจากระบบคะแนน\n(ข้อมูลงานทะเบียนและผลการเรียนชั้นปีอื่นไม่ถูกแตะ)\n\nดำเนินการต่อ?')) return;
    await window.syncCohortFromScoreSystem({ overwrite: true });
};
window.syncOneClass = async function (cId, level) {
    const grad = gradForLiveLevel(level);
    if (grad && grad !== gradYearOf(PP1)) {
        if (!confirm('ห้องนี้เป็นนักเรียนรุ่นที่จบปีการศึกษา ' + grad + ' (ป.1 ปี ' + (num(grad) - 5) + ')\n' +
            'รุ่นที่เปิดอยู่คือรุ่นที่จบ ' + (gradYearOf(PP1) || '—') + ' — เปิดรุ่น ' + grad + ' แล้วดึงห้องนี้เข้าไป?')) return;
        await openOrCreateCohort(grad);
        renderCohortPicker();
    }
    if (ANP.live && !ANP.scoresLoaded) await loadScoresFromCloud();
    const r1 = syncStudentsFromAnp([cId]);
    const addedSub = syncCurriculumFromAnp(level, [cId]);
    if (!PP1.grades[level].year && anpCurrentYear()) setYearOfLevel(level, anpCurrentYear());
    const r2 = syncGradesFromAnp(level, [cId], { overwrite: true });
    PP1.meta.lastSyncAt = new Date().toISOString();
    saveDB();
    notify('ดึงห้องนี้แล้ว • นักเรียนใหม่ ' + r1.added + ' คน • รายวิชา ' + addedSub + ' วิชา • เกรด ' + r2.filled + ' ช่อง');
    navigate('sync');
};

/* ---------------------- เริ่มระบบ ---------------------- */
let autoSyncStarted = false;
function startAutoSync() {
    if (autoSyncStarted) return;
    autoSyncStarted = true;
    window.autoSyncFromScoreSystem(false).finally(() => scheduleImageSync(0));
}
/* โมดูลคลาวด์อาจพร้อมก่อนที่ loadDB() จะอ่าน IndexedDB เสร็จ จึงต้องดักทั้งสองทาง */
window.addEventListener('anp-cloud-ready', () => { if (window.PP1) startAutoSync(); });

(async function boot() {
    await loadDB();
    buildSidebar();
    if (document.documentElement.classList.contains('dark-mode')) $('theme-icon').className = 'ph ph-sun text-base';
    navigate('guide');
    if (window.anpCloud) startAutoSync();
    setTimeout(() => { if (!window.anpCloud) setAnpStatus('offline', 'ไม่พบโมดูลคลาวด์ — ใช้ข้อมูลในเครื่อง'); }, 6000);
})();
</script>

<!-- โมดูลอ่านข้อมูลสดจาก Firestore ชุดเดียวกับ ANPSCORE (อ่านอย่างเดียว ไม่เขียนกลับ) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, collection, query, where, documentId } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ใช้บัญชีชุดเดียวกับ index.html และบังคับให้ล็อกอินก่อนเข้าหน้านี้
    // เดิมหน้านี้ไม่มีการตรวจสิทธิ์เลย เปิด URL ตรงก็อ่านข้อมูลนักเรียนได้ทันที
    import { db, requireStaff } from "./auth/session.js";
    const staffSession = requireStaff({ redirectTo: 'index.html' });

    const coreRef = doc(db, 'anpscore', 'core_db');
    const subjectsCol = collection(db, 'anpscore', 'data', 'subjects');
    const scoreEntriesCol = collection(db, 'anpscore', 'data', 'scoreEntries');
    const archivesCol = collection(db, 'anpscore', 'data', 'archives');
    const imagesCol = collection(db, 'anpscore', 'data', 'pp1Images');
    const imagesIndex = doc(imagesCol, '_index');

    /* อ่านเอกสารรูปแบบเดียวกับ readStoredData ของ index.html (รองรับทั้ง data และ jsonStr แบบเดิม) */
    const readStored = (raw) => {
        if (!raw) return null;
        if (raw.data && typeof raw.data === 'object') return raw.data;
        if (typeof raw.jsonStr === 'string' && raw.jsonStr.trim()) {
            try { return JSON.parse(raw.jsonStr); } catch (e) { console.warn('อ่าน jsonStr ไม่สำเร็จ', e); }
        }
        return null;
    };

    /* ระบบจัดการข้อมูลนักเรียน (แบบสำรวจ 2569) — คนละโปรเจกต์ Firebase
       เก็บข้อมูลส่วนตัวที่งานทะเบียนต้องใช้: เลขบัตรประชาชน วันเกิด บิดา-มารดา
       อ่านอย่างเดียว ไม่มีการเขียนกลับ */
    const surveyConfig = {
        apiKey: "AIzaSyCn2393d58ZAe_nD6Osbz_DkAqmCIx8vuI",
        authDomain: "school-survey-2569.firebaseapp.com",
        projectId: "school-survey-2569",
        storageBucket: "school-survey-2569.firebasestorage.app",
        messagingSenderId: "680561712319",
        appId: "1:680561712319:web:f6e682490e285d06497a0a"
    };
    const surveyApp = initializeApp(surveyConfig, 'survey');
    const surveyDb = getFirestore(surveyApp);
    window.surveyCloud = {
        async loadStudents() {
            const snap = await getDocs(collection(surveyDb, 'students'));
            const rows = [];
            snap.forEach(d => rows.push(Object.assign({ _id: d.id }, d.data())));
            return rows;
        },
        async loadSchoolInfo() {
            const snap = await getDoc(doc(surveyDb, 'settings', 'school_info'));
            return snap.exists() ? snap.data() : null;
        }
    };

    let signedIn = false;
    window.anpCloud = {
        async connect() {
            if (signedIn) return true;
            // รอให้ผ่านด่านตรวจสิทธิ์ก่อน ถ้าไม่ผ่านจะถูกพากลับหน้าเข้าสู่ระบบ
            await staffSession;
            signedIn = true;
            return true;
        },
        async loadCore() {
            const snap = await getDoc(coreRef);
            const core = snap.exists() ? readStored(snap.data()) : null;
            const subjects = {};
            const subjSnap = await getDocs(subjectsCol);
            subjSnap.forEach(d => { const v = readStored(d.data()); if (v) subjects[d.id] = v; });
            return { db: core, subjects };
        },
        async loadScoresForSubjects(subIds, onProgress) {
            const out = {};
            for (let i = 0; i < subIds.length; i++) {
                const subId = String(subIds[i]);
                try {
                    const snap = await getDocs(query(scoreEntriesCol, where('subId', '==', subId)));
                    snap.forEach(d => {
                        const x = d.data();
                        if (!x || !x.clsId || !x.stuId) return;
                        if (!out[subId]) out[subId] = {};
                        if (!out[subId][x.clsId]) out[subId][x.clsId] = {};
                        out[subId][x.clsId][x.stuId] = x.scores || {};
                    });
                } catch (e) { console.warn('ดึงคะแนนวิชา ' + subId + ' ไม่สำเร็จ', e); }
                if (onProgress) onProgress(i + 1, subIds.length);
            }
            return out;
        },
        /* รูปภาพ ปพ.1 — หนึ่งรูปต่อหนึ่งเอกสาร และ _index เก็บเวลาแก้ไขของทุกรูป */
        images: {
            async index() {
                const snap = await getDoc(imagesIndex);
                return snap.exists() ? (snap.data().m || {}) : {};
            },
            async get(ids) {
                const out = {};
                for (let i = 0; i < ids.length; i += 30) {
                    const snap = await getDocs(query(imagesCol, where(documentId(), 'in', ids.slice(i, i + 30))));
                    snap.forEach(d => { out[d.id] = d.data(); });
                }
                return out;
            },
            async put(id, src, at) {
                await setDoc(doc(imagesCol, id), { src, at });
                await setDoc(imagesIndex, { m: { [id]: at } }, { merge: true });
            },
            async remove(id, at) {
                await deleteDoc(doc(imagesCol, id));
                await setDoc(imagesIndex, { m: { [id]: at } }, { merge: true });
            }
        },
        async listArchiveYears() {
            const snap = await getDocs(query(archivesCol, where('isIndex', '==', true)));
            const years = [];
            snap.forEach(d => years.push(d.data()));
            return years.sort((a, b) => String(b.year).localeCompare(String(a.year), 'th', { numeric: true }));
        }
    };
    window.dispatchEvent(new CustomEvent('anp-cloud-ready'));
</script>
