<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANPSCORE ปพ.1 - ระบบจัดทำเอกสารงานทะเบียน (ประถมศึกษา)</title>
    <!-- ไลบรารีทั้งหมดเก็บไว้ในโปรเจกต์แล้ว ไม่พึ่ง CDN ภายนอก
         สร้างใหม่ได้ด้วย  npm install && npm run build  -->
    <link rel="stylesheet" href="app/tailwind.css">
    <link rel="stylesheet" href="vendor/sarabun/sarabun.css">
    <link rel="stylesheet" href="vendor/phosphor/style.css">
    <script defer src="vendor/chart.umd.js"></script>
    <script defer src="vendor/xlsx.full.min.js"></script>
    <script>
        try {
            if ((localStorage.getItem('anpscore_theme') || 'light') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch(e) {}
    </script>
    <style>
        :root {
            --brand-primary: #2563eb;
            --brand-accent: #6366f1;
            --line: #e2e8f0;
            --shadow-card: 0 14px 34px rgba(15, 23, 42, 0.07);
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background:
                radial-gradient(circle at 18% 0%, rgba(37, 99, 235, 0.08), transparent 30rem),
                radial-gradient(circle at 100% 0%, rgba(15, 118, 110, 0.08), transparent 28rem),
                #f6f8fb;
            color: #334155;
            font-size: 16px;
            overflow: hidden;
        }
        html.dark-mode body { background-color: #141c2e; color: #dbe3f0; }
        html.dark-mode #app-container, html.dark-mode #content-area { background: #1a2438 !important; }
        html.dark-mode #sidebar, html.dark-mode .glass-header, html.dark-mode .modern-card,
        html.dark-mode #modal-content { background-color: #232f47 !important; border-color: #3a4a68 !important; color: #e8eef7 !important; }
        html.dark-mode .glass-header { background: rgba(35, 47, 71, 0.9) !important; }
        html.dark-mode .bg-white, html.dark-mode .bg-slate-50 { background-color: #232f47 !important; }
        html.dark-mode .bg-slate-100, html.dark-mode .bg-indigo-50 { background-color: #2c3a55 !important; }
        html.dark-mode .border-slate-100, html.dark-mode .border-slate-200 { border-color: #3a4a68 !important; }
        html.dark-mode .text-slate-400, html.dark-mode .text-slate-500 { color: #a9b8ce !important; }
        html.dark-mode .text-slate-600, html.dark-mode .text-slate-700 { color: #dbe3f0 !important; }
        html.dark-mode .text-slate-800, html.dark-mode .text-slate-900 { color: #f8fafc !important; }
        html.dark-mode input, html.dark-mode select, html.dark-mode textarea {
            background-color: #1c2740 !important; border-color: #3a4a68 !important; color: #f1f5fb !important;
        }
        html.dark-mode table th { background-color: #2c3a55 !important; color: #dbe3f0 !important; }
        html.dark-mode table td { background-color: #232f47; color: #e8eef7; }
        html.dark-mode .doc-sheet { background: #ffffff !important; color: #111827 !important; }
        html.dark-mode .doc-sheet * { color: #111827 !important; border-color: #111827 !important; }

        .bg-primary-gradient { background-image: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%); }
        .modern-card { background: #fff; border: 1px solid var(--line); border-radius: 1.25rem; box-shadow: var(--shadow-card); }
        .glass-header { background: rgba(255,255,255,0.86); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
        .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.25); border-color: #6366f1; }
        .tactile-btn { transition: transform .15s ease, box-shadow .15s ease; }
        .tactile-btn:active { transform: scale(.97); }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .animate-fade-in-up { animation: fadeInUp .35s ease both; }

        /* ตารางกรอกข้อมูลแบบสเปรดชีต */
        .grid-table { border-collapse: separate; border-spacing: 0; width: max-content; font-size: 13px; }
        .grid-table th, .grid-table td { border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; padding: 0; }
        .grid-table th { background: #f1f5f9; font-weight: 700; padding: 6px 8px; white-space: nowrap; position: sticky; top: 0; z-index: 5; }
        .grid-table td input, .grid-table td select {
            width: 100%; border: 0; padding: 5px 7px; background: transparent; font-size: 13px; min-width: 60px;
        }
        .grid-table td input:focus, .grid-table td select:focus { outline: 2px solid #6366f1; outline-offset: -2px; background: #eef2ff; }
        .grid-table .sticky-col { position: sticky; left: 0; background: #fff; z-index: 4; }
        .grid-table th.sticky-col { z-index: 6; background: #f1f5f9; }
        .grid-wrap { overflow: auto; max-height: calc(100vh - 320px); border: 1px solid #e2e8f0; border-radius: 1rem; background: #fff; }
        html.dark-mode .grid-table th { background: #2c3a55 !important; }
        html.dark-mode .grid-table .sticky-col { background: #232f47 !important; }
        html.dark-mode .grid-wrap { background: #232f47; }

        /* ---------- เอกสารสำหรับพิมพ์ ---------- */
        .doc-sheet {
            background: #fff; color: #111827; margin: 0 auto 18px auto; position: relative;
            box-shadow: 0 8px 26px rgba(15,23,42,.18); font-family: 'Sarabun', sans-serif;
        }
        .doc-a4 { width: 210mm; min-height: 297mm; padding: 10mm 9mm; }
        /* แบบพิมพ์ ปพ.1 : ป — ขนาดและระยะขอบตรงตามที่ Excel ตั้งไว้ในชีตต้นฉบับ
           (A4 แนวตั้ง ขอบซ้าย/ขวา 0 ขอบบน 0.394 นิ้ว) จึงต้องคุมกล่องเป๊ะ */
        /* ฟอนต์ของแบบพิมพ์ฝังมากับระบบ — เครื่องที่ลง TH SarabunIT๙ ไว้ ชื่อ "TH SarabunPSK"
           จะชี้ไปที่ฟอนต์ IT๙ ซึ่งวาดเลขอารบิกเป็นเลขไทยทั้งหมด ผลพิมพ์เลยไม่ตรงต้นฉบับ */
        /* ใช้ไฟล์ที่ฝังมาเสมอ ไม่อ่านจากเครื่อง — TH Sarabun New แต่ละรุ่นตั้งระยะบน-ล่างไม่เท่ากัน
           ตัวหนังสือจึงลอยสูงต่ำไม่เท่ากันแล้วแต่เครื่อง
           ascent-override ดันเส้นฐานของตัวหนังสือลงให้นั่งชิดเส้นบรรทัด (ค่าจริงของฟอนต์คือ 84%)
           สระล่างยังลอยเหนือเส้นเล็กน้อย ความสูงแถวและตารางไม่เปลี่ยน */
        @font-face { font-family: 'PP1 Sarabun'; font-weight: 400; font-display: block;
            ascent-override: 108%; descent-override: 46%; line-gap-override: 0%;
            src: url(vendor/th-sarabun-new/THSarabunNew.ttf) format('truetype'); }
        @font-face { font-family: 'PP1 Sarabun'; font-weight: 700; font-display: block;
            ascent-override: 108%; descent-override: 46%; line-gap-override: 0%;
            src: url(vendor/th-sarabun-new/THSarabunNew-Bold.ttf) format('truetype'); }
        /* หัวตารางที่หมุนข้อความใช้ระยะเดิมของฟอนต์ ไม่งั้นบรรทัดแนวตั้งกว้างขึ้นจนตัวหนังสือถูกย่อ */
        @font-face { font-family: 'PP1 Sarabun Plain'; font-weight: 400; font-display: block;
            src: url(vendor/th-sarabun-new/THSarabunNew.ttf) format('truetype'); }
        @font-face { font-family: 'PP1 Sarabun Plain'; font-weight: 700; font-display: block;
            src: url(vendor/th-sarabun-new/THSarabunNew-Bold.ttf) format('truetype'); }
        .pp1-sheet {
            width: 210mm; height: 297mm; box-sizing: border-box;
            padding: 10mm 1mm 0 1mm; background: #fff; color: #000;
            font-family: 'PP1 Sarabun', 'TH Sarabun New', sans-serif;
            /* ฟอนต์ไทยหลายตัวสลับเลขอารบิกเป็นเลขไทยเมื่อภาษาเป็นไทย ต้องปิดไว้ */
            font-feature-settings: 'locl' 0, 'lnum' 1;
            font-variant-numeric: lining-nums;
        }
        .pp1-sheet table { table-layout: fixed; border-collapse: collapse; }
        .pp1-sheet td { padding: 0; }
        /* ตัวหนังสือเข้ม: TH Sarabun เส้นบาง พิมพ์เลเซอร์แล้วจาง เติมเส้นขอบบาง ๆ ให้ตัวอักษรหนาขึ้นเล็กน้อย */
        .ink-dark, .ink-dark td, .ink-dark th, .ink-dark div, .ink-dark span { -webkit-text-stroke: 0.2px #000; color: #000 !important; }
        .ink-dark { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .pp1-sheet .pp1-rot { font-family: 'PP1 Sarabun Plain', 'TH Sarabun New', sans-serif; position: absolute; left: 50%; top: 50%; writing-mode: vertical-rl; transform: translate(-50%, -50%) rotate(180deg); white-space: pre; line-height: 1; }
        .doc-legal { width: 355.6mm; min-height: 215.9mm; padding: 6mm 6mm; }
        .doc-sheet table { border-collapse: collapse; width: 100%; }
        .doc-sheet .bx td, .doc-sheet .bx th { border: 0.8pt solid #111827; padding: 1px 3px; }
        .doc-sheet .tiny { font-size: 9pt; }
        .doc-sheet .mini { font-size: 8pt; }
        .dotline { border-bottom: 1px dotted #111827; display: inline-block; min-width: 40px; }
        .fillline { border-bottom: 1px solid #111827; display: inline-block; }

        @media print {
            body { overflow: visible !important; background: #fff !important; }
            .no-print, #sidebar, #header { display: none !important; }
            #app-container { display: block !important; height: auto !important; overflow: visible !important; }
            #content-area { overflow: visible !important; padding: 0 !important; }
            #print-view { position: static !important; display: block !important; padding: 0 !important; background: #fff !important; }
            /* ขณะเปิดหน้าตัวอย่างก่อนพิมพ์ ต้องไม่พิมพ์หน้าจอโปรแกรมที่อยู่ข้างหลังติดไปด้วย
               และต้องไม่มีระยะเว้นบนของกรอบตัวอย่าง ไม่งั้นแผ่นเอกสารจะเลื่อนลงจนขาดข้ามหน้า */
            body:has(#print-view:not(.hidden)) > :not(#print-view) { display: none !important; }
            #print-view .print-pages { padding: 0 !important; }
            .pp1-sheet { height: 293mm !important; overflow: hidden; }   /* สูงเต็ม 297 แล้ว Chrome ดันหน้าว่างต่อท้าย */
            /* เอกสารอื่นสูง 297 มม. บนจอ แต่กระดาษเหลือพื้นที่น้อยกว่านั้นหลังหักขอบ ใบรับรองทุกใบจึงมีหน้าว่างตามมา
               ตอนพิมพ์ให้สูงเท่าเนื้อหา แล้วขึ้นหน้าใหม่ด้วย page-break แทน */
            .doc-sheet:not(.pp1-sheet) { min-height: 0 !important; width: auto !important; }
            .doc-sheet { box-shadow: none !important; margin: 0 auto !important; page-break-after: always; break-after: page; }
            .doc-sheet:last-child { page-break-after: auto; break-after: auto; }
            html.dark-mode .doc-sheet, html.dark-mode .doc-sheet * { background: #fff !important; color: #111827 !important; }
        }
        @page { size: A4 portrait; margin: 6mm; }
        body.print-legal-landscape { }
    </style>
</head>
<body>

<div id="app-container" class="w-full h-screen flex bg-[#f8fafc]">

    <aside id="sidebar" class="w-72 bg-white border-r border-slate-100 flex flex-col no-print shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20">
        <div class="h-20 flex items-center px-5 border-b border-slate-50 shrink-0">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-indigo-600 text-white rounded-xl flex items-center justify-center mr-3 shadow-md">
                <i class="ph ph-certificate text-2xl"></i>
            </div>
            <div>
                <h2 class="text-xl font-extrabold text-slate-800 tracking-tight leading-none">ปพ.1 : ป</h2>
                <div class="text-[11px] text-slate-400 font-bold">งานทะเบียน ประถมศึกษา</div>
            </div>
        </div>

        <div class="px-4 py-3 border-b border-slate-50 bg-slate-50/60 shrink-0">
            <div class="flex gap-2">
                <button onclick="window.openFilePicker()" class="tactile-btn flex-1 text-xs font-bold bg-white border border-slate-200 rounded-lg py-2 hover:border-indigo-300 flex items-center justify-center gap-1">
                    <i class="ph ph-microsoft-excel-logo text-base text-emerald-600"></i> นำเข้า
                </button>
                <button onclick="window.exportWorkbook()" class="tactile-btn flex-1 text-xs font-bold bg-white border border-slate-200 rounded-lg py-2 hover:border-indigo-300 flex items-center justify-center gap-1">
                    <i class="ph ph-download-simple text-base text-indigo-600"></i> ส่งออก
                </button>
            </div>
            <div id="cohort-picker" class="mt-2"></div>
            <input type="file" id="bulk-photo-file" class="hidden" accept="image/*" multiple onchange="window.bulkPhotosPicked(this)">
            <input type="file" id="one-photo-file" class="hidden" accept="image/*" onchange="window.onePhotoPicked(this)">
            <input type="file" id="file-import" class="hidden" accept=".xlsm,.xlsx,.xls,.json" onchange="window.handleImportFile(event)">
            <button id="anp-pill" onclick="window.navigate('sync')" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl border text-[11px] font-bold bg-slate-100 text-slate-600 border-slate-200 mt-2">
                <i class="ph ph-cloud text-sm shrink-0"></i><span class="truncate">ยังไม่ได้เชื่อมต่อ</span>
            </button>
        </div>

        <nav id="nav-menu" class="flex-1 overflow-y-auto px-3 py-3 space-y-1 custom-scrollbar"></nav>

        <div class="p-4 border-t border-slate-50 bg-slate-50/60 shrink-0 space-y-2">
            <div id="save-status" class="text-[11px] text-slate-400 font-bold text-center">พร้อมใช้งาน</div>
            <div class="flex gap-2">
                <button onclick="window.toggleThemeMode()" class="tactile-btn flex-1 text-xs font-bold bg-white border border-slate-200 rounded-lg py-2.5 flex items-center justify-center gap-1">
                    <i id="theme-icon" class="ph ph-moon text-base"></i> ธีม
                </button>
                <a href="index.html" class="tactile-btn flex-1 text-xs font-bold bg-white border border-slate-200 rounded-lg py-2.5 flex items-center justify-center gap-1 text-slate-700">
                    <i class="ph ph-arrow-u-up-left text-base"></i> ANPSCORE
                </a>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header id="header" class="h-20 glass-header flex items-center justify-between px-6 shrink-0 z-10 no-print">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-2 h-8 bg-indigo-500 rounded-full shrink-0"></div>
                <div class="min-w-0">
                    <h2 id="page-title" class="text-xl font-extrabold text-slate-800 tracking-tight truncate">คู่มือการใช้งาน</h2>
                    <div id="page-sub" class="text-xs text-slate-400 font-bold truncate">แผ่นงานที่ 1</div>
                </div>
            </div>
            <div id="header-actions" class="flex items-center gap-2 shrink-0"></div>

        <div id="content-area" class="flex-1 overflow-y-auto p-5 md:p-7 pb-20 custom-scrollbar"></div>

</div>

<div id="print-view" class="hidden fixed inset-0 z-[200] bg-slate-200 overflow-auto"></div>

<div id="modal-container" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 hidden no-print backdrop-blur-sm">
    <div id="modal-content" class="bg-white rounded-3xl shadow-2xl p-7 w-full max-w-lg max-h-[90vh] overflow-y-auto mx-4 custom-scrollbar"></div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-[210] text-white px-6 py-4 rounded-2xl shadow-xl translate-y-24 opacity-0 transition-all duration-300 flex items-center gap-3 font-medium">
    <i id="toast-icon" class="ph ph-check-circle text-2xl"></i><span id="toast-msg"></span>

<script>
/* =========================================================================
   ANPSCORE ปพ.1 — ระบบจัดทำเอกสารงานทะเบียน ระดับประถมศึกษา
   โครงสร้างเมนูแยกเป็นรายการตามแผ่นงาน (sheet) ของแฟ้ม PP2551P6 ต้นฉบับ
   ========================================================================= */

const $ = (id) => document.getElementById(id);

const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const PREFIXES = ['เด็กชาย','เด็กหญิง','นาย','นางสาว','นาง','สามเณร','พระ'];
const LEVEL_SHORT = { 1: 'ป.1', 2: 'ป.2', 3: 'ป.3', 4: 'ป.4', 5: 'ป.5', 6: 'ป.6' };
const LEVEL_NAMES = { 1:'ประถมศึกษาปีที่ 1', 2:'ประถมศึกษาปีที่ 2', 3:'ประถมศึกษาปีที่ 3', 4:'ประถมศึกษาปีที่ 4', 5:'ประถมศึกษาปีที่ 5', 6:'ประถมศึกษาปีที่ 6' };
const SUBJECT_TYPES = ['พื้นฐาน','เพิ่มเติม','มาตรฐานสากล','กิจกรรม'];
const LEARNING_AREAS = ['ภาษาไทย','คณิตศาสตร์','วิทยาศาสตร์','สังคมศึกษา ศาสนาและวัฒนธรรม','สุขศึกษาและพละศึกษา','ศิลปะ','การงานอาชีพและเทคโนโลยี','ภาษาต่างประเทศ','กิจกรรม'];
const GRADE_OPTIONS = ['', '4', '3.5', '3', '2.5', '2', '1.5', '1', '0', 'ร', 'มส', 'มผ'];
const PASS_OPTIONS = ['', 'ผ', 'มผ'];
const QUALITY_OPTIONS = ['', 'ดีเยี่ยม', 'ดี', 'ผ่าน', 'ไม่ผ่าน'];
const MAX_SUBJECT_SLOTS = 18;   // ตรงกับคอลัมน์ H..Y ของชีตเกรด
const MAX_ACTIVITY_SLOTS = 5;   // ตรงกับคอลัมน์ Z..AD ของชีตเกรด

/* กลุ่มสาระของ ปพ.1 (สรุป ป.4-6) จำแนกตามอักษรนำหน้ารหัสวิชา
   ตามที่แฟ้มต้นฉบับใช้ เช่น จ (ภาษาจีน) นับรวมอยู่ในกลุ่มภาษาต่างประเทศ */
const PP1_AREAS = [
    { key:'ท', label:'ภาษาไทย', codes:['ท'] },
    { key:'ค', label:'คณิตศาสตร์', codes:['ค'] },
    { key:'ว', label:'วิทยาศาสตร์และเทคโนโลยี', codes:['ว'] },
    { key:'ส', label:'สังคมศึกษา ศาสนาและวัฒนธรรม', codes:['ส'] },
    { key:'พ', label:'สุขศึกษาและพลศึกษา', codes:['พ'] },
    { key:'ศ', label:'ศิลปะ', codes:['ศ'] },
    { key:'ง', label:'การงานอาชีพ', codes:['ง'] },
    { key:'อ', label:'ภาษาต่างประเทศ', codes:['อ','จ','ญ','ฝ','ย','ร','ต'] }
];

/* ระบบคะแนนไม่ได้บังคับให้กรอกรหัสวิชา จึงต้องเดากลุ่มสาระจากชื่อวิชาเมื่อไม่มีรหัส */
const AREA_BY_NAME = [
    { key: 'ท', words: ['ภาษาไทย'] },
    { key: 'ค', words: ['คณิต'] },
    { key: 'ว', words: ['วิทยาศาสตร์', 'เทคโนโลยี', 'วิทยาการคำนวณ'] },
    { key: 'ส', words: ['สังคม', 'ประวัติศาสตร์', 'หน้าที่พลเมือง', 'ศาสนา', 'ทุจริต'] },
    { key: 'พ', words: ['สุขศึกษา', 'พลศึกษา', 'พละ'] },
    { key: 'ศ', words: ['ศิลปะ', 'ทัศนศิลป์', 'ดนตรี', 'นาฏศิลป์'] },
    { key: 'ง', words: ['การงาน', 'เกษตร', 'คอมพิวเตอร์', 'อาชีพ'] },
    { key: 'อ', words: ['ภาษาอังกฤษ', 'ภาษาต่างประเทศ', 'ภาษาจีน', 'ภาษาญี่ปุ่น', 'ภาษาฝรั่งเศส'] }
];
/* ลำดับกลุ่มสาระตามหลักสูตรแกนกลาง ใช้เรียงรายวิชาให้ตรงกันทุกเอกสาร
   เอกสารทุกฉบับอ่านรายวิชาจาก PP1.curriculum[ชั้น].subjects ตามลำดับในอาร์เรย์
   การจัดลำดับที่นี่จึงมีผลกับ ปพ.1 ใบรับรอง รายงานผลการเรียน และชีตเกรดพร้อมกัน */
const AREA_SEQUENCE = ['ท', 'ค', 'ว', 'ส', 'พ', 'ศ', 'ง', 'อ', 'other'];
function subjectTypeRank(type) {
    if (type === 'พื้นฐาน') return 0;
    if (type === 'เพิ่มเติม') return 1;
    return 2;
}
/* ลำดับภายในกลุ่มสาระเดียวกัน เช่น สังคมศึกษาฯ มาก่อนประวัติศาสตร์เสมอ
   ใช้ตอนที่ยังไม่มีรหัสวิชาให้เรียง (เรียงตามชื่อเฉย ๆ จะได้ลำดับผิด) */
const SUBJECT_NAME_ORDER = ['สังคมศึกษา', 'ประวัติศาสตร์', 'หน้าที่พลเมือง', 'ทุจริต',
    'วิทยาศาสตร์', 'วิทยาการคำนวณ', 'ศิลปะ', 'ทัศนศิลป์', 'ดนตรี', 'นาฏศิลป์',
    'สุขศึกษา', 'พลศึกษา', 'ภาษาต่างประเทศ', 'ภาษาอังกฤษเพื่อการสื่อสาร'];
function subjectNameRank(sub) {
    const name = String(sub.name || '');
    /* "ภาษาอังกฤษ" ต้องมาก่อน "ภาษาอังกฤษเพื่อการสื่อสาร" จึงเทียบแบบยาวสุดก่อน */
    if (name.indexOf('ภาษาอังกฤษเพื่อการสื่อสาร') >= 0) return 90;
    for (let i = 0; i < SUBJECT_NAME_ORDER.length; i++) {
        if (name.indexOf(SUBJECT_NAME_ORDER[i]) >= 0) return i;
    }
    return 50;
}
function compareSubjects(a, b) {
    const ta = subjectTypeRank(a.type), tb = subjectTypeRank(b.type);
    if (ta !== tb) return ta - tb;
    const ca = String(a.code || '').trim(), cb = String(b.code || '').trim();
    if (!!ca !== !!cb) return ca ? -1 : 1;      // วิชาที่ยังไม่มีรหัสอยู่ท้ายกลุ่มเสมอ
    const byName = () => {
        const na = subjectNameRank(a), nb = subjectNameRank(b);
        if (na !== nb) return na - nb;
        return String(a.name || '').localeCompare(String(b.name || ''), 'th');
    };
    const byCode = () => (ca && cb && ca !== cb) ? ca.localeCompare(cb, 'th') : byName();
    /* วิชาเพิ่มเติมในแบบต้นฉบับเรียงตามรหัสวิชา ไม่ได้เรียงตามกลุ่มสาระ */
    if (ta !== 0) return byCode();
    /* วิชาพื้นฐานเรียงตามลำดับกลุ่มสาระของหลักสูตรแกนกลาง */
    const ra = AREA_SEQUENCE.indexOf(areaKeyFor(a)), rb = AREA_SEQUENCE.indexOf(areaKeyFor(b));
    if (ra !== rb) return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
    return byCode();
}
/* ---------- รหัสวิชาและน้ำหนักหน่วยกิต ----------
   รหัสวิชาตามรูปแบบ สพฐ. = อักษรกลุ่มสาระ + ระดับการศึกษา(1=ประถม) + ชั้นปี
   + ประเภท(1=พื้นฐาน 2=เพิ่มเติม) + ลำดับ 2 หลัก  เช่น ท11101, จ11201
   น้ำหนักหน่วยกิต = เวลาเรียนต่อปี หาร 40 (160 ชม. = 4.00 นก.) */
const HOURS_PER_CREDIT = 40;
const SUBJECT_CODE_LETTERS = [
    { letter: 'จ', words: ['ภาษาจีน', 'จีน'] },
    { letter: 'ญ', words: ['ภาษาญี่ปุ่น', 'ญี่ปุ่น'] },
    { letter: 'ฝ', words: ['ภาษาฝรั่งเศส', 'ฝรั่งเศส'] },
    { letter: 'ท', words: ['ภาษาไทย'] },
    { letter: 'ค', words: ['คณิต'] },
    { letter: 'ว', words: ['วิทยาศาสตร์', 'เทคโนโลยี', 'วิทยาการคำนวณ'] },
    { letter: 'ส', words: ['สังคม', 'ประวัติศาสตร์', 'หน้าที่พลเมือง', 'ศาสนา', 'ทุจริต'] },
    { letter: 'พ', words: ['สุขศึกษา', 'พลศึกษา', 'พละ'] },
    { letter: 'ศ', words: ['ศิลปะ', 'ทัศนศิลป์', 'ดนตรี', 'นาฏศิลป์'] },
    { letter: 'ง', words: ['การงาน', 'อาชีพ', 'เกษตร', 'คอมพิวเตอร์'] },
    { letter: 'อ', words: ['ภาษาอังกฤษ', 'ภาษาต่างประเทศ', 'อังกฤษ'] }
];
function subjectCodeLetter(sub) {
    const name = String(sub.name || '');
    for (const m of SUBJECT_CODE_LETTERS) {
        if (m.words.some(w => name.indexOf(w) >= 0)) return m.letter;
    }
    const k = areaKeyFor(sub);
    return k === 'other' ? 'ง' : k;
}
function creditFromHours(hours) {
    const h = num(hours);
    if (!h) return '';
    const c = h / HOURS_PER_CREDIT;
    return String(Math.round(c * 100) / 100);
}
function generateSubjectCodes(level, regenerate) {
    const subs = (PP1.curriculum[level].subjects || []);
    const used = {};      // นับลำดับที่ถูกใช้ไปแล้วในแต่ละ อักษร+ประเภท
    const keyOf = (letter, typeDigit) => letter + typeDigit;
    /* สร้างใหม่ทั้งหมด: ล้างรหัสเดิมแล้วจัดลำดับก่อน เพื่อให้เลขลำดับในรหัส
       เดินตามลำดับหลักสูตร ไม่ใช่ตามลำดับที่บังเอิญอยู่ในตาราง */
    if (regenerate) {
        subs.forEach(s => { s.code = ''; });
        subs.sort(compareSubjects);
    }
    if (!regenerate) {
        subs.forEach(s => {
            const code = String(s.code || '').trim();
            const m = /^(.)1(\d)(\d)(\d{2})$/.exec(code);
            if (m) {
                const k = keyOf(m[1], m[3]);
                used[k] = Math.max(used[k] || 0, parseInt(m[4], 10));
            }
        });
    }
    let made = 0;
    subs.forEach(s => {
        if (!s.name) return;
        if (!regenerate && String(s.code || '').trim()) return;
        const letter = subjectCodeLetter(s);
        const typeDigit = s.type === 'เพิ่มเติม' ? '2' : '1';
        const k = keyOf(letter, typeDigit);
        const seq = (used[k] || 0) + 1;
        used[k] = seq;
        s.code = letter + '1' + level + typeDigit + String(seq).padStart(2, '0');
        made++;
    });
    return made;
}

function sortCurriculumLevel(level) {
    const cur = PP1.curriculum[level];

function areaKeyFor(subject) {
    const code = String((subject && subject.code) || '').trim();
    if (code) {
        const hit = PP1_AREAS.find(a => a.codes.indexOf(code.charAt(0)) >= 0);
        if (hit) return hit.key;
    }
    const name = String((subject && subject.name) || '');
    for (const m of AREA_BY_NAME) {
        if (m.words.some(w => name.indexOf(w) >= 0)) return m.key;
    }
    return 'other';
}

/* ---------------------- โหลด/บันทึกข้อมูล ----------------------
   เก็บใน IndexedDB ไม่ใช่ localStorage เพราะ localStorage มีเพดานราว 5 MB
   ต่อโดเมน และ ANPSCORE ใช้ก้อนเดียวกันแคชคะแนนทั้งโรงเรียนอยู่แล้ว
   ทะเบียน 360 คน 6 ปีจึงดันจนเต็มและบันทึกไม่ได้ทั้งสองระบบ
   ------------------------------------------------------------------ */
const STORAGE_KEY = 'anppp1_db';
const IDB = { name: 'anppp1_store', store: 'kv', ready: null, available: false };

function idbOpen() {
    if (IDB.ready) return IDB.ready;
    IDB.ready = new Promise(resolve => {
        try {
            if (!window.indexedDB) return resolve(null);
            const req = indexedDB.open(IDB.name, 1);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(IDB.store)) db.createObjectStore(IDB.store);
            };
            req.onsuccess = () => { IDB.available = true; resolve(req.result); };
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
        } catch (e) { resolve(null); }
    });
    return IDB.ready;
}
function idbGet(key) {
    return idbOpen().then(db => {
        if (!db) return undefined;
        return new Promise(resolve => {
            try {
                const rq = db.transaction(IDB.store, 'readonly').objectStore(IDB.store).get(key);
                rq.onsuccess = () => resolve(rq.result);
                rq.onerror = () => resolve(undefined);
            } catch (e) { resolve(undefined); }
        });
    });
}
function idbSet(key, value) {
    return idbOpen().then(db => {
        if (!db) throw new Error('ไม่รองรับ IndexedDB');
        return new Promise((resolve, reject) => {
            try {
                const tx = db.transaction(IDB.store, 'readwrite');
                tx.objectStore(IDB.store).put(value, key);
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error || new Error('เขียนไม่สำเร็จ'));
                tx.onabort = () => reject(tx.error || new Error('ถูกยกเลิก'));
            } catch (e) { reject(e); }
        });
    });
}

async function loadDB() {
    await loadCohortIndex();

        const stored = await idbGet(STORAGE_KEY);
        if (stored) parsed = typeof stored === 'string' ? JSON.parse(stored) : stored;
    } catch (e) { console.warn('อ่าน IndexedDB ไม่สำเร็จ', e); }
    if (!parsed) {
        /* ย้ายข้อมูลเดิมที่เคยเก็บใน localStorage มาไว้ใน IndexedDB ครั้งเดียว */
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) { parsed = JSON.parse(raw); migrated = true; }
        } catch (e) { console.warn('โหลดข้อมูลเดิมไม่สำเร็จ', e); }
    }
    if (!parsed || !parsed.students || parsed.students.length === 0 || !parsed.school || !parsed.school.name) {

    renderCohortPicker();

function mergeDefaults(base, override) {
    if (override === null || override === undefined) return base;
    if (Array.isArray(override)) return override;
    if (typeof override !== 'object') return override;
    const out = Array.isArray(base) ? [] : Object.assign({}, base);
    Object.keys(override).forEach(k => {
        out[k] = (base && typeof base === 'object' && !Array.isArray(base) && base[k] !== undefined)
            ? mergeDefaults(base[k], override[k]) : override[k];
    });
    return out;
}

function saveDebounced() {

/* ---------------------- รุ่นนักเรียน แยกตามปีการศึกษาที่จบ ----------------------
   ข้อมูล ปพ.1 หนึ่งชุด = นักเรียนหนึ่งรุ่น 6 ปี เก็บแยกคีย์ตามปีที่จบ เช่น จบ 2569 = ป.1 ปี 2564
   ชุดที่เปิดอยู่ยังเก็บไว้ที่ STORAGE_KEY ด้วยเพื่อให้เปิดหน้าครั้งต่อไปเจอรุ่นเดิม
   ------------------------------------------------------------------------------------ */
const COHORT_INDEX_KEY = 'anppp1_cohorts';
function cohortKey(year) { return 'anppp1_cohort_' + year; }
let COHORTS = { active: '', years: {} };

function gradYearOf(db) {
    const start = parseInt(db && db.settings && db.settings.startYear, 10);
    return start ? String(start + 5) : '';
}
function idbDel(key) {
    return idbOpen().then(db => {
        if (!db) return false;
        return new Promise(resolve => {
            try {
                const tx = db.transaction(IDB.store, 'readwrite');
                tx.objectStore(IDB.store).delete(key);
                tx.oncomplete = () => resolve(true);
                tx.onerror = tx.onabort = () => resolve(false);
            } catch (e) { resolve(false); }
        });
    });
}
async function loadCohortIndex() {
    try {
        const v = await idbGet(COHORT_INDEX_KEY);
        if (v) COHORTS = Object.assign({ active: '', years: {} }, typeof v === 'string' ? JSON.parse(v) : v);
    } catch (e) { console.warn('อ่านรายการรุ่นไม่สำเร็จ', e); }
}
/* เรียกจาก saveDB ทุกครั้ง — เก็บสำเนาของรุ่นที่เปิดอยู่ไว้ที่คีย์ของปีที่จบ */
async function saveCohortCopy(json) {
    const year = gradYearOf(PP1);
    if (!year || !PP1.students.length) return;
    /* เปลี่ยนปีเข้าเรียนของรุ่นที่เปิดอยู่ = รุ่นเดิมย้ายไปอยู่ปีใหม่ ลบคีย์ปีเก่าทิ้ง */
    if (COHORTS.active && COHORTS.active !== year && COHORTS.years[COHORTS.active]) {
        await idbDel(cohortKey(COHORTS.active));
        delete COHORTS.years[COHORTS.active];
    }
    await idbSet(cohortKey(year), json);
    COHORTS.active = year;
    COHORTS.years[year] = { students: PP1.students.length, updatedAt: PP1.meta.updatedAt };

/* ปีที่จบของไฟล์ Excel ปพ.1 — ปีเข้าเรียนชั้น ป.1 ในชีตข้อมูลนักเรียน หรือปีในชีตเกรด1/เกรด6 */
function workbookGradYear(wb) {
    const stu = sheetRows(wb, 'ข้อมูลนักเรียน');
    const start = stu ? parseInt(cellAt(stu, 3, 5), 10) : 0;
    if (start) return String(start + 5);
    const g6 = sheetRows(wb, 'เกรด6'), g1 = sheetRows(wb, 'เกรด1');
    if (g6 && parseInt(cellAt(g6, 0, 3), 10)) return String(parseInt(cellAt(g6, 0, 3), 10));
    if (g1 && parseInt(cellAt(g1, 0, 3), 10)) return String(parseInt(cellAt(g1, 0, 3), 10) + 5);
    return '';
}
/* นำเข้าไฟล์ของรุ่นอื่น → เปิด/สร้างรุ่นนั้นก่อน แล้วค่อยอ่านไฟล์ลงไป */
async function prepareCohortForImport(wb) {
    const year = workbookGradYear(wb);
    if (!year || year === gradYearOf(PP1)) return year;
    if (!PP1.students.length && !gradYearOf(PP1)) return year;   // ฐานข้อมูลยังว่าง ใช้ชุดนี้ได้เลย
    if (COHORTS.years[year]) {
        await saveDB(true);
        const raw = await idbGet(cohortKey(year));
        if (raw) { await openCohortData(year, typeof raw === 'string' ? JSON.parse(raw) : raw); return year; }
    }
    await startBlankCohort(year);
    return year;
}

/* ---------------------- รูปภาพบนคลาวด์ ----------------------
   รูปถ่ายนักเรียน ตราโรงเรียน ลายเซ็น และตราประทับ เก็บใน Firestore (anpscore/data/pp1Images)
   เปิดจากเครื่องไหนก็ได้รูปชุดเดียวกัน อ่าน/เขียนได้เฉพาะครูและผู้ดูแลที่ล็อกอิน
   แต่ละรูปมีเวลาแก้ไขล่าสุด (บวก = มีรูป, ลบ = ลบรูปแล้ว) ทั้งในเครื่องและบนคลาวด์
   ฝั่งที่ใหม่กว่าชนะ เอกสาร _index เก็บเวลาของทุกรูปไว้ อ่านครั้งเดียวก็รู้ว่าต้องโหลดรูปไหน
   ------------------------------------------------------------- */
const IMG_SYNC = { running: false, again: false, timer: null, status: '' };
function cloudImages() { return window.anpCloud && window.anpCloud.images; }
function imageEntries() {
    const list = PP1_IMAGES.map(st => ({
        id: 'school_' + st.key,
        get: () => PP1.school[st.key] || '', set: v => { PP1.school[st.key] = v; },
        at: () => num(PP1.school[st.key + 'At']), setAt: t => { PP1.school[st.key + 'At'] = t; }
    }));
    PP1.students.forEach(stu => list.push({
        id: 'stu_' + stu.studentId,
        get: () => stu.photo || '', set: v => { stu.photo = v; },
        at: () => num(stu.photoAt), setAt: t => { stu.photoAt = t; }
    }));
    return list;
}
/* เรียกทุกครั้งที่เพิ่ม เปลี่ยน หรือลบรูป แล้วส่งขึ้นคลาวด์ตามหลัง */
function setStudentPhoto(stu, src) { stu.photo = src; stu.photoAt = src ? Date.now() : -Date.now(); scheduleImageSync(); }
function setSchoolImage(key, src) { PP1.school[key] = src; PP1.school[key + 'At'] = src ? Date.now() : -Date.now(); scheduleImageSync(); }
function scheduleImageSync(delay) {
    clearTimeout(IMG_SYNC.timer);
    IMG_SYNC.timer = setTimeout(syncImagesWithCloud, delay === undefined ? 1500 : delay);
}
function setImageCloudStatus(text) {
    IMG_SYNC.status = text;
    document.querySelectorAll('.img-cloud-status').forEach(el => { el.textContent = text; });
}
function imageCloudStatusHtml() {
    return '<span class="img-cloud-status">' + esc(IMG_SYNC.status || (cloudImages() ? '' : 'รูปเก็บเฉพาะในเครื่องนี้ (ยังไม่ได้เชื่อมต่อคลาวด์)')) + '</span>';
}
async function syncImagesWithCloud() {
    const api = cloudImages();
    if (!api) return;
    if (IMG_SYNC.running) { IMG_SYNC.again = true; return; }
    IMG_SYNC.running = true;
    const cohort = gradYearOf(PP1);
    let up = 0, down = 0;
    try {
        setImageCloudStatus('กำลังซิงก์รูปกับคลาวด์…');
        await window.anpCloud.connect();
        const index = await api.index();
        const fetchList = [];
        for (const e of imageEntries()) {
            const lt = e.at(), ct = num(index[e.id]), src = e.get();
            if (Math.abs(ct) > Math.abs(lt)) {
                if (ct > 0) fetchList.push(e);
                else { if (src) { e.set(''); down++; } e.setAt(ct); }
            } else if (Math.abs(lt) > Math.abs(ct)) {
                if (lt > 0 && src) { await api.put(e.id, src, lt); up++; }
                else if (lt < 0) { await api.remove(e.id, lt); up++; }
            } else if (!lt && !ct && src) {
                /* รูปที่มีอยู่ก่อนเปิดใช้คลาวด์ ส่งขึ้นไปครั้งแรก */
                const t = Date.now();
                await api.put(e.id, src, t); e.setAt(t); up++;
            }
        }
        if (fetchList.length) {
            const got = await api.get(fetchList.map(e => e.id));
            fetchList.forEach(e => { const d = got[e.id]; if (d && d.src) { e.set(d.src); e.setAt(num(d.at)); down++; } });
        }
        if ((up || down) && gradYearOf(PP1) === cohort) await saveDB(true);
        setImageCloudStatus('รูปเก็บบนคลาวด์แล้ว • เปิดเครื่องอื่นก็ได้รูปชุดเดียวกัน' +
            (up || down ? ' (ส่งขึ้น ' + up + ' • ดึงลง ' + down + ')' : ''));
        if (down && ['pp1copy', 'pp1real', 'cert', 'basic'].indexOf(state.page) >= 0) refreshAfterImageChange();
    } catch (err) {
        console.warn('ซิงก์รูปกับคลาวด์ไม่สำเร็จ', err);
        setImageCloudStatus('ซิงก์รูปกับคลาวด์ไม่สำเร็จ — รูปยังอยู่ในเครื่องนี้ จะลองใหม่เมื่อเปิดหน้าครั้งต่อไป');
    } finally {
        IMG_SYNC.running = false;
        if (IMG_SYNC.again) { IMG_SYNC.again = false; scheduleImageSync(); }
    }
}

/* ---------------------- ยูทิลิตี้ ---------------------- */
function esc(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function roundDown2(v) { return Math.floor((num(v) + 1e-9) * 100) / 100; }
function fmt2(v) { return (Math.round(num(v) * 100) / 100).toFixed(2); }
function notify(msg, type) {
    const t = $('toast'), i = $('toast-icon');
    $('toast-msg').innerText = msg;
    t.className = 'fixed bottom-6 right-6 z-[210] text-white px-6 py-4 rounded-2xl shadow-xl transition-all duration-300 flex items-center gap-3 font-medium ' +
        (type === 'error' ? 'bg-rose-600' : type === 'warn' ? 'bg-amber-500' : 'bg-emerald-600');
    i.className = 'ph text-2xl ' + (type === 'error' ? 'ph-warning-circle' : type === 'warn' ? 'ph-warning' : 'ph-check-circle');
    requestAnimationFrame(() => { t.style.transform = 'translateY(0)'; t.style.opacity = '1'; });

}
window.notify = notify;
/* opts.wide ใช้กับฟอร์มที่มีหลายช่อง (เช่น บันทึกนักเรียนออกกลางคัน) ให้กว้างเกือบเต็มจอ */

function studentFullName(s) {
    if (!s) return '';
    return ((s.prefix || '') + (s.first || '') + '  ' + (s.last || '')).trim();
}
function studentDisplayName(s) { return ((s.prefix || '') + (s.first || '') + ' ' + (s.last || '')).trim(); }

/* ปีการศึกษาของชั้นปีที่ n = ปีที่เข้าเรียน + (n-1) */
/* ป.1 = ปีที่จบ − 5 ไล่ขึ้นทีละปี ค่าที่เคยเก็บแยกรายชั้นใช้เฉพาะเมื่อยังไม่รู้ปีเข้าเรียน */
function yearOfLevel(level) {
    const start = parseInt(PP1.settings.startYear, 10);
    if (start) return String(start + (parseInt(level, 10) - 1));
    const explicit = PP1.grades[level] && PP1.grades[level].year;
    return explicit ? String(explicit) : '';
}
function setYearOfLevel(level, y) { PP1.grades[level].year = y; }

function getStudent(sid) { return PP1.students.find(s => String(s.studentId) === String(sid)); }
function sortedStudents() {
    return PP1.students.slice().sort((a, b) => {
        const r = num(a.room) - num(b.room);
        if (r !== 0) return r;
        return num(a.no) - num(b.no);
    });
}
function gradeRecord(level, sid) {
    const g = PP1.grades[level];
    if (!g.records[sid]) g.records[sid] = { subjects: {}, activities: {}, character: '', reading: '', activitySummary: '', clubName: '' };
    return g.records[sid];
}

/* คำนวณเกรดเฉลี่ยของชั้นปี (ถ่วงน้ำหนักด้วยหน่วยน้ำหนัก) */
function gpaOfLevel(level, sid) {
    const cur = PP1.curriculum[level];
    const rec = PP1.grades[level].records[sid];
    if (!rec) return { credits: 0, gpa: 0, earned: 0 };
    let sumW = 0, sumWG = 0;
    (cur.subjects || []).forEach(sub => {
        if (!sub.code && !sub.name) return;
        const g = rec.subjects[sub.code || sub.name];
        const w = num(sub.credit);
        if (g === undefined || g === '' || isNaN(parseFloat(g))) return;
        sumW += w; sumWG += w * parseFloat(g);
    });
    return { credits: sumW, gpa: sumW ? sumWG / sumW : 0, earned: sumW };
}
/* สรุปกลุ่มสาระ ป.4-6 ตามหน้าหลัง ปพ.1 */
/* ชั้นที่พิมพ์ใน ปพ.1 — ปิดได้สองทาง: กดปิดชั้นนั้นเอง หรือเอารหัสวิชาแรกของชั้น (ภาษาไทย) ออก
   ปีการศึกษาของชั้นอื่นไม่เลื่อนตาม เพราะปีคิดจากชั้น ไม่ได้คิดจากลำดับที่พิมพ์ */
function firstSubjectUncoded(level) {
    const first = (PP1.curriculum[level].subjects || []).find(s => s.code || s.name);
    return !!first && !String(first.code || '').trim();
}
function levelOnPp1(level) {
    const off = PP1.settings.pp1HiddenLevels || {};
    return !off[level] && !firstSubjectUncoded(level);
}
window.togglePp1Level = function (level) {
    const off = Object.assign({}, PP1.settings.pp1HiddenLevels || {});
    if (off[level]) delete off[level]; else off[level] = true;
    PP1.settings.pp1HiddenLevels = off;
    saveDB(true);
    if (state.page === 'curriculum') navigate('curriculum');
    else if ($('pp1-settings')) { renderPp1Settings(pp1Mode()); renderPp1List(); renderPp1Preview(); }
};
function pp1LevelToggles() {
    return [1, 2, 3, 4, 5, 6].map(l => {
        const on = levelOnPp1(l), forced = firstSubjectUncoded(l);
        return '<button onclick="window.togglePp1Level(' + l + ')" title="' + (forced ? 'รหัสวิชาแรกของชั้นนี้ว่าง จึงไม่แสดง — ใส่รหัสคืนเพื่อแสดง' : 'กดเพื่อเปิด/ปิด') + '" ' +
            'class="px-3 py-1.5 rounded-lg text-sm font-bold border ' + (on ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-white text-slate-400 border-slate-200 line-through') + '">' +
            'ป.' + l + ' ' + esc(yearOfLevel(l) || '') + (forced ? ' <i class="ph ph-warning text-amber-500"></i>' : '') + '</button>';
    }).join('');
}
function summaryP46(sid) {
    const rows = PP1_AREAS.map(a => ({ key: a.key, label: a.label, credit: 0, wsum: 0 }));
    let totCredit = 0, totW = 0, earned = 0;
    const stu = getStudent(sid);
    const lastLevel = isLeaver(stu) ? leaverLastLevel(stu) : 6;
    [4, 5, 6].forEach(level => {
        if (level > lastLevel) return;   // ชั้นที่ยังเรียนไม่จบของผู้ออกกลางคันไม่นับ
        if (!levelOnPp1(level)) return;   // ชั้นที่ปิดไม่พิมพ์ จึงไม่นับ
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid];
        if (!rec) return;
        (cur.subjects || []).forEach(sub => {
            const code = (sub.code || '').trim();
            if (!code) return;   // วิชาที่ไม่มีรหัสไม่พิมพ์ใน ปพ.1 จึงไม่นับหน่วยกิต/เกรดเฉลี่ยด้วย
            const g = rec.subjects[code || sub.name];
            if (g === undefined || g === '' || isNaN(parseFloat(g))) return;
            const w = num(sub.credit);
            if (!w) return;
            const key = areaKeyFor(sub);
            let row = rows.find(r => r.key === key);
            if (!row) { row = { key: 'other', label: 'อื่น ๆ', credit: 0, wsum: 0 }; rows.push(row); }
            row.credit += w; row.wsum += w * parseFloat(g);
            totCredit += w; totW += w * parseFloat(g);
            if (parseFloat(g) > 0) earned += w;
        });
    });
    rows.forEach(r => { r.grade = r.credit ? roundDown2(r.wsum / r.credit) : ''; });
    return { rows, totalCredit: totCredit, earnedCredit: earned, totalGpa: totCredit ? roundDown2(totW / totCredit) : 0 };
}
/* หน่วยน้ำหนักรวม/ที่ได้ ตลอด 6 ปี */
function creditSummaryAll(sid) {
    let registered = 0, earned = 0, sumW = 0, sumWG = 0;
    for (let level = 1; level <= 6; level++) {
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid];
        (cur.subjects || []).forEach(sub => {
            if (!sub.code && !sub.name) return;
            const w = num(sub.credit);
            if (!w) return;
            registered += w;
            const g = rec ? rec.subjects[(sub.code || sub.name)] : '';
            if (g !== undefined && g !== '' && !isNaN(parseFloat(g)) && parseFloat(g) > 0) earned += w;
            if (g !== undefined && g !== '' && !isNaN(parseFloat(g))) { sumW += w; sumWG += w * parseFloat(g); }
        });
    }
    return { registered, earned, gpa: sumW ? roundDown2(sumWG / sumW) : 0 };
}

function buildSidebar() {
    const nav = $('nav-menu');
    nav.innerHTML = '';
    MENU.forEach(item => {
        if (item.group) {
            const h = document.createElement('div');
            h.className = 'px-3 pt-4 pb-1 text-[10px] uppercase tracking-wider text-slate-400 font-extrabold';
            h.innerText = item.group;
            nav.appendChild(h);
            return;
        }
        const btn = document.createElement('button');
        btn.id = 'nav-btn-' + item.id;
        btn.className = navClass(false);
        btn.innerHTML = '<i class="ph ' + item.icon + ' text-lg mr-2.5 shrink-0"></i><span class="truncate">' + esc(item.label) + '</span>';
        btn.onclick = () => navigate(item.id);
        nav.appendChild(btn);
    });
}
function navClass(active) {
    return active
        ? 'w-full flex items-center px-3 py-2.5 rounded-xl text-left text-sm font-bold text-white bg-primary-gradient shadow-md shadow-indigo-200'
        : 'w-full flex items-center px-3 py-2.5 rounded-xl text-left text-sm font-semibold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-colors';
}

function navigate(pageId) {
    const item = MENU.find(m => m.id === pageId);
    if (!item) return;
    state.page = pageId;
    if (item.level) state.gradeYear = item.level;
    destroyCharts();
    MENU.forEach(m => { if (m.id) { const b = $('nav-btn-' + m.id); if (b) b.className = navClass(m.id === pageId); } });
    $('page-title').innerText = item.label;
    $('page-sub').innerText = 'แผ่นงาน: ' + item.sheet;
    $('header-actions').innerHTML = '';
    const area = $('content-area');
    area.innerHTML = '<div id="page-root" class="animate-fade-in-up"></div>';
    const root = $('page-root');
    const fn = PAGES[pageId];
    if (fn) fn(root, item);
    area.scrollTop = 0;
}
window.navigate = navigate;

function destroyCharts() {
    (state.chartRefs || []).forEach(c => { try { c.destroy(); } catch (e) {} });
    state.chartRefs = [];
}

/* ---------------------- ส่วนประกอบ UI ที่ใช้ซ้ำ ---------------------- */
function card(title, icon, bodyHtml, extra) {
    return '<div class="modern-card p-6 mb-5">' +

        bodyHtml + '</div>';
}
function field(label, id, value, opts) {
    opts = opts || {};
    const type = opts.type || 'text';
    return '<div class="' + (opts.wrap || '') + '">' +
        '<label class="block text-xs font-bold text-slate-500 mb-1">' + esc(label) + '</label>' +
        '<input id="' + id + '" type="' + type + '" value="' + esc(value) + '" ' + (opts.attrs || '') +
        ' class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus-ring bg-white">' +
        '</div>';
}
function selectField(label, id, value, options, opts) {
    opts = opts || {};
    let html = '<div class="' + (opts.wrap || '') + '"><label class="block text-xs font-bold text-slate-500 mb-1">' + esc(label) + '</label>' +
        '<select id="' + id + '" ' + (opts.attrs || '') + ' class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus-ring bg-white">';
    options.forEach(o => {
        const val = (typeof o === 'object') ? o.value : o;
        const lab = (typeof o === 'object') ? o.label : o;
        html += '<option value="' + esc(val) + '"' + (String(val) === String(value) ? ' selected' : '') + '>' + esc(lab) + '</option>';
    });
    return html + '</select></div>';
}
function toolbarBtn(label, icon, onclick, tone) {

        primary: 'bg-primary-gradient text-white shadow-md shadow-indigo-200',

function studentPicker(id, value, onchange, customList) {

    html += '<option value="">— เลือกรายบุคคล (พิมพ์เฉพาะคนนี้) —</option>';

async function updateStorageInfo() {
    const el = $('storage-info');
    if (!el) return;
    const parts = [];
    try { parts.push('ขนาดข้อมูล ปพ.1 ' + Math.round(JSON.stringify(PP1).length / 1024) + ' KB'); } catch (e) {}
    parts.push(IDB.available ? 'เก็บใน IndexedDB' : 'เก็บใน localStorage (พื้นที่สำรอง)');
    try {
        if (navigator.storage && navigator.storage.estimate) {
            const est = await navigator.storage.estimate();
            if (est && est.quota) parts.push('ใช้ไป ' + (est.usage / 1048576).toFixed(1) + ' MB จากโควตา ' + Math.round(est.quota / 1048576) + ' MB');
        }
    } catch (e) {}
    el.innerText = parts.join(' • ');
}
function statPill(label, value, icon) {
    return '<div class="bg-white/15 rounded-2xl px-4 py-3 backdrop-blur-sm">' +
        '<div class="text-[11px] font-bold opacity-80 flex items-center gap-1"><i class="ph ' + icon + '"></i>' + esc(label) + '</div>' +
        '<div class="text-xl font-extrabold mt-0.5">' + esc(value) + '</div></div>';
}
function countSummary() {
    let subjects = 0, gradeYears = 0;
    for (let i = 1; i <= 6; i++) {
        subjects += (PP1.curriculum[i].subjects || []).filter(s => s.code || s.name).length;
        if (Object.keys(PP1.grades[i].records || {}).length) gradeYears++;
    }
    return { students: PP1.students.length, subjects, gradeYears };
}

}

}

function curriculumTotals(level) {
    const cur = PP1.curriculum[level];
    let baseHours = 0, baseCredit = 0, extraHours = 0, extraCredit = 0, actHours = 0;
    (cur.subjects || []).forEach(s => {
        if (s.type === 'เพิ่มเติม') { extraHours += num(s.hours); extraCredit += num(s.credit); }
        else { baseHours += num(s.hours); baseCredit += num(s.credit); }
    });
    (cur.activities || []).forEach(a => { actHours += num(a.hours); });
    return { baseHours, baseCredit, extraHours, extraCredit, actHours };
}
window.setCurriculumCell = function (kind, i, key, val) {
    const cur = PP1.curriculum[state.gradeYear];
    const arr = kind === 'sub' ? cur.subjects : cur.activities;
    if (!arr[i]) return;
    arr[i][key] = (key === 'hours' || key === 'credit') ? val : val.trim();
    /* กรอกเวลาเรียนแล้วคิดน้ำหนักหน่วยกิตให้ทันที (เวลาเรียน ÷ 40) */
    if (kind === 'sub' && key === 'hours') {
        const c = creditFromHours(val);
        if (c !== '') arr[i].credit = c;
    }
    saveDebounced();
    if (key === 'type' || key === 'hours' || key === 'credit') renderCurriculumBody();
};
window.addSubjectRow = function () {
    const cur = PP1.curriculum[state.gradeYear];

window.copyPrevCurriculum = function () {
    const level = state.gradeYear;
    if (level <= 1) { notify('ป.1 ไม่มีชั้นก่อนหน้า', 'warn'); return; }
    const prev = PP1.curriculum[level - 1];
    PP1.curriculum[level] = JSON.parse(JSON.stringify(prev));
    // ปรับเลขชั้นในรหัสวิชา เช่น ท11101 -> ท12101
    PP1.curriculum[level].subjects.forEach(s => {
        if (s.code && s.code.length >= 3) {
            const digits = s.code.slice(1);
            if (/^\d/.test(digits)) {
                const arr = digits.split('');
                if (arr[1] === String(level - 1)) { arr[1] = String(level); s.code = s.code.charAt(0) + arr.join(''); }
            }
        }
    });
    saveDB(); renderCurriculumBody();
    notify('คัดลอกหลักสูตรจาก ป.' + (level - 1) + ' แล้ว');
};

function filteredStudents() {
    const q = (state.studentSearch || '').trim().toLowerCase();
    const group = studentGroup();
    const lvl = group === 'left' ? '' : (state.studentLevel || '');
    return studentGroupBase(group).filter(s => {
        if (group === 'left') {
            if (state.leaveYearFilter && String(leaveAcadOf(s)) !== state.leaveYearFilter) return false;
            if (state.leaveTermFilter && (s.leftTerm ? String(s.leftTerm) : '-') !== state.leaveTermFilter) return false;
        }
        if (lvl) {
            const sLvl = String(s.level || PP1.settings.cohortLevel || 6);
            if (sLvl !== lvl) return false;
        }

window.setStudentId = function (i, val) {

    for (let l = 1; l <= 6; l++) {

        if (recs[oldId]) { recs[newId] = recs[oldId]; delete recs[oldId]; }

window.addStudent = function () {
    const targetLevel = state.studentLevel ? parseInt(state.studentLevel, 10) : (PP1.settings.cohortLevel || 6);
    const rooms = PP1.students.filter(s => (s.level || PP1.settings.cohortLevel || 6) == targetLevel).map(s => num(s.room));
    const room = state.studentRoom || (rooms.length ? Math.max.apply(null, rooms) : 1);
    const inRoom = PP1.students.filter(s => (s.level || PP1.settings.cohortLevel || 6) == targetLevel && String(s.room) === String(room));
    let maxId = 0;
    PP1.students.forEach(s => { const n = parseInt(s.studentId, 10); if (!isNaN(n) && n > maxId) maxId = n; });
    PP1.students.push({
        level: targetLevel,
        room: String(room), no: String(inRoom.length + 1), studentId: String(maxId + 1),
        prefix: 'เด็กชาย', first: '', last: '', citizenId: '', nationality: 'ไทย', religion: 'พุทธ', sex: 'ชาย',
        entryD: '13', entryM: 'พฤษภาคม', entryY: '2564',

function colToIndex(letter) {
    const s = String(letter || '').trim().toUpperCase();
    if (!s) return -1;
    let n = 0;
    for (let i = 0; i < s.length; i++) {
        const c = s.charCodeAt(i) - 64;
        if (c < 1 || c > 26) return -1;
        n = n * 26 + c;
    }
    return n - 1;
}
window.parseOnetPaste = function () {
    const text = $('onet-paste').value;
    if (!text.trim()) { notify('ยังไม่ได้วางข้อมูล', 'warn'); return; }
    const startRow = Math.max(1, num($('onet-row-start').value) || 1);
    const rows = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '').slice(startRow - 1)
        .map(line => line.split('\t'));
    PP1.onetRaw = { header: {}, rows };
    saveDB();
    renderOnetPreview();
    notify('อ่านข้อมูลได้ ' + rows.length + ' แถว');
};
function renderOnetPreview() {
    const rows = (PP1.onetRaw && PP1.onetRaw.rows) || [];

    if (!cont) return;

    const maxCols = rows.reduce((m, r) => Math.max(m, r.length), 0);
    let head = '<th class="sticky-col">แถว</th>';
    for (let i = 0; i < maxCols; i++) head += '<th>' + indexToCol(i) + '</th>';
    const body = rows.slice(0, 120).map((r, i) => '<tr><td class="sticky-col text-center text-xs text-slate-400 px-2">' + (i + 1) + '</td>' +
        Array.from({ length: maxCols }, (_, c) => '<td class="px-2 py-1 text-xs whitespace-nowrap">' + esc(r[c] || '') + '</td>').join('') + '</tr>').join('');
    cont.innerHTML = card('ข้อมูลที่อ่านได้ (' + rows.length + ' แถว)', 'ph-table',
        '<div class="grid-wrap"><table class="grid-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        (rows.length > 120 ? '<div class="text-xs text-slate-400 mt-2">แสดงตัวอย่าง 120 แถวแรก</div>' : ''));
}
function indexToCol(i) {
    let s = '';
    i = i + 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
}
window.applyOnet = function () {

    const avgCol = colToIndex($('onet-col-avg').value);
    const map = {};

};

/* ---------- สะพานเชื่อมข้อมูลกับระบบ ANPSCORE ---------- */
function readAnpscore() {
    let db = null, sdata = null;
    try { db = JSON.parse(localStorage.getItem('anpscore_db') || 'null'); } catch (e) {}
    try { sdata = JSON.parse(localStorage.getItem('anpscore_subjectData') || 'null'); } catch (e) {}
    if (!db) return null;
    return { db, sdata: sdata || {} };
}
function anpNormalize(value, preferredKey) {
    if (value === null || value === undefined || value === '') return 0;
    if (typeof value === 'number') return isFinite(value) ? value : 0;
    if (typeof value === 'string') { const n = Number(value.trim()); return isFinite(n) ? n : 0; }
    if (typeof value === 'object') {
        const keys = [preferredKey, 'value', 'score', 'total', 'k', 'p', 'a'].filter(Boolean);
        for (const k of keys) if (value[k] !== undefined) return anpNormalize(value[k]);
    }
    return 0;
}
function anpTotalScore(sd, cId, studentId, term) {
    if (!sd || !sd.scores || !sd.scores[cId] || !sd.scores[cId][studentId]) return null;
    const stuNode = sd.scores[cId][studentId];
    let sc = stuNode[term];
    if (stuNode.term !== undefined) { if (String(stuNode.term) === String(term)) sc = stuNode; else return null; }
    if (!sc) return null;
    let total = 0, any = false;
    const units = (sd.classData && sd.classData[cId]) ? sd.classData[cId].learningUnits : sd.learningUnits;
    (units || []).forEach(u => {
        if (String(u.term) !== String(term) || !u.indicators) return;
        u.indicators.forEach(ind => {
            const val = sc.indicators ? sc.indicators[ind.id] : null;
            if (val) { any = true; total += anpNormalize(val.k, 'k') + anpNormalize(val.p, 'p') + anpNormalize(val.a, 'a'); }
        });
    });
    if (sc.midTermScore !== undefined && sc.midTermScore !== '') any = true;
    if (sc.finalScore !== undefined && sc.finalScore !== '') any = true;
    total += anpNormalize(sc.midTermScore, 'midTermScore') + anpNormalize(sc.finalScore, 'finalScore');
    return any ? total : null;
}
function anpGrade(score, settings) {
    const s = parseFloat(score);
    const keys = ['4.0', '3.5', '3.0', '2.5', '2.0', '1.5', '1.0'];
    for (const g of keys) if (s >= num(settings[g])) return String(parseFloat(g));
    return '0';
}
window.showAnpscoreImport = async function (level) {
    if (ANP.live && !ANP.scoresLoaded) await loadScoresFromCloud();
    const src = anpSource();

window.doAnpscoreImport = function () {
    const src = anpSource();
    if (!src) return;
    const level = parseInt($('anp-level').value, 10);
    const termMode = $('anp-term').value;
    const addStudents = $('anp-add-students').checked;
    const overwrite = $('anp-overwrite').checked;
    const clsIds = Array.from(document.querySelectorAll('.anp-cls:checked')).map(el => el.value);
    const settings = src.db.gradeSettings || { '4.0': 80, '3.5': 75, '3.0': 70, '2.5': 65, '2.0': 60, '1.5': 55, '1.0': 50 };
    const curSubjects = (PP1.curriculum[level].subjects || []).filter(s => s.code || s.name);

    let added = 0, filled = 0, skippedSubj = new Set();
    clsIds.forEach(cId => {
        const cls = (src.db.classes || {})[cId];
        if (!cls) return;
        (cls.students || []).forEach(stu => {
            const sid = String(stu.studentId || '').trim();
            if (!sid) return;
            let target = getStudent(sid);
            if (!target) {
                if (!addStudents) return;
                const parts = String(stu.name || '').trim();
                const pfx = PREFIXES.find(p => parts.indexOf(p) === 0) || '';
                const rest = parts.slice(pfx.length).trim().split(/\s+/);
                target = {
                    room: (cls.name || '').split('/')[1] || '1', no: '', studentId: sid,
                    prefix: pfx, first: rest[0] || '', last: rest.slice(1).join(' ') || '',
                    citizenId: '', nationality: 'ไทย', religion: 'พุทธ', sex: pfx.indexOf('หญิง') >= 0 ? 'หญิง' : 'ชาย'
                };
                PP1.students.push(target); added++;
            }
            const rec = gradeRecord(level, sid);
            (src.db.subjects || []).forEach(sub => {
                const sd = src.sdata[sub.id];
                if (!sd) return;
                const match = curSubjects.find(cs =>
                    (sub.code && cs.code && String(sub.code).trim() === String(cs.code).trim()) ||
                    (sub.name && cs.name && String(sub.name).trim() === String(cs.name).trim()));
                if (!match) { if (sub.name) skippedSubj.add(sub.name); return; }
                let score = null;
                if (termMode === 'avg') {
                    const t1 = anpTotalScore(sd, cId, sid, '1'), t2 = anpTotalScore(sd, cId, sid, '2');
                    if (t1 === null && t2 === null) return;
                    score = (t1 === null || t2 === null) ? (t1 === null ? t2 : t1) : (t1 + t2) / 2;
                } else {
                    score = anpTotalScore(sd, cId, sid, termMode);
                    if (score === null) return;
                }
                const key = match.code || match.name;
                if (!overwrite && rec.subjects[key] !== undefined && rec.subjects[key] !== '') return;
                rec.subjects[key] = anpGrade(score, settings);
                filled++;
            });
        });
    });
    saveDB(); closeModal();
    if (state.page === 'grade' + level) renderGradeGrid(level); else navigate('grade' + level);
    notify('ดึงข้อมูลสำเร็จ • เติมเกรด ' + filled + ' ช่อง' + (added ? ' • เพิ่มนักเรียนใหม่ ' + added + ' คน' : '') +
        (skippedSubj.size ? ' • ไม่พบวิชาที่ตรงกัน ' + skippedSubj.size + ' วิชา' : ''), skippedSubj.size ? 'warn' : 'success');
};

const GRADE_BUCKETS = ['0', '1', '1.5', '2', '2.5', '3', '3.5', '4', 'ร', 'มส'];

function achievementRows(level, mode) {
    const cur = PP1.curriculum[level];
    const subjects = (cur.subjects || []).filter(s => s.code || s.name);
    const recs = PP1.grades[level].records;
    const students = PP1.students;
    const groups = [];
    if (mode === 'area') {
        PP1_AREAS.forEach(a => groups.push({ key: a.key, label: a.label, subjects: subjects.filter(s => areaKeyFor(s) === a.key) }));
        const others = subjects.filter(s => areaKeyFor(s) === 'other');
        if (others.length) groups.push({ key: 'other', label: 'อื่น ๆ', subjects: others });
    } else {
        subjects.forEach(s => groups.push({ key: s.code || s.name, label: (s.code ? s.code + '  ' : '') + s.name, subjects: [s] }));
    }
    return groups.filter(g => g.subjects.length).map(g => {
        const counts = {}; GRADE_BUCKETS.forEach(b => counts[b] = 0);
        let registered = 0, graded = 0, sum = 0, sumSq = 0, pass = 0, good = 0, fail = 0;
        students.forEach(stu => {
            const rec = recs[String(stu.studentId)];
            g.subjects.forEach(sub => {
                registered++;
                const v = rec ? rec.subjects[sub.code || sub.name] : '';
                if (v === undefined || v === '') return;
                graded++;
                if (counts[v] !== undefined) counts[v]++;
                const n = parseFloat(v);
                if (!isNaN(n)) {
                    sum += n; sumSq += n * n;
                    if (n >= 1) pass++; else fail++;
                    if (n >= 3) good++;
                } else fail++;
            });
        });
        const mean = graded ? sum / graded : 0;
        const variance = graded ? Math.max(0, sumSq / graded - mean * mean) : 0;
        return {
            label: g.label, counts, registered, graded, mean, sd: Math.sqrt(variance),
            pass, good, fail,
            passPct: graded ? pass * 100 / graded : 0, goodPct: graded ? good * 100 / graded : 0
        };
    });
}

            '<div class="pt-6"><button type="button" onclick="window.selectFullRange(\'' + prefix + '\')" class="px-3.5 py-2.5 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 transition-colors flex items-center gap-1.5"><i class="ph ph-check-square"></i>เลือกทั้งห้องนี้</button></div>' +
            (extraHtml || '') +
        '</div>' +
        '<div class="text-xs text-slate-400 mt-3 flex items-center gap-2">' +
            '<i class="ph ph-info text-indigo-500"></i>' +
            '<span id="' + prefix + '-status-text">พบ ' + maxVal + ' คน ในชั้น/ห้องที่เลือก • สั่งพิมพ์จะเรียงตามห้องและเลขที่</span>' +
        '</div>' +
        '</div>';
}

function pickRange(prefix) {
    const one = $(prefix + '-one') ? $(prefix + '-one').value : '';
    const list = rangeStudents(prefix);
    if (one) { const s = getStudent(one); return s ? [s] : []; }
    const from = Math.max(1, num($(prefix + '-from').value) || 1);
    const to = Math.min(list.length, num($(prefix + '-to').value) || list.length);
    return list.slice(from - 1, to);
}

window.onRangeFilterChange = function (prefix) {
    const list = rangeStudents(prefix);
    const fromEl = $(prefix + '-from');
    const toEl = $(prefix + '-to');
    const pickerWrap = $(prefix + '-picker-wrap');
    const statusEl = $(prefix + '-status-text');

    if (fromEl) fromEl.value = 1;
    if (toEl) toEl.value = list.length;
    if (pickerWrap) {
        pickerWrap.innerHTML = '<label class="block text-xs font-bold text-slate-500 mb-1">เลือกรายบุคคล</label>' +
            studentPicker(prefix + '-one', '', 'window.onRangeStudentPick(\'' + prefix + '\')', list);
    }
    if (statusEl) {
        statusEl.innerText = 'พบ ' + list.length + ' คน ในชั้น/ห้องที่เลือก • สั่งพิมพ์จะเรียงตามห้องและเลขที่';
    }
    if (list.length) updateRangePreview(prefix, list[0]);
};

window.onRangeStudentPick = function (prefix) {
    const one = $(prefix + '-one') ? $(prefix + '-one').value : '';
    if (one) {
        const s = getStudent(one);
        if (s) updateRangePreview(prefix, s);
    } else {
        const list = rangeStudents(prefix);
        if (list.length) updateRangePreview(prefix, list[0]);
    }
};

window.selectFullRange = function (prefix) {
    const list = rangeStudents(prefix);
    const fromEl = $(prefix + '-from');
    const toEl = $(prefix + '-to');
    const oneEl = $(prefix + '-one');
    if (fromEl) fromEl.value = 1;
    if (toEl) toEl.value = list.length;
    if (oneEl) oneEl.value = '';
    notify('เลือกนักเรียนทั้งห้อง/ชั้นจำนวน ' + list.length + ' คน เรียบร้อย');
    if (list.length) updateRangePreview(prefix, list[0]);
};

function updateRangePreview(prefix, student) {
    if (!student) return;
    state.previewStudentId = student.studentId;
    if (prefix === 'rp' && $('report-preview')) {
        $('report-preview').innerHTML = reportDocHtml(student, state.gradeYear);
    } else if (prefix === 'gs' && $('gs-preview')) {
        $('gs-preview').innerHTML = gradeSummaryDocHtml(student);
    } else if (prefix === 'ct' && $('ct-preview')) {
        $('ct-preview').innerHTML = certAnyDocHtml(student);
    } else if (prefix === 'p2' && $('p2-preview')) {
        $('p2-preview').innerHTML = pp2DocHtml(student);
    }
}

const PP1_OVERLAYS_REAL = {
    1: [{ type: 'photoBox', from: [36, 129261, 1, 107950], to: [41, 88514, 7, 72361] }],
    2: []
};
function pp1OverlayHtml(page, geo, stu) {
    const cols = geo.cols, rows = geo.rows;
    const pageTop = page === 2 ? rows.slice(0, PP1_TPL.pageBreak).reduce((x, y) => x + y, 0) : 0;
    const rk = geo.pages[page].s;
    const at = p => ({
        x: cols.slice(0, p[0]).reduce((t, w) => t + w, 0) * geo.sx + p[1] * EMU_MM * geo.sy,
        y: (rows.slice(0, p[2]).reduce((t, h) => t + h, 0) - pageTop + p[3] * EMU_MM) * rk
    });
    return ((geo.real ? PP1_OVERLAYS_REAL : PP1_OVERLAYS)[page] || []).map(o => {
        const p1 = at(o.from), p2 = at(o.to);
        const box = 'position:absolute;left:' + p1.x.toFixed(3) + 'mm;top:' + p1.y.toFixed(3) +
            'mm;width:' + (p2.x - p1.x).toFixed(3) + 'mm;height:' + (p2.y - p1.y).toFixed(3) + 'mm;box-sizing:border-box';
        if (o.type === 'garuda') {
            return '<img src="' + PP1_GARUDA + '" alt="" style="' + box + ';object-fit:contain">';
        }
        if (o.type === 'image') {
            const src = PP1.settings.pp1Stamps !== false && PP1.school[o.key];
            /* multiply ทำให้พื้นขาวของรูปลายเซ็นโปร่งใส ตราประทับจึงไม่ถูกบัง */
            return src ? '<img src="' + esc(src) + '" alt="" style="' + box + ';object-fit:contain;mix-blend-mode:multiply">' : '';
        }
        if (o.type === 'photoBox') {
            /* พื้นขาวทึบ ปิดเส้นบรรทัดของตารางที่ลากผ่านใต้กรอบรูป */
            return '<div style="' + box + ';background:#fff;border:0.75pt dashed #000;display:flex;align-items:center;justify-content:center;' +
                'font-size:' + (14 * geo.sy).toFixed(2) + 'pt;font-weight:700">3x4 ซม.</div>';
        }
        if (o.type === 'photo') {
            const photo = stu && stu.photo;
            return '<div style="' + box + ';background:#fff;border:0.25pt solid #000;overflow:hidden">' +
                (photo ? '<img src="' + esc(photo) + '" alt="" style="width:100%;height:100%;object-fit:cover">' : '') +
                '</div>';
        }
        return '';
    }).join('');
}

function pp1FillMap(stu) {
    const sid = String(stu.studentId);

    const B = {};
    Object.defineProperty(F, 'bold', { value: B, enumerable: false });

    put('X11', stu.sex); put('AE11', stu.nationality); put('AM11', stu.religion);
    put('AB12', stu.father); put('AB13', stu.mother);

    /* ---- ผลการเรียนรายวิชา 3 คอลัมน์ ---- */
    const blocks = pp1YearBlocks(sid);
    const columns = pp1SubjectColumns(blocks, cfg.pp1Layout);
    PP1_GROUPS.forEach((g, gi) => {
        const lines = columns[gi] || [];
        for (let k = 0; k <= g.subjectTo - PP1_SUBJECT_ROWS.from; k++) {
            const r = PP1_SUBJECT_ROWS.from + k, line = lines[k];
            F[r + ',' + g.label] = line ? (line.t === 'row' ? line.r.label : line.text) : '';
            F[r + ',' + g.hours] = (line && line.t === 'row') ? (line.r.hours || '') : '';
            F[r + ',' + g.grade] = (line && line.t === 'row') ? (line.r.grade || '') : '';
            B[r + ',' + g.label] = !!(line && line.t !== 'row');
            B[r + ',' + g.hours] = false;
            B[r + ',' + g.grade] = false;
        }
    });

    /* ---- ผลการประเมินกิจกรรมพัฒนาผู้เรียน ---- */
    const actColumns = pp1ActivityColumns(blocks, cfg.pp1Layout);
    const actRows = PP1_ACTIVITY_ROWS.to - PP1_ACTIVITY_ROWS.from + 1;
    PP1_GROUPS.forEach((g, gi) => {
        const lines = actColumns[gi] || [];
        for (let k = 0; k < actRows; k++) {
            const r = PP1_ACTIVITY_ROWS.from + k, line = lines[k];
            F[r + ',' + g.label] = line ? (line.t === 'row' ? line.r.label : line.text) : '';
            F[r + ',' + g.hours] = (line && line.t === 'row') ? (line.r.hours || '') : '';
            F[r + ',' + g.grade] = (line && line.t === 'row') ? (line.r.grade || '') : '';
            B[r + ',' + g.label] = !!(line && line.t !== 'row');
            B[r + ',' + g.hours] = false;
            B[r + ',' + g.grade] = false;

    /* ---- สรุปผลการประเมิน / ผลการตัดสิน ---- */

    put('I89', gradDate.d); put('K89', gradDate.m); put('P89', gradDate.y);

    /* ---- ผลการทดสอบระดับชาติ ---- */

    put('AA95', showScores ? stu.onet_sci : ''); put('AA96', showScores ? stu.onet_eng : '');

    /* ---- ตารางกลุ่มสาระ ป.4-6 ---- */
    const p46 = summaryP46(sid);
    const g3 = PP1_GROUPS[2];
    const areaRows = PP1_AREA_ROWS.to - PP1_AREA_ROWS.from + 1;
    for (let k = 0; k < areaRows; k++) {
        const r = PP1_AREA_ROWS.from + k, row = p46.rows[k];
        if (row && (row.key !== 'other' || row.credit)) {

    if (stu.pp1Note) put('AC108', 'หมายเหตุ ' + stu.pp1Note);

       วันที่ใต้ลายเซ็นผู้อำนวยการใช้วันที่ออกจากโรงเรียน */
    if (isLeaver(stu)) {

    /* ช่องข้อมูลที่ว่างให้ขีด "-" แทนเส้นเปล่า เพื่อไม่ให้มีคนเติมเองภายหลัง */
    const dash = addr => { const k = addrKey(addr); if (!String(F[k] || '').trim()) F[k] = '-'; };
    PP1_DASH_FIELDS.forEach(dash);

        if (d.every(a => !String(F[addrKey(a)] || '').trim())) F[addrKey(d[0])] = '-';

    return F;
}
const PP1_DASH_FIELDS = ['G11', 'G12', 'G13', 'Y6', 'Y7', 'AD8', 'AD9', 'Y10', 'AD10', 'AL10', 'X11', 'AE11', 'AM11', 'AB12', 'AB13',
    'I91', 'R83', 'R84', 'R85', 'R86', 'W83', 'W84', 'W85', 'W86'];
const PP1_DASH_DATES = [['G10', 'I10', 'N10'], ['I89', 'K89', 'P89'], ['I90', 'K90', 'P90']];

/* O-NET ใน ปพ.1 มีสามแบบ — show พิมพ์คะแนน, blank พิมพ์หัวข้อแต่เว้นคะแนนว่าง (แบบเดียวกับไฟล์ต้นฉบับ
   "ไม่แสดงโอเน็ต" ที่พิมพ์ออกมา), hide ปิดทั้งสองช่วงด้วยกล่องขาวแบบเดิม */
const ONET_MODES = [
    { value: 'blank', label: 'ไม่แสดงคะแนนโอเน็ต (ตามต้นฉบับ)' },
    { value: 'show', label: 'แสดงคะแนนโอเน็ต' },

function onetMode() {

function setOnetMode(m) {
    PP1.settings.onetMode = m;
    PP1.settings.showOnet = m === 'show';
}
function pp1HiddenSet() {
    const H = {};
    if (onetMode() === 'hide') {
        /* ต้นฉบับรุ่น "ไม่แสดงโอเน็ต" ใช้กล่องขาวทับไว้สองใบ คือแถว 95-97
           (คะแนนรายวิชา) และแถว 101-104 (สัดส่วนถ่วงน้ำหนัก) คอลัมน์ A-AB
           ส่วนหัวข้อแถว 93-94 และ 100 ยังพิมพ์อยู่ */
        for (let r = 95; r <= 97; r++) for (let c = 1; c <= 28; c++) H[r + ',' + c] = 1;
        for (let r = 101; r <= 104; r++) for (let c = 1; c <= 28; c++) H[r + ',' + c] = 1;
    }
    return H;
}

/* วาดกริดหนึ่งหน้าให้ตรงกับที่ Excel พิมพ์
   Excel ปล่อยให้ข้อความที่ยาวเกินช่อง "ล้น" ไปทับช่องขวามือที่ว่างอยู่
   ป้ายหัวข้ออย่าง "โรงเรียน" หรือ "ระเบียนแสดงผลการเรียน…" จึงอ่านได้เต็ม
   ทั้งที่เซลล์กว้างแค่ 5 มม. ตัวเรนเดอร์ต้องเลียนพฤติกรรมนี้ ไม่งั้นข้อความ
   จะถูกตัดหางหมด */
/* หัวตารางที่ต้นฉบับวางข้อความไว้สองเซลล์ติดกันโดยไม่มีเส้นคั่น เพื่อให้อ่าน
   เป็นกล่องเดียวสองบรรทัด เช่น "เวลา" + "(ชั่วโมง)" และ "ผลการ" + "ประเมิน" */
const PP1_STACK_PAIRS = [[16, 11], [16, 25], [16, 39], [65, 11], [65, 25], [65, 39], [65, 13], [65, 27], [65, 41],
    [81, 39], [81, 41]];
/* หัวตารางช่องเดียวที่ข้อความยาวกว่ากล่อง ต้องตัดบรรทัด */
const PP1_WRAP_CELLS = [[16, 13], [16, 27], [16, 41]];

function pp1PageCells(from, to, fill, hidden, rowsMm) {
    const cols = PP1_TPL.cols, idx = tplIndex();
    const skip = {}, list = [], filled = {};
    for (let r = from; r <= to; r++) {
        if (!rowsMm[r - 1]) continue;
        for (let c = 1; c <= cols.length; c++) {
            const key = r + ',' + c;
            if (skip[key]) continue;
            const cell = idx[key];
            let span = (cell && cell.rs) ? cell.rs : 1;
            const cs = (cell && cell.cs) ? cell.cs : 1;
            if (r + span - 1 > to) span = to - r + 1;
            for (let rr = r; rr < r + span; rr++)
                for (let cc = c; cc < c + cs; cc++)
                    if (rr !== r || cc !== c) skip[rr + ',' + cc] = 1;
            let rs = 0;
            for (let rr = r; rr < r + span; rr++) if (rowsMm[rr - 1]) rs++;

            const hasFill = Object.prototype.hasOwnProperty.call(fill, key);
            let text = hasFill ? fill[key] : (cell ? (cell.t || '') : '');
            if (hidden[key]) text = '';
            text = String(text);
            list.push({ r, c, rs, cs, cell, text, bold: fill.bold && Object.prototype.hasOwnProperty.call(fill.bold, key) ? fill.bold[key] : undefined });
            if (text.trim()) {
                for (let cc = c; cc < c + cs; cc++) filled[r + ',' + cc] = 1;
            }
        }
    }
    /* รวมหัวตารางสองเซลล์ให้เป็นกล่องเดียวสองบรรทัด */
    PP1_STACK_PAIRS.forEach(pair => {
        const r = pair[0], c = pair[1];
        if (r < from || r > to) return;
        const a = list.find(x => x.r === r && x.c === c);
        const bi = list.findIndex(x => x.r === r && x.c === c + 1);
        if (!a || bi < 0) return;
        const b = list[bi];
        if (!a.text.trim() || !b.text.trim()) return;
        a.text = a.text + '\n' + b.text;
        a.cs += b.cs;
        a.stack = true;
        a.rightBorder = (b.cell && b.cell.b) ? b.cell.b[1] : '0';
        list.splice(bi, 1);
    });
    PP1_WRAP_CELLS.forEach(pair => {
        if (pair[0] < from || pair[0] > to) return;
        const a = list.find(x => x.r === pair[0] && x.c === pair[1]);
        if (a) a.stack = true;
    });
    return { list, filled };
}
function pp1RenderPage(from, to, fill, hidden, geo, page) {
    const cols = geo.cols, rows = geo.rows;
    const k = geo.sy, rk = geo.pages[page].s;
    const { list, filled } = pp1PageCells(from, to, fill, hidden, rows);
    let html = '<table style="width:' + geo.width.toFixed(3) + 'mm;table-layout:fixed;border-collapse:collapse"><colgroup>' +
        cols.map(w => '<col style="width:' + (w * geo.sx).toFixed(4) + 'mm">').join('') + '</colgroup><tbody>';
    let currentRow = -1;
    list.forEach(it => {
        if (it.r !== currentRow) {
            if (currentRow !== -1) html += '</tr>';
            html += '<tr style="height:' + (rows[it.r - 1] * rk).toFixed(4) + 'mm">';
            currentRow = it.r;
        }
        const cell = it.cell;
        const b = (cell && cell.b) ? cell.b : '0000';
        const style = [];
        /* ฉบับจริงไม่มีเส้นใต้ ชุดที่/เลขที่ (แถว 2 และ 62 คอลัมน์ N-AG) เพราะแบบพิมพ์มีอยู่แล้ว */
        const noUnder = geo.real && (it.r === 2 || it.r === 62) && it.c >= 14 && it.c <= 33;
        style.push('border-top:' + PP1_BORDER[b[0]]);
        style.push('border-right:' + PP1_BORDER[it.rightBorder !== undefined ? it.rightBorder : b[1]]);
        style.push('border-bottom:' + PP1_BORDER[noUnder ? 0 : b[2]]);
        style.push('border-left:' + PP1_BORDER[b[3]]);
        const fs = ((cell && cell.fs) ? cell.fs : 11) * k;
        style.push('font-size:' + fs.toFixed(2) + 'pt');
        if (it.bold !== undefined ? it.bold : (cell && cell.fb)) style.push('font-weight:700');
        else if (it.bold === false) style.push('font-weight:400');
        style.push('text-align:' + (it.stack ? 'center' : ((cell && PP1_HALIGN[cell.h]) || 'left')));
        style.push('vertical-align:' + (it.stack ? 'middle' : ((cell && PP1_VALIGN[cell.v]) || 'bottom')));
        /* หัวตารางเหล่านี้ต้นฉบับหมุนข้อความ 90° อ่านจากล่างขึ้นบน */
        const body = it.text === '' ? '' : esc(applyNumerals(it.text));
        if (it.stack && body) {
            /* วางข้อความหมุนแบบลอย ไม่ให้ความยาวของข้อความดันแถวหัวตารางให้สูงขึ้น */
            style.push('overflow:hidden', 'padding:0', 'line-height:1', 'position:relative');
            html += '<td' + (it.cs > 1 ? ' colspan="' + it.cs + '"' : '') + (it.rs > 1 ? ' rowspan="' + it.rs + '"' : '') +
                ' style="' + style.join(';') + '"><div class="pp1-rot">' + body + '</div></td>';
            return;
        }
        /* ต้นฉบับเว้นวรรคสองครั้งระหว่างรหัสวิชากับชื่อวิชา จึงต้องคง whitespace ไว้ */
        const wrap = it.stack || (cell && cell.w);
        style.push(wrap ? 'white-space:pre-wrap' : 'white-space:pre');
        /* ล้นได้เมื่อช่องถัดไปทางขวายังว่าง — เหมือนที่ Excel ทำ */
        const nextCol = it.c + it.cs;
        const canSpill = !wrap && it.text.trim() && (nextCol > cols.length || !filled[it.r + ',' + nextCol]);
        style.push(canSpill ? 'overflow:visible' : 'overflow:hidden');
        style.push('padding:0 0.4mm');
        style.push('line-height:1.05');
        html += '<td' + (it.cs > 1 ? ' colspan="' + it.cs + '"' : '') + (it.rs > 1 ? ' rowspan="' + it.rs + '"' : '') +
            ' style="' + style.join(';') + '">' + (it.text === '' ? '' : esc(applyNumerals(it.text))) + '</td>';
    });
    if (currentRow !== -1) html += '</tr>';
    return html + '</tbody></table>';
}

/* Excel มีตัวเลือก "ย่อให้พอดีช่อง" ที่นี่ต้องทำเองหลังวางลง DOM เพราะความ
   กว้างจริงขึ้นกับฟอนต์ที่เครื่องนั้นมี ถ้าไม่มี TH SarabunPSK ตัวอักษรจะกว้าง
   กว่าต้นฉบับเล็กน้อยจนหัวตารางถูกตัดหาง */
window.pp1ShrinkToFit = function (root) {
    if (!root) return;
    root.querySelectorAll('.pp1-sheet .pp1-rot').forEach(rot => {
        const td = rot.parentElement;
        let size = parseFloat(getComputedStyle(rot).fontSize), guard = 0;
        while (guard++ < 20 && size > 4 && (rot.offsetHeight > td.clientHeight - 1 || rot.offsetWidth > td.clientWidth)) {
            size -= 0.3;
            rot.style.fontSize = size.toFixed(2) + 'px';
        }
    });
    root.querySelectorAll('.pp1-sheet td').forEach(td => {
        if (!td.textContent.trim()) return;
        const cs = getComputedStyle(td);
        if (cs.overflow !== 'hidden') return;
        /* ข้อความบรรทัดเดียวดูเฉพาะความกว้าง — ฟอนต์ตั้ง ascent ไว้สูงกว่าบรรทัด
           ความสูงของกล่องข้อความจึงเกินแถวเล็กน้อยเสมอ แม้ตัวอักษรจะอยู่ในช่องพอดี */
        const wraps = cs.whiteSpace === 'pre-wrap';
        let size = parseFloat(cs.fontSize);
        let guard = 0;
        while (guard++ < 14 && size > 5 &&
               (td.scrollWidth > td.clientWidth + 1 || (wraps && td.scrollHeight > td.clientHeight + 1))) {
            size -= 0.35;
            td.style.fontSize = size.toFixed(2) + 'px';
        }
    });
};

function pp1DocHtml(stu, mode) {
    const fill = pp1FillMap(stu);
    const hidden = pp1HiddenSet();
    const brk = PP1_TPL.pageBreak;
    const geo = pp1Geometry(mode);
    if (geo.real) {
        PP1_REAL_BLANK.forEach(a => { fill[addrKey(a)] = ''; });
        delete fill[addrKey('AC108')];   // เหลือหัวข้อ "หมายเหตุ" ของแบบพิมพ์ ไม่ต่อท้ายข้อความ
    }
    const left = geo.left + num(PP1.settings.pp1NudgeX);
    const nudgeY = num(PP1.settings.pp1NudgeY);
    /* lang="en" กันฟอนต์ไทยสลับเลขอารบิกเป็นเลขไทยผ่านฟีเจอร์ locl
       เมื่อเลือกโหมดเลขไทยเราแปลงตัวอักษรเองอยู่แล้ว */
    const ink = PP1.settings.inkDark !== false ? ' ink-dark' : '';
    const sheet = (inner, page) => '<div class="doc-sheet pp1-sheet' + ink + '" lang="en" style="padding:0">' +
        '<div style="position:absolute;left:' + left.toFixed(2) + 'mm;top:' + (geo.pages[page].top + nudgeY).toFixed(2) + 'mm">' + inner +
        pp1OverlayHtml(page, geo, stu) + '</div></div>';
    return sheet(pp1RenderPage(1, brk, fill, hidden, geo, 1), 1) +
           sheet(pp1RenderPage(brk + 1, geo.rows.length, fill, hidden, geo, 2), 2);
}
