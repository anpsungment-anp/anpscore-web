    <style>

        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* ตารางกรอกข้อมูลแบบสเปรดชีต */
        .grid-table { border-collapse: separate; border-spacing: 0; width: max-content; font-size: 13px; }

        @media print {

        }
        @page { size: A4 portrait; margin: 6mm; }
        body.print-legal-landscape { }
    </style>
</head>
<body>

<div id="app-container" class="w-full h-screen flex bg-[#f8fafc]">

<script>
/* =========================================================================
   ANPSCORE ปพ.1 — ระบบจัดทำเอกสารงานทะเบียน ระดับประถมศึกษา
   โครงสร้างเมนูแยกเป็นรายการตามแผ่นงาน (sheet) ของแฟ้ม PP2551P6 ต้นฉบับ
   ========================================================================= */

const $ = (id) => document.getElementById(id);

const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const PREFIXES = ['เด็กชาย','เด็กหญิง','นาย','นางสาว','นาง','สามเณร','พระ'];
const LEVEL_NAMES = { 1:'ประถมศึกษาปีที่ 1', 2:'ประถมศึกษาปีที่ 2', 3:'ประถมศึกษาปีที่ 3', 4:'ประถมศึกษาปีที่ 4', 5:'ประถมศึกษาปีที่ 5', 6:'ประถมศึกษาปีที่ 6' };
const SUBJECT_TYPES = ['พื้นฐาน','เพิ่มเติม','มาตรฐานสากล','กิจกรรม'];
const LEARNING_AREAS = ['ภาษาไทย','คณิตศาสตร์','วิทยาศาสตร์','สังคมศึกษา ศาสนาและวัฒนธรรม','สุขศึกษาและพละศึกษา','ศิลปะ','การงานอาชีพและเทคโนโลยี','ภาษาต่างประเทศ','กิจกรรม'];
const GRADE_OPTIONS = ['', '4', '3.5', '3', '2.5', '2', '1.5', '1', '0', 'ร', 'มส', 'มผ'];
const PASS_OPTIONS = ['', 'ผ', 'มผ'];
const QUALITY_OPTIONS = ['', 'ดีเยี่ยม', 'ดี', 'ผ่าน', 'ไม่ผ่าน'];
const MAX_SUBJECT_SLOTS = 18;   // ตรงกับคอลัมน์ H..Y ของชีตเกรด
const MAX_ACTIVITY_SLOTS = 5;   // ตรงกับคอลัมน์ Z..AD ของชีตเกรด

/* กลุ่มสาระของ ปพ.1 (สรุป ป.4-6) จำแนกตามอักษรนำหน้ารหัสวิชา
   ตามที่แฟ้มต้นฉบับใช้ เช่น จ (ภาษาจีน) นับรวมอยู่ในกลุ่มภาษาต่างประเทศ */
const PP1_AREAS = [
    { key:'ท', label:'ภาษาไทย', codes:['ท'] },
    { key:'ค', label:'คณิตศาสตร์', codes:['ค'] },
    { key:'ว', label:'วิทยาศาสตร์และเทคโนโลยี', codes:['ว'] },
    { key:'ส', label:'สังคมศึกษา ศาสนาและวัฒนธรรม', codes:['ส'] },
    { key:'พ', label:'สุขศึกษาและพลศึกษา', codes:['พ'] },
    { key:'ศ', label:'ศิลปะ', codes:['ศ'] },
    { key:'ง', label:'การงานอาชีพ', codes:['ง'] },
    { key:'อ', label:'ภาษาต่างประเทศ', codes:['อ','จ','ญ','ฝ','ย','ร','ต'] }
];

const ONET_FIELDS = [
    { key:'thai', label:'ภาษาไทย' },
    { key:'math', label:'คณิตศาสตร์' },
    { key:'sci', label:'วิทยาศาสตร์' },
    { key:'soc', label:'สังคมศึกษาฯ' },
    { key:'health', label:'สุขศึกษาฯ' },
    { key:'art', label:'ศิลปะ' },
    { key:'work', label:'การงานอาชีพฯ' },
    { key:'eng', label:'ภาษาอังกฤษ' }
];

/* ---------------------- โครงสร้างข้อมูลเริ่มต้น ---------------------- */
function blankCurriculumYear() {
    return { subjects: [], activities: [] };
}
function defaultDB() {
    const curriculum = {};
    for (let i = 1; i <= 6; i++) curriculum[i] = blankCurriculumYear();
    const grades = {};
    for (let i = 1; i <= 6; i++) grades[i] = { year: '', records: {} };
    return {
        school: {
            name: '', affiliation: '', area: '', tambon: '', amphoe: '', province: '',
            registrar: '', registrarPosition: 'นายทะเบียน', director: '', directorPosition: 'ผู้อำนวยการโรงเรียน'
        },
        settings: {
            startYear: '',            // ปีการศึกษาที่เข้าเรียนชั้นปีที่ 1
            onetPercent: 3,           // ร้อยละ O-NET ที่ใช้ถ่วงน้ำหนัก
            onetGroups: 4,            // จำนวนกลุ่มสาระที่สอบ O-NET
            showOnet: false,          // แสดง/ไม่แสดง O-NET ใน ปพ.1
            showGpa: true,            // แสดงเกรดเฉลี่ยใน ปพ.1
            pp1Layout: 'byYear',      // byYear = แบ่งคอลัมน์ตามปี, sequential = เรียงกันทุกปี
            pp3Style: 'copy',         // copy = ฉบับสำเนามีหัว, real = ฉบับจริงไม่มีหัว
            pp3Term: '2', pp3Year: '', pp3Page: 1,
            certValidity: 'ใบรับรองนี้มีอายุ 120 วัน นับแต่วันที่ออกให้',
            gradYear: '', gradTerm: '2',
            baseHours: '5,040', extraHours: '240'
        },
        curriculum,
        students: [],
        grades,
        certData: {},
        onetRaw: { header: {}, rows: [] },
        meta: { updatedAt: '' }
    };
}

let PP1 = defaultDB();
let state = { page: 'guide', gradeYear: 1, previewStudent: '', chartRefs: [] };

/* ---------------------- โหลด/บันทึกข้อมูล ---------------------- */
const STORAGE_KEY = 'anppp1_db';

function loadDB() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            PP1 = mergeDefaults(defaultDB(), parsed);
        }
    } catch (e) { console.warn('โหลดข้อมูลไม่สำเร็จ', e); }
    window.PP1 = PP1;
}
function mergeDefaults(base, override) {
    if (override === null || override === undefined) return base;
    if (Array.isArray(override)) return override;
    if (typeof override !== 'object') return override;
    const out = Array.isArray(base) ? [] : Object.assign({}, base);
    Object.keys(override).forEach(k => {
        out[k] = (base && typeof base === 'object' && !Array.isArray(base) && base[k] !== undefined)
            ? mergeDefaults(base[k], override[k]) : override[k];
    });
    return out;
}
let saveTimer = null;
function saveDB(silent) {
    PP1.meta.updatedAt = new Date().toISOString();
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(PP1));
        if (!silent) setSaveStatus('บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH'));
    } catch (e) {
        setSaveStatus('บันทึกไม่สำเร็จ: พื้นที่เต็ม');
        notify('บันทึกไม่สำเร็จ — พื้นที่จัดเก็บของเบราว์เซอร์เต็ม', 'error');
    }
}
function saveDebounced() {
    setSaveStatus('กำลังบันทึก…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveDB(), 500);
}
function setSaveStatus(txt) { const el = $('save-status'); if (el) el.innerText = txt; }

/* ---------------------- ยูทิลิตี้ ---------------------- */
function esc(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function roundDown2(v) { return Math.floor((num(v) + 1e-9) * 100) / 100; }
function fmt2(v) { return (Math.round(num(v) * 100) / 100).toFixed(2); }
function notify(msg, type) {
    const t = $('toast'), i = $('toast-icon');
    $('toast-msg').innerText = msg;
    t.className = 'fixed bottom-6 right-6 z-[210] text-white px-6 py-4 rounded-2xl shadow-xl transition-all duration-300 flex items-center gap-3 font-medium ' +
        (type === 'error' ? 'bg-rose-600' : type === 'warn' ? 'bg-amber-500' : 'bg-emerald-600');
    i.className = 'ph text-2xl ' + (type === 'error' ? 'ph-warning-circle' : type === 'warn' ? 'ph-warning' : 'ph-check-circle');
    requestAnimationFrame(() => { t.style.transform = 'translateY(0)'; t.style.opacity = '1'; });
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => { t.style.transform = 'translateY(6rem)'; t.style.opacity = '0'; }, 2600);
}
window.notify = notify;
function openModal(html) { $('modal-content').innerHTML = html; $('modal-container').classList.remove('hidden'); }
function closeModal() { $('modal-container').classList.add('hidden'); }
window.closeModal = closeModal;
$('modal-container').addEventListener('click', (e) => { if (e.target.id === 'modal-container') closeModal(); });

window.toggleThemeMode = function () {
    const dark = document.documentElement.classList.toggle('dark-mode');
    try { localStorage.setItem('anpscore_theme', dark ? 'dark' : 'light'); } catch (e) {}
    $('theme-icon').className = 'ph text-base ' + (dark ? 'ph-sun' : 'ph-moon');
};

function studentFullName(s) {
    if (!s) return '';
    return ((s.prefix || '') + (s.first || '') + '  ' + (s.last || '')).trim();
}
function studentDisplayName(s) { return ((s.prefix || '') + (s.first || '') + ' ' + (s.last || '')).trim(); }

/* ปีการศึกษาของชั้นปีที่ n = ปีที่เข้าเรียน + (n-1) */
function yearOfLevel(level) {
    const explicit = PP1.grades[level] && PP1.grades[level].year;
    if (explicit) return String(explicit);
    const start = parseInt(PP1.settings.startYear, 10);
    if (!start) return '';
    return String(start + (parseInt(level, 10) - 1));
}
function setYearOfLevel(level, y) { PP1.grades[level].year = y; }

function getStudent(sid) { return PP1.students.find(s => String(s.studentId) === String(sid)); }
function sortedStudents() {
    return PP1.students.slice().sort((a, b) => {
        const r = num(a.room) - num(b.room);
        if (r !== 0) return r;
        return num(a.no) - num(b.no);
    });
}
function gradeRecord(level, sid) {
    const g = PP1.grades[level];
    if (!g.records[sid]) g.records[sid] = { subjects: {}, activities: {}, character: '', reading: '', activitySummary: '', clubName: '' };
    return g.records[sid];
}

/* คำนวณเกรดเฉลี่ยของชั้นปี (ถ่วงน้ำหนักด้วยหน่วยน้ำหนัก) */
function gpaOfLevel(level, sid) {
    const cur = PP1.curriculum[level];
    const rec = PP1.grades[level].records[sid];
    if (!rec) return { credits: 0, gpa: 0, earned: 0 };
    let sumW = 0, sumWG = 0;
    (cur.subjects || []).forEach(sub => {
        if (!sub.code && !sub.name) return;
        const g = rec.subjects[sub.code || sub.name];
        const w = num(sub.credit);
        if (g === undefined || g === '' || isNaN(parseFloat(g))) return;
        sumW += w; sumWG += w * parseFloat(g);
    });
    return { credits: sumW, gpa: sumW ? sumWG / sumW : 0, earned: sumW };
}
/* สรุปกลุ่มสาระ ป.4-6 ตามหน้าหลัง ปพ.1 */
function summaryP46(sid) {
    const rows = PP1_AREAS.map(a => ({ key: a.key, label: a.label, credit: 0, wsum: 0 }));
    let totCredit = 0, totW = 0, earned = 0;
    [4, 5, 6].forEach(level => {
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid];
        if (!rec) return;
        (cur.subjects || []).forEach(sub => {
            const code = (sub.code || '').trim();
            if (!code && !sub.name) return;
            const g = rec.subjects[code || sub.name];
            if (g === undefined || g === '' || isNaN(parseFloat(g))) return;
            const w = num(sub.credit);
            if (!w) return;
            const first = code.charAt(0);
            let row = rows.find(r => PP1_AREAS.find(a => a.key === r.key).codes.indexOf(first) >= 0);
            if (!row) row = rows[rows.length - 1];
            row.credit += w; row.wsum += w * parseFloat(g);
            totCredit += w; totW += w * parseFloat(g);
            if (parseFloat(g) > 0) earned += w;
        });
    });
    rows.forEach(r => { r.grade = r.credit ? roundDown2(r.wsum / r.credit) : ''; });
    return { rows, totalCredit: totCredit, earnedCredit: earned, totalGpa: totCredit ? roundDown2(totW / totCredit) : 0 };
}
/* หน่วยน้ำหนักรวม/ที่ได้ ตลอด 6 ปี */
function creditSummaryAll(sid) {
    let registered = 0, earned = 0, sumW = 0, sumWG = 0;
    for (let level = 1; level <= 6; level++) {
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid];
        (cur.subjects || []).forEach(sub => {
            if (!sub.code && !sub.name) return;
            const w = num(sub.credit);
            if (!w) return;
            registered += w;
            const g = rec ? rec.subjects[(sub.code || sub.name)] : '';
            if (g !== undefined && g !== '' && !isNaN(parseFloat(g)) && parseFloat(g) > 0) earned += w;
            if (g !== undefined && g !== '' && !isNaN(parseFloat(g))) { sumW += w; sumWG += w * parseFloat(g); }
        });
    }
    return { registered, earned, gpa: sumW ? roundDown2(sumWG / sumW) : 0 };
}

function buildSidebar() {
    const nav = $('nav-menu');
    nav.innerHTML = '';
    MENU.forEach(item => {
        if (item.group) {
            const h = document.createElement('div');
            h.className = 'px-3 pt-4 pb-1 text-[10px] uppercase tracking-wider text-slate-400 font-extrabold';
            h.innerText = item.group;
            nav.appendChild(h);
            return;
        }
        const btn = document.createElement('button');
        btn.id = 'nav-btn-' + item.id;
        btn.className = navClass(false);
        btn.innerHTML = '<i class="ph ' + item.icon + ' text-lg mr-2.5 shrink-0"></i><span class="truncate">' + esc(item.label) + '</span>';
        btn.onclick = () => navigate(item.id);
        nav.appendChild(btn);
    });
}
function navClass(active) {
    return active
        ? 'w-full flex items-center px-3 py-2.5 rounded-xl text-left text-sm font-bold text-white bg-primary-gradient shadow-md shadow-indigo-200'
        : 'w-full flex items-center px-3 py-2.5 rounded-xl text-left text-sm font-semibold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-colors';
}

function navigate(pageId) {
    const item = MENU.find(m => m.id === pageId);
    if (!item) return;
    state.page = pageId;
    if (item.level) state.gradeYear = item.level;
    destroyCharts();
    MENU.forEach(m => { if (m.id) { const b = $('nav-btn-' + m.id); if (b) b.className = navClass(m.id === pageId); } });
    $('page-title').innerText = item.label;
    $('page-sub').innerText = 'แผ่นงาน: ' + item.sheet;
    $('header-actions').innerHTML = '';
    const area = $('content-area');
    area.innerHTML = '<div id="page-root" class="animate-fade-in-up"></div>';
    const root = $('page-root');
    const fn = PAGES[pageId];
    if (fn) fn(root, item);
    area.scrollTop = 0;
}
window.navigate = navigate;

function destroyCharts() {
    (state.chartRefs || []).forEach(c => { try { c.destroy(); } catch (e) {} });
    state.chartRefs = [];
}

function badge(text, tone) {
    const tones = { indigo: 'bg-indigo-50 text-indigo-600 border-indigo-100', emerald: 'bg-emerald-50 text-emerald-600 border-emerald-100', amber: 'bg-amber-50 text-amber-600 border-amber-100', slate: 'bg-slate-100 text-slate-600 border-slate-200' };
    return '<span class="px-3 py-1.5 rounded-full border ' + (tones[tone] || tones.slate) + '">' + esc(text) + '</span>';
}
function cellInput(kind, level, i, key, value, cls, type) {
    return '<td><input type="' + (type || 'text') + '" value="' + esc(value === undefined ? '' : value) + '" class="' + (cls || '') +
        '" onchange="window.setCurriculumCell(\'' + kind + '\',' + i + ',\'' + key + '\',this.value)"></td>';
}
function cellSelect(kind, level, i, key, value, options) {
    let h = '<td><select onchange="window.setCurriculumCell(\'' + kind + '\',' + i + ',\'' + key + '\',this.value)">';
    options.forEach(o => { h += '<option value="' + esc(o) + '"' + (String(o) === String(value || '') ? ' selected' : '') + '>' + esc(o || '—') + '</option>'; });
    return h + '</select></td>';
}
function curriculumTotals(level) {
    const cur = PP1.curriculum[level];
    let baseHours = 0, baseCredit = 0, extraHours = 0, extraCredit = 0, actHours = 0;
    (cur.subjects || []).forEach(s => {
        if (s.type === 'เพิ่มเติม') { extraHours += num(s.hours); extraCredit += num(s.credit); }
        else { baseHours += num(s.hours); baseCredit += num(s.credit); }
    });
    (cur.activities || []).forEach(a => { actHours += num(a.hours); });
    return { baseHours, baseCredit, extraHours, extraCredit, actHours };
}
window.setCurriculumCell = function (kind, i, key, val) {
    const cur = PP1.curriculum[state.gradeYear];
    const arr = kind === 'sub' ? cur.subjects : cur.activities;
    if (!arr[i]) return;
    arr[i][key] = (key === 'hours' || key === 'credit') ? val : val.trim();
    saveDebounced();
    if (key === 'type' || key === 'hours' || key === 'credit') renderCurriculumBody();
};
window.addSubjectRow = function () {
    const cur = PP1.curriculum[state.gradeYear];
    if (cur.subjects.length >= MAX_SUBJECT_SLOTS) { notify('รายวิชาสูงสุด ' + MAX_SUBJECT_SLOTS + ' วิชาต่อชั้นปี', 'warn'); return; }
    cur.subjects.push({ code: '', name: '', type: 'พื้นฐาน', area: '', hours: '', credit: '' });
    saveDB(true); renderCurriculumBody();
};
window.addActivityRow = function () {
    const cur = PP1.curriculum[state.gradeYear];
    if (cur.activities.length >= MAX_ACTIVITY_SLOTS) { notify('กิจกรรมสูงสุด ' + MAX_ACTIVITY_SLOTS + ' รายการต่อชั้นปี', 'warn'); return; }
    cur.activities.push({ code: 'ก' + (cur.activities.length + 1), name: '', hours: '' });
    saveDB(true); renderCurriculumBody();
};
window.removeCurriculumRow = function (kind, i) {
    const cur = PP1.curriculum[state.gradeYear];
    (kind === 'sub' ? cur.subjects : cur.activities).splice(i, 1);
    saveDB(true); renderCurriculumBody();
};
window.copyPrevCurriculum = function () {
    const level = state.gradeYear;
    if (level <= 1) { notify('ป.1 ไม่มีชั้นก่อนหน้า', 'warn'); return; }
    const prev = PP1.curriculum[level - 1];
    PP1.curriculum[level] = JSON.parse(JSON.stringify(prev));
    // ปรับเลขชั้นในรหัสวิชา เช่น ท11101 -> ท12101
    PP1.curriculum[level].subjects.forEach(s => {
        if (s.code && s.code.length >= 3) {
            const digits = s.code.slice(1);
            if (/^\d/.test(digits)) {
                const arr = digits.split('');
                if (arr[1] === String(level - 1)) { arr[1] = String(level); s.code = s.code.charAt(0) + arr.join(''); }
            }
        }
    });
    saveDB(); renderCurriculumBody();
    notify('คัดลอกหลักสูตรจาก ป.' + (level - 1) + ' แล้ว');
};

};
window.setStudentId = function (i, val) {
    const s = PP1.students[i]; if (!s) return;
    const oldId = String(s.studentId || ''), newId = String(val).trim();
    if (!newId) { notify('เลขประจำตัวนักเรียนห้ามว่าง', 'error'); renderStudentGrid(); return; }
    if (PP1.students.some((o, j) => j !== i && String(o.studentId) === newId)) { notify('เลขประจำตัว ' + newId + ' ซ้ำกับนักเรียนคนอื่น', 'error'); renderStudentGrid(); return; }
    s.studentId = newId;
    // ย้ายผลการเรียน/ข้อมูลใบรับรองตามเลขประจำตัวใหม่
    for (let l = 1; l <= 6; l++) {
        const recs = PP1.grades[l].records;
        if (recs[oldId]) { recs[newId] = recs[oldId]; delete recs[oldId]; }
    }
    if (PP1.certData[oldId]) { PP1.certData[newId] = PP1.certData[oldId]; delete PP1.certData[oldId]; }
    saveDB();
};
window.addStudent = function () {
    const rooms = PP1.students.map(s => num(s.room));
    const room = state.studentRoom || (rooms.length ? Math.max.apply(null, rooms) : 1);
    const inRoom = PP1.students.filter(s => String(s.room) === String(room));
    let maxId = 0;
    PP1.students.forEach(s => { const n = parseInt(s.studentId, 10); if (!isNaN(n) && n > maxId) maxId = n; });
    PP1.students.push({
        room: String(room), no: String(inRoom.length + 1), studentId: String(maxId + 1),
        prefix: 'เด็กชาย', first: '', last: '', citizenId: '', nationality: 'ไทย', religion: 'พุทธ', sex: 'ชาย'
    });
    saveDB(); renderStudentGrid();
};
window.removeStudent = function (i) {
    const s = PP1.students[i]; if (!s) return;
    if (!confirm('ลบ ' + studentDisplayName(s) + ' ออกจากทะเบียน?\nผลการเรียนทุกชั้นปีของนักเรียนคนนี้จะถูกลบด้วย')) return;
    const sid = String(s.studentId);
    PP1.students.splice(i, 1);
    for (let l = 1; l <= 6; l++) delete PP1.grades[l].records[sid];
    delete PP1.certData[sid];
    saveDB(); renderStudentGrid();
    notify('ลบนักเรียนแล้ว', 'warn');
};
window.renumberStudents = function () {

        s.no = String(byRoom[r]);

function colToIndex(letter) {
    const s = String(letter || '').trim().toUpperCase();
    if (!s) return -1;
    let n = 0;
    for (let i = 0; i < s.length; i++) {
        const c = s.charCodeAt(i) - 64;
        if (c < 1 || c > 26) return -1;
        n = n * 26 + c;
    }
    return n - 1;
}
window.parseOnetPaste = function () {
    const text = $('onet-paste').value;
    if (!text.trim()) { notify('ยังไม่ได้วางข้อมูล', 'warn'); return; }
    const startRow = Math.max(1, num($('onet-row-start').value) || 1);
    const rows = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '').slice(startRow - 1)
        .map(line => line.split('\t'));
    PP1.onetRaw = { header: {}, rows };
    saveDB();
    renderOnetPreview();
    notify('อ่านข้อมูลได้ ' + rows.length + ' แถว');
};
function renderOnetPreview() {
    const rows = (PP1.onetRaw && PP1.onetRaw.rows) || [];
    const cont = $('onet-preview');
    if (!cont) return;
    if (!rows.length) { cont.innerHTML = card('ข้อมูลที่อ่านได้', 'ph-table', emptyState('ยังไม่มีข้อมูลโอเน็ต', 'วางข้อมูลจากแฟ้ม สทศ. แล้วกด “อ่านข้อมูลที่วาง”')); return; }
    const maxCols = rows.reduce((m, r) => Math.max(m, r.length), 0);
    let head = '<th class="sticky-col">แถว</th>';
    for (let i = 0; i < maxCols; i++) head += '<th>' + indexToCol(i) + '</th>';
    const body = rows.slice(0, 120).map((r, i) => '<tr><td class="sticky-col text-center text-xs text-slate-400 px-2">' + (i + 1) + '</td>' +
        Array.from({ length: maxCols }, (_, c) => '<td class="px-2 py-1 text-xs whitespace-nowrap">' + esc(r[c] || '') + '</td>').join('') + '</tr>').join('');
    cont.innerHTML = card('ข้อมูลที่อ่านได้ (' + rows.length + ' แถว)', 'ph-table',
        '<div class="grid-wrap"><table class="grid-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        (rows.length > 120 ? '<div class="text-xs text-slate-400 mt-2">แสดงตัวอย่าง 120 แถวแรก</div>' : ''));
}
function indexToCol(i) {
    let s = '';
    i = i + 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
}
window.applyOnet = function () {
    const rows = (PP1.onetRaw && PP1.onetRaw.rows) || [];
    if (!rows.length) { notify('ยังไม่มีข้อมูลให้โอน', 'warn'); return; }
    const cidCol = colToIndex($('onet-col-cid').value);
    const avgCol = colToIndex($('onet-col-avg').value);
    const map = {};
    ONET_FIELDS.forEach(f => { map[f.key] = colToIndex($('onet-col-' + f.key).value); state.onetMap[f.key] = $('onet-col-' + f.key).value; });
    let matched = 0, unmatched = 0;
    rows.forEach(r => {
        const cid = String((r[cidCol] || '')).replace(/\D/g, '');
        if (!cid) return;
        const stu = PP1.students.find(s => String(s.citizenId || '').replace(/\D/g, '') === cid);
        if (!stu) { unmatched++; return; }
        ONET_FIELDS.forEach(f => {
            const idx = map[f.key];
            if (idx >= 0 && r[idx] !== undefined && String(r[idx]).trim() !== '') stu['onet_' + f.key] = String(r[idx]).trim();
        });
        if (avgCol >= 0 && r[avgCol] !== undefined && String(r[avgCol]).trim() !== '') stu.onetAvg = String(r[avgCol]).trim();
        matched++;
    });
    saveDB();
    notify('โอนข้อมูลสำเร็จ ' + matched + ' คน' + (unmatched ? ' • ไม่พบนักเรียน ' + unmatched + ' รายการ' : ''), unmatched ? 'warn' : 'success');
};

/* ---------- สะพานเชื่อมข้อมูลกับระบบ ANPSCORE ---------- */
function readAnpscore() {
    let db = null, sdata = null;
    try { db = JSON.parse(localStorage.getItem('anpscore_db') || 'null'); } catch (e) {}
    try { sdata = JSON.parse(localStorage.getItem('anpscore_subjectData') || 'null'); } catch (e) {}
    if (!db) return null;
    return { db, sdata: sdata || {} };
}
function anpNormalize(value, preferredKey) {
    if (value === null || value === undefined || value === '') return 0;
    if (typeof value === 'number') return isFinite(value) ? value : 0;
    if (typeof value === 'string') { const n = Number(value.trim()); return isFinite(n) ? n : 0; }
    if (typeof value === 'object') {
        const keys = [preferredKey, 'value', 'score', 'total', 'k', 'p', 'a'].filter(Boolean);
        for (const k of keys) if (value[k] !== undefined) return anpNormalize(value[k]);
    }
    return 0;
}
function anpTotalScore(sd, cId, studentId, term) {
    if (!sd || !sd.scores || !sd.scores[cId] || !sd.scores[cId][studentId]) return null;
    const stuNode = sd.scores[cId][studentId];
    let sc = stuNode[term];
    if (stuNode.term !== undefined) { if (String(stuNode.term) === String(term)) sc = stuNode; else return null; }
    if (!sc) return null;
    let total = 0, any = false;
    const units = (sd.classData && sd.classData[cId]) ? sd.classData[cId].learningUnits : sd.learningUnits;
    (units || []).forEach(u => {
        if (String(u.term) !== String(term) || !u.indicators) return;
        u.indicators.forEach(ind => {
            const val = sc.indicators ? sc.indicators[ind.id] : null;
            if (val) { any = true; total += anpNormalize(val.k, 'k') + anpNormalize(val.p, 'p') + anpNormalize(val.a, 'a'); }
        });
    });
    if (sc.midTermScore !== undefined && sc.midTermScore !== '') any = true;
    if (sc.finalScore !== undefined && sc.finalScore !== '') any = true;
    total += anpNormalize(sc.midTermScore, 'midTermScore') + anpNormalize(sc.finalScore, 'finalScore');
    return any ? total : null;
}
function anpGrade(score, settings) {
    const s = parseFloat(score);
    const keys = ['4.0', '3.5', '3.0', '2.5', '2.0', '1.5', '1.0'];
    for (const g of keys) if (s >= num(settings[g])) return String(parseFloat(g));
    return '0';
}

window.doAnpscoreImport = function () {
    const src = readAnpscore();
    if (!src) return;
    const level = parseInt($('anp-level').value, 10);
    const termMode = $('anp-term').value;
    const addStudents = $('anp-add-students').checked;
    const overwrite = $('anp-overwrite').checked;
    const clsIds = Array.from(document.querySelectorAll('.anp-cls:checked')).map(el => el.value);
    const settings = src.db.gradeSettings || { '4.0': 80, '3.5': 75, '3.0': 70, '2.5': 65, '2.0': 60, '1.5': 55, '1.0': 50 };
    const curSubjects = (PP1.curriculum[level].subjects || []).filter(s => s.code || s.name);

    let added = 0, filled = 0, skippedSubj = new Set();
    clsIds.forEach(cId => {
        const cls = (src.db.classes || {})[cId];
        if (!cls) return;
        (cls.students || []).forEach(stu => {
            const sid = String(stu.studentId || '').trim();
            if (!sid) return;
            let target = getStudent(sid);
            if (!target) {
                if (!addStudents) return;
                const parts = String(stu.name || '').trim();
                const pfx = PREFIXES.find(p => parts.indexOf(p) === 0) || '';
                const rest = parts.slice(pfx.length).trim().split(/\s+/);
                target = {
                    room: (cls.name || '').split('/')[1] || '1', no: '', studentId: sid,
                    prefix: pfx, first: rest[0] || '', last: rest.slice(1).join(' ') || '',
                    citizenId: '', nationality: 'ไทย', religion: 'พุทธ', sex: pfx.indexOf('หญิง') >= 0 ? 'หญิง' : 'ชาย'
                };
                PP1.students.push(target); added++;
            }
            const rec = gradeRecord(level, sid);
            (src.db.subjects || []).forEach(sub => {
                const sd = src.sdata[sub.id];
                if (!sd) return;
                const match = curSubjects.find(cs =>
                    (sub.code && cs.code && String(sub.code).trim() === String(cs.code).trim()) ||
                    (sub.name && cs.name && String(sub.name).trim() === String(cs.name).trim()));
                if (!match) { if (sub.name) skippedSubj.add(sub.name); return; }
                let score = null;
                if (termMode === 'avg') {
                    const t1 = anpTotalScore(sd, cId, sid, '1'), t2 = anpTotalScore(sd, cId, sid, '2');
                    if (t1 === null && t2 === null) return;
                    score = (t1 === null || t2 === null) ? (t1 === null ? t2 : t1) : (t1 + t2) / 2;
                } else {
                    score = anpTotalScore(sd, cId, sid, termMode);
                    if (score === null) return;
                }
                const key = match.code || match.name;
                if (!overwrite && rec.subjects[key] !== undefined && rec.subjects[key] !== '') return;
                rec.subjects[key] = anpGrade(score, settings);
                filled++;
            });
        });
    });
    saveDB(); closeModal();
    if (state.page === 'grade' + level) renderGradeGrid(level); else navigate('grade' + level);

        (skippedSubj.size ? ' • ไม่พบวิชาที่ตรงกัน ' + skippedSubj.size + ' วิชา' : ''), skippedSubj.size ? 'warn' : 'success');

const GRADE_BUCKETS = ['0', '1', '1.5', '2', '2.5', '3', '3.5', '4', 'ร', 'มส'];

function achievementRows(level, mode) {
    const cur = PP1.curriculum[level];
    const subjects = (cur.subjects || []).filter(s => s.code || s.name);
    const recs = PP1.grades[level].records;
    const students = PP1.students;
    const groups = [];
    if (mode === 'area') {
        PP1_AREAS.forEach(a => groups.push({ key: a.key, label: a.label, subjects: subjects.filter(s => a.codes.indexOf((s.code || '').charAt(0)) >= 0) }));
        const others = subjects.filter(s => !PP1_AREAS.some(a => a.codes.indexOf((s.code || '').charAt(0)) >= 0));
        if (others.length) groups.push({ key: 'other', label: 'อื่น ๆ', subjects: others });
    } else {
        subjects.forEach(s => groups.push({ key: s.code || s.name, label: (s.code ? s.code + '  ' : '') + s.name, subjects: [s] }));
    }
    return groups.filter(g => g.subjects.length).map(g => {
        const counts = {}; GRADE_BUCKETS.forEach(b => counts[b] = 0);
        let registered = 0, graded = 0, sum = 0, sumSq = 0, pass = 0, good = 0, fail = 0;
        students.forEach(stu => {
            const rec = recs[String(stu.studentId)];
            g.subjects.forEach(sub => {
                registered++;
                const v = rec ? rec.subjects[sub.code || sub.name] : '';
                if (v === undefined || v === '') return;
                graded++;
                if (counts[v] !== undefined) counts[v]++;
                const n = parseFloat(v);
                if (!isNaN(n)) {
                    sum += n; sumSq += n * n;
                    if (n >= 1) pass++; else fail++;
                    if (n >= 3) good++;
                } else fail++;
            });
        });
        const mean = graded ? sum / graded : 0;
        const variance = graded ? Math.max(0, sumSq / graded - mean * mean) : 0;
        return {
            label: g.label, counts, registered, graded, mean, sd: Math.sqrt(variance),
            pass, good, fail,
            passPct: graded ? pass * 100 / graded : 0, goodPct: graded ? good * 100 / graded : 0
        };
    });
}

function pp1YearBlocks(sid) {
    const blocks = [];
    for (let level = 1; level <= 6; level++) {
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid] || { subjects: {}, activities: {} };
        /* แสดงเฉพาะรายวิชาที่มีรหัสวิชา หรือมีผลการเรียนบันทึกไว้ (ตรงกับแบบพิมพ์ต้นฉบับ) */
        const subs = (cur.subjects || []).filter(s => {
            if (!s.code && !s.name) return false;
            if (s.code) return true;
            const g = rec.subjects[s.name];
            return g !== undefined && g !== '';
        });
        if (!subs.length) continue;
        blocks.push({
            level,
            title: 'ปีการศึกษา ' + (yearOfLevel(level) || '….') + ' ' + LEVEL_NAMES[level],
            base: subs.filter(s => s.type !== 'เพิ่มเติม').map(s => ({ label: (s.code ? s.code + '  ' : '') + s.name, hours: s.hours, grade: rec.subjects[s.code || s.name] || '' })),
            extra: subs.filter(s => s.type === 'เพิ่มเติม').map(s => ({ label: (s.code ? s.code + '  ' : '') + s.name, hours: s.hours, grade: rec.subjects[s.code || s.name] || '' })),
            acts: (cur.activities || []).filter(a => a.code || a.name).map(a => ({ label: a.name, hours: a.hours, grade: rec.activities[a.code || a.name] || '' }))
        });
    }
    return blocks;
}
function pp1SubjectColumns(blocks, layout) {
    const lines = [];
    blocks.forEach(b => {
        lines.push({ t: 'year', text: b.title });
        if (b.base.length) lines.push({ t: 'group', text: 'รายวิชาพื้นฐาน' });
        b.base.forEach(r => lines.push({ t: 'row', r }));
        if (b.extra.length) lines.push({ t: 'group', text: 'รายวิชาเพิ่มเติม' });
        b.extra.forEach(r => lines.push({ t: 'row', r }));
    });
    if (layout === 'byYear') {
        const cols = [[], [], []];
        blocks.forEach(b => {
            const ci = Math.min(2, Math.floor((b.level - 1) / 2));
            cols[ci].push({ t: 'year', text: b.title });
            if (b.base.length) cols[ci].push({ t: 'group', text: 'รายวิชาพื้นฐาน' });
            b.base.forEach(r => cols[ci].push({ t: 'row', r }));
            if (b.extra.length) cols[ci].push({ t: 'group', text: 'รายวิชาเพิ่มเติม' });
            b.extra.forEach(r => cols[ci].push({ t: 'row', r }));
        });
        return cols;
    }
    const per = Math.ceil(lines.length / 3);
    return [lines.slice(0, per), lines.slice(per, per * 2), lines.slice(per * 2)];
}
function pp1ActivityColumns(blocks) {
    const cols = [[], [], []];
    blocks.forEach(b => {
        const ci = Math.min(2, Math.floor((b.level - 1) / 2));
        cols[ci].push({ t: 'year', text: 'ปีการศึกษา ' + (yearOfLevel(b.level) || '….') });
        b.acts.forEach(r => cols[ci].push({ t: 'row', r }));
    });
    return cols;
}
function pp1ColumnTable(lines, minRows, real) {
    const border = real ? 'none' : '0.7pt solid #111827';
    let html = '<table style="width:100%;border-collapse:collapse;font-size:7.6pt;table-layout:fixed">';
    const emit = (l) => {
        if (l.t === 'year') return '<tr><td colspan="3" style="border:' + border + ';font-weight:700;padding:0 2px">' + esc(l.text) + '</td></tr>';
        if (l.t === 'group') return '<tr><td colspan="3" style="border:' + border + ';padding:0 2px">' + esc(l.text) + '</td></tr>';
        return '<tr><td style="border:' + border + ';padding:0 2px;overflow:hidden;white-space:nowrap">' + esc(l.r.label) + '</td>' +
            '<td style="border:' + border + ';width:11mm;text-align:center">' + esc(l.r.hours || '') + '</td>' +
            '<td style="border:' + border + ';width:11mm;text-align:center;font-weight:700">' + esc(l.r.grade || '') + '</td></tr>';
    };
    lines.forEach(l => { html += emit(l); });
    for (let i = lines.length; i < minRows; i++) {
        html += '<tr><td style="border:' + border + ';padding:0 2px">&nbsp;</td><td style="border:' + border + '"></td><td style="border:' + border + '"></td></tr>';
    }
    return html + '</table>';
}

function areaSummaryByYear(sid) {
    const areas = PP1_AREAS.map(a => ({ key: a.key, label: a.label, years: {}, totalHours: 0, wsum: 0, credit: 0 }));
    for (let level = 1; level <= 6; level++) {
        const cur = PP1.curriculum[level];
        const rec = PP1.grades[level].records[sid];
        areas.forEach(a => { a.years[level] = { hours: 0, wsum: 0, credit: 0 }; });
        (cur.subjects || []).filter(s => s.code || s.name).forEach(sub => {
            const first = (sub.code || '').charAt(0);
            let a = areas.find(x => PP1_AREAS.find(p => p.key === x.key).codes.indexOf(first) >= 0);
            if (!a) a = areas[areas.length - 1];
            const hours = num(sub.hours), credit = num(sub.credit);
            a.years[level].hours += hours;
            a.totalHours += hours;
            const g = rec ? rec.subjects[sub.code || sub.name] : '';
            if (g !== undefined && g !== '' && !isNaN(parseFloat(g)) && credit) {
                a.years[level].wsum += credit * parseFloat(g); a.years[level].credit += credit;
                a.wsum += credit * parseFloat(g); a.credit += credit;
            }
        });
    }
    areas.forEach(a => {
        for (let l = 1; l <= 6; l++) { const y = a.years[l]; y.avg = y.credit ? roundDown2(y.wsum / y.credit) : ''; }
        a.avg = a.credit ? roundDown2(a.wsum / a.credit) : '';
    });
    return areas;
}

window.openFilePicker = function () { $('file-import').click(); };
window.handleImportFile = function (ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    const isJson = /\.json$/i.test(file.name);
    reader.onload = function (e) {
        try {
            if (isJson) {
                const parsed = JSON.parse(e.target.result);
                PP1 = mergeDefaults(defaultDB(), parsed);
                window.PP1 = PP1; saveDB(); navigate(state.page);
                notify('นำเข้าไฟล์สำรองสำเร็จ');
            } else {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const report = importFromWorkbook(wb);
                saveDB(); navigate('students');
                notify('นำเข้าสำเร็จ • นักเรียน ' + report.students + ' คน • รายวิชา ' + report.subjects + ' วิชา • ผลการเรียน ' + report.grades + ' ช่อง');
            }
        } catch (err) {
            console.error(err);
            notify('นำเข้าไม่สำเร็จ: ' + err.message, 'error');
        }
        ev.target.value = '';
    };
    if (isJson) reader.readAsText(file, 'utf-8'); else reader.readAsArrayBuffer(file);
};
function sheetRows(wb, name) {
    const ws = wb.Sheets[name];
    if (!ws) return null;
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
}
function cellAt(rows, r, c) {
    const row = rows[r];
    if (!row) return '';
    const v = row[c];
    return (v === undefined || v === null) ? '' : String(v).trim();
}
function importFromWorkbook(wb) {
    const report = { students: 0, subjects: 0, grades: 0 };

    /* --- ข้อมูลพื้นฐาน --- */
    const basic = sheetRows(wb, 'ข้อมูลพื้นฐาน');
    if (basic) {
        const D = 3;
        PP1.school.name = cellAt(basic, 3, D) || PP1.school.name;
        PP1.school.affiliation = cellAt(basic, 4, D) || PP1.school.affiliation;
        PP1.school.area = cellAt(basic, 5, D) || PP1.school.area;
        PP1.school.tambon = cellAt(basic, 6, D) || PP1.school.tambon;
        PP1.school.amphoe = cellAt(basic, 7, D) || PP1.school.amphoe;
        PP1.school.province = cellAt(basic, 8, D) || PP1.school.province;
        PP1.school.registrar = cellAt(basic, 9, D) || PP1.school.registrar;
        PP1.school.registrarPosition = cellAt(basic, 10, D) || PP1.school.registrarPosition;
        PP1.school.director = cellAt(basic, 11, D) || PP1.school.director;
        PP1.school.directorPosition = cellAt(basic, 12, D) || PP1.school.directorPosition;
    }

    /* --- หลักสูตร --- */
    const cur = sheetRows(wb, 'หลักสูตร');
    if (cur) {
        const bands = [
            { level: 1, base: 0,  subFrom: 3,  subTo: 20, actFrom: 22, actTo: 26 },
            { level: 2, base: 8,  subFrom: 3,  subTo: 20, actFrom: 22, actTo: 26 },
            { level: 3, base: 16, subFrom: 3,  subTo: 20, actFrom: 22, actTo: 26 },
            { level: 4, base: 0,  subFrom: 31, subTo: 48, actFrom: 50, actTo: 54 },
            { level: 5, base: 8,  subFrom: 31, subTo: 48, actFrom: 50, actTo: 54 },
            { level: 6, base: 16, subFrom: 31, subTo: 48, actFrom: 50, actTo: 54 }
        ];
        bands.forEach(b => {
            const subs = [], acts = [];
            for (let r = b.subFrom; r <= b.subTo; r++) {
                const code = cellAt(cur, r, b.base + 1), name = cellAt(cur, r, b.base + 2);
                if (!code && !name) continue;
                subs.push({
                    code, name,
                    type: cellAt(cur, r, b.base + 3) || 'พื้นฐาน',
                    area: cellAt(cur, r, b.base + 4),
                    hours: cellAt(cur, r, b.base + 5),
                    credit: cellAt(cur, r, b.base + 6)
                });
            }
            for (let r = b.actFrom; r <= b.actTo; r++) {
                const code = cellAt(cur, r, b.base + 1), name = cellAt(cur, r, b.base + 2);
                if (!code && !name) continue;
                acts.push({ code, name, hours: cellAt(cur, r, b.base + 5) });
            }
            if (subs.length || acts.length) {
                PP1.curriculum[b.level] = { subjects: subs, activities: acts };
                report.subjects += subs.length;
            }
        });
    }

    /* --- ข้อมูลนักเรียน --- */
    const stuRows = sheetRows(wb, 'ข้อมูลนักเรียน');
    if (stuRows) {
        const startYear = cellAt(stuRows, 3, 5);
        if (startYear) PP1.settings.startYear = startYear;
        const map = {
            room: 0, no: 1, studentId: 2, prefix: 3, first: 4, last: 5, citizenId: 6,
            entryD: 7, entryM: 8, entryY: 9, prevSchool: 10, prevProvince: 11, prevLevel: 12,
            birthD: 13, birthM: 14, birthY: 15, sex: 16, nationality: 17, religion: 18,
            father: 19, mother: 20, pp1Set: 21, pp1No: 22, pp2No: 23,
            gradD: 24, gradM: 25, gradY: 26, leaveD: 27, leaveM: 28, leaveY: 29, leaveReason: 30,
            evalBasic: 31, evalRead: 32, evalChar: 33, evalAct: 34,
            decBasic: 35, decRead: 36, decChar: 37, decAct: 38,
            onet_thai: 39, onet_math: 40, onet_sci: 41, onet_soc: 42,
            onet_health: 43, onet_art: 44, onet_work: 45, onet_eng: 46,
            onetAvg: 47, pp1Note: 52
        };
        const imported = [];
        for (let r = 6; r < stuRows.length; r++) {
            const sid = cellAt(stuRows, r, 2);
            const first = cellAt(stuRows, r, 4);
            if (!sid && !first) continue;
            const rec = {};
            Object.keys(map).forEach(k => { rec[k] = cellAt(stuRows, r, map[k]); });
            if (!rec.studentId) continue;
            imported.push(rec);
        }
        if (imported.length) { PP1.students = imported; report.students = imported.length; }
    }

    /* --- ข้อมูลใบรับรอง --- */
    const certRows = sheetRows(wb, 'ข้อมูลใบรับรอง');
    if (certRows) {
        for (let r = 6; r < certRows.length; r++) {
            const sid = cellAt(certRows, r, 2);
            if (!sid) continue;
            PP1.certData[sid] = {
                docNo: cellAt(certRows, r, 6), d: cellAt(certRows, r, 7), m: cellAt(certRows, r, 8), y: cellAt(certRows, r, 9),
                l1: cellAt(certRows, r, 10), l2: cellAt(certRows, r, 11), l3: cellAt(certRows, r, 12), note: cellAt(certRows, r, 13)
            };
        }
    }

    /* --- เกรด 1 - 6 --- */
    const qualityMap = { '3': 'ดีเยี่ยม', '2': 'ดี', '1': 'ผ่าน', '0': 'ไม่ผ่าน' };
    for (let level = 1; level <= 6; level++) {
        const g = sheetRows(wb, 'เกรด' + level);
        if (!g) continue;
        const year = cellAt(g, 0, 3);
        if (year) PP1.grades[level].year = year;
        const cols = [];   // ตำแหน่งคอลัมน์รายวิชา H..Y
        for (let c = 7; c <= 24; c++) cols.push({ c, code: cellAt(g, 2, c), name: cellAt(g, 1, c) });
        const actCols = [];
        for (let c = 25; c <= 29; c++) actCols.push({ c, code: cellAt(g, 2, c), name: cellAt(g, 1, c) });
        const curSubs = (PP1.curriculum[level].subjects || []);
        const curActs = (PP1.curriculum[level].activities || []);
        for (let r = 6; r < g.length; r++) {
            const sid = cellAt(g, r, 2);
            if (!sid) continue;
            const rec = gradeRecord(level, sid);
            cols.forEach((col, idx) => {
                const val = cellAt(g, r, col.c);
                if (val === '') return;
                let target = curSubs.find(s => col.code && s.code && s.code.trim() === col.code.trim());
                if (!target) target = curSubs.find(s => col.name && s.name && s.name.trim() === col.name.trim());
                if (!target) target = curSubs[idx];
                if (!target) return;
                rec.subjects[target.code || target.name] = val;
                report.grades++;
            });
            actCols.forEach((col, idx) => {
                const val = cellAt(g, r, col.c);
                if (val === '') return;
                let target = curActs.find(a => col.code && a.code && a.code.trim() === col.code.trim());
                if (!target) target = curActs.find(a => col.name && a.name && a.name.trim() === col.name.trim());
                if (!target) target = curActs[idx];
                if (!target) return;
                rec.activities[target.code || target.name] = val;
            });
            const ch = cellAt(g, r, 30), rd = cellAt(g, r, 31);
            rec.character = qualityMap[ch] !== undefined ? qualityMap[ch] : ch;
            rec.reading = qualityMap[rd] !== undefined ? qualityMap[rd] : rd;
            rec.activitySummary = cellAt(g, r, 32);
            rec.clubName = cellAt(g, r, 36);
        }
    }

    /* --- O-Net (เก็บข้อมูลดิบไว้ดู/โอนซ้ำ) --- */
    const onet = sheetRows(wb, 'O-Net');
    if (onet) {
        const rows = [];
        for (let r = 11; r < onet.length; r++) {
            const cid = cellAt(onet, r, 2);
            if (!cid) continue;
            rows.push(onet[r].map(v => (v === undefined || v === null) ? '' : String(v)));
        }
        if (rows.length) PP1.onetRaw = { header: {}, rows };
    }
    return report;
}

            s.onet_thai, s.onet_math, s.onet_sci, s.onet_soc, s.onet_health, s.onet_art, s.onet_work, s.onet_eng,
            s.onetAvg, p46.totalCredit, p46.earnedCredit, p46.totalGpa, weighted, s.pp1Note];
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stuAoa), 'ข้อมูลนักเรียน');

    /* ข้อมูลใบรับรอง */
    const certAoa = [];
    certAoa[4] = ['ห้อง', 'เลขที่', 'เลขประจำตัวนักเรียน', 'ชื่อ', 'สกุล', 'เลขบัตรประชาชน', 'เลขที่เอกสาร', 'วันที่', 'เดือน', 'ปี',
        'คำรับรองบรรทัดที่ 1', 'คำรับรองบรรทัดที่ 2', 'คำรับรองบรรทัดที่ 3', 'หมายเหตุ'];
    sortedStudents().forEach((s, i) => {
        const c = PP1.certData[String(s.studentId)] || {};
        certAoa[6 + i] = [s.room, s.no, s.studentId, (s.prefix || '') + (s.first || ''), s.last, s.citizenId,
            c.docNo, c.d, c.m, c.y, c.l1, c.l2, c.l3, c.note];
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(certAoa), 'ข้อมูลใบรับรอง');

    /* เกรด 1-6 */
    for (let level = 1; level <= 6; level++) {
        const cur = PP1.curriculum[level];
        const subs = (cur.subjects || []).filter(s => s.code || s.name);
        const acts = (cur.activities || []).filter(a => a.code || a.name);
        const aoa = [];
        aoa[0] = ['ปีการศึกษา : ', '', '', yearOfLevel(level)];
        const nameRow = ['ห้อง', 'เลขที่', 'รหัสนักเรียน', 'ชื่อ - สกุล', 'เลขประชาชน', 'ลำดับ', 'วิชา'];
        const codeRow = ['', '', '', '', '', '', ''];
        const hoursRow = ['', '', '', '', '', '', ''];
        const typeRow = ['', '', '', '', '', '', 'ประเภท'];
        const creditRow = ['', '', '', '', '', '', 'น้ำหนัก'];
        for (let i = 0; i < MAX_SUBJECT_SLOTS; i++) {
            const s = subs[i];
            nameRow[7 + i] = s ? s.name : 'ช่องว่าง';
            codeRow[7 + i] = s ? s.code : '';
            hoursRow[7 + i] = s ? s.hours : '';
            typeRow[7 + i] = s ? s.type : '';
            creditRow[7 + i] = s ? s.credit : '';
        }
        for (let i = 0; i < MAX_ACTIVITY_SLOTS; i++) {
            const a = acts[i];
            nameRow[25 + i] = a ? a.name : 'ช่องว่าง';
            codeRow[25 + i] = a ? a.code : '';
            hoursRow[25 + i] = a ? a.hours : '';
            typeRow[25 + i] = a ? 'กิจกรรม' : '';
            creditRow[25 + i] = a ? '-' : '';
        }
        nameRow[30] = 'คุณลักษณะ'; nameRow[31] = 'อ่าน คิดฯ'; nameRow[32] = 'สรุปกิจกรรม'; nameRow[33] = 'เกรดเฉลี่ย'; nameRow[36] = 'ชื่อชุมนุม';
        aoa[1] = nameRow; aoa[2] = codeRow; aoa[3] = hoursRow; aoa[4] = typeRow; aoa[5] = creditRow;
        sortedStudents().forEach((s, i) => {
            const sid = String(s.studentId);
            const rec = PP1.grades[level].records[sid] || { subjects: {}, activities: {} };
            const row = [s.room, s.no, s.studentId, studentFullName(s), s.citizenId, i + 1, ''];
            subs.forEach((sub, j) => { row[7 + j] = rec.subjects[sub.code || sub.name] || ''; });
            acts.forEach((a, j) => { row[25 + j] = rec.activities[a.code || a.name] || ''; });
            row[30] = rec.character || ''; row[31] = rec.reading || ''; row[32] = rec.activitySummary || '';
            row[33] = gpaOfLevel(level, sid).credits ? fmt2(gpaOfLevel(level, sid).gpa) : '';
            row[36] = rec.clubName || '';
            aoa[6 + i] = row;
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'เกรด' + level);
    }

    /* สรุปผลสัมฤทธิ์ */
    const achAoa = [['ระดับชั้น', 'รายวิชา'].concat(GRADE_BUCKETS).concat(['ลงทะเบียน', 'มีผลการเรียน', 'ค่าเฉลี่ย', 'SD', 'ผ่าน', 'ได้ 3-4', 'ไม่ผ่าน'])];
    for (let level = 1; level <= 6; level++) {
        achievementRows(level, 'subject').forEach(r => {
            achAoa.push([LEVEL_NAMES[level], r.label].concat(GRADE_BUCKETS.map(b => r.counts[b] || 0))
                .concat([r.registered, r.graded, roundDown2(r.mean), roundDown2(r.sd), r.pass, r.good, r.fail]));
        });
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(achAoa), 'สรุปผลสัมฤทธิ์');

    /* สรุปเกรด (ต่อคน) */
    const gsAoa = [['เลขประจำตัว', 'ชื่อ - สกุล'].concat(PP1_AREAS.map(a => a.label)).concat(['นก.เรียน', 'นก.ได้', 'เกรดเฉลี่ย', 'เฉลี่ย ป.4-6'])];
    sortedStudents().forEach(s => {
        const sid = String(s.studentId);
        const areas = areaSummaryByYear(sid);
        const cs = creditSummaryAll(sid);
        const p46 = summaryP46(sid);
        gsAoa.push([s.studentId, studentDisplayName(s)].concat(areas.map(a => a.avg === '' ? '' : fmt2(a.avg)))
            .concat([cs.registered, cs.earned, fmt2(cs.gpa), fmt2(p46.totalGpa)]));
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gsAoa), 'สรุปเกรด');

    XLSX.writeFile(wb, 'PP1-' + (PP1.school.name || 'school') + '-' + new Date().toISOString().slice(0, 10) + '.xlsx');
    notify('ส่งออกไฟล์ Excel แล้ว');
};

/* === MODULE INSERT POINT === */

/* ---------------------- เริ่มระบบ ---------------------- */
loadDB();
buildSidebar();
if (document.documentElement.classList.contains('dark-mode')) $('theme-icon').className = 'ph ph-sun text-base';
navigate('guide');
</script>
