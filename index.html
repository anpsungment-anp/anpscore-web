<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANPSCORE - ระบบบริหารจัดการผลการเรียน</title>
    <!-- ไลบรารีทั้งหมดเก็บไว้ในโปรเจกต์แล้ว ไม่พึ่ง CDN ภายนอก
         สร้างใหม่ได้ด้วย  npm install && npm run build  -->
    <link rel="stylesheet" href="app/tailwind.css">
    <link rel="stylesheet" href="vendor/sarabun/sarabun.css">
    <link rel="stylesheet" href="vendor/phosphor/style.css">
    <!-- ไลบรารีส่งออก Excel/PDF โหลดเบื้องหลังโดย app/vendor-loader.js ไม่ให้ถ่วงการเชื่อมต่อคลาวด์ -->
    <script>
        try {
            if ((localStorage.getItem('anpscore_theme') || 'light') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch(e) {}
    </script>

    <link rel="stylesheet" href="app/styles.css">
    <link rel="stylesheet" href="app/theme-modern.css?v=2">
</head>
<body class="h-screen w-full flex relative">

    <a href="#main-content" class="skip-link no-print">ข้ามไปยังเนื้อหาหลัก</a>

    <div id="loading-screen" role="status" aria-live="polite" class="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-login-gradient text-white transition-opacity duration-700">
        <div class="relative">
            <i class="ph ph-spinner-gap text-7xl animate-spin"></i>
            <div class="absolute inset-0 bg-white blur-xl opacity-20 rounded-full animate-pulse"></div>
        </div>
        <h2 class="text-3xl font-extrabold mt-6 tracking-widest drop-shadow-md">ANPSCORE</h2>
        <p class="text-indigo-100 mt-2 font-medium">กำลังเตรียมพร้อมระบบ...</p>
    </div>

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-login-gradient transition-opacity duration-500 hidden opacity-0">
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse"></div>
            <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 2s;"></div>
        </div>
        
        <div class="glass-panel p-10 rounded-[2.5rem] w-full max-w-md mx-4 text-center relative z-10 animate-fade-in-up">
            <div id="login-logo-container" class="mb-5 flex justify-center">
                <div class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[1.5rem] flex items-center justify-center text-white shadow-xl transform hover:scale-105 transition-transform duration-300">
                    <i class="ph ph-graduation-cap text-5xl"></i>
                </div>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-800 mb-1 tracking-tight">ANPSCORE</h1>
            <p class="text-gray-500 mb-8 font-medium">ระบบบริหารจัดการผลการเรียน</p>

            <div role="tablist" aria-label="เลือกประเภทผู้ใช้" class="flex bg-gray-100/80 p-1.5 rounded-2xl mb-8 shadow-inner">
                <button onclick="window.switchLoginTab('teacher')" id="tab-teacher" class="flex-1 py-2.5 rounded-xl bg-white shadow-sm text-indigo-600 font-bold text-sm transition-all duration-300">ครูผู้สอน</button>
                <button onclick="window.switchLoginTab('admin')" id="tab-admin" class="flex-1 py-2.5 rounded-xl text-gray-500 font-bold text-sm transition-all duration-300 hover:text-gray-700">ผู้ดูแลระบบ</button>
            </div>

            <form id="form-teacher-login" class="text-left animate-fade-in-up stagger-1" onsubmit="event.preventDefault(); window.doLogin('teacher');">
                <label for="login-teacher-sel" class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">เลือกบัญชีผู้ใช้</label>
                <select id="login-teacher-sel" autocomplete="username" class="w-full border border-gray-200 rounded-2xl p-3.5 focus-ring mb-5 bg-white/80 backdrop-blur-sm shadow-sm transition-colors hover:bg-white text-gray-700 font-medium">
                    <option value="">-- เลือกบัญชีของคุณ --</option>
                </select>
                <label for="login-teacher-pwd" class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">รหัสผ่าน</label>
                <input type="password" id="login-teacher-pwd" autocomplete="current-password" class="w-full border border-gray-200 rounded-2xl p-3.5 focus-ring mb-8 bg-white/80 backdrop-blur-sm shadow-sm transition-colors hover:bg-white text-gray-800" placeholder="••••••••">
                <button type="submit" class="tactile-btn w-full bg-primary-gradient text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 text-lg flex justify-center items-center gap-2">
                    เข้าสู่ระบบ <i class="ph ph-arrow-right font-bold"></i>
                </button>
            </form>

            <form id="form-admin-login" class="text-left hidden animate-fade-in-up stagger-1" onsubmit="event.preventDefault(); window.doLogin('admin');">
                <label for="login-admin-pwd" class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">รหัสผ่านผู้ดูแลระบบ</label>
                <input type="password" id="login-admin-pwd" autocomplete="current-password" class="w-full border border-gray-200 rounded-2xl p-3.5 focus-ring mb-8 bg-white/80 backdrop-blur-sm shadow-sm transition-colors hover:bg-white text-gray-800" placeholder="••••••••">
                <button type="submit" class="tactile-btn w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg shadow-gray-300 text-lg flex justify-center items-center gap-2">
                    เข้าสู่ระบบ <i class="ph ph-shield-check font-bold"></i>
                </button>
            </form>
        </div>
    </div>

    <div id="app-container" class="w-full h-full flex hidden opacity-0 transition-opacity duration-700 bg-[#f8fafc]">
        
        <aside id="sidebar" class="w-72 bg-white border-r border-gray-100 flex flex-col no-print shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20">
            <div class="h-20 flex items-center px-6 border-b border-gray-50">
                <img id="sidebar-logo" src="" alt="Logo" class="w-10 h-10 mr-3 hidden rounded-xl object-cover shadow-sm">
                <div id="sidebar-logo-icon" class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-indigo-600 text-white rounded-xl flex items-center justify-center mr-3 shadow-md shadow-indigo-100">
                    <i class="ph ph-graduation-cap text-2xl"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-800 tracking-tight">ANPSCORE</h2>
            </div>
            
            <div class="p-5 border-b border-gray-50 bg-slate-50/50">
                <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold mb-2">ปีการศึกษา / เทอม</div>
                <div class="relative">
                    <select id="global-term-select" class="w-full appearance-none border border-slate-200 rounded-xl p-3 pl-4 pr-10 focus-ring text-sm font-bold text-indigo-900 bg-white shadow-sm cursor-pointer transition-colors hover:border-indigo-300" onchange="window.changeGlobalTerm()">
                        <option value="1">ภาคเรียนที่ 1</option>
                        <option value="2">ภาคเรียนที่ 2</option>
                    </select>
                    <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>
            </div>

            <div class="px-5 pt-6 pb-2 text-[11px] uppercase tracking-wider text-slate-400 font-bold">เมนูหลัก</div>
            <nav id="nav-menu" class="flex-1 overflow-y-auto px-3 space-y-1.5 custom-scrollbar">
            </nav>

            <div class="p-5 border-t border-gray-50 bg-slate-50/50">
                <div class="flex items-center mb-5 p-3 bg-white rounded-2xl shadow-sm border border-slate-100">
                    <div class="w-11 h-11 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-700 font-extrabold text-lg mr-3 shadow-inner overflow-hidden shrink-0" id="user-avatar">A</div>
                    <div class="overflow-hidden">
                        <div id="user-name" class="font-bold text-gray-800 text-sm truncate">ผู้ใช้งาน</div>
                        <div id="user-role" class="text-xs text-indigo-500 font-medium">บทบาท</div>
                    </div>
                </div>
                <button onclick="window.doLogout()" class="tactile-btn w-full flex items-center justify-center px-4 py-3 text-sm font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition-colors border border-rose-100">
                    <i class="ph ph-sign-out mr-2 text-lg"></i> ออกจากระบบ
                </button>
            </div>
        </aside>

        <div id="sidebar-backdrop" class="no-print" onclick="window.toggleSidebar(false)"></div>

        <main id="main-content" class="flex-1 flex flex-col h-full overflow-hidden relative">
            <header id="header" class="h-20 glass-header flex items-center justify-between px-8 shrink-0 z-10 no-print">
                <div class="flex items-center gap-4 animate-fade-in-up min-w-0">
                    <button id="sidebar-toggle" type="button" class="sidebar-toggle" onclick="window.toggleSidebar()" aria-label="เปิดเมนู" aria-controls="sidebar" aria-expanded="false"><i class="ph ph-list"></i></button>
                    <div class="w-2 h-8 bg-indigo-500 rounded-full"></div>
                    <h2 id="page-title" class="text-2xl font-extrabold text-slate-800 tracking-tight">หน้าแรก</h2>
                </div>
                <div class="flex items-center gap-2 min-w-0">
                    <div id="header-term-display" class="animate-fade-in-up stagger-1 flex items-center gap-2 bg-indigo-50/80 text-indigo-700 px-4 py-2 rounded-full text-sm font-bold border border-indigo-100/50 shadow-sm backdrop-blur-md">
                        <span class="relative flex h-2.5 w-2.5">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
                        </span>
                        กำลังใช้งาน: ภาคเรียนที่ 1
                    </div>
                    <button id="theme-toggle-btn" onclick="window.toggleThemeMode()" class="animate-fade-in-up stagger-1 flex items-center gap-2 bg-slate-100/80 text-slate-700 px-3.5 py-2 rounded-full text-sm font-bold border border-slate-200/70 shadow-sm backdrop-blur-md transition-colors hover:bg-slate-200" title="สลับ Light/Dark mode">
                        <i id="theme-toggle-icon" class="ph ph-moon text-lg"></i>
                        <span id="theme-toggle-label" class="hidden sm:inline">กลางคืน</span>
                    </button>
                    <button id="active-users-pill" onclick="window.showActiveUsersModal()" class="animate-fade-in-up stagger-1 flex items-center gap-2 bg-amber-50/80 text-amber-700 px-4 py-2 rounded-full text-sm font-bold border border-amber-100/70 shadow-sm backdrop-blur-md transition-colors" title="ดูรายชื่อผู้ที่กำลังล็อกอิน">
                        <span class="relative flex h-2.5 w-2.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
                        </span>
                        ออนไลน์ 0 คน
                    </button>
                    <button id="chat-header-btn" onclick="window.toggleChatWidget()" class="animate-fade-in-up stagger-1 relative flex items-center gap-2 bg-indigo-50/80 hover:bg-indigo-100 text-indigo-700 px-3.5 py-2 rounded-full text-sm font-bold border border-indigo-100/70 shadow-sm backdrop-blur-md transition-colors cursor-pointer" title="เปิดหน้าต่างแชท / สอบถามสด">
                        <i class="ph ph-chat-circle-dots text-lg"></i>
                        <span class="hidden sm:inline">ข้อความ</span>
                        <span id="chat-unread-badge" class="hidden min-w-[1.25rem] h-5 px-1 bg-rose-500 text-white text-xs font-black rounded-full flex items-center justify-center border-2 border-white animate-pulse">0</span>
                    </button>
                </div>
            </header>

            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth pb-24">
            </div>
        </main>
    </div>

    <div id="print-view" class="hidden fixed inset-0 z-[200]"></div>

    <div id="modal-container" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 hidden no-print backdrop-blur-sm transition-opacity duration-300">
        <div id="modal-content" class="bg-white rounded-[2rem] shadow-2xl p-8 w-full max-w-lg max-h-[90vh] overflow-y-auto mx-4 transform transition-all duration-300 scale-95 opacity-0 custom-scrollbar">
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-[110] text-white px-6 py-4 rounded-2xl shadow-xl transform translate-y-24 opacity-0 transition-all duration-400 flex items-center gap-3 backdrop-blur-md font-medium border border-white/10">
        <i id="toast-icon" class="ph ph-info text-2xl"></i>
        <span id="toast-msg" class="tracking-wide">Notification</span>
    </div>

    <script src="app/state.js?v=3.2"></script>
    <script src="app/local-store.js?v=3.1"></script>
    <script src="app/utils.js?v=3.1"></script>
    <script src="app/storage.js?v=3.1"></script>
    <script src="app/cloud-status.js?v=3.4"></script>
    <script src="app/app-shell.js?v=3.6"></script>
    <script src="app/grading.js?v=4.4"></script>
    <script src="app/admin-scoring.js?v=4.4"></script>
    <script src="app/teacher-scoring.js?v=4.4"></script>
    <script src="app/guardian-reports.js?v=3.9"></script>
    <script src="app/executive-reports.js?v=3.9"></script>
    <script src="app/admin-manage.js?v=3.2"></script>
    <script src="app/term-archive.js?v=3.2"></script>
    <script src="app/a11y.js?v=3.1"></script>
    <script src="app/chat.js?v=3.1"></script>
    <script src="app/vendor-loader.js?v=1"></script>

    <!-- Cloud Firebase Module for Real-time Sync -->
    <script type="module" src="app/cloud.js?v=3.6"></script>
</body>
</html>
