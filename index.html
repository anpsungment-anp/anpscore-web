        window.adminGenerateSelectedPrint = function(subId, cId, teacherId) {
            const selectedUnits = Array.from(document.querySelectorAll('input[name="print_unit_admin"]:checked')).map(cb => cb.value);
            const printKpa = $('print_kpa_admin').checked;
            const printMid = $('print_mid_admin').checked;
            const printFinal = $('print_final_admin').checked;
            const printTotal = $('print_total_admin').checked;
            window.hideModal();

            const sub = DB.subjects.find(x => x.id === subId);
            const cls = DB.classes[cId];
            const teacher = DB.teachers.find(x => x.id === teacherId);
            if(!sub || !cls) return;

            let sd = DB_SubjectData[subId] || { classData: {}, scores: {} };
            const classConfig = sd.classData[cId] || {};
            let termUnits = (classConfig.learningUnits||[]).filter(u => String(u.term) === String(state.term) && selectedUnits.includes(u.id));
            const printScoreStore = sd.scores[cId] || {};
            const getPrintColumn = (indicator, type) => window.getEffectiveIndicatorColumn
                ? window.getEffectiveIndicatorColumn(indicator, type, printScoreStore, state.term)
                : { max: Number(indicator[`max_${type}`] || 0) };

            let hasAnyPrintedKpa = false;
            if (printKpa) {
                termUnits.forEach(u => {
                    if(u.indicators) {
                        u.indicators.forEach(ind => {
                            if (getPrintColumn(ind, 'k').max > 0 || getPrintColumn(ind, 'p').max > 0 || getPrintColumn(ind, 'a').max > 0) hasAnyPrintedKpa = true;
                        });
                    }
                });
            }
            let rowSpanAttr = hasAnyPrintedKpa ? 'rowspan="3"' : '';

            /* ปรับความกว้าง 3 คอลัมน์แรกให้เล็กลง */
            let thHtmlRow1 = `
                <th ${rowSpanAttr} class="print-num-col">เลขที่</th>
                <th ${rowSpanAttr} class="print-code-col">รหัส</th>
                <th ${rowSpanAttr} class="text-left print-name-col">ชื่อ-สกุล</th>
            `;
            let thHtmlRow2 = ``;
            let thHtmlRow3 = ``;

            termUnits.forEach(u => { 
                if (printKpa && hasAnyPrintedKpa) {
                    let uCols = 0;
                    let indRow2 = '';
                    let indRow3 = '';
                    if(u.indicators && u.indicators.length > 0) {
                        u.indicators.forEach((ind, iIdx) => {
                            let kpaCols = 0;
                            let kpaRow3 = '';
                            if(getPrintColumn(ind, 'k').max > 0) { kpaRow3 += `<th>K</th>`; kpaCols++; }
                            if(getPrintColumn(ind, 'p').max > 0) { kpaRow3 += `<th>P</th>`; kpaCols++; }
                            if(getPrintColumn(ind, 'a').max > 0) { kpaRow3 += `<th>A</th>`; kpaCols++; }
                            
                            if(kpaCols > 0) {
                                indRow2 += `<th colspan="${kpaCols}" class="print-indicator-header" title="${ind.name}"><span>${ind.name}</span></th>`;
                                indRow3 += kpaRow3;
                                uCols += kpaCols;
                            }
                        });
                    }
                    if (uCols === 0) {
                        thHtmlRow1 += `<th ${rowSpanAttr} class="print-unit-header" title="${u.name}"><span>${u.name}</span></th>`;
                    } else {
                        thHtmlRow1 += `<th colspan="${uCols + 1}" class="print-unit-header" title="${u.name}"><span>${u.name}</span></th>`;
                        thHtmlRow2 += indRow2 + `<th rowspan="2" class="align-middle">รวม</th>`;
                        thHtmlRow3 += indRow3;
                    }
                } else {
                    thHtmlRow1 += `<th ${rowSpanAttr} class="print-unit-header" title="${u.name}"><span>${u.name}</span></th>`; 
                }
            });

            if(printMid) thHtmlRow1 += `<th ${rowSpanAttr} class="print-score-col">กลางภาค</th>`;
            if(printFinal) thHtmlRow1 += `<th ${rowSpanAttr} class="print-score-col">ปลายภาค</th>`;
            if(printTotal) thHtmlRow1 += `<th ${rowSpanAttr} class="font-bold print-score-col">รวม</th><th ${rowSpanAttr} class="font-bold print-score-col">เกรด</th>`;

            let tableHtml = `<table class="print-table mb-6"><thead><tr>${thHtmlRow1}</tr>`;
            if (printKpa && hasAnyPrintedKpa) {
                tableHtml += `<tr>${thHtmlRow2}</tr><tr>${thHtmlRow3}</tr>`;
            }
            tableHtml += `</thead><tbody>`;

            let sumGrade = 0, passCount = 0;

            cls.students.forEach((s, idx) => {
                let scStore = sd.scores[cId] || {};
                let stuNode = scStore[s.studentId] || {};
                let mySc = stuNode[state.term] || { indicators: {}, midTermScore: '', finalScore: '' };

                let trHtml = `
                    <tr>
                        <td>${idx+1}</td>
                        <td>${s.studentId}</td>
                        <td class="text-left font-medium">${s.name}</td>
                `;

                termUnits.forEach(u => {
                    let uTotal = 0;
                    if (printKpa && hasAnyPrintedKpa) {
                        let hasInd = false;
                        if(u.indicators && u.indicators.length > 0) {
                            u.indicators.forEach(ind => {
                                let kpaCols = 0;
                                if(getPrintColumn(ind, 'k').max > 0) kpaCols++;
                                if(getPrintColumn(ind, 'p').max > 0) kpaCols++;
                                if(getPrintColumn(ind, 'a').max > 0) kpaCols++;

                                if(kpaCols > 0) {
                                    hasInd = true;
                                    let vals = mySc.indicators ? mySc.indicators[ind.id] : null;
                                    let vK = vals ? window.scoreDisplayValue(vals.k, '', 'k') : '';
                                    let vP = vals ? window.scoreDisplayValue(vals.p, '', 'p') : '';
                                    let vA = vals ? window.scoreDisplayValue(vals.a, '', 'a') : '';

                                    if(getPrintColumn(ind, 'k').max > 0) { trHtml += `<td>${vK}</td>`; uTotal += Number(vK)||0; }
                                    if(getPrintColumn(ind, 'p').max > 0) { trHtml += `<td>${vP}</td>`; uTotal += Number(vP)||0; }
                                    if(getPrintColumn(ind, 'a').max > 0) { trHtml += `<td>${vA}</td>`; uTotal += Number(vA)||0; }
                                }
                            });
                        }
                        if (!hasInd) {
                            trHtml += `<td></td>`;
                        } else {
                            trHtml += `<td class="font-bold bg-[#f8fafc] print:bg-transparent">${uTotal || ''}</td>`;
                        }
                    } else {
                        if(u.indicators) {
                            u.indicators.forEach(ind => {
                                let vals = mySc.indicators ? mySc.indicators[ind.id] : null;
                                if(vals) {
                                    uTotal += window.scoreNumber(vals.k, 'k') + window.scoreNumber(vals.p, 'p') + window.scoreNumber(vals.a, 'a');
                                }
                            });
                        }
                        trHtml += `<td>${uTotal || ''}</td>`;
                    }
                });

                if(printMid) trHtml += `<td>${window.scoreDisplayValue(mySc.midTermScore, '', 'midTermScore')}</td>`;
                if(printFinal) trHtml += `<td>${window.scoreDisplayValue(mySc.finalScore, '', 'finalScore')}</td>`;

                if(printTotal) {
                    let total = window.getStudentTotalScore(s, subId, cId, state.term);
                    let grade = window.calculateGrade(total, DB.gradeSettings);
                    sumGrade += Number(grade);
                    if(total >= DB.gradeSettings.passThreshold) passCount++;
                    trHtml += `<td class="font-bold">${total}</td><td class="font-bold">${grade}</td>`;
                }

                trHtml += `</tr>`;
                tableHtml += trHtml;
            });
            tableHtml += `</tbody></table>`;

            let avgGrade = cls.students.length && printTotal ? (sumGrade / cls.students.length).toFixed(2) : '0.00';
            let titleHtml = `
                <h3 class="text-lg mt-1 font-bold">รายงานผลการเรียน ภาคเรียนที่ ${state.term} ปีการศึกษา ${DB.schoolInfo.year}</h3>
                <p class="mt-1">วิชา ${sub.name} ${sub.code ? `รหัสวิชา ${sub.code}` : ''} ชั้น ${cls.name}</p>
            `;

            let reportHtml = window.generatePrintHTML(titleHtml, tableHtml, cls.students.length, printTotal ? passCount : '-', printTotal ? avgGrade : '-', sub, teacher);
            window.openPrintWindow(reportHtml);
        }

        window.getModalScrollSnapshot = function() {
            const mc = $('modal-content');
            const inner = $('unit-config-scroll');
            return {
                top: mc ? (mc.scrollTop || 0) : 0,
                innerTop: inner ? (inner.scrollTop || 0) : 0
            };
        }

        window.restoreModalScrollSnapshot = function(snapshot = {}, anchorId = '') {
            const mc = $('modal-content');
            if(!mc) return;
            requestAnimationFrame(() => {
                const inner = $('unit-config-scroll');
                const scroller = inner || mc;
                if(anchorId) {
                    const target = document.getElementById(anchorId);
                    if(target) {
                        const scrollerRect = scroller.getBoundingClientRect();
                        const targetRect = target.getBoundingClientRect();
                        scroller.scrollTop = Math.max(0, scroller.scrollTop + targetRect.top - scrollerRect.top - 18);
                        return;
                    }
                }
                mc.scrollTop = Number(snapshot.top || 0);
                if(inner) inner.scrollTop = Number(snapshot.innerTop || 0);
            });
        }

        window.t_addUnit = function() {
            if(!window.ensureCanEditScorebook()) return;
            let v = $('inp-new-unit').value.trim();
            if(v) {
                let sd = window.getSubjectData();
                const newUnitId = generateId();
                sd.classData[state.clsId].learningUnits.push({ id: newUnitId, name: v, term: String(state.term), indicators: [] });
                let syncCount = window.syncClassConfigToSameGrade();
                window.saveDB(); window.refreshUnitConfigModal(newUnitId);
                if(syncCount > 0) window.notify(`เพิ่มหน่วยและซิงค์อัตโนมัติ ${syncCount} ห้อง`);
            }
        }
        window.t_delUnit = function(uid) {
            if(!window.ensureCanEditScorebook()) return;
            window.showCustomConfirm('ลบหน่วยการเรียนรู้', 'ต้องการลบหน่วยการเรียนรู้นี้พร้อมตัวชี้วัดทั้งหมดหรือไม่?', 'danger', () => {
                let sd = window.getSubjectData();
                sd.classData[state.clsId].learningUnits = sd.classData[state.clsId].learningUnits.filter(x => x.id !== uid);
                let syncCount = window.syncClassConfigToSameGrade();
                window.saveDB(); window.refreshUnitConfigModal();
                if(syncCount > 0) window.notify(`อัปเดตโครงสร้างไปยังห้องอื่น ${syncCount} ห้องแล้ว`);

        window.t_addIndi = function(uid) {
            if(!window.ensureCanEditScorebook()) return;
            let sd = window.getSubjectData();
            let u = sd.classData[state.clsId].learningUnits.find(x => x.id === uid);
            if(u) {
                if(!u.indicators) u.indicators = [];
                u.indicators.push({ id: generateId(), name:'ตัวชี้วัดใหม่', max_k:0, max_p:0, max_a:0 });
                window.syncClassConfigToSameGrade();
                window.saveDB(); window.refreshUnitConfigModal();
            }
        }
        // Sum of every K/P/A indicator max plus the midterm/final max for one class's score
        // structure - used to hard-block a structure edit that would push the total over 100.
        window.calcClassScoreStructureTotal = function(classConfig, term) {
            const termUnits = (classConfig.learningUnits || []).filter(u => String(u.term) === String(term));
            let total = 0;
            termUnits.forEach(u => {
                (u.indicators || []).forEach(i => {
                    total += Number(i.max_k || 0) + Number(i.max_p || 0) + Number(i.max_a || 0);
                });
            });
            const ex = (classConfig.examSettings && classConfig.examSettings[term]) || { mid: 20, final: 30 };
            total += Number(ex.mid || 0) + Number(ex.final || 0);
            return total;
        }

        window.t_updIndi = function(uid, idx, field, val) {
            if(!window.ensureCanEditScorebook()) return;
            let sd = window.getSubjectData();
            let classConfig = sd.classData[state.clsId];
            let u = classConfig.learningUnits.find(x => x.id === uid);
            if(u && u.indicators[idx]) {
                if(field === 'name') {
                    u.indicators[idx][field] = val;
                } else {
                    const oldValue = Number(u.indicators[idx][field] || 0);
                    let newValue = Number(val);
                    if(!Number.isFinite(newValue) || newValue < 0) newValue = 0;
                    u.indicators[idx][field] = newValue;
                    const total = window.calcClassScoreStructureTotal(classConfig, state.term);
                    if(total > 100) {
                        u.indicators[idx][field] = oldValue;
                        window.notify(`คะแนนรวมโครงสร้างทั้งหมดต้องไม่เกิน 100 คะแนน (ค่าที่กรอกจะทำให้รวมเป็น ${total})`, true);

                        return;

                window.saveDB(); window.refreshUnitConfigModal();
            }
        }

        window.t_applyBulkFill = function(cat, indId, type, maxVal) {
            if(!window.ensureCanEditScorebook()) return;
            let inputVal = document.getElementById('bulk-fill-input').value;
            let fillVal = inputVal.trim() === '' ? '' : Number(inputVal);

            if (fillVal !== '' && isNaN(fillVal)) { window.notify('กรุณากรอกตัวเลขที่ถูกต้อง', true); return; }
            if (fillVal !== '' && fillVal < 0) fillVal = 0;
            if (fillVal !== '' && fillVal > maxVal) { window.notify(`คะแนนเต็ม ${maxVal}`, true); fillVal = maxVal; }

            const cls = DB.classes[state.clsId];
            if(!cls || cls.students.length === 0) { window.hideModal(); return; }

            let sd = window.getSubjectData();
            let scStore = sd.scores[state.clsId];
            const scoreField = cat === 'ind' ? `indicators.${indId}.${type}` : type;

            cls.students.forEach(stu => {
                let sId = stu.studentId;
                if(!scStore[sId]) scStore[sId] = {};
                if(!scStore[sId][state.term]) scStore[sId][state.term] = { indicators: {} };

                if(cat === 'ind') {
                    if(!scStore[sId][state.term].indicators) scStore[sId][state.term].indicators = {};
                    if(!scStore[sId][state.term].indicators[indId]) scStore[sId][state.term].indicators[indId] = {};
                    scStore[sId][state.term].indicators[indId][type] = fillVal;
                } else if(cat === 'exam') {
                    scStore[sId][state.term][type] = fillVal;
                }
                window.rememberScoreSafetyValue(state.subjId, state.clsId, sId, state.term, scoreField, fillVal);
                window.markScoreSubjectPending(state.subjId, state.clsId, sId);
            });

            window.saveSubjectDataLocalNow();
            window.persistScoreSafetyLogNow();
            window.setScoreAutoSaveStatus('pending', 'กำลังบันทึกอัตโนมัติ...');

            // Bulk fill can touch dozens of students at once. Writing each cell one-by-one through
            // the interactive per-cell save queue is safe but serialized (one Firestore round trip
            // after another), so it can sit in "saving" for a long time. Use one batched write
            // instead - it covers every touched cell in a couple of Firestore commits, and any
            // cell that still fails falls back to the reliable per-cell retry queue so nothing is
            // silently dropped.
            const targets = cls.students.map(stu => ({ subId: state.subjId, clsId: state.clsId, stuId: stu.studentId }));
            const fallbackToPerCellRetry = () => {
                cls.students.forEach(stu => {
                    window.scheduleScoreAutoSave(state.subjId, state.clsId, stu.studentId, state.term, scoreField, fillVal);
                });
            };
            if (!window.firebaseBatchWriteScoreNodes) {
                window.saveDB();
            } else {
                window.firebaseBatchWriteScoreNodes(targets).then(result => {
                    if(result && result.failed > 0) {
                        window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว บางส่วนยังไม่ขึ้นคลาวด์ กำลังลองใหม่');
                        fallbackToPerCellRetry();
                    } else {
                        cls.students.forEach(stu => window.clearScoreSubjectPendingIfDone(state.subjId, state.clsId, stu.studentId));
                        window.setScoreAutoSaveStatus('saved', 'บันทึกอัตโนมัติแล้ว');
                    }
                }).catch(err => {
                    console.error('Bulk fill batch save failed:', err);
                    window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว กำลังลองซิงก์อีกครั้ง');
                    fallbackToPerCellRetry();
                });
            }

            window.hideModal(); window.t_renderScoreTable(); window.notify('เติมคะแนนเรียบร้อยแล้ว');
        };

        window.t_cacheSc = function(sId, indId, type, val, max) {

        window.getScoreUnitVisibilityKey = function() {
            return `anpscore_visible_units_${state.subjId}_${state.clsId}_${state.term}`;
        }

        window.getEffectiveIndicatorColumn = function(indicator, type, scoreStore = {}, term = state.term) {
            const configuredMax = Number((indicator && indicator[`max_${type}`]) || 0);
            let hasStoredScore = false;
            let observedMax = 0;

            Object.values(scoreStore || {}).forEach(studentNode => {
                if(!studentNode || typeof studentNode !== 'object') return;
                let termNode = studentNode[String(term)];
                if(!termNode && String(studentNode.term || '') === String(term)) termNode = studentNode;
                const indicatorScores = termNode && termNode.indicators ? termNode.indicators[indicator.id] : null;
                if(!indicatorScores) return;
                const rawValue = indicatorScores[type];
                if(rawValue === '' || rawValue === null || rawValue === undefined) return;
                const numericValue = Number(rawValue);
                if(!Number.isFinite(numericValue) || numericValue < 0) return;
                hasStoredScore = true;
                observedMax = Math.max(observedMax, numericValue);
            });

            const recovered = configuredMax <= 0 && hasStoredScore;
            return {
                type,
                configuredMax,
                observedMax,
                hasStoredScore,
                recovered,
                max: configuredMax > 0 ? configuredMax : (recovered ? Math.max(observedMax, 1) : 0)
            };
        }

        window.getVisibleScoreUnitIds = function(termUnits = []) {
            const allIds = termUnits.map(u => String(u.id));
            const key = window.getScoreUnitVisibilityKey();
            const raw = localStorage.getItem(key);
            if(raw === null) return allIds;
            try {
                const parsed = JSON.parse(raw);
                let visibleIds = [];
                let knownIds = [];
                if(Array.isArray(parsed)) {
                    visibleIds = parsed.map(String);
                    knownIds = parsed.map(String);
                } else if(parsed && Array.isArray(parsed.visible)) {
                    visibleIds = parsed.visible.map(String);
                    knownIds = Array.isArray(parsed.known) ? parsed.known.map(String) : visibleIds;
                }
                const newIds = allIds.filter(id => !knownIds.includes(id));
                return Array.from(new Set([...visibleIds.filter(id => allIds.includes(id)), ...newIds]));
            } catch(e) {}
            return allIds;
        }

        window.saveVisibleScoreUnitIds = function(ids = []) {
            const sd = window.getSubjectData();
            const classConfig = sd.classData[state.clsId] || {};
            const allIds = (classConfig.learningUnits||[])
                .filter(u => String(u.term) === String(state.term))
                .map(u => String(u.id));
            localStorage.setItem(window.getScoreUnitVisibilityKey(), JSON.stringify({
                visible: ids.map(String).filter(id => allIds.includes(id)),
                known: allIds
            }));
        }

        window.toggleScoreUnitVisibility = function(unitId, checked) {
            const sd = window.getSubjectData();
            const classConfig = sd.classData[state.clsId];
            const termUnits = (classConfig.learningUnits||[]).filter(u => String(u.term) === String(state.term));
            const allIds = termUnits.map(u => String(u.id));

            window.saveVisibleScoreUnitIds(allIds.filter(id => visibleSet.has(id)));
            window.t_renderScoreTable();

        window.t_updateScoreTableValues = function() {
            const sd = window.getSubjectData();
            const cls = DB.classes[state.clsId];
            if(!cls) return;

            let scStore = sd.scores[state.clsId] || {};

            cls.students.forEach(stu => {
                let stuNode = scStore[stu.studentId] || {};
                let mySc = stuNode[state.term] || { indicators: {}, midTermScore: '', finalScore: '' };
                if(!mySc.indicators) mySc.indicators = {};

                ['mid', 'fin'].forEach(type => {
                    let dbKey = type === 'mid' ? 'midTermScore' : 'finalScore';
                    mySc[dbKey] = window.recoverScoreCellIfMissing(state.subjId, state.clsId, stu.studentId, state.term, dbKey, mySc[dbKey], recovered => { mySc[dbKey] = recovered; });
                    let inpEl = document.getElementById(`inp-${type}-${stu.studentId}`);
                    if (inpEl && document.activeElement !== inpEl) {
                        inpEl.value = window.scoreDisplayValue(mySc[dbKey], '', dbKey);
                    }
                });

                let termUnits = (sd.classData[state.clsId].learningUnits||[]).filter(u => String(u.term) === String(state.term));
                termUnits.forEach(u => {
                    if(u.indicators) {
                        u.indicators.forEach(ind => {
                            ['k', 'p', 'a'].forEach(type => {
                                let inpEl = document.getElementById(`inp-${type}-${stu.studentId}-${ind.id}`);
                                if (inpEl && document.activeElement !== inpEl) {
                                    if(!mySc.indicators[ind.id]) mySc.indicators[ind.id] = {};
                                    let rawVal = mySc.indicators[ind.id][type];
                                    rawVal = window.recoverScoreCellIfMissing(state.subjId, state.clsId, stu.studentId, state.term, `indicators.${ind.id}.${type}`, rawVal, recovered => { mySc.indicators[ind.id][type] = recovered; });
                                    let val = window.scoreDisplayValue(rawVal, '', type);
                                    inpEl.value = val;
                                }
                            });
                        });
                    }
                });

                window.updateRowTotal(stu.studentId);
            });
        }

        window.t_saveSc = function(sId, indId, type, val, max) {
            if(!window.ensureCanEditScorebook()) return;
            let v = val === '' ? '' : Number(val);
            if(v !== '' && v < 0) v = 0;
            if(v !== '' && v > max) { window.notify(`คะแนนเต็ม ${max}`, true); v = max; }
            
            let scStore = window.getSubjectData().scores[state.clsId];
            if(!scStore[sId]) scStore[sId] = {};
            if(!scStore[sId][state.term]) scStore[sId][state.term] = { indicators: {} };
            if(!scStore[sId][state.term].indicators) scStore[sId][state.term].indicators = {};
            if(!scStore[sId][state.term].indicators[indId]) scStore[sId][state.term].indicators[indId] = {};
            
            scStore[sId][state.term].indicators[indId][type] = v;
            window.rememberScoreSafetyValue(state.subjId, state.clsId, sId, state.term, `indicators.${indId}.${type}`, v);
            window.markScoreSubjectPending(state.subjId, state.clsId, sId);
            window.clearScoreAutoSave(state.subjId, state.clsId, sId, state.term, `indicators.${indId}.${type}`);
            window.registerPendingScoreWrite(state.subjId, state.clsId, sId, state.term, `indicators.${indId}.${type}`, v);
            window.saveSubjectDataLocalNow();
            window.updateRowTotal(sId);

            if (window.firebaseUpdateScore) {
                window.firebaseUpdateScore(state.subjId, state.clsId, sId, state.term, `indicators.${indId}.${type}`, v)
                    .then(() => window.resolvePendingScoreWrite(state.subjId, state.clsId, sId, state.term, `indicators.${indId}.${type}`))
                    .catch(() => {
                        window.scheduleScoreAutoSave(state.subjId, state.clsId, sId, state.term, `indicators.${indId}.${type}`, v);
                    });
            } else {
                window.saveDB();
            }
        }

        window.t_saveExam = function(sId, type, val, max) {
            if(!window.ensureCanEditScorebook()) return;
            let v = val === '' ? '' : Number(val);
            if(v !== '' && v < 0) v = 0;
            if(v !== '' && v > max) { window.notify(`คะแนนเต็ม ${max}`, true); v = max; }
            
            let scStore = window.getSubjectData().scores[state.clsId];
            if(!scStore[sId]) scStore[sId] = {};
            if(!scStore[sId][state.term]) scStore[sId][state.term] = { indicators: {} };

            scStore[sId][state.term][type] = v;
            window.rememberScoreSafetyValue(state.subjId, state.clsId, sId, state.term, type, v);
            window.markScoreSubjectPending(state.subjId, state.clsId, sId);
            window.clearScoreAutoSave(state.subjId, state.clsId, sId, state.term, type);
            window.registerPendingScoreWrite(state.subjId, state.clsId, sId, state.term, type, v);
            window.saveSubjectDataLocalNow();
            window.updateRowTotal(sId);

            if (window.firebaseUpdateScore) {
                window.firebaseUpdateScore(state.subjId, state.clsId, sId, state.term, type, v)
                    .then(() => window.resolvePendingScoreWrite(state.subjId, state.clsId, sId, state.term, type))
                    .catch(() => {
                        window.scheduleScoreAutoSave(state.subjId, state.clsId, sId, state.term, type, v);
                    });
            } else {
                window.saveDB();
            }
        }

            let stu = DB.classes[state.clsId].students.find(x => x.studentId === sId);

        }

        window.t_generateSelectedPrint = function() {
            const selectedUnits = Array.from(document.querySelectorAll('input[name="print_unit"]:checked')).map(cb => cb.value);
            const printKpa = $('print_kpa').checked;
            const printMid = $('print_mid').checked;
            const printFinal = $('print_final').checked;
            const printTotal = $('print_total').checked;
            window.hideModal();

            const sub = DB.subjects.find(x => x.id === state.subjId);
            const cls = DB.classes[state.clsId];
            const sd = window.getSubjectData();
            const classConfig = sd.classData[state.clsId];
            
            let termUnits = (classConfig.learningUnits||[]).filter(u => String(u.term) === String(state.term) && selectedUnits.includes(u.id));
            const printScoreStore = sd.scores[state.clsId] || {};
            const getPrintColumn = (indicator, type) => window.getEffectiveIndicatorColumn
                ? window.getEffectiveIndicatorColumn(indicator, type, printScoreStore, state.term)
                : { max: Number(indicator[`max_${type}`] || 0) };
            
            let hasAnyPrintedKpa = false;
            if (printKpa) {
                termUnits.forEach(u => {
                    if(u.indicators) {
                        u.indicators.forEach(ind => {
                            if (getPrintColumn(ind, 'k').max > 0 || getPrintColumn(ind, 'p').max > 0 || getPrintColumn(ind, 'a').max > 0) hasAnyPrintedKpa = true;
                        });
                    }
                });
            }
            let rowSpanAttr = hasAnyPrintedKpa ? 'rowspan="3"' : '';

            /* ปรับความกว้าง 3 คอลัมน์แรกให้เล็กลง */
            let thHtmlRow1 = `
                <th ${rowSpanAttr} class="print-num-col">เลขที่</th>
                <th ${rowSpanAttr} class="print-code-col">รหัส</th>
                <th ${rowSpanAttr} class="text-left print-name-col">ชื่อ-สกุล</th>
            `;
            let thHtmlRow2 = ``;
            let thHtmlRow3 = ``;

            termUnits.forEach(u => { 
                if (printKpa && hasAnyPrintedKpa) {
                    let uCols = 0;
                    let indRow2 = '';
                    let indRow3 = '';
                    if(u.indicators && u.indicators.length > 0) {
                        u.indicators.forEach((ind, iIdx) => {
                            let kpaCols = 0;
                            let kpaRow3 = '';
                            if(getPrintColumn(ind, 'k').max > 0) { kpaRow3 += `<th>K</th>`; kpaCols++; }
                            if(getPrintColumn(ind, 'p').max > 0) { kpaRow3 += `<th>P</th>`; kpaCols++; }
                            if(getPrintColumn(ind, 'a').max > 0) { kpaRow3 += `<th>A</th>`; kpaCols++; }
                            
                            if(kpaCols > 0) {
                                indRow2 += `<th colspan="${kpaCols}" class="print-indicator-header" title="${ind.name}"><span>${ind.name}</span></th>`;
                                indRow3 += kpaRow3;
                                uCols += kpaCols;
                            }
                        });
                    }
                    if (uCols === 0) {
                        thHtmlRow1 += `<th ${rowSpanAttr} class="print-unit-header" title="${u.name}"><span>${u.name}</span></th>`;
                    } else {
                        thHtmlRow1 += `<th colspan="${uCols + 1}" class="print-unit-header" title="${u.name}"><span>${u.name}</span></th>`;
                        thHtmlRow2 += indRow2 + `<th rowspan="2" class="align-middle">รวม</th>`;
                        thHtmlRow3 += indRow3;
                    }
                } else {
                    thHtmlRow1 += `<th ${rowSpanAttr} class="print-unit-header" title="${u.name}"><span>${u.name}</span></th>`; 
                }
            });
            
            if(printMid) thHtmlRow1 += `<th ${rowSpanAttr} class="print-score-col">กลางภาค</th>`;
            if(printFinal) thHtmlRow1 += `<th ${rowSpanAttr} class="print-score-col">ปลายภาค</th>`;
            if(printTotal) thHtmlRow1 += `<th ${rowSpanAttr} class="font-bold print-score-col">รวม</th><th ${rowSpanAttr} class="font-bold print-score-col">เกรด</th>`;

            let tableHtml = `<table class="print-table mb-6"><thead><tr>${thHtmlRow1}</tr>`;
            if (printKpa && hasAnyPrintedKpa) {
                tableHtml += `<tr>${thHtmlRow2}</tr><tr>${thHtmlRow3}</tr>`;
            }
            tableHtml += `</thead><tbody>`;

            let sumGrade = 0, passCount = 0;

            cls.students.forEach((s, idx) => {
                let scStore = sd.scores[state.clsId] || {};
                let stuNode = scStore[s.studentId] || {};
                let mySc = stuNode[state.term] || { indicators: {}, midTermScore: '', finalScore: '' };

                let trHtml = `<tr><td>${idx+1}</td><td>${s.studentId}</td><td class="text-left font-medium">${s.name}</td>`;
                termUnits.forEach(u => {
                    let uTotal = 0;
                    if (printKpa && hasAnyPrintedKpa) {
                        let hasInd = false;
                        if(u.indicators && u.indicators.length > 0) {
                            u.indicators.forEach(ind => {
                                let kpaCols = 0;
                                if(getPrintColumn(ind, 'k').max > 0) kpaCols++;
                                if(getPrintColumn(ind, 'p').max > 0) kpaCols++;
                                if(getPrintColumn(ind, 'a').max > 0) kpaCols++;

                                if(kpaCols > 0) {
                                    hasInd = true;
                                    let vals = mySc.indicators ? mySc.indicators[ind.id] : null;
                                    let vK = vals ? window.scoreDisplayValue(vals.k, '', 'k') : '';
                                    let vP = vals ? window.scoreDisplayValue(vals.p, '', 'p') : '';
                                    let vA = vals ? window.scoreDisplayValue(vals.a, '', 'a') : '';

                                    if(getPrintColumn(ind, 'k').max > 0) { trHtml += `<td>${vK}</td>`; uTotal += Number(vK)||0; }
                                    if(getPrintColumn(ind, 'p').max > 0) { trHtml += `<td>${vP}</td>`; uTotal += Number(vP)||0; }
                                    if(getPrintColumn(ind, 'a').max > 0) { trHtml += `<td>${vA}</td>`; uTotal += Number(vA)||0; }
                                }
                            });
                        }
                        if (!hasInd) {
                            trHtml += `<td></td>`;
                        } else {
                            trHtml += `<td class="font-bold bg-[#f8fafc] print:bg-transparent">${uTotal || ''}</td>`;
                        }
                    } else {
                        if(u.indicators) {
                            u.indicators.forEach(ind => {
                                let vals = mySc.indicators ? mySc.indicators[ind.id] : null;
                                if(vals) {
                                    uTotal += window.scoreNumber(vals.k, 'k') + window.scoreNumber(vals.p, 'p') + window.scoreNumber(vals.a, 'a');
                                }
                            });
                        }
                        trHtml += `<td>${uTotal || ''}</td>`;
                    }
                });

                if(printMid) trHtml += `<td>${window.scoreDisplayValue(mySc.midTermScore, '', 'midTermScore')}</td>`;
                if(printFinal) trHtml += `<td>${window.scoreDisplayValue(mySc.finalScore, '', 'finalScore')}</td>`;

                if(printTotal) {
                    let total = window.getStudentTotalScore(s, state.subjId, state.clsId, state.term);
                    let grade = window.calculateGrade(total, DB.gradeSettings);
                    sumGrade += Number(grade);
                    if(total >= DB.gradeSettings.passThreshold) passCount++;
                    trHtml += `<td class="font-bold">${total}</td><td class="font-bold">${grade}</td>`;
                }
                trHtml += `</tr>`;
                tableHtml += trHtml;
            });
            tableHtml += `</tbody></table>`;

            let avgGrade = cls.students.length && printTotal ? (sumGrade / cls.students.length).toFixed(2) : '0.00';
            let titleHtml = `
                <h3 class="text-lg mt-1 font-bold">รายงานผลการเรียน ภาคเรียนที่ ${state.term} ปีการศึกษา ${DB.schoolInfo.year}</h3>
                <p class="mt-1">วิชา ${sub.name} ${sub.code ? `รหัสวิชา ${sub.code}` : ''} ชั้น ${cls.name}</p>
            `;
            let reportHtml = window.generatePrintHTML(titleHtml, tableHtml, cls.students.length, printTotal ? passCount : '-', printTotal ? avgGrade : '-', sub, DB.teachers.find(x => x.id === state.user.id));
            window.openPrintWindow(reportHtml);
        }

        // Parent score reports read existing scores only and never write to the score database.
        window.guardianReportState = {
            classId: '',
            scoreType: 'mid',
            archiveYear: '',   // ว่าง = ใช้คะแนนปีปัจจุบัน, มีค่า = ดึงจากคลังข้อมูล (อ่านอย่างเดียว)
            conduct: 'เรียบร้อย',
            homeroomTeacherName: '',
            greeting: 'เรียน ท่านผู้ปกครอง',
            intro: '',
            previewStudentId: ''
        };
        window.guardianArchiveYears = [];
        window.guardianReportModel = null;
        window.guardianReportCloudCache = {};
        window.guardianReportRequestId = 0;

        window.loadGuardianReportSettings = function() {
            try {
                const saved = JSON.parse(localStorage.getItem('anpscore_guardianReportSettings') || '{}');
                if(saved && typeof saved === 'object' && !Array.isArray(saved)) {
                    window.guardianReportState = Object.assign(window.guardianReportState, saved);
                }
            } catch(e) {}
            if(!['mid', 'final', 'both'].includes(window.guardianReportState.scoreType)) {
                window.guardianReportState.scoreType = 'mid';
            }
        }

        window.saveGuardianReportSettings = function() {
            try {
                const s = window.guardianReportState;
                localStorage.setItem('anpscore_guardianReportSettings', JSON.stringify({
                    classId: s.classId,
                    scoreType: s.scoreType,
                    archiveYear: s.archiveYear,
                    conduct: s.conduct,
                    homeroomTeacherName: s.homeroomTeacherName,
                    greeting: s.greeting,
                    intro: s.intro
                }));
            } catch(e) {}
        }

        window.getGuardianReportAllowedClassIds = function() {
            if(state.user && state.user.role === 'admin') {
                return window.getSortedClassEntries().map(([cId]) => cId);
            }
            const teacher = DB.teachers.find(item => item.id === (state.user && state.user.id));
            const classIds = window.getTeacherHomeroomClasses(teacher, state.term)
                .filter(cId => !!DB.classes[cId]);
            return window.sortClassIds(classIds);
        }

        window.getGuardianReportSubjects = function(cId) {
            const assignedSubjectIds = new Set();
            (DB.teachers || []).forEach(teacher => {
                const assignments = window.getTeacherAssignments(teacher, state.term);
                Object.entries(assignments || {}).forEach(([subId, classIds]) => {
                    if((Array.isArray(classIds) ? classIds : []).some(id => String(id) === String(cId))) {
                        assignedSubjectIds.add(String(subId));
                    }
                });
            });

            return (DB.subjects || [])
                .filter(sub => {
                    const sd = DB_SubjectData[sub.id];
                    const hasClassConfig = !!(sd && sd.classData && sd.classData[cId]);
                    const hasScores = !!(sd && sd.scores && sd.scores[cId]);
                    return assignedSubjectIds.has(String(sub.id)) || hasClassConfig || hasScores;
                })
                .slice()
                .sort((a, b) => window.getAdminSubjectSortRank(a.name) - window.getAdminSubjectSortRank(b.name));
        }

        window.getGuardianHomeroomDefault = function(cId) {
            if(state.user && state.user.role === 'teacher') {
                const teacher = DB.teachers.find(item => item.id === state.user.id);
                return teacher ? teacher.name : '';
            }
            const teacher = (DB.teachers || []).find(item => {
                return window.getTeacherHomeroomClasses(item, state.term)
                    .some(id => String(id) === String(cId));
            });
            return teacher ? teacher.name : '';
        }

        window.getGuardianExamFullScore = function(subId, cId, scoreType) {
            if(scoreType === 'final') return 100;
            const sd = DB_SubjectData[subId] || {};
            const classConfig = (sd.classData && sd.classData[cId]) ? sd.classData[cId] : sd;
            const exam = (classConfig.examSettings && classConfig.examSettings[state.term]) || {};
            const value = Number(exam.mid);
            return Number.isFinite(value) && value >= 0 ? value : 20;
        }

        window.guardianScoreBlockHasAnyValue = function(termNode) {
            if(!termNode || typeof termNode !== 'object') return false;
            if(window.normalizeScoreValue(termNode.midTermScore, 'midTermScore') !== '') return true;
            if(window.normalizeScoreValue(termNode.finalScore, 'finalScore') !== '') return true;
            return Object.values(termNode.indicators || {}).some(indicatorScores => {
                if(!indicatorScores || typeof indicatorScores !== 'object') return false;
                return ['k', 'p', 'a'].some(key =>
                    window.normalizeScoreValue(indicatorScores[key], key) !== ''
                );
            });
        }

        window.getGuardianExamScore = function(subId, cId, studentId, scoreType) {
            const sd = DB_SubjectData[subId] || {};
            const studentNode = (((sd.scores || {})[cId] || {})[studentId]) || {};
            let termNode = studentNode[state.term];
            if(!termNode && (studentNode.midTermScore !== undefined || studentNode.finalScore !== undefined)) {
                termNode = studentNode;
            }
            termNode = termNode || {};
            if(scoreType === 'final') {
                if(!window.guardianScoreBlockHasAnyValue(termNode)) return null;
                const student = ((DB.classes[cId] && DB.classes[cId].students) || [])
                    .find(item => String(item.studentId) === String(studentId));
                if(!student) return null;
                const total = Number(window.getStudentTotalScore(student, subId, cId, state.term));
                return Number.isFinite(total) ? total : null;
            }
            const normalized = window.normalizeScoreValue(termNode.midTermScore, 'midTermScore');
            if(normalized === '') return null;
            const score = Number(normalized);
            return Number.isFinite(score) ? score : null;
        }

        window.guardianFormatNumber = function(value, fallback = '-') {
            if(value === null || value === undefined || value === '') return fallback;
            const num = Number(value);
            if(!Number.isFinite(num)) return fallback;
            return Number.isInteger(num) ? String(num) : num.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
        }

        window.getGuardianAcademicResult = function(percentage) {
            if(percentage >= 80) return 'ดีเยี่ยม';
            if(percentage >= 70) return 'ดี';
            if(percentage >= 50) return 'พอใช้';
            return 'ควรปรับปรุง';
        }

        window.getGuardianDefaultIntro = function(scoreType) {
            if(scoreType === 'final') {
                return `การประเมินผลการเรียนปลายภาค ภาคเรียนที่ ${state.term} ปีการศึกษา ${DB.schoolInfo.year} คะแนนที่แจ้งเป็นคะแนนรวมรายวิชาเต็ม 100 คะแนน จึงขอแจ้งผลการเรียนให้ผู้ปกครองทราบดังนี้`;
            }
            if(scoreType === 'both') {

        window.loadGuardianScoresFromCloud = async function(cId, subjects) {
            const cacheKey = `${state.term}|${cId}`;
            const cachedAt = Number(window.guardianReportCloudCache[cacheKey] || 0);
            if(Date.now() - cachedAt < 2 * 60 * 1000) return { attempted: false, failed: 0, cached: true };
            if(!window.cloudSyncState || !window.cloudSyncState.connected) return { attempted: false, failed: 0, localOnly: true };
            if(window.isCloudQuotaBackoffActive && window.isCloudQuotaBackoffActive()) return { attempted: false, failed: 0, localOnly: true };

            const cls = DB.classes[cId];
            const studentIds = cls && Array.isArray(cls.students) ? cls.students.map(stu => stu.studentId).filter(Boolean) : [];
            let failed = 0;
            let changed = false;
            for(let i = 0; i < subjects.length; i += 2) {
                const batch = subjects.slice(i, i + 2);
                const results = await Promise.all(batch.map(async sub => {
                    try {
                        return await window.firebaseLoadClassScores(sub.id, cId, studentIds, { refresh: false });
                    } catch(err) {
                        console.warn('Guardian report score preload failed:', sub.id, err);
                        failed++;
                        return false;
                    }
                }));
                if(results.some(Boolean)) changed = true;
                if(window.isCloudQuotaBackoffActive && window.isCloudQuotaBackoffActive()) break;
            }
            if(changed && window.saveSubjectDataLocalNow) window.saveSubjectDataLocalNow();
            if(failed === 0) window.guardianReportCloudCache[cacheKey] = Date.now();
            return { attempted: true, failed, changed };
        }

        // ---- คลังข้อมูลรายปีการศึกษา (ฝั่งแอป) --------------------------------
        // เก็บเฉพาะข้อมูลที่จำเป็นต่อการออกรายงานย้อนหลัง ไม่ใช่คะแนนดิบทั้งก้อน
        // ทำให้เอกสารเล็กและกู้กลับมาพิมพ์ได้ทันทีโดยไม่ต้องพึ่งโครงสร้างคะแนนปัจจุบัน
        window.buildYearArchiveSnapshot = function() {
            const originalTerm = state.term;
            const entries = [];
            try {
                ['1', '2'].forEach(term => {
                    state.term = term;
                    window.getSortedClassEntries().forEach(([clsId, cls]) => {
                        const subjects = window.getGuardianReportSubjects(clsId).map(sub => ({
                            id: sub.id,
                            name: sub.name || 'ไม่ระบุชื่อวิชา',
                            midFullScore: window.getGuardianExamFullScore(sub.id, clsId, 'mid'),
                            finalFullScore: 100
                        }));
                        const students = (cls.students || []).map(stu => ({
                            studentId: stu.studentId || '',
                            name: stu.name || '',
                            rows: subjects.map(sub => ({
                                mid: window.getGuardianExamScore(sub.id, clsId, stu.studentId, 'mid'),
                                final: window.getGuardianExamScore(sub.id, clsId, stu.studentId, 'final')
                            }))
                        }));
                        // ข้ามห้อง/เทอมที่ยังไม่มีคะแนนเลย เพื่อไม่ให้คลังเต็มไปด้วยเอกสารว่าง
                        const hasAnyScore = students.some(stu =>
                            stu.rows.some(r => r.mid !== null || r.final !== null));
                        if(!hasAnyScore) return;
                        entries.push({
                            term, classId: clsId,
                            payload: { className: cls.name || '', subjects, students,
                                homeroomTeacherName: window.getGuardianHomeroomDefault(clsId) }
                        });
                    });
                });
            } finally {
                state.term = originalTerm;
            }
            return { entries };
        };

        window.archiveCurrentYear = async function() {
            const year = String((DB.schoolInfo && DB.schoolInfo.year) || '').trim();
            if(!year) return window.notify('กรุณาระบุปีการศึกษาในหน้าตั้งค่าก่อน', true);
            if(!confirm(`เก็บคะแนนปีการศึกษา ${year} เข้าคลังข้อมูล?\n\nระบบจะบันทึกภาพรวมคะแนนทั้ง 2 ภาคเรียนไว้สำหรับพิมพ์รายงานย้อนหลัง\nคะแนนที่ใช้งานอยู่จะไม่ถูกแก้ไขหรือลบ`)) return;

            const btn = $('archive-year-btn');
            if(btn) { btn.disabled = true; btn.innerHTML = '<i class="ph ph-spinner-gap text-3xl animate-spin"></i> กำลังเก็บเข้าคลัง...'; }
            try {
                const snapshot = window.buildYearArchiveSnapshot();
                if(snapshot.entries.length === 0) {
                    window.notify('ยังไม่มีคะแนนให้เก็บเข้าคลัง', true);
                } else {
                    const saved = await window.firebaseSaveYearArchive(year, snapshot);
                    window.notify(`เก็บปีการศึกษา ${year} เข้าคลังแล้ว (${saved} ห้อง/ภาคเรียน)`);
                }
            } catch(err) {
                console.error(err);
                window.notify('เก็บเข้าคลังไม่สำเร็จ: ' + (err.message || ''), true);
            }
            if($('archive-year-btn')) {
                $('archive-year-btn').disabled = false;
                $('archive-year-btn').innerHTML = '<i class="ph ph-archive-box text-3xl opacity-80"></i> เก็บปีการศึกษานี้เข้าคลัง';
            }
        };

        // สร้างโมเดลรายงานจากข้อมูลในคลัง (อ่านอย่างเดียว) ใช้ตรรกะสรุปผลชุดเดียวกับปีปัจจุบัน
        window.buildArchivedReportModel = function(archive, scoreType) {
            if(!archive) return null;
            const isBoth = scoreType === 'both';
            const subjects = archive.subjects.map(sub => ({
                id: sub.id, name: sub.name, code: '',
                fullScore: (scoreType === 'final' || isBoth) ? sub.finalFullScore : sub.midFullScore,
                midFullScore: sub.midFullScore
            })).filter(sub => sub.fullScore > 0);

            let missingCount = 0, filledCount = 0;
            const students = archive.students.map((stu, index) => {
                let totalScore = 0, totalMidScore = 0;
                const gradePoints = [];
                const scoreRows = subjects.map((sub, i) => {
                    const raw = stu.rows[i] || {};
                    const score = (scoreType === 'final' || isBoth) ? raw.final : raw.mid;
                    const midScore = isBoth ? raw.mid : null;
                    if(score === null || score === undefined) missingCount++;
                    else { filledCount++; totalScore += score; }
                    if(midScore !== null && midScore !== undefined) totalMidScore += midScore;
                    const grade = (scoreType === 'final' || isBoth) && score !== null && score !== undefined
                        ? window.calculateGrade(score, DB.gradeSettings) : '';
                    if(grade !== '') gradePoints.push(Number(grade));
                    return { subjectId: sub.id, score: score === undefined ? null : score, midScore, grade };
                });
                const totalFullScore = subjects.reduce((sum, sub) => sum + sub.fullScore, 0);
                const totalMidFullScore = subjects.reduce((sum, sub) => sum + (sub.midFullScore || 0), 0);
                const percentage = totalFullScore > 0 ? (totalScore / totalFullScore) * 100 : 0;
                const midPercentage = totalMidFullScore > 0 ? (totalMidScore / totalMidFullScore) * 100 : 0;
                return {
                    studentId: stu.studentId, name: stu.name, number: index + 1, scoreRows,
                    totalScore, totalFullScore, totalMidScore, totalMidFullScore,
                    midPercentage, percentage,
                    gradeAverage: gradePoints.length ? gradePoints.reduce((a, b) => a + b, 0) / gradePoints.length : null,
                    academicResult: window.getGuardianAcademicResult(percentage)
                };
            });

            const s = window.guardianReportState;
            return {
                classId: s.classId, className: archive.className, scoreType,
                scoreLabel: scoreType === 'final' ? 'ปลายภาค (รวม 100 คะแนน)'
                    : (scoreType === 'both' ? 'กลางภาคและรวมทั้งภาค' : 'กลางภาค'),
                subjects, students, missingCount, filledCount,
                generatedAt: Date.now(), archivedYear: s.archiveYear,
                settings: {
                    conduct: s.conduct,
                    homeroomTeacherName: s.homeroomTeacherName || archive.homeroomTeacherName || '',
                    greeting: s.greeting, intro: s.intro
                }
            };
        };

        window.buildGuardianReportModel = function() {
            const s = window.guardianReportState;
            const cls = DB.classes[s.classId];
            if(!cls) return null;
            const isBoth = s.scoreType === 'both';
            const allSubjects = window.getGuardianReportSubjects(s.classId);
            const subjects = allSubjects.map(sub => ({
                id: sub.id,
                name: sub.name || 'ไม่ระบุชื่อวิชา',
                code: sub.code || '',
                fullScore: window.getGuardianExamFullScore(sub.id, s.classId, isBoth ? 'final' : s.scoreType),
                midFullScore: window.getGuardianExamFullScore(sub.id, s.classId, 'mid')
            })).filter(sub => sub.fullScore > 0);

            let missingCount = 0;
            let filledCount = 0;
            const students = (cls.students || []).map((student, index) => {
                let totalScore = 0;
                let totalMidScore = 0;
                const gradePoints = [];
                const scoreRows = subjects.map(sub => {
                    // โหมด "รวมทั้งสอง" ดึงทั้งคะแนนกลางภาคและคะแนนรวมทั้งภาคมาแสดงคู่กัน
                    const score = window.getGuardianExamScore(sub.id, s.classId, student.studentId, isBoth ? 'final' : s.scoreType);
                    const midScore = isBoth
                        ? window.getGuardianExamScore(sub.id, s.classId, student.studentId, 'mid')
                        : null;
                    if(score === null) missingCount++;
                    else {
                        filledCount++;
                        totalScore += score;
                    }
                    if(midScore !== null) totalMidScore += midScore;
                    // เกรดคิดจากคะแนนรวมทั้งภาค (เต็ม 100) ซึ่งรวมคะแนนกลางภาคอยู่แล้ว
                    const grade = (s.scoreType === 'final' || isBoth) && score !== null
                        ? window.calculateGrade(score, DB.gradeSettings)
                        : '';
                    if(grade !== '') gradePoints.push(Number(grade));
                    return { subjectId: sub.id, score, midScore, grade };
                });
                const totalFullScore = subjects.reduce((sum, sub) => sum + sub.fullScore, 0);
                const totalMidFullScore = subjects.reduce((sum, sub) => sum + (sub.midFullScore || 0), 0);
                const percentage = totalFullScore > 0 ? (totalScore / totalFullScore) * 100 : 0;
                const midPercentage = totalMidFullScore > 0 ? (totalMidScore / totalMidFullScore) * 100 : 0;
                const gradeAverage = gradePoints.length
                    ? gradePoints.reduce((sum, grade) => sum + grade, 0) / gradePoints.length
                    : null;
                return {
                    studentId: student.studentId || '',
                    name: student.name || '',
                    number: index + 1,
                    scoreRows,
                    totalScore,
                    totalFullScore,
                    totalMidScore,
                    totalMidFullScore,
                    midPercentage,
                    percentage,
                    gradeAverage,
                    academicResult: window.getGuardianAcademicResult(percentage)
                };
            });

            return {
                classId: s.classId,
                className: cls.name || '',
                scoreType: s.scoreType,
                scoreLabel: s.scoreType === 'final'
                    ? 'ปลายภาค (รวม 100 คะแนน)'
                    : (s.scoreType === 'both' ? 'กลางภาคและรวมทั้งภาค' : 'กลางภาค'),
                subjects,
                students,
                missingCount,
                filledCount,
                generatedAt: Date.now(),
                settings: {
                    conduct: s.conduct,
                    homeroomTeacherName: s.homeroomTeacherName,
                    greeting: s.greeting,
                    intro: s.intro
                }
            };
        }

        window.generateGuardianReports = async function(options = {}) {
            window.captureGuardianReportForm();
            const requestId = ++window.guardianReportRequestId;
            const s = window.guardianReportState;
            const cls = DB.classes[s.classId];
            if(!cls) {
                window.notify('กรุณาเลือกห้องเรียนก่อนสร้างรายงาน', true);
                return;
            }
            // โหมดคลังข้อมูล: อ่านจาก snapshot ที่เก็บไว้ ไม่ต้องแตะคะแนนสดหรือดึงจากคลาวด์
            if(s.archiveYear) {
                const archive = await window.firebaseLoadArchiveClass(s.archiveYear, state.term, s.classId);
                if(requestId !== window.guardianReportRequestId) return;
                if(!archive) {
                    $('guardian-report-output').innerHTML = `
                        <div class="py-12 text-center text-slate-500">
                            <i class="ph ph-archive-box text-4xl text-amber-500"></i>
                            <p class="font-bold mt-3">ไม่พบข้อมูลห้อง ${window.escapeHtml(cls.name || '')} ภาคเรียนที่ ${window.escapeHtml(state.term)} ในคลังปี ${window.escapeHtml(s.archiveYear)}</p>
                            <p class="text-sm mt-1">ลองเปลี่ยนภาคเรียน ห้องเรียน หรือเลือกปีอื่น</p>
                        </div>`;
                    window.guardianReportModel = null;
                    return;
                }
                window.guardianReportModel = window.buildArchivedReportModel(archive, s.scoreType);
                const archModel = window.guardianReportModel;
                if(!archModel.students.some(stu => String(stu.studentId) === String(s.previewStudentId))) {
                    s.previewStudentId = (archModel.students[0] || {}).studentId || '';
                }
                window.renderGuardianReportResults({ attempted: false, failed: 0 });
                if(!options.automatic) window.notify(`เปิดรายงานจากคลังข้อมูลปี ${s.archiveYear}`);
                return;
            }

            const subjects = window.getGuardianReportSubjects(s.classId);

            const btn = $('guardian-generate-btn');
            const restoreButton = () => {
                const currentBtn = $('guardian-generate-btn');
                if(!currentBtn) return;
                currentBtn.disabled = false;
                currentBtn.innerHTML = '<i class="ph ph-arrows-clockwise text-xl"></i> รีเฟรชคะแนนล่าสุด';
            };
            if(btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="ph ph-spinner-gap text-xl animate-spin"></i> กำลังดึงคะแนนล่าสุด';
            }
            let cloudResult = { attempted: false, failed: 0 };
            try {
                cloudResult = await window.firebaseLoadScoresForSubjectsBulk(subjects.map(sub => sub.id));
            } catch(err) {
                console.warn('Guardian report cloud load failed:', err);
                cloudResult.failed = subjects.length;
            }
            if(requestId !== window.guardianReportRequestId) return;

            window.guardianReportModel = window.buildGuardianReportModel();
            const model = window.guardianReportModel;
            if(!model || model.students.length === 0) {
                restoreButton();
                window.notify('ห้องนี้ยังไม่มีรายชื่อนักเรียน', true);
                return;
            }
            if(!model.students.some(stu => String(stu.studentId) === String(s.previewStudentId))) {
                s.previewStudentId = model.students[0].studentId;
            }
            window.renderGuardianReportResults(cloudResult);
            restoreButton();
            if(cloudResult.failed > 0) {
                window.notify('ดึงคะแนนบางรายวิชาจากคลาวด์ไม่สำเร็จ จึงใช้ข้อมูลล่าสุดในเครื่องร่วมด้วย', true);
            } else if(!options.automatic) {
                window.notify(`สร้างรายงานห้อง ${model.className} จากคะแนน${model.scoreLabel}แล้ว`);
            }
        }

        window.editTeacher = function(id = null) {
            let t = id ? DB.teachers.find(x => x.id === id) : { name: '', password: '', picUrl: '', assignments: {}, homeroomClasses: { "1": [], "2": [] } };
            let currentTermAsg = window.getTeacherAssignments(t, state.term);
            const currentHomeroomClasses = window.getTeacherHomeroomClasses(t, state.term);
            
            let globalAssignments = {};
            let globalHomerooms = {};
            DB.teachers.forEach(teacher => {
                if (id && teacher.id === id) return; 
                let termAsg = window.getTeacherAssignments(teacher, state.term);
                if (termAsg) {
                    Object.keys(termAsg).forEach(sId => {
                        termAsg[sId].forEach(cId => {
                            globalAssignments[`${sId}|${cId}`] = teacher.name;
                        });
                    });
                }
                window.getTeacherHomeroomClasses(teacher, state.term).forEach(cId => {
                    globalHomerooms[cId] = teacher.name;
                });
            });

            let homeroomHtml = `
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 mb-2">
                    <p class="text-sm text-emerald-900 font-extrabold flex items-center">

                    </p>
                    <p class="text-xs text-emerald-700 font-medium mt-1">ใช้กำหนดสิทธิ์ดูรายงานแจ้งผู้ปกครอง ครูจะเห็นเฉพาะห้องที่เลือกไว้ที่นี่</p>

                homeroomHtml += '<div class="text-sm text-slate-400 font-medium">ยังไม่มีห้องเรียนในระบบ</div>';

                window.getSortedClassEntries().forEach(([cId, cls]) => {
                    const checked = currentHomeroomClasses.includes(cId);

                    homeroomHtml += `
                        <label class="flex items-center text-sm ${assignedToOther ? 'cursor-not-allowed opacity-60 bg-slate-100' : 'cursor-pointer bg-white hover:border-emerald-300'} border border-slate-200 px-3 py-2 rounded-lg transition-colors">

        window.saveTeacher = function(id) {
            const name = $('mt-name').value.trim();
            const pwd = $('mt-pwd').value.trim();
            const pic = $('mt-pic').value.trim();
            const asgForTerm = {};
            document.querySelectorAll('input[name="ta"]:checked').forEach(cb => {
                let [s, c] = cb.value.split('|');
                if(!asgForTerm[s]) asgForTerm[s] = [];
                asgForTerm[s].push(c);

        window.cloneData = function(value) {
            return JSON.parse(JSON.stringify(value || {}));
        }

        window.inferStudentGenderRank = function(student) {
            const name = String((student && student.name) || '').replace(/\s+/g, '');
            if(/^(เด็กชาย|ด\.ช\.|นาย|Mr\.?)/i.test(name)) return 0;
            if(/^(เด็กหญิง|ด\.ญ\.|นางสาว|น\.ส\.|นาง|Miss|Ms\.?|Mrs\.?)/i.test(name)) return 1;
            return 2;
        }

        window.compareStudentIds = function(a, b) {
            const aId = String((a && a.studentId) || '').trim();
            const bId = String((b && b.studentId) || '').trim();
            const aNum = /^\d+$/.test(aId) ? Number(aId) : null;
            const bNum = /^\d+$/.test(bId) ? Number(bId) : null;
            if(aNum !== null && bNum !== null && aNum !== bNum) return aNum - bNum;
            return aId.localeCompare(bId, 'th', { numeric: true, sensitivity: 'base' });
        }

        window.compareStudentsForRoomNumber = function(a, b) {
            const genderDiff = window.inferStudentGenderRank(a) - window.inferStudentGenderRank(b);
            if(genderDiff !== 0) return genderDiff;
            const idDiff = window.compareStudentIds(a, b);
            if(idDiff !== 0) return idDiff;
            return String((a && a.name) || '').localeCompare(String((b && b.name) || ''), 'th', { sensitivity: 'base' });
        }

        window.sortClassStudents = function(cId) {
            const cls = DB.classes[cId];
            if(!cls || !Array.isArray(cls.students)) return;
            cls.students.sort(window.compareStudentsForRoomNumber);
        }

        window.parseClassSortParts = function(name) {
            const raw = String(name || '').replace(/^ห้อง\s*/i, '').trim();
            const clean = raw.replace(/\s+/g, '');
            const fallback = { levelRank: 99, grade: 999, room: 999, raw };
            const patterns = [
                { rank: 0, rx: /^(อ\.?|อนุบาล)(\d+)(?:\/(\d+))?/i },
                { rank: 1, rx: /^(ป\.?|ประถม(?:ศึกษา)?)(\d+)(?:\/(\d+))?/i },
                { rank: 2, rx: /^(ม\.?|มัธยม(?:ศึกษา)?)(\d+)(?:\/(\d+))?/i }
            ];
            for(const item of patterns) {
                const match = clean.match(item.rx);
                if(match) {
                    return {
                        levelRank: item.rank,
                        grade: Number(match[2] || 999),
                        room: Number(match[3] || 999),
                        raw
                    };
                }
            }
            const numeric = clean.match(/^(\d+)(?:\/(\d+))?/);
            if(numeric) {
                return {
                    levelRank: 50,
                    grade: Number(numeric[1] || 999),
                    room: Number(numeric[2] || 999),
                    raw
                };
            }
            return fallback;
        }

        window.compareClassEntries = function(a, b) {
            const aParts = window.parseClassSortParts((a[1] && a[1].name) || '');
            const bParts = window.parseClassSortParts((b[1] && b[1].name) || '');
            if(aParts.levelRank !== bParts.levelRank) return aParts.levelRank - bParts.levelRank;
            if(aParts.grade !== bParts.grade) return aParts.grade - bParts.grade;
            if(aParts.room !== bParts.room) return aParts.room - bParts.room;
            const nameDiff = aParts.raw.localeCompare(bParts.raw, 'th', { numeric: true, sensitivity: 'base' });
            if(nameDiff !== 0) return nameDiff;
            return String(a[0]).localeCompare(String(b[0]), 'th', { numeric: true, sensitivity: 'base' });
        }

        window.getSortedClassEntries = function(classIds = null) {
            let entries = Object.entries(DB.classes || {});
            if(Array.isArray(classIds)) {
                const allowed = new Set(classIds.map(id => String(id)));
                entries = entries.filter(([cId]) => allowed.has(String(cId)));
            }
            return entries.sort(window.compareClassEntries);
        }

        window.sortClassIds = function(classIds = []) {
            if(!Array.isArray(classIds)) return [];
            const order = new Map(window.getSortedClassEntries(classIds).map(([cId], idx) => [String(cId), idx]));
            return classIds.slice().sort((a, b) => {
                const aRank = order.has(String(a)) ? order.get(String(a)) : 999999;
                const bRank = order.has(String(b)) ? order.get(String(b)) : 999999;
                if(aRank !== bRank) return aRank - bRank;
                return String(a).localeCompare(String(b), 'th', { numeric: true, sensitivity: 'base' });
            });
        }

        window.countClassStudentId = function(cId, studentId) {
            const cls = DB.classes[cId];
            if(!cls || !Array.isArray(cls.students)) return 0;
            const id = String(studentId || '').trim();
            return cls.students.filter(stu => String((stu && stu.studentId) || '').trim() === id).length;
        }

        window.countAllScoreRecords = function(subjectData = window.DB_SubjectData) {
            let count = 0;
            Object.values(subjectData || {}).forEach(sd => {
                if(!sd || !sd.scores || typeof sd.scores !== 'object') return;
                Object.values(sd.scores).forEach(classScores => {
                    if(classScores && typeof classScores === 'object') count += Object.keys(classScores).length;
                });
            });
            return count;
        }

        window.getStudentMoveSummary = function(fromCId, toCId, studentId) {
            const summary = {
                movedSubjectIds: [],
                targetScoreConflicts: [],
                scoreBackup: {},
                scoreRecordCount: window.countAllScoreRecords()
            };
            const id = String(studentId || '').trim();
            Object.entries(window.DB_SubjectData || {}).forEach(([subId, sd]) => {
                if(!sd || !sd.scores || typeof sd.scores !== 'object') return;
                const sourceScores = sd.scores[fromCId];
                const targetScores = sd.scores[toCId];
                if(sourceScores && Object.prototype.hasOwnProperty.call(sourceScores, id)) {
                    summary.movedSubjectIds.push(subId);
                    summary.scoreBackup[subId] = window.cloneData(sourceScores[id]);
                    if(targetScores && Object.prototype.hasOwnProperty.call(targetScores, id)) {
                        summary.targetScoreConflicts.push(subId);
                    }
                }
            });
            return summary;
        }

        window.moveStudentWithScores = function(fromCId, toCId, studentId) {
            const dbBefore = window.cloneData(window.DB);
            const subjectBefore = window.cloneData(window.DB_SubjectData);
            const scoreCountBefore = window.countAllScoreRecords(subjectBefore);
            const id = String(studentId || '').trim();

            try {
                const sourceClass = DB.classes[fromCId];
                const targetClass = DB.classes[toCId];
                if(!sourceClass || !targetClass || fromCId === toCId) throw new Error('invalid class');
                const sourceIndex = (sourceClass.students || []).findIndex(stu => String((stu && stu.studentId) || '').trim() === id);
                if(sourceIndex < 0) throw new Error('student not found');
                if(window.countClassStudentId(fromCId, id) !== 1) throw new Error('duplicate source id');
                if(window.countClassStudentId(toCId, id) > 0) throw new Error('duplicate target id');

                const summary = window.getStudentMoveSummary(fromCId, toCId, id);
                if(summary.targetScoreConflicts.length > 0) throw new Error('target score conflict');

                const student = window.cloneData(sourceClass.students[sourceIndex]);
                window.recordStudentMoveBackup({
                    time: Date.now(),
                    student,
                    fromCId,
                    fromClassName: sourceClass.name || '',
                    toCId,
                    toClassName: targetClass.name || '',
                    movedSubjectIds: summary.movedSubjectIds,
                    scoreBackup: summary.scoreBackup
                });

                sourceClass.students.splice(sourceIndex, 1);
                targetClass.students.push(student);

                summary.movedSubjectIds.forEach(subId => {
                    const sd = window.DB_SubjectData[subId];
                    if(!sd.scores[toCId]) sd.scores[toCId] = {};
                    sd.scores[toCId][id] = window.cloneData(sd.scores[fromCId][id]);
                    delete sd.scores[fromCId][id];
                });

                window.sortClassStudents(fromCId);
                window.sortClassStudents(toCId);

                const scoreCountAfter = window.countAllScoreRecords(window.DB_SubjectData);
                const movedStudentInTarget = window.countClassStudentId(toCId, id) === 1;
                const movedStudentRemovedFromSource = window.countClassStudentId(fromCId, id) === 0;
                const copiedScoresOk = summary.movedSubjectIds.every(subId => {
                    const sd = window.DB_SubjectData[subId];
                    return sd && sd.scores && sd.scores[toCId] && JSON.stringify(sd.scores[toCId][id]) === JSON.stringify(summary.scoreBackup[subId])
                        && (!sd.scores[fromCId] || !Object.prototype.hasOwnProperty.call(sd.scores[fromCId], id));
                });

                if(scoreCountBefore !== scoreCountAfter || !movedStudentInTarget || !movedStudentRemovedFromSource || !copiedScoresOk) {
                    window.DB = dbBefore;
                    DB = window.DB;
                    window.DB_SubjectData = subjectBefore;
                    DB_SubjectData = window.DB_SubjectData;
                    throw new Error('move validation failed');
                }

                window.saveLocalDB();
                summary.movedSubjectIds.forEach(subId => {
                    window.markSubjectDirty(subId);
                    if(typeof window.firebaseDeleteScoreEntry === 'function') {
                        window.firebaseDeleteScoreEntry(subId, fromCId, id).catch(err => console.warn('Old moved score cleanup failed:', err));
                    }
                });
                if(typeof window.firebaseSaveFn === 'function') window.firebaseSaveFn();
                if(typeof window.classToggleState === 'undefined') window.classToggleState = {};
                window.classToggleState[fromCId] = true;
                window.classToggleState[toCId] = true;
                window.updateClassesList();
                window.notify(`ย้ายห้องสำเร็จ และย้ายคะแนนตามไป ${summary.movedSubjectIds.length} วิชา`);
            } catch(err) {
                console.error(err);
                window.DB = dbBefore;
                DB = window.DB;
                window.DB_SubjectData = subjectBefore;
                DB_SubjectData = window.DB_SubjectData;
                window.saveLocalDB();
                if(typeof window.updateClassesList === 'function') window.updateClassesList();
                window.notify('ย้ายไม่สำเร็จ ระบบคืนข้อมูลเดิมแล้วเพื่อป้องกันข้อมูลหาย', true);
            }
        }

        window.processExcelImport = function(file, cId, inputElement) {
            const reader = new FileReader();
            reader.onload = async function(evt) {
                const data = evt.target.result;
                const workbook = XLSX.read(data, {type: 'binary'});
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(sheet, {header: 1});
                
                let newStudents = [];
                let count = 0;
                for(let i=0; i<json.length; i++) {
                    const row = json[i];
                    if(row.length >= 2 && row[0] && row[1] && i > 0) { 
                        newStudents.push({ studentId: String(row[0]).trim(), name: String(row[1]).trim() });
                        count++;
                    }
                }
                
                if(count > 0) {
                    DB.classes[cId].students = newStudents;
                    window.sortClassStudents(cId);
                    if (typeof window.classToggleState === 'undefined') window.classToggleState = {};
                    window.classToggleState[cId] = true; 
                    window.saveDB();
                    window.updateClassesList();
                    window.notify(`นำเข้าและเขียนทับรายชื่อสำเร็จ ${count} คน`);
                } else {
                    window.notify('ไม่พบข้อมูลนักเรียนในไฟล์', true);
                }
                if(inputElement) inputElement.value = ''; 
            };
            reader.readAsBinaryString(file);
        }

        window.importStudents = function(e, cId) {
            const file = e.target.files[0];
            const inputEl = e.target;
            if(!file) return;

            const existingCount = DB.classes[cId].students.length;
            if (existingCount > 0) {
                const confirmMsg = `ห้องเรียนนี้มีรายชื่อนักเรียนอยู่แล้ว <span class="font-bold text-rose-600">${existingCount}</span> คน\n\nการนำเข้าไฟล์ใหม่จะ <strong class="text-slate-800">"ลบรายชื่อเดิมและเขียนทับทั้งหมด"</strong>\n\nคุณยืนยันที่จะดำเนินการต่อหรือไม่?`;
                window.showCustomConfirm('ยืนยันการเขียนทับข้อมูล', confirmMsg, 'danger', 
                    () => { window.processExcelImport(file, cId, inputEl); },
                    () => { inputEl.value = ''; }

            } else {
                window.processExcelImport(file, cId, inputEl);
            }
        }
