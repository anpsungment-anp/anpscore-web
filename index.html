<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANPSCORE - ระบบบริหารจัดการผลการเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        try {
            if ((localStorage.getItem('anpscore_theme') || 'light') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }

    <style>
        :root {
            --brand-primary: #2563eb;
            --brand-secondary: #0f766e;
            --brand-accent: #6366f1;
            --surface: rgba(255, 255, 255, 0.94);
            --surface-soft: rgba(248, 250, 252, 0.86);
            --line: #e2e8f0;
            --shadow-card: 0 14px 34px rgba(15, 23, 42, 0.07);
            --shadow-soft: 0 8px 22px rgba(15, 23, 42, 0.06);
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background:
                radial-gradient(circle at 18% 0%, rgba(37, 99, 235, 0.08), transparent 30rem),
                radial-gradient(circle at 100% 0%, rgba(15, 118, 110, 0.08), transparent 28rem),
                #f6f8fb;
            color: #334155;
            font-size: 16px;
            overflow: hidden;
            letter-spacing: 0;
        }
        html.dark-mode body { background-color: #020617; color: #cbd5e1; }
        html.dark-mode #app-container,
        html.dark-mode #content-area { background: #0f172a !important; }
        html.dark-mode #sidebar,
        html.dark-mode .glass-header,
        html.dark-mode .modern-card,
        html.dark-mode #modal-content,
        html.dark-mode .a4-preview-container { background-color: #111827 !important; border-color: #1f2937 !important; color: #e5e7eb !important; }
        html.dark-mode .glass-header { background: rgba(15, 23, 42, 0.86) !important; }
        html.dark-mode .glass-panel { background: rgba(15, 23, 42, 0.72) !important; border-color: rgba(148, 163, 184, 0.2) !important; }
        html.dark-mode .bg-white,
        html.dark-mode .bg-slate-50,
        html.dark-mode .bg-gray-50 { background-color: #111827 !important; }
        html.dark-mode .bg-slate-100,
        html.dark-mode .bg-gray-100,
        html.dark-mode .bg-indigo-50 { background-color: #1e293b !important; }
        html.dark-mode .border-slate-100,
        html.dark-mode .border-slate-200,
        html.dark-mode .border-gray-50,
        html.dark-mode .border-gray-100,
        html.dark-mode .border-gray-200 { border-color: #334155 !important; }
        html.dark-mode .text-slate-400,
        html.dark-mode .text-slate-500,
        html.dark-mode .text-gray-500 { color: #94a3b8 !important; }
        html.dark-mode .text-slate-600,
        html.dark-mode .text-slate-700,
        html.dark-mode .text-gray-700 { color: #cbd5e1 !important; }
        html.dark-mode .text-slate-800,
        html.dark-mode .text-gray-800,
        html.dark-mode .text-gray-900 { color: #f8fafc !important; }
        html.dark-mode .text-indigo-100 { color: #e0e7ff !important; }
        html.dark-mode .text-indigo-400,
        html.dark-mode .text-indigo-500,
        html.dark-mode .text-indigo-600 { color: #a5b4fc !important; }
        html.dark-mode .text-indigo-700,
        html.dark-mode .text-indigo-800,
        html.dark-mode .text-indigo-900 { color: #c7d2fe !important; }
        html.dark-mode .hover\:text-indigo-600:hover,
        html.dark-mode .hover\:text-indigo-700:hover,
        html.dark-mode .group:hover .group-hover\:text-indigo-600,
        html.dark-mode .group:hover .group-hover\:text-indigo-700 { color: #dbeafe !important; }
        html.dark-mode .text-emerald-600,
        html.dark-mode .text-emerald-700,
        html.dark-mode .text-emerald-800 { color: #86efac !important; }
        html.dark-mode .text-amber-600,
        html.dark-mode .text-amber-700,
        html.dark-mode .text-amber-800 { color: #fde68a !important; }
        html.dark-mode .text-rose-600,
        html.dark-mode .text-rose-700,
        html.dark-mode .text-rose-800 { color: #fda4af !important; }
        html.dark-mode .bg-indigo-100 { background-color: rgba(67, 56, 202, 0.28) !important; }
        html.dark-mode .bg-emerald-50,
        html.dark-mode .bg-emerald-100 { background-color: rgba(6, 78, 59, 0.55) !important; }
        html.dark-mode .bg-amber-50,
        html.dark-mode .bg-amber-100 { background-color: rgba(120, 53, 15, 0.5) !important; }
        html.dark-mode .bg-rose-50,
        html.dark-mode .bg-rose-100 { background-color: rgba(136, 19, 55, 0.48) !important; }
        html.dark-mode [class*="bg-slate-50/"],
        html.dark-mode [class*="bg-white/"] { background-color: rgba(15, 23, 42, 0.72) !important; }
        html.dark-mode input,
        html.dark-mode select,
        html.dark-mode textarea {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }
        html.dark-mode input::placeholder,
        html.dark-mode textarea::placeholder { color: #64748b !important; }
        html.dark-mode table th { background-color: rgba(30, 41, 59, 0.94) !important; color: #cbd5e1 !important; }
        html.dark-mode table td { background-color: #0f172a; color: #dbeafe; }
        html.dark-mode .scorebook-scroll,
        html.dark-mode .scorebook-table,
        html.dark-mode .scorebook-table td,
        html.dark-mode .scorebook-table th { background-color: #0f172a !important; }
        html.dark-mode .scorebook-input { background: transparent !important; color: #f8fafc !important; }
        html.dark-mode .shadow-sm,
        html.dark-mode .shadow-lg,
        html.dark-mode .shadow-xl,
        html.dark-mode .shadow-2xl { box-shadow: 0 18px 45px rgba(0,0,0,0.35) !important; }
        html.dark-mode .print-table,
        html.dark-mode .print-table th,
        html.dark-mode .print-table td,
        html.dark-mode #print-view,
        html.dark-mode .a4-preview-container {
            color: #000 !important;
            background: #fff !important;
        }
        
        /* Glassmorphism Effects */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
        }
        
        /* Modern Cards */
        .modern-card { 
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--line);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }
        .modern-card:hover { 
            box-shadow: var(--shadow-card);
            transform: translateY(-1px);
            border-color: rgba(148, 163, 184, 0.55);
        }
        
        /* Colorful Gradients */
        .bg-login-gradient { background: linear-gradient(135deg, #2563eb 0%, #0f766e 100%); }
        .bg-primary-gradient { background: linear-gradient(135deg, #2563eb 0%, #0f766e 100%); }
        
        /* Interactive Utilities */
        .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); border-color: var(--brand-primary); }
        .tactile-btn { transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease; cursor: pointer; }
        .tactile-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 18px -10px rgba(15, 23, 42, 0.28); }
        .tactile-btn:active { transform: translateY(0) scale(0.985); box-shadow: none; }

        /* 2026 UI refresh */
        #app-container { background: linear-gradient(180deg, rgba(248, 250, 252, 0.72), rgba(241, 245, 249, 0.98)) !important; }
        #content-area { background: transparent !important; }
        #sidebar {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(226, 232, 240, 0.9) !important;
            box-shadow: 8px 0 30px rgba(15, 23, 42, 0.05) !important;
        }
        #sidebar h2 { letter-spacing: -0.02em; }
        #sidebar .border-b,
        #sidebar .border-t { border-color: rgba(226, 232, 240, 0.78) !important; }
        #page-title {
            font-size: clamp(1.25rem, 1.5vw, 1.65rem);
            line-height: 1.25;
            letter-spacing: -0.01em;
        }
        #header-term-display,
        #active-users-pill,
        #theme-toggle-btn {
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
            white-space: nowrap;
        }
        #content-wrapper { max-width: 100%; }
        input,
        select,
        textarea {
            border-radius: 12px !important;
            border-color: #dbe3ef !important;
        }
        input:hover,
        select:hover,
        textarea:hover { border-color: #b6c3d5 !important; }
        table {
            border-collapse: separate;
            border-spacing: 0;
        }
        table th {
            color: #334155;
            background: rgba(248, 250, 252, 0.92);
            border-color: #e2e8f0;
        }
        table td { border-color: #edf2f7; }
        .scorebook-card,
        .scorebook-scroll { border-radius: 14px; }
        .scorebook-table th {
            font-size: 12px;
            font-weight: 800;
            color: #334155;
        }
        .scorebook-table td {
            font-size: 13px;
            color: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #b6c3d5;
            border-radius: 999px;
        }
        html.dark-mode body {
            background:
                radial-gradient(circle at 16% 0%, rgba(59, 130, 246, 0.16), transparent 32rem),
                radial-gradient(circle at 100% 0%, rgba(45, 212, 191, 0.1), transparent 28rem),
                #07111f;
        }
        html.dark-mode #app-container,
        html.dark-mode #content-area { background: transparent !important; }
        html.dark-mode #sidebar,
        html.dark-mode .glass-header,
        html.dark-mode .modern-card,
        html.dark-mode #modal-content {
            background-color: rgba(15, 23, 42, 0.88) !important;
            border-color: rgba(71, 85, 105, 0.72) !important;
        }
        html.dark-mode .modern-card {
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22) !important;
        }
        html.dark-mode .modern-card:hover {
            border-color: rgba(125, 211, 252, 0.42) !important;
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28) !important;
        }
        html.dark-mode table th {
            background: rgba(30, 41, 59, 0.96) !important;
            color: #e2e8f0 !important;
        }
        html.dark-mode table td { border-color: rgba(51, 65, 85, 0.82) !important; }
        
        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        input, select, textarea { font-size: 16px !important; transition: all 0.2s; }
        table th { font-size: 15px; font-weight: 700; background-color: rgba(248, 250, 252, 0.9); backdrop-filter: blur(8px); color: #475569; }
        table td { font-size: 15px; }

        .scorebook-card:hover { transform: none; }
        .scorebook-scroll {
            max-height: min(64vh, calc(100vh - 360px));
            overflow: auto;
            overscroll-behavior: contain;
            background: #fff;
        }
        .scorebook-table {
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
        }
        .scorebook-table th,
        .scorebook-table td {
            height: 38px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .scorebook-table thead {
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .scorebook-table thead th {
            z-index: 31;
        }
        .scorebook-table .score-num-col { width: 44px; min-width: 44px; max-width: 44px; }
        .scorebook-table .score-code-col { width: 70px; min-width: 70px; max-width: 70px; }
        .scorebook-table .score-name-col { width: 190px; min-width: 190px; max-width: 190px; }
        .scorebook-table .score-mark-col { width: 56px; min-width: 56px; max-width: 56px; }
        .scorebook-table .score-exam-col,
        .scorebook-table .score-total-col { width: 58px; min-width: 58px; max-width: 58px; }
        .scorebook-table .score-grade-col { width: 52px; min-width: 52px; max-width: 52px; }
        .scorebook-table .score-sticky-num {
            position: sticky;
            left: 0;
            z-index: 22;
        }
        .scorebook-table .score-sticky-name {
            position: sticky;
            left: 114px;
            z-index: 22;
        }
        .scorebook-table thead .score-sticky-num,
        .scorebook-table thead .score-sticky-code,
        .scorebook-table thead .score-sticky-name {
            z-index: 42;
        }
        .scorebook-table .score-sticky-code {
            position: sticky;
            left: 44px;
            z-index: 22;
        }
        .scorebook-unit-title {
            display: block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .scorebook-input {
            height: 34px;
            min-width: 0;
            padding: 4px 2px !important;
            font-size: 14px !important;
            line-height: 1;
        }
        @media (max-width: 900px) {
            .scorebook-scroll { max-height: calc(100vh - 330px); }
            .scorebook-table .score-code-col { width: 64px; min-width: 64px; max-width: 64px; }
            .scorebook-table .score-name-col { width: 165px; min-width: 165px; max-width: 165px; }
            .scorebook-table .score-mark-col { width: 52px; min-width: 52px; max-width: 52px; }
            .scorebook-table .score-sticky-name { left: 108px; }
        }

        /* --- รูปแบบตารางสำหรับการพิมพ์ --- */
        .print-table { 
            width: 100%; 
            max-width: 100%;
            border-collapse: collapse; 
            color: #000; 
            table-layout: fixed; 
        }
        .print-table th, .print-table td { 
            border: 1px solid #000; 
            padding: 4px 2px; 
            text-align: center; 
            font-size: 11px; 
            word-wrap: break-word; 
            overflow-wrap: anywhere; 
            word-break: break-word;
            line-height: 1.15; 
            box-sizing: border-box;
            vertical-align: middle;
        }
        .print-table th { 
            background-color: #f3f4f6 !important; 
            font-weight: bold; 
            font-size: 11px; 
            white-space: normal;
            -webkit-print-color-adjust: exact; 
            print-color-adjust: exact; 
        }
        .print-table .print-unit-header,
        .print-table .print-indicator-header {
            white-space: normal !important;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.12;
        }
        .print-table .print-unit-header > span,
        .print-table .print-indicator-header > span {
            display: block;
            max-width: 100%;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .print-table .print-num-col { width: 4%; }
        .print-table .print-code-col { width: 7%; }
        .print-table .print-name-col { width: 18%; min-width: 86px; }
        .print-table .print-score-col { width: 4.5%; }
        .print-table .text-left { text-align: left !important; padding-left: 6px !important; }
        .print-logo { width: 75px; height: 75px; object-fit: contain; margin: 0 auto 10px auto; display: block; }

        .a4-preview-container {
            width: 210mm;
            max-width: 100%;
            min-height: 297mm;
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin: 0 auto;
            padding: 10mm 15mm;
            position: relative;
        }

        .break-inside-avoid {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        @media print {
            @page { size: A4 portrait; margin: 8mm; } 
            body { background: white !important; margin: 0; padding: 0; color: #000; overflow: visible !important; font-size: 11pt; }
            .no-print, #sidebar, #header, .bg-login-gradient, #loading-screen, #app-container, #modal-container, #toast { display: none !important; }
            #print-view { position: static !important; display: block !important; padding: 0 !important; width: 100% !important; height: auto !important; background: white !important; z-index: 10; overflow: visible !important; }
            .a4-preview-container { width: 100% !important; max-width: 100% !important; min-height: 0 !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
            
            .print-table { width: 100% !important; max-width: 100% !important; table-layout: fixed !important; }
            .print-table th, .print-table td { font-size: 8px !important; padding: 2px 1px !important; line-height: 1.08; white-space: normal !important; overflow-wrap: anywhere !important; word-break: break-word !important; } 
            .print-table th { font-size: 8.2px !important; padding: 3px 1px !important; }
            .print-table tr { page-break-inside: avoid; break-inside: avoid; }
            
            .page-break { page-break-before: always; }

            .print-area {
                width: 100%;
                max-width: 100%;
                zoom: 0.95; 
            }
            .print-table td:not(.text-left) {
                white-space: normal !important; 
            }
        }
    </style>
</head>
<body class="h-screen w-full flex relative">

    <div id="loading-screen" class="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-login-gradient text-white transition-opacity duration-700">
        <div class="relative">
            <i class="ph ph-spinner-gap text-7xl animate-spin"></i>
            <div class="absolute inset-0 bg-white blur-xl opacity-20 rounded-full animate-pulse"></div>
        </div>
        <h2 class="text-3xl font-extrabold mt-6 tracking-widest drop-shadow-md">ANPSCORE</h2>
        <p class="text-indigo-100 mt-2 font-medium">กำลังเตรียมพร้อมระบบ...</p>
    </div>

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-login-gradient transition-opacity duration-500 hidden opacity-0">
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse"></div>
            <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 2s;"></div>
        </div>
        
        <div class="glass-panel p-10 rounded-[2.5rem] w-full max-w-md mx-4 text-center relative z-10 animate-fade-in-up">
            <div id="login-logo-container" class="mb-5 flex justify-center">
                <div class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[1.5rem] flex items-center justify-center text-white shadow-xl transform hover:scale-105 transition-transform duration-300">
                    <i class="ph ph-graduation-cap text-5xl"></i>
                </div>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-800 mb-1 tracking-tight">ANPSCORE</h1>
            <p class="text-gray-500 mb-8 font-medium">ระบบบริหารจัดการผลการเรียน</p>

            <div class="flex bg-gray-100/80 p-1.5 rounded-2xl mb-8 shadow-inner">
                <button onclick="window.switchLoginTab('teacher')" id="tab-teacher" class="flex-1 py-2.5 rounded-xl bg-white shadow-sm text-indigo-600 font-bold text-sm transition-all duration-300">ครูผู้สอน</button>
                <button onclick="window.switchLoginTab('admin')" id="tab-admin" class="flex-1 py-2.5 rounded-xl text-gray-500 font-bold text-sm transition-all duration-300 hover:text-gray-700">ผู้ดูแลระบบ</button>
            </div>

            <form id="form-teacher-login" class="text-left animate-fade-in-up stagger-1" onsubmit="event.preventDefault(); window.doLogin('teacher');">
                <label class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">เลือกบัญชีผู้ใช้</label>
                <select id="login-teacher-sel" class="w-full border border-gray-200 rounded-2xl p-3.5 focus-ring mb-5 bg-white/80 backdrop-blur-sm shadow-sm transition-colors hover:bg-white text-gray-700 font-medium">
                    <option value="">-- เลือกบัญชีของคุณ --</option>
                </select>
                <label class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">รหัสผ่าน</label>
                <input type="password" id="login-teacher-pwd" class="w-full border border-gray-200 rounded-2xl p-3.5 focus-ring mb-8 bg-white/80 backdrop-blur-sm shadow-sm transition-colors hover:bg-white text-gray-800" placeholder="••••••••">
                <button type="submit" class="tactile-btn w-full bg-primary-gradient text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 text-lg flex justify-center items-center gap-2">
                    เข้าสู่ระบบ <i class="ph ph-arrow-right font-bold"></i>
                </button>
            </form>

            <form id="form-admin-login" class="text-left hidden animate-fade-in-up stagger-1" onsubmit="event.preventDefault(); window.doLogin('admin');">

        // --- Helper Function for Drive Image URLs ---
        window.formatImgUrl = function(url) {
            if (!url) return '';
            const cleanUrl = String(url).trim();
            if(!cleanUrl || cleanUrl.startsWith('data:image/')) return cleanUrl;
            if(!/drive\.google\.com/i.test(cleanUrl)) return cleanUrl;

            const driveIdPatterns = [
                /drive\.google\.com\/file\/d\/([^/?#]+)/i,
                /drive\.google\.com\/open\?id=([^&#]+)/i,
                /drive\.google\.com\/uc\?(?:.*[?&])?id=([^&#]+)/i,
                /drive\.google\.com\/thumbnail\?(?:.*[?&])?id=([^&#]+)/i,
                /[?&]id=([^&#]+)/i
            ];
            for(const pattern of driveIdPatterns) {
                const match = cleanUrl.match(pattern);
                if(match && match[1]) {
                    return `https://drive.google.com/thumbnail?id=${encodeURIComponent(match[1])}&sz=w400`;
                }
            }
            return cleanUrl;
        }

        window.compressImageDataUrl = function(dataUrl, maxSize = 180, quality = 0.82) {
            return new Promise((resolve) => {
                if(!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image/')) return resolve(dataUrl);
                const img = new Image();
                img.onload = () => {
                    try {
                        const scale = Math.min(1, maxSize / img.width, maxSize / img.height);
                        const w = Math.max(1, Math.round(img.width * scale));
                        const h = Math.max(1, Math.round(img.height * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        const candidates = [
                            canvas.toDataURL('image/webp', quality),
                            canvas.toDataURL('image/png')
                        ].filter(Boolean);
                        const best = candidates.reduce((shortest, item) => item.length < shortest.length ? item : shortest, dataUrl);
                        resolve(best.length < dataUrl.length ? best : dataUrl);
                    } catch(e) {
                        console.warn('Logo compression skipped:', e);
                        resolve(dataUrl);
                    }
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        window.compressSchoolLogo = async function(dbObj) {
            if(!dbObj || !dbObj.schoolInfo) return dbObj;
            const logo = dbObj.schoolInfo.logo;
            if(typeof logo === 'string' && logo.length > 160000 && logo.startsWith('data:image/')) {
                dbObj.schoolInfo.logo = await window.compressImageDataUrl(logo);
            }
            return dbObj;
        }

        window.normalizeScoreValue = function(value, preferredKey = '') {
            const seen = new Set();
            const pick = (item) => {
                if(item === null || item === undefined || item === '') return '';
                if(typeof item === 'number') return Number.isFinite(item) ? item : '';
                if(typeof item === 'string') {
                    const trimmed = item.trim();
                    if(!trimmed || trimmed === '[object Object]') return '';
                    const num = Number(trimmed);
                    return Number.isFinite(num) ? num : '';
                }
                if(typeof item === 'boolean') return item ? 1 : 0;
                if(Array.isArray(item)) {
                    for(const entry of item) {
                        const found = pick(entry);
                        if(found !== '') return found;
                    }
                    return '';
                }
                if(typeof item === 'object') {
                    if(seen.has(item)) return '';
                    seen.add(item);
                    const priorityKeys = [preferredKey, 'value', 'score', 'total', 'amount', 'midTermScore', 'finalScore', 'mid', 'final', 'k', 'p', 'a'].filter(Boolean);
                    for(const key of priorityKeys) {
                        if(Object.prototype.hasOwnProperty.call(item, key)) {
                            const found = pick(item[key]);
                            if(found !== '') return found;
                        }
                    }
                    for(const entry of Object.values(item)) {
                        const found = pick(entry);
                        if(found !== '') return found;
                    }
                }
                return '';
            };
            return pick(value);
        }

        window.scoreNumber = function(value, preferredKey = '') {
            const normalized = window.normalizeScoreValue(value, preferredKey);
            const num = Number(normalized);
            return Number.isFinite(num) ? num : 0;
        }

        window.scoreDisplayValue = function(value, fallback = '', preferredKey = '') {
            const normalized = window.normalizeScoreValue(value, preferredKey);
            return normalized === '' ? fallback : normalized;
        }

        window.normalizeSubjectScores = function(subjectData) {
            if(!subjectData || typeof subjectData !== 'object' || !subjectData.scores || typeof subjectData.scores !== 'object') return false;
            let changed = false;
            const setIfFixed = (obj, key) => {
                if(!obj || typeof obj !== 'object' || obj[key] === undefined) return;
                const fixed = window.normalizeScoreValue(obj[key], key);
                if(obj[key] !== fixed) {
                    obj[key] = fixed;
                    changed = true;
                }
            };
            const fixScoreBlock = (scoreBlock) => {
                if(!scoreBlock || typeof scoreBlock !== 'object') return;
                if(scoreBlock.indicators && typeof scoreBlock.indicators === 'object') {
                    Object.values(scoreBlock.indicators).forEach(indScores => {
                        if(indScores && typeof indScores === 'object') {
                            ['k', 'p', 'a'].forEach(key => setIfFixed(indScores, key));
                        }
                    });
                }
                ['midTermScore', 'finalScore'].forEach(key => setIfFixed(scoreBlock, key));
            };

            Object.values(subjectData.scores).forEach(classScores => {
                if(!classScores || typeof classScores !== 'object') return;
                Object.values(classScores).forEach(studentScores => {
                    if(!studentScores || typeof studentScores !== 'object') return;
                    if(studentScores.term !== undefined) fixScoreBlock(studentScores);
                    Object.values(studentScores).forEach(termScores => {
                        if(termScores && typeof termScores === 'object') fixScoreBlock(termScores);
                    });
                });
            });
            return changed;
        }

        window.subjectScoresNeedRepair = function(subjectData) {
            try {
                const copy = JSON.parse(JSON.stringify(subjectData || {}));
                return window.normalizeSubjectScores(copy);
            } catch(e) {
                return false;
            }
        }

        window.repairAllSubjectScoreValues = function() {
            let changed = false;
            Object.values(window.DB_SubjectData || {}).forEach(subjectData => {
                if(window.normalizeSubjectScores(subjectData)) changed = true;
            });
            return changed;
        }

        if(window.repairAllSubjectScoreValues()) {
            localStorage.setItem('anpscore_subjectData', JSON.stringify(window.DB_SubjectData));
        }

            document.addEventListener(evtName, () => { lastUserInteractionAt = Date.now(); }, { capture: true, passive: true });

        window.persistPendingScoreSubjects = function() {
            try { localStorage.removeItem('anpscore_pendingScoreSubjects'); } catch(e) {}
        }

        window.scorePendingEntryKey = function(subId, clsId, stuId) {
            if(!subId || !clsId || !stuId) return '';
            return [subId, clsId, stuId].map(v => String(v || '').replace(/\|/g, '_')).join('|');
        }

        window.markScoreSubjectPending = function(subId = null, clsId = null, stuId = null) {
            const id = subId || state.subjId;
            if(!id) return;
            pendingScoreSubjects.add(id);
            const entryKey = window.scorePendingEntryKey(id, clsId || state.clsId, stuId);
            if(entryKey) pendingScoreEntries.add(entryKey);
            window.persistPendingScoreSubjects();
        }

        window.clearScoreSubjectPendingIfDone = function(subId = null, clsId = null, stuId = null) {
            const id = subId || state.subjId;
            if(!id) return;
            const entryKey = window.scorePendingEntryKey(id, clsId || state.clsId, stuId);
            if(entryKey) {
                const hasPendingEntry = Object.values(scoreAutoSavePending || {}).some(item => item && item.subId === id && item.clsId === (clsId || state.clsId) && item.stuId === stuId);
                if(!hasPendingEntry) pendingScoreEntries.delete(entryKey);
            }
            const hasPendingSubject = Object.values(scoreAutoSavePending || {}).some(item => item && item.subId === id) || Array.from(pendingScoreEntries).some(key => key.startsWith(`${id}|`));
            if(!hasPendingSubject) {
                pendingScoreSubjects.delete(id);
                window.persistPendingScoreSubjects();
            }
        }

        window.hasPendingScoreSubject = function(subId = null) {
            const id = subId || state.subjId;
            if(!id) return false;
            return pendingScoreSubjects.has(id) || Array.from(pendingScoreEntries).some(key => key.startsWith(`${id}|`)) || Object.values(scoreAutoSavePending || {}).some(item => item && item.subId === id);
        }

        window.hasPendingScoreEntry = function(subId = null, clsId = null, stuId = null) {
            const entryKey = window.scorePendingEntryKey(subId || state.subjId, clsId || state.clsId, stuId);
            if(!entryKey) return false;
            return pendingScoreEntries.has(entryKey) || Object.values(scoreAutoSavePending || {}).some(item => item && window.scorePendingEntryKey(item.subId, item.clsId, item.stuId) === entryKey);
        }

        window.scoreClassDirtyKey = function(subId, clsId) {
            if(!subId || !clsId) return '';

        window.persistScoreBundleDirtyClasses = function() {
            try {
                const keys = Array.from(scoreBundleDirtyClasses || []).filter(Boolean);

                else localStorage.removeItem('anpscore_dirtyScoreClasses');
            } catch(e) {}
        }

        window.markScoreClassBundleDirty = function(subId = null, clsId = null) {
            const sId = subId || state.subjId;
            const cId = clsId || state.clsId;
            if(!sId || !cId) return;
            scoreBundleDirtyClasses.add(window.scoreClassDirtyKey(sId, cId));
            window.persistScoreBundleDirtyClasses();
            window.markSubjectDirty(sId);
        }

        window.markAllScoreClassesDirty = function(subId = null) {
            const sId = subId || state.subjId;
            if(!sId) return;
            const subjectData = window.DB_SubjectData && window.DB_SubjectData[sId];
            const scores = (subjectData && subjectData.scores) || {};
            const classIds = Object.keys(scores);
            if(classIds.length === 0) {
                window.markSubjectDirty(sId);
                return;
            }
            classIds.forEach(clsId => window.markScoreClassBundleDirty(sId, clsId));
        }

        window.requestDirtyCloudFlush = function(delay = 1500) {
            if(cloudDirtyFlushTimer || typeof window.firebaseSaveFn !== 'function') return;
            const hasDirtyScoreClasses = scoreBundleDirtyClasses && scoreBundleDirtyClasses.size > 0;
            const hasDirtySubjects = window.dirtySubjects && window.dirtySubjects.size > 0;
            if(!hasDirtyScoreClasses && !hasDirtySubjects) return;

            cloudDirtyFlushTimer = setTimeout(() => {
                cloudDirtyFlushTimer = null;
                if(scoreBundleDirtyClasses && scoreBundleDirtyClasses.size > 0) {
                    Array.from(scoreBundleDirtyClasses).forEach(key => {
                        const subId = decodeURIComponent(String(key).split('|')[0] || '');
                        if(subId) window.markSubjectDirty(subId);
                    });
                }
                if(typeof window.firebaseSaveFn === 'function' && window.dirtySubjects && window.dirtySubjects.size > 0) {
                    window.firebaseSaveFn();
                }
            }, delay);
        }

            window.persistDirtySubjects();

        pendingScoreSubjects.clear();
        pendingScoreEntries.clear();
        window.persistPendingScoreSubjects();

        window.saveDB = function(targetSubjId = null) {
            window.DB = DB;
            window.DB_SubjectData = DB_SubjectData;
            window.saveLocalDB();
            
            window.markSubjectDirty(targetSubjId || state.subjId);

            if(typeof window.firebaseSaveFn === 'function') window.firebaseSaveFn();
        }

        window.scoreSafetyKey = function(subId, clsId, stuId, term, type) {
            return [subId, clsId, stuId, term, type].map(v => String(v || '').replace(/\|/g, '_')).join('|');
        }

        window.scoreSafetyLeafKey = function(type) {
            const parts = String(type || '').split('.').filter(Boolean);
            return parts[parts.length - 1] || '';
        }

        window.persistScoreSafetyLogNow = function(limit = SCORE_SAFETY_LOG_LIMIT) {
            if(scoreSafetyPersistTimer) {
                clearTimeout(scoreSafetyPersistTimer);
                scoreSafetyPersistTimer = null;
            }
            try {
                let entries = Object.entries(scoreSafetyLog || {});
                if(entries.length > limit) {
                    entries.sort((a, b) => Number((b[1] || {}).savedAt || 0) - Number((a[1] || {}).savedAt || 0));
                    scoreSafetyLog = Object.fromEntries(entries.slice(0, limit));
                    window.scoreSafetyLog = scoreSafetyLog;
                    entries = Object.entries(scoreSafetyLog);
                }
                if(entries.length > 0) localStorage.setItem(SCORE_SAFETY_LOG_KEY, JSON.stringify(scoreSafetyLog));
                else localStorage.removeItem(SCORE_SAFETY_LOG_KEY);
            } catch(e) {
                try {
                    const fallbackLimit = Math.max(500, Math.floor(limit / 2));
                    const trimmed = Object.entries(scoreSafetyLog || {})
                        .sort((a, b) => Number((b[1] || {}).savedAt || 0) - Number((a[1] || {}).savedAt || 0))
                        .slice(0, fallbackLimit);
                    scoreSafetyLog = Object.fromEntries(trimmed);
                    window.scoreSafetyLog = scoreSafetyLog;
                    localStorage.setItem(SCORE_SAFETY_LOG_KEY, JSON.stringify(scoreSafetyLog));
                } catch(inner) {
                    console.warn('Score safety log could not be persisted:', inner);
                }
            }
        }

        window.scheduleScoreSafetyLogPersist = function(delay = 250) {
            if(scoreSafetyPersistTimer) clearTimeout(scoreSafetyPersistTimer);
            scoreSafetyPersistTimer = setTimeout(() => window.persistScoreSafetyLogNow(), delay);
        }

        window.rememberScoreSafetyValue = function(subId, clsId, stuId, term, type, val, options = {}) {
            if(!subId || !clsId || !stuId || !term || !type) return;
            const leaf = window.scoreSafetyLeafKey(type);
            const normalized = window.normalizeScoreValue ? window.normalizeScoreValue(val, leaf) : val;
            const isEmpty = normalized === '' || normalized === null || normalized === undefined;
            if(isEmpty && options.skipEmpty) return;
            const key = window.scoreSafetyKey(subId, clsId, stuId, term, type);
            scoreSafetyLog[key] = {
                subId: String(subId),
                clsId: String(clsId),
                stuId: String(stuId),
                term: String(term),
                type: String(type),
                val: isEmpty ? '' : normalized,
                cleared: !!isEmpty,
                savedAt: Date.now()
            };
            window.scoreSafetyLog = scoreSafetyLog;
            window.scheduleScoreSafetyLogPersist(options.persistDelay || 250);
        }

        window.getScoreSafetyRecord = function(subId, clsId, stuId, term, type) {
            const key = window.scoreSafetyKey(subId, clsId, stuId, term, type);
            return (scoreSafetyLog || {})[key] || null;
        }

        window.rememberScoreNodeInSafetyLog = function(subId, clsId, stuId, scoresNode, options = {}) {
            if(!scoresNode || typeof scoresNode !== 'object') return;
            Object.entries(scoresNode).forEach(([term, termNode]) => {
                if(!termNode || typeof termNode !== 'object') return;
                if(termNode.indicators && typeof termNode.indicators === 'object') {
                    Object.entries(termNode.indicators).forEach(([indId, indScores]) => {
                        if(!indScores || typeof indScores !== 'object') return;
                        ['k', 'p', 'a'].forEach(type => {
                            if(indScores[type] !== undefined) {
                                window.rememberScoreSafetyValue(subId, clsId, stuId, term, `indicators.${indId}.${type}`, indScores[type], Object.assign({ skipEmpty: true, persistDelay: 900 }, options));
                            }
                        });
                    });
                }
                ['midTermScore', 'finalScore'].forEach(type => {
                    if(termNode[type] !== undefined) {
                        window.rememberScoreSafetyValue(subId, clsId, stuId, term, type, termNode[type], Object.assign({ skipEmpty: true, persistDelay: 900 }, options));
                    }
                });
            });
        }

        window.markScoreStructureClearedInSafetyLog = function(subId, clsId, stuId, term, classConfig = {}) {
            const termUnits = (classConfig.learningUnits || []).filter(u => String(u.term) === String(term));
            termUnits.forEach(u => {
                (u.indicators || []).forEach(ind => {
                    if(Number(ind.max_k || 0) > 0) window.rememberScoreSafetyValue(subId, clsId, stuId, term, `indicators.${ind.id}.k`, '', { persistDelay: 900 });
                    if(Number(ind.max_p || 0) > 0) window.rememberScoreSafetyValue(subId, clsId, stuId, term, `indicators.${ind.id}.p`, '', { persistDelay: 900 });
                    if(Number(ind.max_a || 0) > 0) window.rememberScoreSafetyValue(subId, clsId, stuId, term, `indicators.${ind.id}.a`, '', { persistDelay: 900 });
                });
            });
            const ex = classConfig.examSettings ? (classConfig.examSettings[term] || { mid: 20, final: 30 }) : { mid: 20, final: 30 };
            if(Number(ex.mid || 0) > 0) window.rememberScoreSafetyValue(subId, clsId, stuId, term, 'midTermScore', '', { persistDelay: 900 });
            if(Number(ex.final || 0) > 0) window.rememberScoreSafetyValue(subId, clsId, stuId, term, 'finalScore', '', { persistDelay: 900 });
        }

        window.recoverScoreCellIfMissing = function(subId, clsId, stuId, term, type, currentValue, applyValue = null) {
            const leaf = window.scoreSafetyLeafKey(type);
            const normalizedCurrent = window.normalizeScoreValue ? window.normalizeScoreValue(currentValue, leaf) : currentValue;
            if(normalizedCurrent !== '' && normalizedCurrent !== null && normalizedCurrent !== undefined) {
                window.rememberScoreSafetyValue(subId, clsId, stuId, term, type, normalizedCurrent, { skipEmpty: true, persistDelay: 900 });
                return normalizedCurrent;
            }

            const record = window.getScoreSafetyRecord(subId, clsId, stuId, term, type);
            if(!record || record.cleared) return currentValue;
            const recovered = window.normalizeScoreValue ? window.normalizeScoreValue(record.val, leaf) : record.val;
            if(recovered === '' || recovered === null || recovered === undefined) return currentValue;

            if(typeof applyValue === 'function') applyValue(recovered);
            const recoveryKey = window.scoreSafetyKey(subId, clsId, stuId, term, type);
            if(!scoreSafetyRecoveryKeys.has(recoveryKey)) {
                scoreSafetyRecoveryKeys.add(recoveryKey);
                window.scheduleScoreAutoSave(subId, clsId, stuId, term, type, recovered);
                window.saveSubjectDataLocalNow();
                console.warn('Recovered missing score cell from local safety log', { subId, clsId, stuId, term, type });
            }
            return recovered;
        }

        window.scoreAutoSaveKey = function(subId, clsId, stuId, term, type) {
            return [subId, clsId, stuId, term, type].map(v => String(v || '').replace(/\|/g, '_')).join('|');
        }

        window.persistScoreAutoSavePending = function() {
            try {
                const keys = Object.keys(scoreAutoSavePending || {});
                if(keys.length > 0) localStorage.setItem('anpscore_pendingScoreCells', JSON.stringify(scoreAutoSavePending));
                else localStorage.removeItem('anpscore_pendingScoreCells');
            } catch(e) {}
        }

        window.setScoreAutoSaveStatus = function(status, message) {
            const el = document.getElementById('score-autosave-status');
            if(!el) return;
            const classes = {
                idle: 'bg-slate-50 text-slate-500 border-slate-200',
                pending: 'bg-amber-50 text-amber-700 border-amber-200',
                saved: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                error: 'bg-rose-50 text-rose-700 border-rose-200'
            };
            el.className = `px-3 py-2 rounded-xl border text-xs font-bold flex items-center gap-1.5 shrink-0 ${classes[status] || classes.idle}`;
            const icon = status === 'pending' ? 'ph-spinner-gap animate-spin' : (status === 'saved' ? 'ph-check-circle' : (status === 'error' ? 'ph-warning-circle' : 'ph-floppy-disk'));
            el.innerHTML = `<i class="ph ${icon} text-base"></i><span>${message}</span>`;
        }

        window.clearScoreAutoSave = function(subId, clsId, stuId, term, type) {
            const key = window.scoreAutoSaveKey(subId, clsId, stuId, term, type);
            if(scoreAutoSaveTimers[key]) clearTimeout(scoreAutoSaveTimers[key]);
            delete scoreAutoSaveTimers[key];
            delete scoreAutoSavePending[key];
            window.persistScoreAutoSavePending();
        }

        window.flushScoreAutoSave = async function(key) {
            const item = scoreAutoSavePending[key];
            if(!item) return;
            if(scoreAutoSaveTimers[key]) clearTimeout(scoreAutoSaveTimers[key]);
            if(window.isCloudQuotaBackoffActive && window.isCloudQuotaBackoffActive()) {
                const retryDelay = Math.min(Math.max(window.getCloudQuotaBackoffRemaining(), 30000), 5 * 60 * 1000);
                scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), retryDelay);
                window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
                window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว รอคลาวด์ว่าง');
                return;
            }
            delete scoreAutoSaveTimers[key];
            delete scoreAutoSavePending[key];
            window.persistScoreAutoSavePending();

            try {
                if(typeof window.firebaseUpdateScore !== 'function' && typeof window.firebaseSaveFn !== 'function') {
                    throw new Error('cloud score writer is not ready');
                }
                if(typeof window.firebaseUpdateScore === 'function') {
                    await window.firebaseUpdateScore(item.subId, item.clsId, item.stuId, item.term, item.type, item.val);
                } else if(typeof window.firebaseSaveFn === 'function') {
                    window.firebaseSaveFn();
                }
                window.clearScoreSubjectPendingIfDone(item.subId, item.clsId, item.stuId);
                window.setScoreAutoSaveStatus('saved', 'บันทึกอัตโนมัติแล้ว');
            } catch(err) {
                const quotaErr = window.isCloudQuotaError && window.isCloudQuotaError(err);
                if(!quotaErr) console.error('Score autosave failed:', err);
                if(quotaErr && window.activateCloudQuotaBackoff) {
                    window.activateCloudQuotaBackoff(err);
                }
                const retryCount = Number(item.retryCount || 0) + 1;
                item.retryCount = retryCount;
                scoreAutoSavePending[key] = item;
                window.persistScoreAutoSavePending();
                const quotaDelay = window.getCloudQuotaBackoffRemaining ? window.getCloudQuotaBackoffRemaining() : 0;
                const retryDelay = quotaDelay > 0 ? Math.min(Math.max(quotaDelay, 30000), 5 * 60 * 1000) : Math.min(30000, 4000 * retryCount);
                if(retryCount <= 6) {
                    scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), retryDelay);
                    window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
                    window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว กำลังลองซิงก์อีกครั้ง');
                } else {
                    window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
                    window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว รอเชื่อมต่อคลาวด์');
                }
            }
        }

        window.flushPendingScoreAutoSaves = async function() {
            window.saveSubjectDataLocalNow();
            window.persistScoreSafetyLogNow();
            const keys = Object.keys(scoreAutoSavePending);
            await Promise.all(keys.map(key => window.flushScoreAutoSave(key)));
        }

        window.scheduleScoreAutoSave = function(subId, clsId, stuId, term, type, val) {
            if(!subId || !clsId || !stuId || !term || !type) return;
            window.rememberScoreSafetyValue(subId, clsId, stuId, term, type, val);
            window.markScoreSubjectPending(subId, clsId, stuId);
            window.scheduleSubjectDataLocalSave();
            window.setScoreAutoSaveStatus('pending', 'กำลังบันทึกอัตโนมัติ...');

            const key = window.scoreAutoSaveKey(subId, clsId, stuId, term, type);
            scoreAutoSavePending[key] = { subId, clsId, stuId, term, type, val };
            window.persistScoreAutoSavePending();
            if(scoreAutoSaveTimers[key]) clearTimeout(scoreAutoSaveTimers[key]);
            scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), 900);
        }

        window.restorePendingScoreAutosaves = function() {
            Object.keys(scoreAutoSavePending || {}).forEach(key => {
                const item = scoreAutoSavePending[key];
                if(!item || !item.subId || !item.clsId || !item.stuId || !item.term || !item.type) {
                    delete scoreAutoSavePending[key];
                    return;
                }
                window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
            });
            window.persistScoreAutoSavePending();
        }

        window.retryPendingScoreAutoSaves = function(delay = 1800) {
            Object.keys(scoreAutoSavePending || {}).forEach(key => {
                if(scoreAutoSaveTimers[key]) return;
                scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), delay);
            });
        }

        window.restorePendingScoreAutosaves();

        document.addEventListener('visibilitychange', () => {
            if(document.visibilityState === 'hidden' && Object.keys(scoreAutoSavePending).length > 0) {
                window.saveSubjectDataLocalNow();
                window.persistScoreSafetyLogNow();
                window.flushPendingScoreAutoSaves();
            }
        });

        window.addEventListener('beforeunload', () => {
            if(Object.keys(scoreAutoSavePending).length > 0) {
                window.saveSubjectDataLocalNow();
            }
            window.persistScoreSafetyLogNow();
        });

        window.setCloudSyncState = function(nextState = {}) {
            cloudSyncState = Object.assign(cloudSyncState, nextState);
            window.cloudSyncState = cloudSyncState;
            if(typeof window.updateActiveUsersUI === 'function') window.updateActiveUsersUI();
        }

        window.isCloudQuotaError = function(err) {
            const code = String((err && err.code) || '').toLowerCase();
            const message = String((err && err.message) || err || '').toLowerCase();
            return code.includes('resource-exhausted') || message.includes('resource-exhausted') || message.includes('quota exceeded') || message.includes('quota backoff') || message.includes('429');
        }

        window.activateCloudQuotaBackoff = function(err, durationMs = 5 * 60 * 1000) {
            cloudQuotaBackoffUntil = Math.max(cloudQuotaBackoffUntil || 0, Date.now() + durationMs);
            const message = 'Firestore quota exceeded - local save active, cloud sync paused briefly';
            window.setCloudSyncState({ mode: 'local', connected: false, lastError: message });
            if(Date.now() - lastCloudQuotaNoticeAt > 60000) {
                lastCloudQuotaNoticeAt = Date.now();
                console.warn(message, err);
                if(typeof window.notify === 'function') window.notify('คลาวด์ใช้งานเกินโควตาชั่วคราว: บันทึกในเครื่องแล้ว จะซิงก์ใหม่ภายหลัง', true);
            }
            if(cloudQuotaResumeTimer) clearTimeout(cloudQuotaResumeTimer);
            cloudQuotaResumeTimer = setTimeout(() => {
                cloudQuotaResumeTimer = null;
                if(state.activePage === 'teacher_scoring' && typeof window.subscribeActiveScoreSubject === 'function') {
                    window.subscribeActiveScoreSubject(state.subjId, state.clsId, state.term);
                }
                if(typeof window.retryPendingScoreAutoSaves === 'function') window.retryPendingScoreAutoSaves(800);
                if(typeof window.requestDirtyCloudFlush === 'function') window.requestDirtyCloudFlush(1200);
            }, Math.min(Math.max(window.getCloudQuotaBackoffRemaining(), 30000), 5 * 60 * 1000) + 1000);
        }

        window.getCloudQuotaBackoffRemaining = function() {
            return Math.max(0, Number(cloudQuotaBackoffUntil || 0) - Date.now());
        }

        window.isCloudQuotaBackoffActive = function() {
            return window.getCloudQuotaBackoffRemaining() > 0;
        }

        window.getPresenceDisplayName = function(user) {
            if(!user) return 'ไม่ทราบชื่อ';
            if(user.displayName) return user.displayName;
            if(user.role === 'admin') return 'ผู้ดูแลระบบ';
            const teacherId = user.teacherId || user.actorId || user.id;
            const t = DB.teachers.find(x => x.id === teacherId);
            return t ? t.name : 'ครูผู้สอน';
        }

        window.getActiveUsers = function() {
            const now = Date.now();
            const usersById = {};

            Object.entries(window.presenceUsers || {}).forEach(([id, user]) => {
                const lastActive = Number(user.lastActive || 0);
                if(!user.online || !lastActive || now - lastActive > ACTIVE_USER_WINDOW_MS) return;
                usersById[id] = {
                    actorId: id,
                    role: user.role || (id === 'admin' ? 'admin' : 'teacher'),
                    displayName: window.getPresenceDisplayName(user),
                    lastActive
                };
            });

            (DB.teachers || []).forEach(t => {
                const lastActive = Number(t.lastActive || 0);
                if(lastActive && now - lastActive <= ACTIVE_USER_WINDOW_MS && !usersById[t.id]) {
                    usersById[t.id] = {
                        actorId: t.id,
                        role: 'teacher',
                        displayName: t.name,
                        lastActive
                    };
                }
            });

            if(state.user && state.user.role === 'admin' && !usersById.admin) {
                usersById.admin = {
                    actorId: 'admin',
                    role: 'admin',
                    displayName: 'ผู้ดูแลระบบ',
                    lastActive: now
                };
            }

            return Object.values(usersById).sort((a, b) => {
                if(a.role !== b.role) return a.role === 'admin' ? -1 : 1;
                return b.lastActive - a.lastActive;
            });
        }

        window.formatActiveAgo = function(ts) {
            const diff = Math.max(0, Date.now() - Number(ts || 0));
            if(diff < 60000) return 'เมื่อสักครู่';
            const mins = Math.floor(diff / 60000);
            return `${mins} นาทีที่แล้ว`;

            window.showModal(`

                        <h3 class="text-2xl font-extrabold text-slate-800">ผู้ที่กำลังล็อกอินอยู่</h3>
                        <p class="text-sm text-slate-500 font-medium mt-1">นับจากผู้ใช้ที่ยังส่งสถานะภายใน 3 นาทีล่าสุด</p>
                    </div>

        window.updateActiveUsersUI = function() {
            const now = Date.now();
            if(now - lastActiveUsersUiAt < 800) {
                if(!activeUsersUiTimer) {
                    activeUsersUiTimer = setTimeout(() => {
                        activeUsersUiTimer = null;
                        window.updateActiveUsersUI();
                    }, 800);
                }
                return;
            }
            lastActiveUsersUiAt = now;
            const el = $('active-users-pill');
            if(!el) return;
            const users = window.getActiveUsers();
            const names = users.slice(0, 3).map(u => u.displayName).join(', ');
            const cloudOk = window.cloudSyncState && window.cloudSyncState.connected;
            el.className = `animate-fade-in-up stagger-1 flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold border shadow-sm backdrop-blur-md transition-colors ${cloudOk ? 'bg-emerald-50/80 text-emerald-700 border-emerald-100/70' : 'bg-amber-50/80 text-amber-700 border-amber-100/70'}`;
            el.innerHTML = `
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${cloudOk ? 'bg-emerald-400' : 'bg-amber-400'} opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 ${cloudOk ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                </span>
                <span>ออนไลน์ ${users.length} คน</span>
                ${names ? `<span class="hidden xl:inline text-xs opacity-75 max-w-[16rem] truncate">(${names})</span>` : ''}
            `;
        }

        window.getCurrentActorInfo = function() {
            if(!state.user) return { actorId: browserSessionId, role: 'guest', displayName: 'ผู้ใช้งาน' };
            if(state.user.role === 'admin') return { actorId: 'admin', role: 'admin', displayName: 'ผู้ดูแลระบบ' };
            const t = DB.teachers.find(x => x.id === state.user.id);
            return { actorId: state.user.id, role: 'teacher', displayName: t ? t.name : 'ครูผู้สอน' };
        }

        window.getScoreLockKey = function(subId = state.subjId, clsId = state.clsId, term = state.term) {
            if(!subId || !clsId || !term) return '';
            return [subId, clsId, term].map(x => encodeURIComponent(String(x))).join('__');
        }

        window.isScoreLockActive = function(lock) {
            if(!lock || lock.active === false) return false;
            const lastActive = Number(lock.lastActive || 0);
            return !!lastActive && (Date.now() - lastActive <= SCORE_LOCK_TIMEOUT_MS);
        }

        window.getCurrentScoreLock = function() {
            const key = window.getScoreLockKey();
            return key ? window.scoreLocks[key] : null;
        }

        window.isCurrentScoreLockMine = function() {
            const lock = window.getCurrentScoreLock();
            return !!(lock && window.isScoreLockActive(lock) && lock.sessionId === browserSessionId);

            if(scoreLockStatus.pending && scoreLockStatus.key === window.getScoreLockKey()) return false;
            const lock = window.getCurrentScoreLock();
            return !window.isScoreLockActive(lock) || lock.sessionId === browserSessionId;
        }

        window.refreshScoreLockBanner = function() {
            const statusEl = $('score-entry-status-banner');
            if(statusEl) statusEl.outerHTML = window.renderScoreEntryStatusBanner(state.activePage !== 'teacher_scoring');
            const el = $('score-lock-banner');
            if(el) el.outerHTML = window.renderScoreLockBannerHtml();
            const canEdit = window.canEditCurrentScorebook();
            const scoreEntryStatus = window.getScoreEntryStatus ? window.getScoreEntryStatus() : { allowed: true, message: '' };

        window.ensureCanEditScorebook = function() {
            if(window.canEditCurrentScorebook()) return true;
            const scoreEntryStatus = window.getScoreEntryStatus ? window.getScoreEntryStatus() : { allowed: true };
            if(!scoreEntryStatus.allowed) {
                window.notify(scoreEntryStatus.message, true);

                return false;
            }
            const lock = window.getCurrentScoreLock();
            const owner = window.getScoreLockOwnerText(lock);
            const msg = scoreLockStatus.pending ? 'ระบบกำลังตรวจสอบสิทธิ์แก้ไข กรุณารอสักครู่' : `${owner} กำลังแก้ไขสมุดคะแนนนี้อยู่`;
            window.notify(msg, true);
            window.refreshScoreLockBanner();
            return false;

        window.acquireScoreLock = function(silent = false) {
            const key = window.getScoreLockKey();
            if(!key) return false;
            const scoreEntryStatus = window.getScoreEntryStatus ? window.getScoreEntryStatus() : { allowed: true };
            if(state.activePage === 'teacher_scoring' && !scoreEntryStatus.allowed) {
                scoreLockStatus = { key, pending: false };
                window.refreshScoreLockBanner();
                return false;
            }
            const existing = window.scoreLocks[key];
            if(window.isScoreLockActive(existing) && existing.sessionId !== browserSessionId) {
                if(!silent) window.notify(`${window.getScoreLockOwnerText(existing)} กำลังแก้ไขสมุดคะแนนนี้อยู่`, true);
                scoreLockStatus = { key, pending: false };
                window.refreshScoreLockBanner();
                return false;
            }

            const actor = window.getCurrentActorInfo();
            const payload = {
                key,
                subId: state.subjId,
                clsId: state.clsId,
                term: state.term,
                actorId: actor.actorId,
                role: actor.role,
                displayName: actor.displayName,
                sessionId: browserSessionId,
                active: true,
                lastActive: Date.now()
            };
            if(window.isScoreLockActive(existing) && existing.sessionId === browserSessionId) {
                scoreLockStatus = { key, pending: false };
                window.scoreLocks[key] = payload;
                if(typeof window.firebaseUpdateScoreLock === 'function') window.firebaseUpdateScoreLock(key, payload);
                window.refreshScoreLockBanner();
                return true;
            }
            const hasCloudLock = typeof window.firebaseAcquireScoreLock === 'function' && !(window.isCloudQuotaBackoffActive && window.isCloudQuotaBackoffActive());
            scoreLockStatus = { key, pending: hasCloudLock };
            window.scoreLocks[key] = payload;
            window.refreshScoreLockBanner();

            if(hasCloudLock) {
                window.firebaseAcquireScoreLock(key, payload).then(result => {
                    if(result && result.ok) {
                        window.scoreLocks[key] = result.lock || payload;
                        scoreLockStatus = { key, pending: false };
                    } else if(result && result.lock) {
                        window.scoreLocks[key] = result.lock;
                        scoreLockStatus = { key, pending: false };
                        if(!silent) window.notify(`${window.getScoreLockOwnerText(result.lock)} กำลังแก้ไขสมุดคะแนนนี้อยู่`, true);
                    }
                    window.refreshScoreLockBanner();
                }).catch(err => {
                    console.error(err);
                    scoreLockStatus = { key, pending: false };
                    window.refreshScoreLockBanner();
                });
            } else if(typeof window.firebaseUpdateScoreLock === 'function') {
                window.firebaseUpdateScoreLock(key, payload);
            }
            return !hasCloudLock;
        }

        window.releaseScoreLock = function() {
            const key = scoreLockStatus.key || window.getScoreLockKey();
            const lock = key ? window.scoreLocks[key] : null;
            if(!key || !lock || lock.sessionId !== browserSessionId) return;
            const released = Object.assign({}, lock, { active: false, lastActive: Date.now() });
            window.scoreLocks[key] = released;
            scoreLockStatus = { key: '', pending: false };
            if(typeof window.firebaseReleaseScoreLock === 'function') window.firebaseReleaseScoreLock(key, released);
            window.refreshScoreLockBanner();
        }

        window.normalizeScoreEntryPolicy = function(policy = null) {
            const src = policy && typeof policy === 'object' ? policy : {};
            const validModes = ['always', 'scheduled', 'closed'];
            const mode = validModes.includes(src.mode) ? src.mode : 'always';
            return {
                mode,
                startDate: typeof src.startDate === 'string' ? src.startDate : '',
                endDate: typeof src.endDate === 'string' ? src.endDate : '',
                notice: typeof src.notice === 'string' ? src.notice : ''
            };
        }

        window.formatThaiDate = function(dateStr) {
            if(!dateStr) return '';
            const d = new Date(`${dateStr}T00:00:00`);
            if(Number.isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        window.getScoreEntryStatus = function() {
            const policy = window.normalizeScoreEntryPolicy(DB.schoolInfo && DB.schoolInfo.scoreEntryPolicy);
            const notice = policy.notice.trim();
            const noticeSuffix = notice ? ` • ${notice}` : '';

            if(policy.mode === 'closed') {
                return {
                    allowed: false,
                    severity: 'closed',
                    title: 'ปิดการลงคะแนน',
                    message: notice || 'ผู้ดูแลระบบปิดการลงคะแนนชั่วคราว'
                };
            }

            if(policy.mode === 'scheduled') {
                if(!policy.startDate || !policy.endDate) {
                    return {
                        allowed: false,
                        severity: 'closed',
                        title: 'ยังไม่ได้กำหนดช่วงวันลงคะแนนครบถ้วน',
                        message: 'กรุณาแจ้งผู้ดูแลระบบให้กำหนดวันเริ่มต้นและวันสิ้นสุดก่อนลงคะแนน'
                    };
                }

                const now = new Date();
                const start = new Date(`${policy.startDate}T00:00:00`);
                const end = new Date(`${policy.endDate}T23:59:59`);
                const rangeText = `${window.formatThaiDate(policy.startDate)} ถึง ${window.formatThaiDate(policy.endDate)}`;

                if(Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) {
                    return {
                        allowed: false,
                        severity: 'closed',
                        title: 'ช่วงวันลงคะแนนไม่ถูกต้อง',
                        message: 'กรุณาแจ้งผู้ดูแลระบบให้ตรวจสอบวันที่เปิดและปิดการลงคะแนน'
                    };
                }

                if(now < start) {
                    return {
                        allowed: false,
                        severity: 'upcoming',
                        title: 'ยังไม่ถึงเวลาเปิดลงคะแนน',
                        message: `ระบบจะเปิดให้ลงคะแนนวันที่ ${rangeText}${noticeSuffix}`
                    };
                }

                if(now > end) {
                    return {
                        allowed: false,
                        severity: 'expired',
                        title: 'หมดเวลาลงคะแนน',
                        message: `ระบบปิดการลงคะแนนแล้ว ช่วงที่กำหนดคือ ${rangeText}${noticeSuffix}`
                    };
                }

                return {
                    allowed: true,
                    severity: 'open',
                    title: 'เปิดลงคะแนนอยู่',
                    message: `สามารถลงคะแนนได้ถึงวันที่ ${window.formatThaiDate(policy.endDate)}${noticeSuffix}`
                };
            }

            return {
                allowed: true,
                severity: 'always',
                title: 'เปิดลงคะแนนตลอดเวลา',
                message: notice || 'ครูสามารถลงคะแนนได้ตามปกติ'
            };
        }

        window.renderScoreEntryStatusBanner = function(compact = false) {

                open: { wrap: 'border-emerald-200 bg-emerald-50 text-emerald-800', sub: 'text-emerald-700', icon: 'ph-calendar-check' },
                upcoming: { wrap: 'border-amber-200 bg-amber-50 text-amber-800', sub: 'text-amber-700', icon: 'ph-calendar-plus' },
                expired: { wrap: 'border-rose-200 bg-rose-50 text-rose-800', sub: 'text-rose-700', icon: 'ph-calendar-x' },
                closed: { wrap: 'border-rose-200 bg-rose-50 text-rose-800', sub: 'text-rose-700', icon: 'ph-lock-key' }
            };
            const palette = palettes[status.severity] || palettes.always;
            const padding = compact ? 'p-4' : 'p-4 md:p-5';
            return `
                <div id="score-entry-status-banner" class="mb-4 ${padding} rounded-2xl border ${palette.wrap} font-bold flex items-start gap-3 shadow-sm">
                    <i class="ph ${palette.icon} text-2xl mt-0.5 shrink-0"></i>

        window.calculateClassProgress = function(subId, cId, term) {
            let sd = DB_SubjectData[subId]; if(!sd) return 0;
            let classConfig = (sd.classData && sd.classData[cId]) ? sd.classData[cId] : sd;
            let termUnits = (classConfig.learningUnits||[]).filter(u => String(u.term) === String(term));
            let ex = classConfig.examSettings ? classConfig.examSettings[term] : {mid:20, final:30};
            if(!ex) ex = {mid:20, final:30};

            let scStore = sd.scores ? sd.scores[cId] : null; if(!scStore) return 0;
            let cls = DB.classes[cId]; if(!cls || cls.students.length === 0) return 0;

            let completedPoints = 0;
            termUnits.forEach(u => {
                if(u.indicators) {
                    u.indicators.forEach(ind => {
                        let k_filled = false, p_filled = false, a_filled = false;
                        cls.students.forEach(stu => {
                            let sId = stu.studentId; let stuNode = scStore[sId];
                            if(stuNode) {
                                let mySc = stuNode[term]; if(!mySc && stuNode.term !== undefined && String(stuNode.term) === String(term)) mySc = stuNode;
                                if(mySc && mySc.indicators && mySc.indicators[ind.id]) {
                                    if(window.normalizeScoreValue(mySc.indicators[ind.id].k, 'k') !== '') k_filled = true;
                                    if(window.normalizeScoreValue(mySc.indicators[ind.id].p, 'p') !== '') p_filled = true;
                                    if(window.normalizeScoreValue(mySc.indicators[ind.id].a, 'a') !== '') a_filled = true;
                                }
                            }
                        });
                        if(k_filled) completedPoints += Number(ind.max_k || 0);
                        if(p_filled) completedPoints += Number(ind.max_p || 0);
                        if(a_filled) completedPoints += Number(ind.max_a || 0);
                    });
                }
            });

            let mid_filled = false, fin_filled = false;
            cls.students.forEach(stu => {
                let sId = stu.studentId; let stuNode = scStore[sId];
                if(stuNode) {
                    let mySc = stuNode[term]; if(!mySc && stuNode.term !== undefined && String(stuNode.term) === String(term)) mySc = stuNode;
                    if(mySc) {
                        if(window.normalizeScoreValue(mySc.midTermScore, 'midTermScore') !== '') mid_filled = true;
                        if(window.normalizeScoreValue(mySc.finalScore, 'finalScore') !== '') fin_filled = true;
                    }
                }
            });
            if(mid_filled) completedPoints += Number(ex.mid || 0);
            if(fin_filled) completedPoints += Number(ex.final || 0);
            return Math.min(100, Math.round(completedPoints));
        }

        window.getStudentTotalScore = function(student, subId, cId, termToCalculate = null) {
            let term = termToCalculate ? String(termToCalculate) : String(state.term);
            let sd = DB_SubjectData[subId];
            if(!sd || !sd.scores || !sd.scores[cId] || !sd.scores[cId][student.studentId]) return 0;
            
            let stuNode = sd.scores[cId][student.studentId];
            let sc = stuNode[term]; 
            if(stuNode.term !== undefined) { if (String(stuNode.term) === term) { sc = stuNode; } else { return 0; } }
            if(!sc) return 0;

            let total = 0;
            let units = (sd.classData && sd.classData[cId]) ? sd.classData[cId].learningUnits : sd.learningUnits;
            if(units) {
                units.forEach(u => {
                    if(String(u.term) === term && u.indicators) {
                        u.indicators.forEach(i => {
                            let val = sc.indicators ? sc.indicators[i.id] : null;
                            if(val) total += window.scoreNumber(val.k, 'k') + window.scoreNumber(val.p, 'p') + window.scoreNumber(val.a, 'a');
                        });
                    }
                });
            }
            total += window.scoreNumber(sc.midTermScore, 'midTermScore') + window.scoreNumber(sc.finalScore, 'finalScore');
            return total;
        }

        window.syncClassConfigToSameGrade = function() {
            let sd = window.getSubjectData(); let sourceCls = DB.classes[state.clsId]; if(!sourceCls) return 0;
            let gradeLevel = sourceCls.name.split('/')[0].trim(); let sourceConfig = sd.classData[state.clsId]; if(!sourceConfig) return 0;
            let sourceUnitsForTerm = (sourceConfig.learningUnits||[]).filter(u => String(u.term) === String(state.term));
            let sourceExamForTerm = sourceConfig.examSettings ? sourceConfig.examSettings[state.term] : null;
            let syncedCount = 0;

            Object.entries(DB.classes).forEach(([cId, cls]) => {
                if(cId === state.clsId) return;
                let targetGrade = cls.name.split('/')[0].trim();
                if(targetGrade === gradeLevel) {
                    if(!sd.classData[cId]) sd.classData[cId] = { learningUnits: [], examSettings: {} };
                    sd.classData[cId].learningUnits = (sd.classData[cId].learningUnits||[]).filter(u => String(u.term) !== String(state.term));
                    sd.classData[cId].learningUnits.push(...JSON.parse(JSON.stringify(sourceUnitsForTerm)));
                    if(!sd.classData[cId].examSettings) sd.classData[cId].examSettings = {};
                    if(sourceExamForTerm) sd.classData[cId].examSettings[state.term] = JSON.parse(JSON.stringify(sourceExamForTerm));
                    syncedCount++;
                }
            });
            return syncedCount;
        }

        window.getScoreImportContext = function() {
            const cls = DB.classes[state.clsId];
            const sub = DB.subjects.find(x => x.id === state.subjId);
            if(!cls || !sub) return null;

            const sd = window.getSubjectData();
            const classConfig = sd.classData[state.clsId] || {};
            const termUnits = (classConfig.learningUnits || []).filter(u => String(u.term) === String(state.term));
            const ex = classConfig.examSettings ? (classConfig.examSettings[state.term] || {mid:20, final:30}) : {mid:20, final:30};
            const slots = [];

            termUnits.forEach((u, unitIdx) => {
                (u.indicators || []).forEach((ind, indIdx) => {
                    [
                        { type: 'k', label: 'K', maxKey: 'max_k' },
                        { type: 'p', label: 'P', maxKey: 'max_p' },
                        { type: 'a', label: 'A', maxKey: 'max_a' }
                    ].forEach(part => {
                        const max = Number(ind[part.maxKey] || 0);
                        if(max > 0) {
                            const unitName = u.name || `หน่วยที่ ${unitIdx + 1}`;
                            const indicatorName = ind.name || `ตัวชี้วัด ${indIdx + 1}`;
                            slots.push({
                                kind: 'indicator',
                                unitId: u.id,
                                unitName,
                                indId: ind.id,
                                indicatorName,
                                type: part.type,
                                max,
                                header: `${unitName} | ${indicatorName} | ${part.label} (${max})`
                            });
                        }
                    });
                });
            });

            const midMax = Number(ex && ex.mid || 0);
            const finalMax = Number(ex && ex.final || 0);
            if(midMax > 0) slots.push({ kind: 'exam', type: 'midTermScore', max: midMax, header: `กลางภาค (${midMax})` });
            if(finalMax > 0) slots.push({ kind: 'exam', type: 'finalScore', max: finalMax, header: `ปลายภาค (${finalMax})` });
            return { cls, sub, sd, classConfig, slots };
        };

            const rows = [

                ['เลขที่', 'รหัส', 'ชื่อ-สกุล', ...ctx.slots.map(slot => slot.header)]
            ];
            ctx.cls.students.forEach((stu, idx) => {

                XLSX.utils.book_append_sheet(wb, ws, 'scores');

                const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
