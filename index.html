    <style>
        :root {
            --brand-primary: #2563eb;
            --brand-secondary: #0f766e;
            --brand-accent: #6366f1;
            --surface: rgba(255, 255, 255, 0.94);
            --surface-soft: rgba(248, 250, 252, 0.86);
            --line: #e2e8f0;
            --shadow-card: 0 14px 34px rgba(15, 23, 42, 0.07);
            --shadow-soft: 0 8px 22px rgba(15, 23, 42, 0.06);
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background:
                radial-gradient(circle at 18% 0%, rgba(37, 99, 235, 0.08), transparent 30rem),
                radial-gradient(circle at 100% 0%, rgba(15, 118, 110, 0.08), transparent 28rem),

            color: #334155;
            font-size: 16px;
            overflow: hidden;
            letter-spacing: 0;

        /* โหมดกลางคืน — ใช้โทนกรมท่าอ่อน ไม่ใช่ดำสนิท และไล่ระดับความสว่างตามชั้นของ UI
           (พื้นหลัง < พื้นที่เนื้อหา < การ์ด/เมนู) เพื่อให้แยกชั้นออกจากกันและอ่านสบายตาขึ้น */
        html.dark-mode body { background-color: #141c2e; color: #dbe3f0; }
        html.dark-mode #app-container,
        html.dark-mode #content-area { background: #1a2438 !important; }
        html.dark-mode #sidebar,
        html.dark-mode .glass-header,
        html.dark-mode .modern-card,
        html.dark-mode #modal-content,
        html.dark-mode .a4-preview-container { background-color: #232f47 !important; border-color: #3a4a68 !important; color: #e8eef7 !important; }
        html.dark-mode .glass-header { background: rgba(35, 47, 71, 0.9) !important; }
        html.dark-mode .glass-panel { background: rgba(35, 47, 71, 0.78) !important; border-color: rgba(148, 163, 184, 0.24) !important; }
        html.dark-mode .bg-white,
        html.dark-mode .bg-slate-50,
        html.dark-mode .bg-gray-50 { background-color: #232f47 !important; }
        html.dark-mode .bg-slate-100,
        html.dark-mode .bg-gray-100,
        html.dark-mode .bg-indigo-50 { background-color: #2c3a55 !important; }
        html.dark-mode .border-slate-100,
        html.dark-mode .border-slate-200,
        html.dark-mode .border-gray-50,
        html.dark-mode .border-gray-100,
        html.dark-mode .border-gray-200 { border-color: #3a4a68 !important; }
        html.dark-mode .text-slate-400,
        html.dark-mode .text-slate-500,
        html.dark-mode .text-gray-500 { color: #a9b8ce !important; }
        html.dark-mode .text-slate-600,
        html.dark-mode .text-slate-700,
        html.dark-mode .text-gray-700 { color: #dbe3f0 !important; }
        html.dark-mode .text-slate-800,
        html.dark-mode .text-gray-800,
        html.dark-mode .text-gray-900 { color: #f8fafc !important; }
        html.dark-mode .text-indigo-100 { color: #e0e7ff !important; }
        html.dark-mode .text-indigo-400,
        html.dark-mode .text-indigo-500,
        html.dark-mode .text-indigo-600 { color: #a5b4fc !important; }
        html.dark-mode .text-indigo-700,
        html.dark-mode .text-indigo-800,
        html.dark-mode .text-indigo-900 { color: #c7d2fe !important; }
        html.dark-mode .hover\:text-indigo-600:hover,
        html.dark-mode .hover\:text-indigo-700:hover,
        html.dark-mode .group:hover .group-hover\:text-indigo-600,
        html.dark-mode .group:hover .group-hover\:text-indigo-700 { color: #dbeafe !important; }
        html.dark-mode .text-emerald-600,
        html.dark-mode .text-emerald-700,
        html.dark-mode .text-emerald-800 { color: #86efac !important; }
        html.dark-mode .text-amber-600,
        html.dark-mode .text-amber-700,
        html.dark-mode .text-amber-800 { color: #fde68a !important; }
        html.dark-mode .text-rose-600,
        html.dark-mode .text-rose-700,
        html.dark-mode .text-rose-800 { color: #fda4af !important; }
        html.dark-mode .bg-indigo-100 { background-color: rgba(67, 56, 202, 0.28) !important; }
        html.dark-mode .bg-emerald-50,
        html.dark-mode .bg-emerald-100 { background-color: rgba(6, 78, 59, 0.55) !important; }
        html.dark-mode .bg-amber-50,
        html.dark-mode .bg-amber-100 { background-color: rgba(120, 53, 15, 0.5) !important; }
        html.dark-mode .bg-rose-50,
        html.dark-mode .bg-rose-100 { background-color: rgba(136, 19, 55, 0.48) !important; }
        html.dark-mode [class*="bg-slate-50/"],
        html.dark-mode [class*="bg-white/"] { background-color: rgba(35, 47, 71, 0.78) !important; }
        html.dark-mode input,
        html.dark-mode select,
        html.dark-mode textarea {
            background-color: #1c2740 !important;
            border-color: #3a4a68 !important;
            color: #f1f5fb !important;
        }
        html.dark-mode input::placeholder,
        html.dark-mode textarea::placeholder { color: #8496b0 !important; }
        html.dark-mode table th { background-color: #2c3a55 !important; color: #dbe3f0 !important; }
        html.dark-mode table td { background-color: #232f47; color: #e8eef7; }
        html.dark-mode .scorebook-scroll,
        html.dark-mode .scorebook-table,
        html.dark-mode .scorebook-table td,
        html.dark-mode .scorebook-table th { background-color: #232f47 !important; }
        html.dark-mode .scorebook-input { background: transparent !important; color: #f1f5fb !important; }
        html.dark-mode .shadow-sm,
        html.dark-mode .shadow-lg,
        html.dark-mode .shadow-xl,
        html.dark-mode .shadow-2xl { box-shadow: 0 16px 40px rgba(0,0,0,0.28) !important; }
        html.dark-mode .print-table,
        html.dark-mode .print-table th,
        html.dark-mode .print-table td,
        html.dark-mode #print-view,
        html.dark-mode .a4-preview-container {
            color: #000 !important;
            background: #fff !important;
        }
        
        /* Glassmorphism Effects */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
        }
        
        /* Modern Cards */
        .modern-card { 
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--line);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }
        .modern-card:hover { 
            box-shadow: var(--shadow-card);
            transform: translateY(-1px);
            border-color: rgba(148, 163, 184, 0.55);
        }
        
        /* Colorful Gradients */
        .bg-login-gradient { background: linear-gradient(135deg, #2563eb 0%, #0f766e 100%); }
        .bg-primary-gradient { background: linear-gradient(135deg, #2563eb 0%, #0f766e 100%); }
        
        /* Interactive Utilities */
        .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); border-color: var(--brand-primary); }
        .tactile-btn { transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease; cursor: pointer; }
        .tactile-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 18px -10px rgba(15, 23, 42, 0.28); }
        .tactile-btn:active { transform: translateY(0) scale(0.985); box-shadow: none; }

        /* 2026 UI refresh */
        #app-container { background: linear-gradient(180deg, rgba(248, 250, 252, 0.72), rgba(241, 245, 249, 0.98)) !important; }
        #content-area { background: transparent !important; }
        #sidebar {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(226, 232, 240, 0.9) !important;
            box-shadow: 8px 0 30px rgba(15, 23, 42, 0.05) !important;
        }
        #sidebar h2 { letter-spacing: -0.02em; }
        #sidebar .border-b,
        #sidebar .border-t { border-color: rgba(226, 232, 240, 0.78) !important; }
        #page-title {
            font-size: clamp(1.25rem, 1.5vw, 1.65rem);
            line-height: 1.25;
            letter-spacing: -0.01em;
        }
        #header-term-display,
        #active-users-pill,
        #theme-toggle-btn {
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
            white-space: nowrap;
        }
        #content-wrapper { max-width: 100%; }
        input,
        select,
        textarea {
            border-radius: 12px !important;
            border-color: #dbe3ef !important;
        }
        input:hover,
        select:hover,
        textarea:hover { border-color: #b6c3d5 !important; }
        table {
            border-collapse: separate;
            border-spacing: 0;
        }
        table th {
            color: #334155;
            background: rgba(248, 250, 252, 0.92);
            border-color: #e2e8f0;
        }
        table td { border-color: #edf2f7; }
        .scorebook-card,
        .scorebook-scroll { border-radius: 14px; }
        .scorebook-table th {
            font-size: 12px;
            font-weight: 800;
            color: #334155;
        }
        .scorebook-table td {
            font-size: 13px;
            color: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #b6c3d5;
            border-radius: 999px;
        }
        /* บล็อกนี้อยู่ท้ายกว่าจึงเป็นตัวที่มีผลจริงในโหมดกลางคืน
           ปรับจากเกือบดำสนิท (#07111f) มาเป็นกรมท่าอ่อน ให้จ้าน้อยลงแต่ยังแยกชั้นได้ชัด */
        html.dark-mode body {
            background:
                radial-gradient(circle at 16% 0%, rgba(96, 165, 250, 0.14), transparent 32rem),
                radial-gradient(circle at 100% 0%, rgba(45, 212, 191, 0.09), transparent 28rem),
                #1b2438;
        }
        html.dark-mode #app-container,
        html.dark-mode #content-area { background: transparent !important; }
        html.dark-mode #sidebar,
        html.dark-mode .glass-header,
        html.dark-mode .modern-card,
        html.dark-mode #modal-content {
            background-color: rgba(42, 56, 82, 0.94) !important;
            border-color: rgba(108, 128, 160, 0.55) !important;
        }
        html.dark-mode .modern-card {
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.18) !important;
        }
        html.dark-mode .modern-card:hover {
            border-color: rgba(125, 211, 252, 0.5) !important;
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24) !important;
        }
        html.dark-mode table th {
            background: rgba(56, 73, 105, 0.96) !important;
            color: #e8eef7 !important;
        }
        html.dark-mode table td { border-color: rgba(108, 128, 160, 0.5) !important; }
        
        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        input, select, textarea { font-size: 16px !important; transition: all 0.2s; }
        table th { font-size: 15px; font-weight: 700; background-color: rgba(248, 250, 252, 0.9); backdrop-filter: blur(8px); color: #475569; }
        table td { font-size: 15px; }

        .scorebook-card:hover { transform: none; }
        .scorebook-scroll {
            max-height: min(64vh, calc(100vh - 360px));
            overflow: auto;
            overscroll-behavior: contain;
            background: #fff;
        }
        .scorebook-table {
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
        }
        .scorebook-table th,
        .scorebook-table td {
            height: 38px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .scorebook-table thead {
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .scorebook-table thead th {
            z-index: 31;
        }
        .scorebook-table .score-num-col { width: 44px; min-width: 44px; max-width: 44px; }
        .scorebook-table .score-code-col { width: 70px; min-width: 70px; max-width: 70px; }
        .scorebook-table .score-name-col { width: 190px; min-width: 190px; max-width: 190px; }
        .scorebook-table .score-mark-col { width: 56px; min-width: 56px; max-width: 56px; }
        .scorebook-table .score-exam-col,
        .scorebook-table .score-total-col { width: 58px; min-width: 58px; max-width: 58px; }
        .scorebook-table .score-grade-col { width: 52px; min-width: 52px; max-width: 52px; }
        .scorebook-table .score-sticky-num {
            position: sticky;
            left: 0;
            z-index: 22;
        }
        .scorebook-table .score-sticky-name {
            position: sticky;
            left: 114px;
            z-index: 22;
        }
        .scorebook-table thead .score-sticky-num,
        .scorebook-table thead .score-sticky-code,
        .scorebook-table thead .score-sticky-name {
            z-index: 42;
        }
        .scorebook-table .score-sticky-code {
            position: sticky;
            left: 44px;
            z-index: 22;
        }
        .scorebook-unit-title {
            display: block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .scorebook-input {
            height: 34px;
            min-width: 0;
            padding: 4px 2px !important;
            font-size: 14px !important;
            line-height: 1;
        }
        @media (max-width: 900px) {
            .scorebook-scroll { max-height: calc(100vh - 330px); }
            .scorebook-table .score-code-col { width: 64px; min-width: 64px; max-width: 64px; }
            .scorebook-table .score-name-col { width: 165px; min-width: 165px; max-width: 165px; }
            .scorebook-table .score-mark-col { width: 52px; min-width: 52px; max-width: 52px; }
            .scorebook-table .score-sticky-name { left: 108px; }
        }

        /* --- รูปแบบตารางสำหรับการพิมพ์ --- */
        .print-table { 
            width: 100%; 
            max-width: 100%;
            border-collapse: collapse; 
            color: #000; 
            table-layout: fixed; 
        }
        .print-table th, .print-table td { 
            border: 1px solid #000; 
            padding: 4px 2px; 
            text-align: center; 
            font-size: 11px; 
            word-wrap: break-word; 
            overflow-wrap: anywhere; 
            word-break: break-word;
            line-height: 1.15; 
            box-sizing: border-box;
            vertical-align: middle;
        }
        .print-table th { 
            background-color: #f3f4f6 !important; 
            font-weight: bold; 
            font-size: 11px; 
            white-space: normal;
            -webkit-print-color-adjust: exact; 
            print-color-adjust: exact; 
        }
        .print-table .print-unit-header,
        .print-table .print-indicator-header {
            white-space: normal !important;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.12;
        }
        .print-table .print-unit-header > span,
        .print-table .print-indicator-header > span {
            display: block;
            max-width: 100%;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .print-table .print-num-col { width: 4%; }
        .print-table .print-code-col { width: 7%; }
        .print-table .print-name-col { width: 18%; min-width: 86px; }
        .print-table .print-score-col { width: 4.5%; }
        .print-table .text-left { text-align: left !important; padding-left: 6px !important; }
        .print-logo { width: 75px; height: 75px; object-fit: contain; margin: 0 auto 10px auto; display: block; }

            width: 210mm;
            max-width: 100%;
            min-height: 297mm;
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin: 0 auto;
            padding: 10mm 15mm;
            position: relative;
        }

        .break-inside-avoid {
            page-break-inside: avoid;
            break-inside: avoid;
        }

                /drive\.google\.com\/thumbnail\?(?:.*[?&])?id=([^&#]+)/i,
                /[?&]id=([^&#]+)/i
            ];
            for(const pattern of driveIdPatterns) {
                const match = cleanUrl.match(pattern);
                if(match && match[1]) {
                    return `https://drive.google.com/thumbnail?id=${encodeURIComponent(match[1])}&sz=w400`;
                }
            }
            return cleanUrl;
        }

        window.compressImageDataUrl = function(dataUrl, maxSize = 180, quality = 0.82) {
            return new Promise((resolve) => {
                if(!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image/')) return resolve(dataUrl);
                const img = new Image();
                img.onload = () => {
                    try {
                        const scale = Math.min(1, maxSize / img.width, maxSize / img.height);
                        const w = Math.max(1, Math.round(img.width * scale));
                        const h = Math.max(1, Math.round(img.height * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        const candidates = [
                            canvas.toDataURL('image/webp', quality),
                            canvas.toDataURL('image/png')
                        ].filter(Boolean);
                        const best = candidates.reduce((shortest, item) => item.length < shortest.length ? item : shortest, dataUrl);
                        resolve(best.length < dataUrl.length ? best : dataUrl);
                    } catch(e) {
                        console.warn('Logo compression skipped:', e);
                        resolve(dataUrl);
                    }
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        window.normalizeScoreValue = function(value, preferredKey = '') {
            const seen = new Set();
            const pick = (item) => {
                if(item === null || item === undefined || item === '') return '';
                if(typeof item === 'number') return Number.isFinite(item) ? item : '';
                if(typeof item === 'string') {
                    const trimmed = item.trim();
                    if(!trimmed || trimmed === '[object Object]') return '';
                    const num = Number(trimmed);
                    return Number.isFinite(num) ? num : '';
                }
                if(typeof item === 'boolean') return item ? 1 : 0;
                if(Array.isArray(item)) {
                    for(const entry of item) {
                        const found = pick(entry);
                        if(found !== '') return found;
                    }
                    return '';
                }
                if(typeof item === 'object') {
                    if(seen.has(item)) return '';
                    seen.add(item);
                    const priorityKeys = [preferredKey, 'value', 'score', 'total', 'amount', 'midTermScore', 'finalScore', 'mid', 'final', 'k', 'p', 'a'].filter(Boolean);
                    for(const key of priorityKeys) {
                        if(Object.prototype.hasOwnProperty.call(item, key)) {
                            const found = pick(item[key]);
                            if(found !== '') return found;
                        }
                    }
                    for(const entry of Object.values(item)) {
                        const found = pick(entry);
                        if(found !== '') return found;
                    }
                }
                return '';
            };
            return pick(value);
        }

        window.normalizeSubjectScores = function(subjectData) {
            if(!subjectData || typeof subjectData !== 'object' || !subjectData.scores || typeof subjectData.scores !== 'object') return false;
            let changed = false;
            const setIfFixed = (obj, key) => {
                if(!obj || typeof obj !== 'object' || obj[key] === undefined) return;
                const fixed = window.normalizeScoreValue(obj[key], key);
                if(obj[key] !== fixed) {
                    obj[key] = fixed;
                    changed = true;
                }
            };
            const fixScoreBlock = (scoreBlock) => {
                if(!scoreBlock || typeof scoreBlock !== 'object') return;
                if(scoreBlock.indicators && typeof scoreBlock.indicators === 'object') {
                    Object.values(scoreBlock.indicators).forEach(indScores => {
                        if(indScores && typeof indScores === 'object') {
                            ['k', 'p', 'a'].forEach(key => setIfFixed(indScores, key));
                        }
                    });
                }
                ['midTermScore', 'finalScore'].forEach(key => setIfFixed(scoreBlock, key));
            };

            Object.values(subjectData.scores).forEach(classScores => {
                if(!classScores || typeof classScores !== 'object') return;
                Object.values(classScores).forEach(studentScores => {
                    if(!studentScores || typeof studentScores !== 'object') return;
                    if(studentScores.term !== undefined) fixScoreBlock(studentScores);
                    Object.values(studentScores).forEach(termScores => {
                        if(termScores && typeof termScores === 'object') fixScoreBlock(termScores);
                    });
                });
            });
            return changed;
        }

        window.hasPendingScoreEntry = function(subId = null, clsId = null, stuId = null) {
            const entryKey = window.scorePendingEntryKey(subId || state.subjId, clsId || state.clsId, stuId);
            if(!entryKey) return false;
            return pendingScoreEntries.has(entryKey) || Object.values(scoreAutoSavePending || {}).some(item => item && window.scorePendingEntryKey(item.subId, item.clsId, item.stuId) === entryKey);
        }

        // A pending autosave should only block an incoming cloud read for a short window -
        // it exists to stop a stale cloud read from clobbering an edit that's still in flight.
        // Entries that failed to sync long ago (or predate this timestamp field entirely) must
        // not shadow fresh cloud data forever, or a permanently-failed old write silently hides
        // real data that later syncs successfully (including re-imports) from ever showing up.
        window.hasFreshPendingScoreEntry = function(subId = null, clsId = null, stuId = null, maxAgeMs = 10 * 60 * 1000) {
            const id = subId || state.subjId;
            const cId = clsId || state.clsId;
            if(!id || !cId || !stuId) return false;
            // The interactive scoring table writes directly (t_saveExam / t_saveIndicator) and
            // marks the cell pending via markScoreSubjectPending *before* awaiting the Firestore
            // call - it only falls back to the debounced scoreAutoSavePending queue if that direct
            // write fails. So a direct write still in flight only shows up in pendingScoreEntries,
            // never in scoreAutoSavePending. It's cleared the moment the write settles (success or
            // handed off to the retry queue), so it's safe to always treat it as fresh - unlike
            // scoreAutoSavePending, it can't get stuck.
            const entryKey = window.scorePendingEntryKey(id, cId, stuId);
            if(entryKey && pendingScoreEntries.has(entryKey)) return true;
            const now = Date.now();
            return Object.values(scoreAutoSavePending || {}).some(item => {
                if(!item || item.subId !== id || item.clsId !== cId || item.stuId !== stuId) return false;
                const since = Number(item.pendingSince || 0);
                if(!since) return false;
                return (now - since) < maxAgeMs;
            });
        }

        // A Firestore write promise only settles once the backend acknowledges the write. On a
        // stalled connection the SDK keeps the write queued and the promise never settles - it
        // neither resolves nor rejects - so anything awaiting it waits forever. Every cloud write
        // the UI blocks on goes through this, so a silent stall surfaces as a normal sync failure
        // (local save is already done, and the pending-cell queue retries) instead of a spinner
        // that never stops.
        window.withCloudWriteTimeout = function(promise, ms = 20000, label = 'write') {
            let timer = null;
            return Promise.race([
                Promise.resolve(promise).finally(() => { if(timer) clearTimeout(timer); }),
                new Promise((_, reject) => {
                    timer = setTimeout(() => {
                        const err = new Error(`cloud ${label} was not acknowledged within ${Math.round(ms / 1000)}s`);
                        err.isCloudWriteTimeout = true;
                        reject(err);
                    }, ms);

            ]);

        window.flushScoreAutoSave = async function(key) {

            if(!item) return;
            if(scoreAutoSaveTimers[key]) clearTimeout(scoreAutoSaveTimers[key]);
            if(window.isCloudQuotaBackoffActive && window.isCloudQuotaBackoffActive()) {
                const retryDelay = Math.min(Math.max(window.getCloudQuotaBackoffRemaining(), 30000), 5 * 60 * 1000);
                scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), retryDelay);
                window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
                window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว รอคลาวด์ว่าง');
                return;
            }
            delete scoreAutoSaveTimers[key];
            delete scoreAutoSavePending[key];
            window.persistScoreAutoSavePending();

            try {
                if(typeof window.firebaseUpdateScore !== 'function' && typeof window.firebaseSaveFn !== 'function') {
                    throw new Error('cloud score writer is not ready');
                }
                if(typeof window.firebaseUpdateScore === 'function') {
                    await window.withCloudWriteTimeout(
                        window.firebaseUpdateScore(item.subId, item.clsId, item.stuId, item.term, item.type, item.val),
                        20000,
                        'score cell write'
                    );
                } else if(typeof window.firebaseSaveFn === 'function') {
                    window.firebaseSaveFn();
                }
                window.clearScoreSubjectPendingIfDone(item.subId, item.clsId, item.stuId);
                window.setScoreAutoSaveStatus('saved', 'บันทึกอัตโนมัติแล้ว');
            } catch(err) {
                const quotaErr = window.isCloudQuotaError && window.isCloudQuotaError(err);
                if(!quotaErr) console.error('Score autosave failed:', err);
                if(quotaErr && window.activateCloudQuotaBackoff) {
                    window.activateCloudQuotaBackoff(err);
                }
                const retryCount = Number(item.retryCount || 0) + 1;
                item.retryCount = retryCount;
                scoreAutoSavePending[key] = item;
                window.persistScoreAutoSavePending();
                const quotaDelay = window.getCloudQuotaBackoffRemaining ? window.getCloudQuotaBackoffRemaining() : 0;
                const retryDelay = quotaDelay > 0 ? Math.min(Math.max(quotaDelay, 30000), 5 * 60 * 1000) : Math.min(30000, 4000 * retryCount);
                if(retryCount <= 6) {
                    scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), retryDelay);
                    window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
                    window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว กำลังลองซิงก์อีกครั้ง');
                } else {
                    window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
                    window.setScoreAutoSaveStatus('error', 'บันทึกในเครื่องแล้ว รอเชื่อมต่อคลาวด์');
                }
            }
        }

        window.flushPendingScoreAutoSaves = async function(onProgress = null) {
            window.saveSubjectDataLocalNow();
            window.persistScoreSafetyLogNow();
            const keys = Object.keys(scoreAutoSavePending);
            const subjectIds = Array.from(new Set(keys.map(key => (scoreAutoSavePending[key] || {}).subId).filter(Boolean)));

            // Every pending entry is a single cell, but the cloud stores one document per student
            // and each per-cell write costs its own round trip through the sequential write queue.
            // Flushing a fully filled class one cell at a time is hundreds of round trips - minutes
            // of spinner. The values are all in the local score node already, so one batched write
            // per student document persists the whole lot. Cells being *cleared* still go through
            // the per-cell path: a batch write merges the pruned score node, which leaves the old
            // cloud value in place for a leaf that is now empty.
            const batchedItems = new Map();
            const perCellKeys = [];
            keys.forEach(key => {
                const item = scoreAutoSavePending[key];
                if(!item) return;
                const isEmptyValue = item.val === '' || item.val === null || item.val === undefined;
                if(isEmptyValue) perCellKeys.push(key);
                else batchedItems.set(key, item);
            });
            const batchedKeys = Array.from(batchedItems.keys());

            let batchedTargets = [];
            if(batchedKeys.length > 1 && typeof window.firebaseBatchWriteScoreNodes === 'function') {
                const seen = new Set();
                batchedItems.forEach(item => {
                    const targetKey = window.scorePendingEntryKey(item.subId, item.clsId, item.stuId);
                    if(!targetKey || seen.has(targetKey)) return;
                    seen.add(targetKey);
                    batchedTargets.push({ subId: item.subId, clsId: item.clsId, stuId: item.stuId });
                });
            }

            let flushedByBatch = false;
            if(batchedTargets.length > 0) {
                if(typeof onProgress === 'function') onProgress(0, batchedKeys.length + perCellKeys.length);
                try {
                    const result = await window.firebaseBatchWriteScoreNodes(batchedTargets);
                    flushedByBatch = !!(result && result.attempted && result.failed === 0);
                } catch(err) {
                    console.warn('Batched pending score flush failed, falling back to per-cell writes:', err);
                }
            }

            if(flushedByBatch) {
                batchedItems.forEach((item, key) => {
                    // A cell retyped while the batch was in flight has a fresh pending record with a
                    // newer value and its own write already on the way - leave that one alone.
                    if(scoreAutoSavePending[key] !== item) return;
                    if(scoreAutoSaveTimers[key]) { clearTimeout(scoreAutoSaveTimers[key]); delete scoreAutoSaveTimers[key]; }
                    delete scoreAutoSavePending[key];
                });
                window.persistScoreAutoSavePending();
                batchedTargets.forEach(t => window.clearScoreSubjectPendingIfDone(t.subId, t.clsId, t.stuId));
                if(typeof onProgress === 'function') onProgress(batchedKeys.length, batchedKeys.length + perCellKeys.length);
            }

            const remainingKeys = flushedByBatch ? perCellKeys : keys;
            let done = flushedByBatch ? batchedKeys.length : 0;
            const total = keys.length;
            await Promise.all(remainingKeys.map(async key => {
                await window.flushScoreAutoSave(key);
                done++;
                if(typeof onProgress === 'function') onProgress(done, total);
            }));

            if(typeof window.firebaseSyncProgressSummaryNow === 'function') {
                await Promise.all(subjectIds.map(subId => window.firebaseSyncProgressSummaryNow(subId)));
            }
        }

        window.scheduleScoreAutoSave = function(subId, clsId, stuId, term, type, val) {
            if(!subId || !clsId || !stuId || !term || !type) return;
            window.rememberScoreSafetyValue(subId, clsId, stuId, term, type, val);
            window.markScoreSubjectPending(subId, clsId, stuId);
            if(typeof window.updateClassProgressSummaryLocal === 'function') {
                window.updateClassProgressSummaryLocal(subId, clsId, term);
            }
            if(typeof window.firebaseScheduleProgressSummarySync === 'function') {
                window.firebaseScheduleProgressSummarySync(subId, clsId, term);
            }
            window.scheduleSubjectDataLocalSave();
            window.setScoreAutoSaveStatus('pending', 'กำลังบันทึกอัตโนมัติ...');

            const key = window.scoreAutoSaveKey(subId, clsId, stuId, term, type);
            scoreAutoSavePending[key] = { subId, clsId, stuId, term, type, val, pendingSince: Date.now() };
            window.persistScoreAutoSavePending();
            if(scoreAutoSaveTimers[key]) clearTimeout(scoreAutoSaveTimers[key]);
            scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), 900);
        }

        // The interactive scoring table (t_saveExam/t_saveSc) writes directly instead of going
        // through the debounced scheduleScoreAutoSave queue above, for instant feedback. But every
        // write - direct or debounced - still funnels through one global sequential Firestore queue
        // (enqueueScoreWrite), so with many cells edited in quick succession a write can sit queued
        // for a while before its turn comes up. That queue lives only in memory: if the page is
        // refreshed or closed before a queued write's turn arrives, it is silently dropped - nothing
        // was ever marked as failed, so nothing would have retried it, and nothing was protecting it
        // from being overwritten by a stale cloud read on the next load. Registering a persisted
        // pending record up front (mirroring scheduleScoreAutoSave's bookkeeping, minus the 900ms
        // debounce timer since the direct call already fires immediately) closes that gap: the
        // record survives a refresh, restorePendingScoreAutosaves() retries it on the next load, and
        // hasFreshPendingScoreEntry keeps protecting it from a stale cloud read in the meantime.
        window.registerPendingScoreWrite = function(subId, clsId, stuId, term, type, val) {
            if(!subId || !clsId || !stuId || !term || !type) return;
            const key = window.scoreAutoSaveKey(subId, clsId, stuId, term, type);
            scoreAutoSavePending[key] = { subId, clsId, stuId, term, type, val, pendingSince: Date.now() };
            window.persistScoreAutoSavePending();
        }

        window.resolvePendingScoreWrite = function(subId, clsId, stuId, term, type) {
            const key = window.scoreAutoSaveKey(subId, clsId, stuId, term, type);
            if(scoreAutoSaveTimers[key]) { clearTimeout(scoreAutoSaveTimers[key]); delete scoreAutoSaveTimers[key]; }
            delete scoreAutoSavePending[key];
            window.persistScoreAutoSavePending();
            window.clearScoreSubjectPendingIfDone(subId, clsId, stuId);
        }

        window.restorePendingScoreAutosaves = function() {
            let hasRestored = false;
            Object.keys(scoreAutoSavePending || {}).forEach(key => {
                const item = scoreAutoSavePending[key];
                if(!item || !item.subId || !item.clsId || !item.stuId || !item.term || !item.type) {
                    delete scoreAutoSavePending[key];
                    return;
                }
                window.markScoreSubjectPending(item.subId, item.clsId, item.stuId);
                hasRestored = true;
            });
            window.persistScoreAutoSavePending();
            // Marking pending status alone doesn't push anything to the cloud - a score that was
            // still queued for its cloud write when the page closed (refresh, tab close, crash)
            // would otherwise sit here forever with nothing actively retrying it. Kick off a retry
            // for everything restored so an interrupted save actually finishes on the next load.
            if(hasRestored && typeof window.retryPendingScoreAutoSaves === 'function') {
                window.retryPendingScoreAutoSaves(1200);
            }
        }

        window.getPendingScoreCellCount = function() {
            return Object.keys(scoreAutoSavePending || {}).length;
        }

        window.retryPendingScoreAutoSaves = function(delay = 1800) {
            Object.keys(scoreAutoSavePending || {}).forEach(key => {
                if(scoreAutoSaveTimers[key]) return;
                scoreAutoSaveTimers[key] = setTimeout(() => window.flushScoreAutoSave(key), delay);
            });
        }

        window.restorePendingScoreAutosaves();

        document.addEventListener('visibilitychange', () => {
            if(document.visibilityState === 'hidden' && Object.keys(scoreAutoSavePending).length > 0) {
                window.saveSubjectDataLocalNow();
                window.persistScoreSafetyLogNow();
                window.flushPendingScoreAutoSaves();

        window.addEventListener('beforeunload', () => {

        });

        window.setCloudSyncState = function(nextState = {}) {
            cloudSyncState = Object.assign(cloudSyncState, nextState);
            window.cloudSyncState = cloudSyncState;
            if(typeof window.updateActiveUsersUI === 'function') window.updateActiveUsersUI();

        window.isCloudQuotaError = function(err) {
            const code = String((err && err.code) || '').toLowerCase();
            const message = String((err && err.message) || err || '').toLowerCase();
            return code.includes('resource-exhausted') || message.includes('resource-exhausted') || message.includes('quota exceeded') || message.includes('quota backoff') || message.includes('429');
        }

        window.activateCloudQuotaBackoff = function(err, durationMs = 5 * 60 * 1000) {
            cloudQuotaBackoffUntil = Math.max(cloudQuotaBackoffUntil || 0, Date.now() + durationMs);
            const message = 'Firestore quota exceeded - local save active, cloud sync paused briefly';
            window.setCloudSyncState({ mode: 'local', connected: false, lastError: message });
            if(Date.now() - lastCloudQuotaNoticeAt > 60000) {
                lastCloudQuotaNoticeAt = Date.now();
                console.warn(message, err);
                if(typeof window.notify === 'function') window.notify('คลาวด์ใช้งานเกินโควตาชั่วคราว: บันทึกในเครื่องแล้ว จะซิงก์ใหม่ภายหลัง', true);
            }
            if(cloudQuotaResumeTimer) clearTimeout(cloudQuotaResumeTimer);
            cloudQuotaResumeTimer = setTimeout(() => {
                cloudQuotaResumeTimer = null;
                if(state.activePage === 'teacher_scoring' && typeof window.subscribeActiveScoreSubject === 'function') {
                    window.subscribeActiveScoreSubject(state.subjId, state.clsId, state.term);
                }
                if(typeof window.retryPendingScoreAutoSaves === 'function') window.retryPendingScoreAutoSaves(800);
                if(typeof window.requestDirtyCloudFlush === 'function') window.requestDirtyCloudFlush(1200);
            }, Math.min(Math.max(window.getCloudQuotaBackoffRemaining(), 30000), 5 * 60 * 1000) + 1000);
        }

        window.getCloudQuotaBackoffRemaining = function() {
            return Math.max(0, Number(cloudQuotaBackoffUntil || 0) - Date.now());
        }

        window.isCloudQuotaBackoffActive = function() {
            return window.getCloudQuotaBackoffRemaining() > 0;
        }

        window.getActiveUsers = function() {

            Object.entries(window.presenceUsers || {}).forEach(([id, user]) => {

                usersById[id] = {

                };

            const msg = scoreLockStatus.pending ? 'ระบบกำลังตรวจสอบสิทธิ์แก้ไข กรุณารอสักครู่' : `${owner} กำลังแก้ไขสมุดคะแนนนี้อยู่`;

        window.acquireScoreLock = function(silent = false) {
            const key = window.getScoreLockKey();
            if(!key) return false;
            const scoreEntryStatus = window.getScoreEntryStatus ? window.getScoreEntryStatus() : { allowed: true };
            if(state.activePage === 'teacher_scoring' && !scoreEntryStatus.allowed) {
                scoreLockStatus = { key, pending: false };
                window.refreshScoreLockBanner();
                return false;
            }
            const existing = window.scoreLocks[key];
            if(window.isScoreLockActive(existing) && existing.sessionId !== browserSessionId) {
                if(!silent) window.notify(`${window.getScoreLockOwnerText(existing)} กำลังแก้ไขสมุดคะแนนนี้อยู่`, true);
                scoreLockStatus = { key, pending: false };
                window.refreshScoreLockBanner();
                return false;
            }

            const actor = window.getCurrentActorInfo();
            const payload = {
                key,
                subId: state.subjId,
                clsId: state.clsId,
                term: state.term,
                actorId: actor.actorId,
                role: actor.role,
                displayName: actor.displayName,
                sessionId: browserSessionId,
                active: true,
                lastActive: Date.now()
            };
            if(window.isScoreLockActive(existing) && existing.sessionId === browserSessionId) {
                scoreLockStatus = { key, pending: false };
                window.scoreLocks[key] = payload;
                if(typeof window.firebaseUpdateScoreLock === 'function') window.firebaseUpdateScoreLock(key, payload);
                window.refreshScoreLockBanner();
                return true;
            }
            const hasCloudLock = typeof window.firebaseAcquireScoreLock === 'function' && !(window.isCloudQuotaBackoffActive && window.isCloudQuotaBackoffActive());
            scoreLockStatus = { key, pending: hasCloudLock };
            window.scoreLocks[key] = payload;
            window.refreshScoreLockBanner();

            if(hasCloudLock) {
                window.firebaseAcquireScoreLock(key, payload).then(result => {
                    if(result && result.ok) {
                        window.scoreLocks[key] = result.lock || payload;
                        scoreLockStatus = { key, pending: false };
                    } else if(result && result.lock) {
                        window.scoreLocks[key] = result.lock;
                        scoreLockStatus = { key, pending: false };
                        if(!silent) window.notify(`${window.getScoreLockOwnerText(result.lock)} กำลังแก้ไขสมุดคะแนนนี้อยู่`, true);
                    }
                    window.refreshScoreLockBanner();
                }).catch(err => {
                    console.error(err);
                    scoreLockStatus = { key, pending: false };
                    window.refreshScoreLockBanner();
                });
            } else if(typeof window.firebaseUpdateScoreLock === 'function') {
                window.firebaseUpdateScoreLock(key, payload);
            }
            return !hasCloudLock;
        }

        window.releaseScoreLock = function() {
            const key = scoreLockStatus.key || window.getScoreLockKey();
            const lock = key ? window.scoreLocks[key] : null;
            if(!key || !lock || lock.sessionId !== browserSessionId) return;
            const released = Object.assign({}, lock, { active: false, lastActive: Date.now() });
            window.scoreLocks[key] = released;
            scoreLockStatus = { key: '', pending: false };
            if(typeof window.firebaseReleaseScoreLock === 'function') window.firebaseReleaseScoreLock(key, released);
            window.refreshScoreLockBanner();
        }

        window.normalizeScoreEntryPolicy = function(policy = null) {
            const src = policy && typeof policy === 'object' ? policy : {};
            const validModes = ['always', 'scheduled', 'closed'];
            const mode = validModes.includes(src.mode) ? src.mode : 'always';
            return {
                mode,
                startDate: typeof src.startDate === 'string' ? src.startDate : '',
                endDate: typeof src.endDate === 'string' ? src.endDate : '',
                notice: typeof src.notice === 'string' ? src.notice : ''
            };
        }

        window.formatThaiDate = function(dateStr) {
            if(!dateStr) return '';
            const d = new Date(`${dateStr}T00:00:00`);
            if(Number.isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        window.getScoreEntryStatus = function() {
            const policy = window.normalizeScoreEntryPolicy(DB.schoolInfo && DB.schoolInfo.scoreEntryPolicy);
            const notice = policy.notice.trim();
            const noticeSuffix = notice ? ` • ${notice}` : '';

            if(policy.mode === 'closed') {
                return {
                    allowed: false,
                    severity: 'closed',
                    title: 'ปิดการลงคะแนน',
                    message: notice || 'ผู้ดูแลระบบปิดการลงคะแนนชั่วคราว'
                };
            }

            if(policy.mode === 'scheduled') {
                if(!policy.startDate || !policy.endDate) {
                    return {
                        allowed: false,
                        severity: 'closed',
                        title: 'ยังไม่ได้กำหนดช่วงวันลงคะแนนครบถ้วน',
                        message: 'กรุณาแจ้งผู้ดูแลระบบให้กำหนดวันเริ่มต้นและวันสิ้นสุดก่อนลงคะแนน'
                    };
                }

                const now = new Date();
                const start = new Date(`${policy.startDate}T00:00:00`);
                const end = new Date(`${policy.endDate}T23:59:59`);
                const rangeText = `${window.formatThaiDate(policy.startDate)} ถึง ${window.formatThaiDate(policy.endDate)}`;

                if(Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) {
                    return {
                        allowed: false,
                        severity: 'closed',
                        title: 'ช่วงวันลงคะแนนไม่ถูกต้อง',
                        message: 'กรุณาแจ้งผู้ดูแลระบบให้ตรวจสอบวันที่เปิดและปิดการลงคะแนน'
                    };
                }

                if(now < start) {
                    return {
                        allowed: false,
                        severity: 'upcoming',
                        title: 'ยังไม่ถึงเวลาเปิดลงคะแนน',
                        message: `ระบบจะเปิดให้ลงคะแนนวันที่ ${rangeText}${noticeSuffix}`
                    };
                }

                if(now > end) {
                    return {
                        allowed: false,
                        severity: 'expired',
                        title: 'หมดเวลาลงคะแนน',
                        message: `ระบบปิดการลงคะแนนแล้ว ช่วงที่กำหนดคือ ${rangeText}${noticeSuffix}`
                    };
                }

                return {
                    allowed: true,
                    severity: 'open',
                    title: 'เปิดลงคะแนนอยู่',
                    message: `สามารถลงคะแนนได้ถึงวันที่ ${window.formatThaiDate(policy.endDate)}${noticeSuffix}`
                };
            }

            return {
                allowed: true,
                severity: 'always',
                title: 'เปิดลงคะแนนตลอดเวลา',
                message: notice || 'ครูสามารถลงคะแนนได้ตามปกติ'
            };
        }

        window.getTeacherHomeroomClasses = function(teacherObj, term) {

        window.calculateClassProgressFromScores = function(subId, cId, term) {
            let sd = DB_SubjectData[subId]; if(!sd) return 0;
            let classConfig = (sd.classData && sd.classData[cId]) ? sd.classData[cId] : sd;
            let termUnits = (classConfig.learningUnits||[]).filter(u => String(u.term) === String(term));
            let ex = classConfig.examSettings ? classConfig.examSettings[term] : {mid:20, final:30};
            if(!ex) ex = {mid:20, final:30};

            let scStore = sd.scores ? sd.scores[cId] : null; if(!scStore) return 0;
            let cls = DB.classes[cId]; if(!cls || cls.students.length === 0) return 0;

            let completedPoints = 0;
            termUnits.forEach(u => {
                if(u.indicators) {
                    u.indicators.forEach(ind => {
                        let k_filled = false, p_filled = false, a_filled = false;
                        cls.students.forEach(stu => {
                            let sId = stu.studentId; let stuNode = scStore[sId];
                            if(stuNode) {
                                let mySc = stuNode[term]; if(!mySc && stuNode.term !== undefined && String(stuNode.term) === String(term)) mySc = stuNode;
                                if(mySc && mySc.indicators && mySc.indicators[ind.id]) {
                                    if(window.normalizeScoreValue(mySc.indicators[ind.id].k, 'k') !== '') k_filled = true;
                                    if(window.normalizeScoreValue(mySc.indicators[ind.id].p, 'p') !== '') p_filled = true;
                                    if(window.normalizeScoreValue(mySc.indicators[ind.id].a, 'a') !== '') a_filled = true;
                                }
                            }
                        });
                        const effectiveK = window.getEffectiveIndicatorColumn ? window.getEffectiveIndicatorColumn(ind, 'k', scStore, term).max : Number(ind.max_k || 0);
                        const effectiveP = window.getEffectiveIndicatorColumn ? window.getEffectiveIndicatorColumn(ind, 'p', scStore, term).max : Number(ind.max_p || 0);
                        const effectiveA = window.getEffectiveIndicatorColumn ? window.getEffectiveIndicatorColumn(ind, 'a', scStore, term).max : Number(ind.max_a || 0);
                        if(k_filled) completedPoints += effectiveK;
                        if(p_filled) completedPoints += effectiveP;
                        if(a_filled) completedPoints += effectiveA;
                    });
                }
            });

            let mid_filled = false, fin_filled = false;
            cls.students.forEach(stu => {
                let sId = stu.studentId; let stuNode = scStore[sId];
                if(stuNode) {
                    let mySc = stuNode[term]; if(!mySc && stuNode.term !== undefined && String(stuNode.term) === String(term)) mySc = stuNode;
                    if(mySc) {
                        if(window.normalizeScoreValue(mySc.midTermScore, 'midTermScore') !== '') mid_filled = true;
                        if(window.normalizeScoreValue(mySc.finalScore, 'finalScore') !== '') fin_filled = true;
                    }
                }
            });
            if(mid_filled) completedPoints += Number(ex.mid || 0);
            if(fin_filled) completedPoints += Number(ex.final || 0);
            return Math.min(100, Math.round(completedPoints));
        }

        window.getClassProgressSummary = function(subId, cId, term) {
            const sd = DB_SubjectData[subId];
            const summary = sd && sd.progressSummary && sd.progressSummary[String(term)]
                ? sd.progressSummary[String(term)][String(cId)]
                : null;
            if(typeof summary === 'number' && Number.isFinite(summary)) return Math.max(0, Math.min(100, Math.round(summary)));
            if(summary && Number.isFinite(Number(summary.percent))) return Math.max(0, Math.min(100, Math.round(Number(summary.percent))));
            return null;
        }

        window.updateClassProgressSummaryLocal = function(subId, cId, term) {
            const sd = DB_SubjectData[subId];
            if(!sd || !cId || !term) return null;
            const percent = window.calculateClassProgressFromScores(subId, cId, term);
            if(!sd.progressSummary || typeof sd.progressSummary !== 'object') sd.progressSummary = {};
            if(!sd.progressSummary[String(term)] || typeof sd.progressSummary[String(term)] !== 'object') sd.progressSummary[String(term)] = {};
            const cls = DB.classes && DB.classes[cId];
            sd.progressSummary[String(term)][String(cId)] = {
                percent,
                studentCount: cls && Array.isArray(cls.students) ? cls.students.length : 0,
                updatedAt: Date.now()
            };
            return percent;
        }

        window.calculateClassProgress = function(subId, cId, term) {
            const summary = window.getClassProgressSummary(subId, cId, term);

            return window.calculateClassProgressFromScores(subId, cId, term);
        }

        window.getMissingAdminDashboardProgressPairs = function(term = state.term) {
            const pairMap = new Map();
            (DB.teachers || []).forEach(teacher => {
                const assignments = window.getTeacherAssignments(teacher, term) || {};
                Object.entries(assignments).forEach(([subId, classIds]) => {
                    (Array.isArray(classIds) ? classIds : []).forEach(cId => {
                        if(!DB.classes || !DB.classes[cId]) return;
                        const key = `${subId}|${cId}`;
                        if(window.getClassProgressSummary(subId, cId, term) === null) pairMap.set(key, { subId, cId, term: String(term) });
                    });
                });
            });
            return Array.from(pairMap.values());
        }

        window.ensureAdminDashboardProgressCurrent = function(term = state.term) {
            const missingPairs = window.getMissingAdminDashboardProgressPairs(term);
            if(missingPairs.length === 0) return Promise.resolve({ synced: true, count: 0 });
            if(adminDashboardProgressSyncPromise) return adminDashboardProgressSyncPromise;
            if(typeof window.firebaseBackfillDashboardProgress !== 'function') return Promise.resolve({ synced: false, count: 0 });
            if(window.isCloudQuotaBackoffActive && window.isCloudQuotaBackoffActive()) return Promise.resolve({ synced: false, count: 0 });
            if(Date.now() - adminDashboardProgressLastAttempt < 30000) return Promise.resolve({ synced: false, count: 0 });

            adminDashboardProgressLastAttempt = Date.now();
            adminDashboardProgressSyncPromise = window.firebaseBackfillDashboardProgress(missingPairs)
                .catch(err => {
                    console.warn('Dashboard progress sync failed:', err);
                    return { synced: false, count: 0 };
                })
                .finally(() => { adminDashboardProgressSyncPromise = null; });
            return adminDashboardProgressSyncPromise;
        }

        window.getStudentTotalScore = function(student, subId, cId, termToCalculate = null) {
            let term = termToCalculate ? String(termToCalculate) : String(state.term);
            let sd = DB_SubjectData[subId];
            if(!sd || !sd.scores || !sd.scores[cId] || !sd.scores[cId][student.studentId]) return 0;
            
            let stuNode = sd.scores[cId][student.studentId];
            let sc = stuNode[term]; 
            if(stuNode.term !== undefined) { if (String(stuNode.term) === term) { sc = stuNode; } else { return 0; } }
            if(!sc) return 0;

            let total = 0;
            let units = (sd.classData && sd.classData[cId]) ? sd.classData[cId].learningUnits : sd.learningUnits;
            if(units) {
                units.forEach(u => {
                    if(String(u.term) === term && u.indicators) {
                        u.indicators.forEach(i => {
                            let val = sc.indicators ? sc.indicators[i.id] : null;
                            if(val) total += window.scoreNumber(val.k, 'k') + window.scoreNumber(val.p, 'p') + window.scoreNumber(val.a, 'a');
                        });
                    }
                });
            }
            total += window.scoreNumber(sc.midTermScore, 'midTermScore') + window.scoreNumber(sc.finalScore, 'finalScore');
            return total;
        }

        window.syncClassConfigToSameGrade = function() {
            let sd = window.getSubjectData(); let sourceCls = DB.classes[state.clsId]; if(!sourceCls) return 0;
            let gradeLevel = sourceCls.name.split('/')[0].trim(); let sourceConfig = sd.classData[state.clsId]; if(!sourceConfig) return 0;
            let sourceUnitsForTerm = (sourceConfig.learningUnits||[]).filter(u => String(u.term) === String(state.term));
            let sourceExamForTerm = sourceConfig.examSettings ? sourceConfig.examSettings[state.term] : null;
            let syncedCount = 0;

            Object.entries(DB.classes).forEach(([cId, cls]) => {
                if(cId === state.clsId) return;
                let targetGrade = cls.name.split('/')[0].trim();
                if(targetGrade === gradeLevel) {
                    if(!sd.classData[cId]) sd.classData[cId] = { learningUnits: [], examSettings: {} };
                    sd.classData[cId].learningUnits = (sd.classData[cId].learningUnits||[]).filter(u => String(u.term) !== String(state.term));
                    sd.classData[cId].learningUnits.push(...JSON.parse(JSON.stringify(sourceUnitsForTerm)));
                    if(!sd.classData[cId].examSettings) sd.classData[cId].examSettings = {};
                    if(sourceExamForTerm) sd.classData[cId].examSettings[state.term] = JSON.parse(JSON.stringify(sourceExamForTerm));
                    syncedCount++;
                }
            });
            return syncedCount;
        }

        window.renderAdminDash = async function(container) {

            const progressTerm = String(state.term);

            if(missingProgress.length > 0 && typeof window.firebaseBackfillDashboardProgress === 'function') {

        window.normalizeAdminMidtermClassKey = function(value) {
            const text = String(value ?? '').trim().replace(/\s+/g, ' ');
            const match = text.match(/(?:ป(?:ระถมศึกษาปีที่)?\.?\s*)?(\d+)\s*[\/.]\s*(\d+)/i);
            return match ? `${Number(match[1])}/${Number(match[2])}` : '';
        }

        window.normalizeAdminMidtermSubjectKey = function(value) {
            const text = String(value ?? '')
                .trim()
                .toLowerCase()
                .replace(/[\s()（）\[\]{}._\-–—/\\:;,'"ฯ]/g, '')
                .replace(/กลุ่มสาระการเรียนรู้|กลุ่มสาระ|รายวิชา/g, '');
            if(!text || text === 'รวม' || text === 'ร้อยละ') return '';
            if(text.includes('อังกฤษ') && (text.includes('สื่อสาร') || text.includes('เพิ่มเติม'))) return 'อังกฤษสื่อสาร';
            if(text.includes('ภาษาจีน') || text === 'จีน') return 'ภาษาจีน';
            if(text.includes('ภาษาอังกฤษ') || text === 'อังกฤษ') return 'ภาษาอังกฤษ';
            if(text.includes('สังคม')) return 'สังคมศึกษา';
            if(text.includes('ประวัติ')) return 'ประวัติศาสตร์';
            if(text.includes('สุขศึกษา') || text === 'สุข') return 'สุขศึกษา';
            if(text.includes('ศิลป') || text.includes('ทัศนศิลป์')) return 'ศิลปะ';
            if(text.includes('การงาน')) return 'การงานอาชีพ';
            if(text.includes('วิทย')) return 'วิทยาศาสตร์';
            if(text.includes('คณิต')) return 'คณิตศาสตร์';
            if(text.includes('ภาษาไทย') || text === 'ไทย') return 'ภาษาไทย';
            return text;
        }

        window.getAdminSubjectSortRank = function(name) {
            const text = String(name || '').trim();
            if(text.includes('อังกฤษ') && (text.includes('สื่อสาร') || text.includes('เพิ่มเติม'))) return 10;
            if(text.includes('จีน')) return 9;
            if(text.includes('อังกฤษ')) return 8;
            if(text.includes('การงาน')) return 7;
            if(text.includes('ศิลป')) return 6;
            if(text.includes('สุขศึกษา') || text.includes('พลศึกษา')) return 5;
            if(text.includes('ประวัติ')) return 4;
            if(text.includes('สังคม')) return 3;
            if(text.includes('วิทย')) return 2;
            if(text.includes('คณิต')) return 1;
            if(text.includes('ภาษาไทย') || text === 'ไทย') return 0;
            if(text.includes('พลเมือง')) return 11;
            if(text.includes('ทุจริต')) return 12;
            return 99;
        }

            const linked = typeof window.getGuardianReportSubjects === 'function'
                ? window.getGuardianReportSubjects(cId)

            const linkedIds = new Set(linked.map(sub => String(sub.id)));
            return (DB.subjects || [])
                .filter(sub => linkedIds.has(String(sub.id)))
                .slice()
                .sort((a, b) => window.getAdminSubjectSortRank(a.name) - window.getAdminSubjectSortRank(b.name));
        }

        window.exportAdminExamSummary = async function(examType = null) {
            if(!state.user || state.user.role !== 'admin') return;
            if(typeof XLSX === 'undefined') {
                window.notify('ไม่พบตัวสร้างไฟล์ Excel กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่', true);
                return;
            }

            const selectedType = examType || ($('admin-report-score-type') ? $('admin-report-score-type').value : 'mid');
            const scoreType = selectedType === 'final' ? 'final' : 'mid';
            const scoreLabel = scoreType === 'final' ? 'ปลายภาค' : 'กลางภาค';
            const classEntries = window.getSortedClassEntries();
            if(!classEntries.length) {
                window.notify('ยังไม่มีห้องเรียนสำหรับส่งออก', true);
                return;
            }

            if(typeof window.firebaseLoadScoresForSubjectsBulk === 'function') {
                window.notify(`กำลังดึงคะแนน${scoreLabel}ล่าสุดจากคลาวด์...`);
                const allSubjectIds = new Set();
                classEntries.forEach(([cId]) => {
                    window.getAdminMidtermSubjectsForClass(cId).forEach(sub => allSubjectIds.add(String(sub.id)));
                });
                try { await window.firebaseLoadScoresForSubjectsBulk(Array.from(allSubjectIds)); }
                catch(err) { console.warn('Admin exam summary score preload failed:', err); }
            }

            const workbook = XLSX.utils.book_new();
            const usedSheetNames = new Set();
            const schoolName = String((DB.schoolInfo && DB.schoolInfo.name) || 'โรงเรียน');
            const schoolYear = String((DB.schoolInfo && DB.schoolInfo.year) || '');
            let exportedRooms = 0;
            classEntries.forEach(([cId, cls]) => {
                const subjects = window.getAdminMidtermSubjectsForClass(cId);
                if(!subjects.length || !(cls.students || []).length) return;
                const classKey = window.normalizeAdminMidtermClassKey(cls.name) || String(cls.name || cId);
                const fullScores = subjects.map(sub => window.getGuardianExamFullScore(sub.id, cId, scoreType));
                const totalFullScore = fullScores.reduce((sum, value) => sum + Number(value || 0), 0);
                const teacherName = typeof window.getGuardianHomeroomDefault === 'function'
                    ? window.getGuardianHomeroomDefault(cId)
                    : '';
                const lastCol = subjects.length + 4;
                const rows = [
                    [`แบบสรุปรวมคะแนนในกลุ่มสาระการเรียนรู้/รายวิชาของนักเรียน   ประจำ${scoreLabel}เรียนที่ ${state.term}   ปีการศึกษา ${schoolYear}`],
                    [schoolName],
                    ['ระดับชั้นประถมศึกษาปีที่', '', '', classKey, 'จำนวน', '', (cls.students || []).length, 'คน', '', 'ครูประจำชั้น', '', '', teacherName],
                    ['กลุ่มสาระ/วิชา', '', '', ...subjects.map(sub => sub.name || ''), 'รวม', 'ร้อยละ'],
                    ['ลำดับ', 'รหัสนักเรียน', 'ชื่อ  -  สกุล', ...fullScores, totalFullScore, '']
                ];

                (cls.students || []).forEach((student, index) => {
                    const scores = subjects.map(sub => window.getGuardianExamScore(sub.id, cId, student.studentId, scoreType));
                    const filledScores = scores.filter(score => score !== null && score !== undefined && score !== '');
                    const total = filledScores.reduce((sum, score) => sum + Number(score || 0), 0);
                    const percent = totalFullScore > 0 ? (total / totalFullScore) * 100 : 0;
                    rows.push([
                        index + 1,
                        String(student.studentId || ''),
                        student.name || '',
                        ...scores.map(score => score === null || score === undefined ? '' : score),
                        total,
                        percent
                    ]);
                });

                const worksheet = XLSX.utils.aoa_to_sheet(rows);
                worksheet['!merges'] = [
                    { s: { r: 0, c: 0 }, e: { r: 0, c: lastCol } },
                    { s: { r: 1, c: 0 }, e: { r: 1, c: lastCol } },
                    { s: { r: 2, c: 0 }, e: { r: 2, c: 2 } },
                    { s: { r: 3, c: 0 }, e: { r: 3, c: 2 } }
                ];
                worksheet['!cols'] = [
                    { wch: 7 }, { wch: 14 }, { wch: 30 },
                    ...subjects.map(() => ({ wch: 12 })),
                    { wch: 12 }, { wch: 12 }
                ];
                worksheet['!rows'] = [{ hpt: 24 }, { hpt: 22 }, { hpt: 22 }, { hpt: 52 }, { hpt: 24 }];
                const dataStartRow = 5;
                const percentCol = subjects.length + 4;
                for(let row = dataStartRow; row < rows.length; row++) {
                    const cellRef = XLSX.utils.encode_cell({ r: row, c: percentCol });
                    if(worksheet[cellRef]) worksheet[cellRef].z = '0.00';
                }

                let sheetName = classKey.replace('/', '.').replace(/[\\/:*?"<>|]/g, '_').slice(0, 31) || `ห้อง${exportedRooms + 1}`;
                const baseName = sheetName;
                let suffix = 2;
                while(usedSheetNames.has(sheetName)) {
                    sheetName = `${baseName.slice(0, 27)}_${suffix++}`;
                }
                usedSheetNames.add(sheetName);
                XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
                exportedRooms++;
            });

            if(exportedRooms === 0) {
                window.notify('ไม่พบห้องที่มีรายวิชาและรายชื่อนักเรียนสำหรับส่งออก', true);
                return;
            }
            const safeYear = String((DB.schoolInfo && DB.schoolInfo.year) || '').replace(/[\\/:*?"<>|]/g, '_');
            XLSX.writeFile(workbook, `แบบสรุปคะแนนรวม_${scoreLabel}_เทอม${state.term}_${safeYear}.xlsx`);
            window.notify(`ส่งออกคะแนนสอบ${scoreLabel}แล้ว ${exportedRooms} ห้อง`);
        }

        window.buildAdminExamPdfPage = function(cId, cls, scoreType = 'mid', pageNumber = 1, totalPages = 1, studentsOverride = null, startIndex = 0) {
            const type = scoreType === 'final' ? 'final' : 'mid';

            const formatScore = value => {
                if(value === null || value === undefined || value === '') return '';
                const number = Number(value);
                if(!Number.isFinite(number)) return '';
                return Number.isInteger(number) ? String(number) : number.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');

        window.checkAdminExamEntryStatus = async function() {
            if(!state.user || state.user.role !== 'admin') return;

                return (cls.students || []).length > 0 && window.getAdminMidtermSubjectsForClass(cId).length > 0;

            try {
                // Read-only check: pulls the latest scores from the cloud so the check reflects
                // reality, but never writes, edits, or deletes anything.
                if(typeof window.firebaseLoadScoresForSubjectsBulk === 'function') {
                    const allSubjectIds = new Set();
                    classEntries.forEach(([cId]) => {
                        window.getAdminMidtermSubjectsForClass(cId).forEach(sub => allSubjectIds.add(String(sub.id)));

                const rows = [];
                let roomsFullyMissingMid = 0;
                classEntries.forEach(([cId, cls]) => {

                    if(roomMidFilled === 0) roomsFullyMissingMid++;
                });

                const missingMidRows = rows.filter(r => r.midCount === 0);

                        <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3"><span class="text-amber-600 font-bold text-xs">รายวิชา/ห้อง ที่ยังไม่ได้ลงกลางภาคเลย</span><strong class="block text-2xl text-amber-700 mt-1">${missingMidRows.length} รายการ</strong></div>
                        <div class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"><span class="text-slate-500 font-bold text-xs">รายวิชา/ห้อง ที่ยังไม่ได้ลงปลายภาคเลย</span><strong class="block text-2xl text-slate-700 mt-1">${missingFinalRows.length} รายการ</strong></div>

                        + buildTable('รายวิชา/ห้อง ที่ยังไม่ได้ลงคะแนนปลายภาคเลย', missingFinalRows, 'final');
                }
                window.notify(`ตรวจสอบเสร็จแล้ว พบ ${missingMidRows.length} รายวิชา/ห้องที่ยังไม่ได้ลงคะแนนกลางภาคเลย`);
            } catch(err) {
                console.error('Admin exam status check failed:', err);
                window.notify('ตรวจสอบสถานะไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', true);
                if(output) output.innerHTML = '';
