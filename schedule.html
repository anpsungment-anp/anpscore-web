<style>
/* ===================== ธีมหลัก : น้ำเงิน–ขาว–เหลืองอ่อน ===================== */
:root{
    --brand:#1d4ed8;
    --brand-soft:#eff6ff;
    --accent:#fde68a;
    --accent-soft:#fffbeb;
    --line:#e2e8f0;
    --ink:#1e293b;
    --shadow:0 14px 34px rgba(15,23,42,.07);
}
*{ -webkit-tap-highlight-color: transparent; }
body{
    font-family:'Sarabun',sans-serif;
    background:
        radial-gradient(circle at 12% -5%, rgba(29,78,216,.10), transparent 30rem),
        radial-gradient(circle at 100% 0%, rgba(253,230,138,.35), transparent 26rem),
        #f5f7fb;
    color:var(--ink); font-size:16px;
}
.modern-card{ background:#fff; border:1px solid var(--line); border-radius:1.25rem; box-shadow:var(--shadow); }
.glass-header{ background:rgba(255,255,255,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.brand-gradient{ background-image:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 100%); }
.accent-gradient{ background-image:linear-gradient(135deg,#f59e0b 0%,#fbbf24 100%); }
.focus-ring:focus{ outline:none; box-shadow:0 0 0 3px rgba(59,130,246,.28); border-color:#3b82f6; }
.tactile-btn{ transition:transform .15s ease, box-shadow .15s ease; }
.tactile-btn:active{ transform:scale(.97); }
.custom-scrollbar::-webkit-scrollbar{ width:9px; height:9px; }
.custom-scrollbar::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:99px; }
.custom-scrollbar::-webkit-scrollbar-track{ background:transparent; }
@keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
.animate-fade-in-up{ animation:fadeInUp .3s ease both; }

/* ===================== ตารางสอน ===================== */
.tt-wrap{ overflow:auto; border:1px solid var(--line); border-radius:1rem; background:#fff; max-height:calc(100vh - 300px); }
.tt-table{ border-collapse:separate; border-spacing:0; width:100%; min-width:820px; }
.tt-table th,.tt-table td{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.tt-table thead th{
    position:sticky; top:0; z-index:6; background:#f1f5f9; font-weight:800; color:#334155;
    padding:8px 6px; font-size:13px; text-align:center; white-space:nowrap;
}
.tt-table tbody th{
    position:sticky; left:0; z-index:5; background:#f8fafc; font-weight:800; color:#334155;
    padding:8px 10px; font-size:13px; text-align:left; white-space:nowrap; min-width:110px;
}
.tt-table thead th:first-child{ left:0; z-index:7; }
.tt-cell{ padding:3px; vertical-align:top; height:74px; min-width:118px; }
.tt-cell.drop-ok{ background:#dcfce7 !important; outline:2px dashed #16a34a; outline-offset:-3px; }
.tt-cell.drop-bad{ background:#fee2e2 !important; outline:2px dashed #dc2626; outline-offset:-3px; }
.tt-cell.is-break{ background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#eef2f7 6px,#eef2f7 12px); }
.tt-item{
    border-radius:.6rem; padding:5px 7px; height:100%; font-size:12px; line-height:1.32;
    border:1px solid rgba(15,23,42,.10); cursor:grab; position:relative; overflow:hidden;
    /* จัดชื่อวิชาและชื่อครูให้อยู่กึ่งกลางช่อง ทั้งแนวตั้งและแนวนอน */
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
}
.tt-item:active{ cursor:grabbing; }
/* ปุ่มเพิ่มวิชาในช่องว่าง : เต็มช่องและกดได้ทั้งช่อง */
.tt-add{
    width:100%; height:100%; min-height:66px; display:flex; align-items:center; justify-content:center;
    border:1px dashed #cbd5e1; border-radius:.6rem; background:transparent; color:#cbd5e1;
    font-size:20px; cursor:pointer; transition:all .15s;
}
.tt-add:hover{ border-color:#3b82f6; color:#3b82f6; background:#eff6ff; }
.tt-item .s-name{ font-weight:800; }
.tt-item .s-meta{ opacity:.85; font-size:11px; }
.tt-item.locked{ box-shadow:inset 0 0 0 2px #f59e0b; }
.tt-item.conflict{ box-shadow:inset 0 0 0 2px #dc2626; }
.tt-item.sub-cover{ box-shadow:inset 0 0 0 2px #0ea5e9; }
.tt-chip{
    border-radius:.6rem; padding:6px 9px; font-size:12px; font-weight:700; cursor:grab;
    border:1px solid rgba(15,23,42,.10); display:flex; justify-content:space-between; gap:6px; align-items:center;
}

/* ===================== เมนู ===================== */
.nav-btn{
    width:100%; display:flex; align-items:center; gap:.75rem; padding:.7rem .9rem; border-radius:.85rem;
    font-weight:700; color:#64748b; transition:all .25s ease; border:1px solid transparent; text-align:left;
}
.nav-btn:hover{ background:#fff; color:var(--brand); box-shadow:0 4px 12px rgba(0,0,0,.04); border-color:var(--line); }
.nav-btn.active{ background-image:linear-gradient(135deg,#1d4ed8,#3b82f6); color:#fff; box-shadow:0 8px 18px rgba(29,78,216,.28); }
.nav-btn i{ font-size:20px; }
.bottom-nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:.45rem 0; font-size:10px; font-weight:700; color:#64748b; }
.bottom-nav-btn.active{ color:var(--brand); }
.bottom-nav-btn i{ font-size:22px; }

/* ===================== กระดาษ A4 ===================== */
.paper{
    background:#fff; color:#111827; margin:0 auto; box-shadow:0 8px 26px rgba(15,23,42,.18);
    font-family:'Sarabun',sans-serif; font-size:calc(13px * var(--print-font-scale,1));
    font-feature-settings:'locl' 0,'lnum' 1; font-variant-numeric:lining-nums;
}
.paper-portrait{ width:210mm; min-height:297mm; padding:10mm 10mm; }
.paper-landscape{ width:297mm; min-height:210mm; padding:8mm 10mm; }
.preview-scroll{ overflow:auto; max-height:60vh; background:#eef2f7; padding:14px; border-radius:1rem; }
.preview-scroll .paper{ transform-origin:top left; }
.print-head{ display:flex; gap:8mm; align-items:center; margin-bottom:4mm; }
.print-head .ph-school{ font-size:1.5em; font-weight:800; }
.print-head .ph-addr{ font-size:.92em; }
.print-head .ph-doc{ font-size:1.25em; font-weight:800; margin-top:1mm; }
.print-head .ph-sub{ font-size:1em; }
.print-title{ flex:1; text-align:center; }
.paper table{ width:100%; border-collapse:collapse; }
.paper .bx th,.paper .bx td{ border:.8pt solid #111827; padding:2px 4px; vertical-align:top; }
.paper .bx th{ background:#f1f5f9; font-weight:800; text-align:center; }
.paper .cell-sub{ font-weight:700; }
.paper .cell-meta{ font-size:.86em; }
/* ตารางเรียน/ตารางสอน : จัดวิชาและชื่อครูให้อยู่กึ่งกลางช่อง */
.paper .tt-grid td{ text-align:center; vertical-align:middle; }
.paper .tt-grid td:first-child{ font-weight:700; }

/* ===== หนึ่งหน้ากระดาษของเอกสารตารางสอน =====
   .tt-page คือกระดาษหนึ่งแผ่น ข้างในมี .tt-slot กี่ช่องก็ได้ (1 ช่อง = เต็มหน้า, 2 ช่อง = ครึ่งหน้า)
   ทุกช่องแบ่งความสูงเท่ากันด้วย flex ตารางจึงยืดเต็มพื้นที่ที่เหลือเสมอ ไม่เหลือขาวครึ่งหน้า */
.tt-page{ display:flex; flex-direction:column; gap:6mm; }
.tt-page + .tt-page{ page-break-before:always; break-before:page; }
.tt-page .tt-slot{ display:flex; flex-direction:column; flex:1 1 0; min-height:0; }
.tt-page .tt-slot .tt-grid{ flex:1 1 auto; }
/* เว้นที่ว่างเหนือเส้นลงชื่อไว้ให้เซ็นได้จริง ตารางจะยืดได้เท่าที่เหลือเท่านั้น */
.tt-page .tt-slot .sign-row{ margin-top:auto; padding-top:18mm; min-height:42mm; }
/* ความสูงหนึ่งหน้าบนจอ (หักระยะขอบกระดาษที่จำลองไว้) */
.paper-portrait .tt-page{ min-height:274mm; }
.paper-landscape .tt-page{ min-height:191mm; }

/* ความสูงขั้นต่ำของแถวตาราง กันไว้เผื่อเครื่องพิมพ์ไม่ยืด flex ให้เต็มหน้า
   :only-child = หน้านั้นมีตารางเดียว (รายห้อง) จึงให้แถวสูง · ถ้ามีสองตาราง (รายครู) ให้แถวเตี้ยลงครึ่งหนึ่ง */
.paper-landscape .tt-page .tt-slot:only-child .tt-grid tbody tr{ height:20mm; }
.paper-portrait  .tt-page .tt-slot:only-child .tt-grid tbody tr{ height:34mm; }
.paper-landscape .tt-page .tt-slot:not(:only-child) .tt-grid tbody tr{ height:10mm; }
.paper-portrait  .tt-page .tt-slot:not(:only-child) .tt-grid tbody tr{ height:17mm; }
.sign-row{ display:flex; justify-content:space-around; gap:8mm; margin-top:12mm; }
.sign-box{ text-align:center; font-size:.95em; }
.sign-name{ margin-top:1mm; }
.sign-role{ margin-top:.5mm; }

#print-view{ display:none; }
@media print{
    body{ background:#fff !important; }
    #app-shell,#toast-host,#modal-backdrop,.no-print{ display:none !important; }
    #print-view{ display:block !important; }
    /* บนกระดาษจริง @page คุมขนาดและระยะขอบให้แล้ว
       จึงต้องปลดความกว้าง/ระยะขอบที่ใช้จำลองกระดาษบนจอ ไม่งั้นเนื้อหาจะล้นออกนอกหน้า */
    .paper{ width:auto !important; min-height:0 !important; padding:0 !important; }
    /* ให้พื้นหลังหัวตาราง/สีวิชาติดไปกับกระดาษด้วย ไม่งั้นเบราว์เซอร์จะตัดสีทิ้ง */
    .paper,.paper *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    /* บนกระดาษจริง พื้นที่พิมพ์ = ขนาดหน้า − ระยะขอบของ @page (8mm สองด้าน) */
    .paper-portrait .tt-page{ min-height:277mm; }
    .paper-landscape .tt-page{ min-height:190mm; }
    .paper{ box-shadow:none !important; margin:0 auto !important; page-break-after:always; break-after:page; }
    .paper:last-child{ page-break-after:auto; break-after:auto; }
    /* แนวกระดาษกำหนดจาก JS (UI.print) เพราะ @page ซ้อนใต้ตัวเลือกไม่ได้
       ค่าเริ่มต้นไว้เผื่อผู้ใช้กด Ctrl+P เองโดยไม่ผ่านหน้าตัวอย่าง */
    @page{ size:A4 portrait; margin:8mm; }
}

/* ===================== มือถือ ===================== */
@media (max-width:768px){
    .tt-wrap{ max-height:none; }
    .tt-cell{ min-width:104px; height:70px; }
    .paper{ zoom:.52; }
}
</style>
</head>
